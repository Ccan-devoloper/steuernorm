/* Statusband: weist offen aus, wie die Annotation zustande kam. */
function statusband(anm){
  if (!anm || !anm.status) return null;
  const d = document.createElement("div");
  d.className = "statusband";
  const p = document.createElement("span");
  p.className = "plakette";
  p.dataset.s = anm.status;
  p.textContent = ({
    belegt: "Amtlich gestützt",
    konsens: "Modellkonsens",
    mehrheit: "Mehrheitlich",
    uneinheitlich: "Uneinheitlich",
    syntaktisch: "Nur Syntaxanalyse",
    ohne_merkmale: "Ohne Markierung",
  })[anm.status] || anm.status;
  d.appendChild(p);

  const t = document.createElement("span");
  const teile = [];
  if (anm.status === "ohne_merkmale"){
    teile.push("keine Tatbestand-Rechtsfolge-Struktur");
  } else {
    if (typeof anm.einstimmigkeit === "number"){
      teile.push(Math.round(anm.einstimmigkeit * 100) + " % Übereinstimmung über " + anm.laeufe + " Läufe");
    }
    if (anm.belegquote) teile.push(Math.round(anm.belegquote * 100) + " % amtlich belegt");
    teile.push("automatisch erzeugt, nicht redaktionell geprüft");
  }
  t.textContent = teile.join(" · ");
  d.appendChild(t);
  return d;
}

function tageSeit(iso){
  if (!iso) return null;
  return Math.round((Date.now() - new Date(iso).getTime()) / 86400000);
}

function normZeichnen(){
  const haupt = el("haupt");
  haupt.innerHTML = "";
  const g = S.gesetz;
  const norm = g.normen.find(n => n.id === S.normId) || g.normen[0];
  S.normId = norm.id;
  const anm = (S.anmerkungen[S.abk] || {})[norm.id];

  // Kopf
  const kopf = document.createElement("div");
  kopf.className = "norm-kopf";
  const eb = document.createElement("div");
  eb.className = "augenbraue";
  eb.textContent = g.titel;
  const h1 = document.createElement("h1");
  const sp1 = document.createElement("span"); sp1.textContent = norm.enbez;
  const sp2 = document.createElement("span"); sp2.className = "titel"; sp2.textContent = norm.titel;
  h1.append(sp1, document.createTextNode(" "), sp2);

  const stand = document.createElement("div");
  stand.className = "stand";
  const alter = tageSeit(g.builddate);
  const s1 = document.createElement("span");
  s1.textContent = "Stand der Daten: " + (g.builddate || "unbekannt");
  if (alter !== null && alter > 90){
    s1.classList.add("veraltet");
    s1.textContent += " — " + alter + " Tage alt, bitte aktualisieren";
  }
  stand.appendChild(s1);
  const fassung = (g.stand || []).find(x => x.typ === "Stand");
  if (fassung){ const s2 = document.createElement("span"); s2.textContent = fassung.text; stand.appendChild(s2); }
  const quelle = document.createElement("a");
  quelle.href = g.quelle; quelle.target = "_blank"; quelle.rel = "noopener";
  quelle.textContent = "amtliche Fassung ↗";
  stand.appendChild(quelle);
  // Werkzeuge: Fundstelle zitieren, drucken, Notizen sichern.
  const werkzeuge = document.createElement("div");
  werkzeuge.className = "werkzeuge";
  const werkzeug = (beschriftung, tun, titel) => {
    const b = document.createElement("button");
    b.textContent = beschriftung;
    if (titel) b.title = titel;
    b.onclick = () => tun(b);
    werkzeuge.appendChild(b);
  };
  werkzeug("Zitat kopieren", (b) => inZwischenablage(zitat(null), b),
    "Fundstelle mit Fassung und Permalink in die Zwischenablage");
  werkzeug("Link kopieren", (b) => inZwischenablage(location.href, b));
  werkzeug("Drucken", () => window.print(), "Druckansicht ohne Navigation");
  werkzeug("Notizen sichern", () => notizenAusfuehren(), "Alle eigenen Markierungen als Datei speichern");
  werkzeug("Notizen laden", () => el("notizdatei").click(), "Gesicherte Notizen wieder einlesen");
  kopf.append(eb, h1, stand, werkzeuge);
  haupt.appendChild(kopf);

  // Statusband direkt unter den Normkopf — es qualifiziert alles, was folgt.
  const sb = statusband(anm);
  if (sb) haupt.appendChild(sb);

  // Text
  const text = document.createElement("div");
  text.className = "text";
  text.lang = "de";   // Voraussetzung für hyphens:auto — ohne das trennt kein Browser
  for (const a of norm.abs){
    const d = document.createElement("div");
    d.className = "absatz";
    if (a.n){ const az = document.createElement("span"); az.className = "az"; az.textContent = "(" + a.n + ")"; d.appendChild(az); }
    const inner = document.createElement("div");
    inner.innerHTML = a.html;
    d.appendChild(inner);
    text.appendChild(d);
  }
  // Alle Markierungen in einem Durchgang gegen denselben kanonischen Text wie im Backend anlegen.
  const verwaist = anm ? markierungenAnlegen(text, anm) : 0;
  verweiseSetzen(text, S.abk);

  const leseraum = document.createElement("div");
  leseraum.className = "leseraum";
  leseraum.append(absatzleisteBauen(anm, text), text);
  haupt.appendChild(leseraum);

  if (norm.fussnote){
    const f = document.createElement("div");
    f.className = "fussnote";
    f.textContent = norm.fussnote;
    haupt.appendChild(f);
  }

  if (anm && anm.hinweis){
    const h = document.createElement("div");
    h.className = "hinweis";
    const kappe = document.createElement("span"); kappe.className = "kappe"; kappe.textContent = "Hinweis";
    const p = document.createElement("p"); p.textContent = anm.hinweis;
    h.append(kappe, p);
    haupt.appendChild(h);
  }

  if (verwaist){
    const w = document.createElement("div");
    w.className = "hinweis";
    w.style.borderLeftColor = "var(--warn)";
    const kappe = document.createElement("span"); kappe.className = "kappe"; kappe.textContent = "Markierung";
    const p = document.createElement("p");
    p.textContent = verwaist + " Markierung(en) finden ihre Textstelle nicht mehr. Der Gesetzestext wurde vermutlich geändert; die Annotation gehört nachgezogen.";
    w.append(kappe, p);
    haupt.appendChild(w);
  }

  const bel = belegeBauen(anm);
  if (bel) haupt.appendChild(bel);

  const eig = eigeneBauen();
  if (eig) haupt.appendChild(eig);

  const zit = zitiertBauen();
  if (zit) haupt.appendChild(zit);

  // Schema unterhalb (schmale Fenster) und rechts (breite)
  const unten = schemaBauen(anm);
  unten.className = "schema-unten";
  unten.style.display = "none";
  haupt.appendChild(unten);
  el("schema-rechts").innerHTML = "";
  el("schema-rechts").appendChild(schemaBauen(anm));

  // Blättern
  const i = g.normen.indexOf(norm);
  const nav = document.createElement("div");
  nav.className = "blaettern";
  const mach = (ziel, label) => {
    const b = document.createElement("button");
    if (!ziel){ b.style.visibility = "hidden"; return b; }
    b.innerHTML = '<span class="k"></span><span class="w"></span>';
    b.querySelector(".k").textContent = label;
    b.querySelector(".w").textContent = ziel.enbez + (ziel.titel ? " " + ziel.titel : "");
    b.onclick = () => { location.hash = "#/" + S.abk.toLowerCase() + "/" + ziel.id; };
    return b;
  };
  nav.append(mach(g.normen[i - 1], "zurück"), mach(g.normen[i + 1], "weiter"));
  haupt.appendChild(nav);

  const fuss = document.createElement("p");
  fuss.className = "fuss";
  fuss.innerHTML = 'Gesetzestexte aus <a href="https://www.gesetze-im-internet.de/" target="_blank" rel="noopener">Gesetze im Internet</a> (BMJ und Bundesamt für Justiz), amtliche Werke und nach § 5 Abs. 1 UrhG gemeinfrei. Maßgeblich ist allein die im Bundesgesetzblatt verkündete Fassung. Markierungen, Hinweise und Prüfungsschemata sind eine didaktische Zutat dieser Seite und keine Rechtsberatung.';
  haupt.appendChild(fuss);

  document.title = norm.enbez + " " + S.abk + (norm.titel ? " — " + norm.titel : "") + " · steuernorm";
  window.scrollTo({ top: 0 });
}

/* ------------------------------ Router ------------------------------ */
async function route(){
  if (!S.register) return;
  const teile = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("/").filter(Boolean);
  const abk = (teile[0] || gemerkt("letztes-gesetz", "estg")).toLowerCase();
  const eintrag = S.register.gesetze.find(g => g.abk.toLowerCase() === abk) || S.register.gesetze[0];
  S.abk = eintrag.abk;
  merken("letztes-gesetz", S.abk.toLowerCase());
  try{
    S.gesetz = await gesetzLaden(S.abk);
  }catch(err){
    el("haupt").innerHTML = '<div class="melder"><strong>' + S.abk + ' konnte nicht geladen werden.</strong><br>' + err.message + '</div>';
    return;
  }
  S.normId = teile[1] || S.gesetz.normen[0].id;
  if (!S.gesetz.normen.some(n => n.id === S.normId)) S.normId = S.gesetz.normen[0].id;
  leisteZeichnen();
  registerZeichnen();
  normZeichnen();
  el("register").classList.remove("offen");

  // Dritter Pfadteil ist ein Anker auf einen Rechtssatz: #/solzg/3/abs-3-satz-1
  const anker = teile[2] || null;
  if (anker){
    requestAnimationFrame(() => {
      const ziel = [...document.querySelectorAll("#haupt mark[data-pfad]")]
        .find(m => pfadZuAnker(m.dataset.pfad) === anker);
      if (ziel){
        ziel.scrollIntoView({ block: "center" });
        ziel.classList.add("springziel");
      }
    });
  }
  const treffer = el("register").querySelector('[aria-current=true]');
  if (treffer && treffer.scrollIntoView) treffer.scrollIntoView({ block: "nearest" });
}

/* ------------------------------ Start ------------------------------ */
async function start(){
  schalterSetzen("tb", gemerkt("marker-tb", "an") === "an");
  schalterSetzen("rf", gemerkt("marker-rf", "an") === "an");
  el("btn-tb").onclick = () => schalterSetzen("tb", document.body.dataset.tb !== "an");
  el("btn-rf").onclick = () => schalterSetzen("rf", document.body.dataset.rf !== "an");
  schalterSetzen("ausn", gemerkt("marker-ausn", "an") === "an");
  el("btn-ausn").onclick = () => schalterSetzen("ausn", document.body.dataset.ausn !== "an");

  schalterSetzen("def", gemerkt("marker-def", "an") === "an");
  el("btn-def").onclick = () => schalterSetzen("def", document.body.dataset.def !== "an");

  schalterSetzen("eigen", gemerkt("marker-eigen", "an") === "an");
  el("btn-eigen").onclick = () => schalterSetzen("eigen", document.body.dataset.eigen !== "an");

  /* Auswahl im Normtext: Werkzeugleiste zeigen, Markierung oder Notiz anlegen. */
  document.addEventListener("selectionchange", () => requestAnimationFrame(auswahlLeiste));
  window.addEventListener("scroll", () => el("auswahl").classList.remove("offen"), { passive: true });

  const ausAnlegen = (mitNotiz) => {
    const leiste = el("auswahl");
    const text = leiste.dataset.text || "";
    if (!text) return;
    let notiz = "";
    if (mitNotiz){
      notiz = window.prompt("Notiz zu „" + text.slice(0, 60) + (text.length > 60 ? "…" : "") + "“", "");
      if (notiz === null) return;
    }
    const { praefix, suffix } = auswahlKontext(text);
    notizAnlegen(text, praefix, suffix, notiz);
    leiste.classList.remove("offen");
    window.getSelection().removeAllRanges();
    normZeichnen();
  };
  el("aus-markieren").onclick = () => ausAnlegen(false);
  el("aus-notiz").onclick = () => ausAnlegen(true);
  el("aus-kopieren").onclick = (e) => {
    inZwischenablage(zitat(el("auswahl").dataset.text || ""), e.currentTarget);
  };
  el("notizdatei").onchange = (e) => {
    const datei = e.target.files && e.target.files[0];
    if (datei) notizenEinlesen(datei);
    e.target.value = "";
  };

  /* Klick auf eine eigene Markierung öffnet ihre Notiz. */
  el("haupt").addEventListener("click", (e) => {
    const marke = e.target.closest("mark.eigen[data-eigen]");
    if (!marke) return;
    const eintrag = notizenLesen().find(n => n.id === marke.dataset.eigen);
    if (!eintrag) return;
    const neu = window.prompt("Notiz zu „" + eintrag.text.slice(0, 60) + "“ (leer lassen zum Löschen der Notiz)", eintrag.notiz || "");
    if (neu === null) return;
    const liste = notizenLesen();
    const treffer = liste.find(n => n.id === eintrag.id);
    if (treffer) treffer.notiz = neu;
    notizenSchreiben(liste);
    normZeichnen();
  });

  // Satzart. Voreinstellung Flattersatz: Er ist über alle Fensterbreiten hinweg
  // am zuverlässigsten lesbar. Blocksatz wirkt bei Gesetzestexten ruhiger und
  // amtlicher, verlangt im Deutschen aber zwingend Silbentrennung — die ist im
  // CSS aktiviert und der Textknoten trägt lang="de".
  function satzSetzen(wert){
    const w = wert === "block" ? "block" : "flatter";
    document.body.dataset.satz = w;
    el("btn-satz").textContent = w === "block" ? "Blocksatz" : "Flattersatz";
    el("btn-satz").setAttribute("aria-label", "Satzart: " + (w === "block" ? "Blocksatz" : "Flattersatz"));
    merken("satzart", w);
  }
  satzSetzen(gemerkt("satzart", "flatter"));
  el("btn-satz").onclick = () => satzSetzen(document.body.dataset.satz === "block" ? "flatter" : "block");

  // Stärke der Markierung: aus · dezent · voll
  const STUFEN = ["aus", "dezent", "voll"];
  function intensitaetSetzen(wert){
    const w = STUFEN.includes(wert) ? wert : "dezent";
    document.body.dataset.intensitaet = w;
    el("btn-intensitaet").textContent = w;
    if (el("fb-intensitaet")) el("fb-intensitaet").textContent = w;
    el("btn-intensitaet").setAttribute("aria-label", "Stärke der Markierung: " + w);
    merken("marker-intensitaet", w);
  }
  intensitaetSetzen(gemerkt("marker-intensitaet", "dezent"));
  el("btn-intensitaet").onclick = () =>
    intensitaetSetzen(STUFEN[(STUFEN.indexOf(document.body.dataset.intensitaet) + 1) % STUFEN.length]);

  // Schriftgröße
  const GROESSEN = ["klein", "normal", "gross"];
  function groesseSetzen(wert){
    const w = GROESSEN.includes(wert) ? wert : "normal";
    if (w === "normal") delete document.documentElement.dataset.groesse;
    else document.documentElement.dataset.groesse = w;
    el("btn-groesse").textContent = { klein: "a", normal: "A", gross: "A+" }[w];
    el("btn-groesse").setAttribute("aria-label", "Schriftgröße: " + w);
    merken("schriftgroesse", w);
  }
  groesseSetzen(gemerkt("schriftgroesse", "normal"));
  el("btn-groesse").onclick = () =>
    groesseSetzen(GROESSEN[(GROESSEN.indexOf(gemerkt("schriftgroesse", "normal")) + 1) % GROESSEN.length]);

  // Hell / dunkel / Systemvorgabe
  const THEMEN = ["system", "hell", "dunkel"];
  function themaSetzen(wert){
    const w = THEMEN.includes(wert) ? wert : "system";
    if (w === "system") delete document.documentElement.dataset.thema;
    else document.documentElement.dataset.thema = w;
    el("btn-thema").textContent = { system: "◐", hell: "☀", dunkel: "☾" }[w];
    el("btn-thema").setAttribute("aria-label", "Darstellung: " + w);
    merken("thema", w);
  }
  themaSetzen(gemerkt("thema", "system"));
  el("btn-thema").onclick = () =>
    themaSetzen(THEMEN[(THEMEN.indexOf(gemerkt("thema", "system")) + 1) % THEMEN.length]);

  // Fußleiste auf schmalen Fenstern spiegelt die Kopfschalter.
  for (const art of ["tb", "rf", "ausn", "def", "eigen"]){
    const b = el("fb-" + art);
    if (b) b.onclick = () => schalterSetzen(art, document.body.dataset[art] !== "an");
  }
  if (el("fb-intensitaet")){
    el("fb-intensitaet").onclick = () =>
      intensitaetSetzen(STUFEN[(STUFEN.indexOf(document.body.dataset.intensitaet) + 1) % STUFEN.length]);
  }
  el("burger").onclick = () => el("register").classList.add("offen");
  el("zu").onclick = () => el("register").classList.remove("offen");
  el("suche").oninput = (e) => { S.filter = e.target.value; S.markiert = null; registerZeichnen(); };
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== el("suche")){ e.preventDefault(); el("suche").focus(); }
    if (document.activeElement === el("suche") && ["ArrowDown", "ArrowUp", "Enter"].includes(e.key)){
      const treffer = [...el("register-liste").querySelectorAll(".reg-eintrag")];
      if (!treffer.length) return;
      if (e.key === "Enter"){ e.preventDefault(); treffer[S.markiert ?? 0]?.click(); return; }
      e.preventDefault();
      const jetzt = S.markiert ?? -1;
      S.markiert = Math.max(0, Math.min(treffer.length - 1, jetzt + (e.key === "ArrowDown" ? 1 : -1)));
      treffer.forEach((b, i) => b.classList.toggle("markiert", i === S.markiert));
      treffer[S.markiert].scrollIntoView({ block: "nearest" });
    }
    if (e.key === "Escape") el("register").classList.remove("offen");
  });
  window.addEventListener("hashchange", route);

  try{
    S.register = await holen("data/index.json");
    // Rückverweise sind eine Zutat: Fehlt die Datei, arbeitet alles andere weiter.
    try { S.verweise = (await holen("data/verweise.json")).normen; }
    catch(e){ S.verweise = {}; }
  }catch(err){
    el("haupt").innerHTML =
      '<div class="melder"><strong>Die Gesetzesdaten fehlen oder sind nicht erreichbar.</strong>' +
      '<p>Ein Browser darf beim Öffnen über <code>file://</code> keine Dateien nachladen. Die Seite über einen Server aufrufen:</p>' +
      '<p><code>python3 -m http.server 8000</code> im Projektordner, dann <code>http://localhost:8000</code>.</p>' +
      '<p>Fehlen die Daten noch ganz, erzeugt <code>node tools/update.mjs</code> sie aus Gesetze im Internet.</p>' +
      '<p style="opacity:.7">' + err.message + '</p></div>';
    return;
  }
  route();
}
start();
</script>
</body>
</html>
