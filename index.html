<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>steuernorm — Arbeitsplatz</title>
<meta name="description" content="Die deutschen Steuergesetze im Volltext, mit maschinell erkannter Struktur von Tatbestand und Rechtsfolge, eigenen Markierungen und Verwaltungsstellen.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════════════════════════════════
   Gestaltungsmarken

   Alle Werte stammen aus der Übergabespezifikation, Abschnitt
   „Gestaltungsmarken". Sie stehen hier einmal und werden nirgends sonst
   als fester Wert wiederholt — genau daran ist die bisherige Fassung
   gescheitert: Die Kopfleiste trug einen fest eingetragenen Hellwert und
   blieb deshalb im Dunkelmodus weiß.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  /* ── Flächen ── */
  --papier:#FCFCFC;          /* Seitengrund */
  --leiste:#F1F3F5;          /* Kopf, Reiterleiste, Fußzeilen */
  --flaeche:#F7F8F9;         /* zurückgesetzte Karten und Hinweiskästen */
  --zeile-aktiv:#EFF2F5;     /* aktive Zeile in Navigation und Trefferliste */
  --zeile-weich:#F4F6F8;     /* überfahrene Zeile */
  --weiss:#FFFFFF;

  /* ── Schrift ── */
  --text:#14161A;            /* primär */
  --text-2:#3B4149;
  --text-2b:#4B525B;
  --text-3:#6C737C;          /* Metadaten */
  --text-4:#8B929B;          /* Zähler, schwach */
  --text-5:#9AA1A9;
  --text-6:#B4BAC1;          /* sehr schwach */
  --titel-2:#5A616A;         /* zweiter Teil der Normüberschrift */

  /* ── Linien ── */
  --linie-stark:#C4C9CF;
  --linie:#D8DBE0;
  --linie-schwach:#E4E7EA;
  --linie-zart:#F0F2F4;      /* Listentrenner */

  /* ── Verweis ── */
  --verweis:#2F5FA8;
  --verweis-kante:#C6D5EA;

  /* ── Verwaltung (Richtlinie, BMF-Schreiben) ── */
  --vw:#6A4C93;
  --vw-grund:#F3F0F8;
  --vw-rand:#D9CFEA;

  /* ── Treffer in der Suche ── */
  --treffer:#FBEEA8;
  --treffer-ohne:#EDEFF1;    /* Treffer ohne geladenen Datensatz */

  /* ── Struktur-Einfärbung: Tatbestand · Rechtsfolge · Ausnahme ── */
  --tb-dezent:#FAF3E4;  --tb-voll:#F3E3B8;  --tb-rand:#E0CE9E;
  --rf-dezent:#EDF4EE;  --rf-voll:#D6E9DB;  --rf-rand:#B4D2BC;
  --au-dezent:#FBEEEC;  --au-voll:#F5D9D4;  --au-rand:#E3B7B0;

  /* ── Schriften ── */
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  /* ── Maße ── */
  --nav:216px;               /* linke Spalte */
  --apparat:340px;           /* rechter Apparat */
  --lesespalte:36rem;        /* Lesespalte, in allen Stufen gleich */
  --rinne:34px;              /* Absatzmarken links vom Text */

  /* ── Radien ── */
  --r-marke:2px;             /* Textmarkierung */
  --r-chip:3px;              /* Mono-Chip */
  --r-knopf:5px;
  --r-feld:6px;
  --r-karte:7px;             /* Karte, Popover */
  --r-pille:999px;

  /* ── Schatten ── */
  --schatten-popover:0 8px 24px rgba(20,22,26,.13);
  --schatten-blatt:0 -8px 28px rgba(20,22,26,.12);
  --schatten-feld:0 1px 2px rgba(20,22,26,.05);
}

/* ══════════════════════════════════════════════════════════════════════
   Grundlagen
   ══════════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--papier);
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* Der Fokusrahmen bleibt sichtbar — er ist die einzige Orientierung für alle,
   die mit der Tastatur arbeiten. */
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:var(--r-marke)}

/* Übergänge sparsam: 120–160 ms für Popover und Blatt, sonst keine Bewegung. */
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* ══════════════════════════════════════════════════════════════════════
   Kopfleiste
   ══════════════════════════════════════════════════════════════════════ */
.kopf{
  display:flex;align-items:center;gap:16px;
  padding:10px 16px;
  background:var(--leiste);
  border-bottom:1px solid var(--linie);
}
.wortmarke{font-family:var(--serif);font-size:16px;font-weight:600;white-space:nowrap}

.suchfeld{
  /* `min-width:0` ist nicht schmückend: Ohne die Angabe bekommt ein Flexkind
     seine Mindestbreite aus dem Inhalt und schrumpft nicht. Die Kopfleiste lief
     dadurch bei 1024 px um fünf Pixel über den Rand hinaus. */
  flex:1;min-width:0;display:flex;align-items:center;gap:10px;
  background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-feld);
  padding:7px 12px;max-width:520px;box-shadow:var(--schatten-feld);
  cursor:text;
}
.suchfeld .kuerzel{font-family:var(--mono);font-size:11px;color:var(--text-4);flex:none}
.suchfeld input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:13.5px;color:var(--text)}
.suchfeld input::placeholder{color:var(--text-4)}
.suchfeld input:focus{outline:0}
.suchfeld:focus-within{border-color:var(--text)}

.kopf-rechts{display:flex;align-items:center;gap:14px;margin-left:auto}
.einfaerben{display:flex;align-items:center;gap:8px}
.einfaerben>span{font-size:12.5px;color:var(--text-3);white-space:nowrap}
.stufen{display:flex;border:1px solid var(--linie);border-radius:var(--r-knopf);overflow:hidden;background:var(--weiss)}
.stufen button{padding:5px 10px;font-size:12.5px;line-height:1;color:var(--text-2b);background:var(--weiss)}
.stufen button[aria-checked=true]{background:var(--text);color:var(--papier)}
.trenner{width:1px;height:22px;background:var(--linie);flex:none}
.kopf-knoepfe{display:flex;gap:6px;font-size:12.5px}
.kopf-knoepfe button{
  border:1px solid var(--linie);background:var(--weiss);color:var(--text-2b);
  border-radius:var(--r-knopf);padding:5px 10px;white-space:nowrap;
}
.kopf-knoepfe button:hover{border-color:var(--text);color:var(--text)}

/* ══════════════════════════════════════════════════════════════════════
   Reiterleiste — GEÖFFNETE Normen, nicht die Normen des Gesetzes
   ══════════════════════════════════════════════════════════════════════ */
.reiterleiste{
  display:flex;align-items:stretch;gap:0;padding:0 16px;
  background:var(--leiste);border-bottom:1px solid var(--linie);
  overflow-x:auto;scrollbar-width:none;
}
.reiterleiste::-webkit-scrollbar{display:none}
.reiter{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;font-size:13px;color:var(--text-3);
  border:1px solid transparent;white-space:nowrap;flex:none;
}
.reiter .nr{font-family:var(--serif)}
.reiter .zu{color:var(--text-6);font-size:13px;line-height:1;padding:2px}
.reiter .zu:hover{color:var(--text)}
.reiter[aria-selected=true]{
  background:var(--papier);border-color:var(--linie);border-bottom-color:var(--papier);
  border-radius:var(--r-knopf) var(--r-knopf) 0 0;margin-bottom:-1px;color:var(--text);
}
.reiter[aria-selected=true] .zu{color:var(--text-4)}
.reiter-plus{display:flex;align-items:center;padding:8px 12px;font-size:15px;color:var(--text-4);flex:none}
.reiter-plus:hover{color:var(--text)}
/* Beim Umsortieren per Ziehen: der gezogene Reiter tritt zurück, das Ziel
   bekommt eine Kante an der Seite, an der eingefügt wird. */
.reiter[draggable=true]{cursor:grab}
.reiter.zieht{opacity:.4}
.reiter.ziel-links{box-shadow:inset 2px 0 0 var(--text)}
.reiter.ziel-rechts{box-shadow:inset -2px 0 0 var(--text)}
.reiter-zahl{
  display:flex;align-items:center;margin-left:auto;padding-left:16px;
  font-size:11.5px;color:var(--text-4);white-space:nowrap;flex:none;
}

/* ══════════════════════════════════════════════════════════════════════
   Grundraster: 216 · flexibel · 340
   ══════════════════════════════════════════════════════════════════════ */
.raster{display:flex;align-items:flex-start}

/* ── Linke Spalte ── */
.navspalte{
  width:var(--nav);flex:none;
  border-right:1px solid var(--linie-schwach);
  padding:18px 0 60px;
  position:sticky;top:0;max-height:100vh;overflow-y:auto;
}
.mono-etikett{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-4);
}
.navspalte>.mono-etikett{padding:0 16px 8px}
.normzeile{
  display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;
  padding:6px 16px;border-left:2px solid transparent;background:transparent;
}
.normzeile:hover{background:var(--zeile-weich)}
.normzeile .nr{font-family:var(--serif);font-size:13.5px;color:var(--text-2b);white-space:nowrap}
.normzeile .titel{font-size:12.5px;color:var(--text-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.normzeile[aria-current=true]{background:var(--zeile-aktiv);border-left-color:var(--text)}
.normzeile[aria-current=true] .nr{color:var(--text)}
.normzeile[aria-current=true] .titel{color:var(--titel-2)}
.zuletzt{margin-top:22px;padding:0 16px}
.zuletzt .mono-etikett{margin-bottom:8px}
.zuletzt-liste{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--text-3);align-items:flex-start}
.zuletzt-liste button:hover{color:var(--text)}

/* ── Mittelspalte ── */
.hauptspalte{flex:1;min-width:0;padding:30px 32px 70px}
.brotkrume{
  display:flex;align-items:baseline;gap:10px;
  font-family:var(--mono);font-size:11px;color:var(--text-4);letter-spacing:.06em;
}
.hauptspalte h1{
  font-family:var(--serif);font-size:30px;line-height:1.2;font-weight:400;
  margin:10px 0 0;letter-spacing:-.015em;
}
.hauptspalte h1 .titel{color:var(--titel-2)}
.meta{
  margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  font-size:12px;color:var(--text-3);
}
.etikett{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--linie);border-radius:var(--r-chip);padding:3px 8px;color:var(--text-3);
}
.etikett.gefuellt{background:var(--leiste);color:var(--text-2b)}

/* Leseraum: Absatzrinne und Lesespalte */
.leseraum{display:flex;gap:24px;margin-top:30px;align-items:flex-start}
.rinne{flex:none;width:var(--rinne);display:flex;flex-direction:column;gap:2px;padding-top:4px}
.rinne button{
  font-family:var(--mono);font-size:10.5px;color:var(--text-5);
  border-right:2px solid var(--linie-schwach);text-align:right;padding:2px 6px 2px 0;
}
.rinne button:hover{color:var(--text-2b)}
.rinne button[aria-current=true]{color:var(--text);border-right-color:var(--text)}
.lesespalte-huelle{flex:1;min-width:0;max-width:var(--lesespalte)}
.lesespalte{max-width:var(--lesespalte)}

/* Lesetypografie. Der Wortlaut kommt unverändert aus data/; hier wird
   ausschließlich gesetzt, nicht ergänzt. */
.lesespalte{font-family:var(--serif);font-size:17.5px;line-height:1.8;color:var(--text)}
.lesespalte p{margin:0 0 12px}
.lesespalte .absatz{margin-bottom:10px}
.lesespalte dl{margin:8px 0 12px}
.lesespalte dt{
  float:left;clear:left;font-family:var(--mono);font-size:12.5px;color:var(--text-5);
  min-width:34px;padding-top:6px;
}
.lesespalte dd{margin:0 0 8px 40px}
/* Aufzählungsglieder liegen in den amtlichen Daten als ZWEI benachbarte
   <span> vor — Bedingung und Anordnung:
     <dd><span>… vorzunehmen ist:</span><span>nach der nach Absatz 2 …</span></dd>
   Zwischen zwei Elementen steht im Quelltext kein Leerzeichen, der Browser
   setzt also keines. Angezeigt wurde deshalb „vorzunehmen ist:nach der“.
   Die verkündete Fassung hat an dieser Stelle ein Leerzeichen; es wird hier
   als Trennung zwischen zwei Elementen wiederhergestellt. Am Wortlaut ändert
   das nichts — es wird kein Wort eingefügt, gekürzt oder ersetzt. */
.lesespalte dd>span+span::before{content:" ";white-space:pre}
.lesespalte .sn{
  font-family:var(--mono);font-size:10px;color:var(--text-6);vertical-align:super;
  margin-right:2px;-webkit-user-select:none;user-select:none;
}
.lesespalte table{border-collapse:collapse;font-family:var(--sans);font-size:13.5px;margin:12px 0;width:100%}
.lesespalte td{border-top:1px solid var(--linie-schwach);padding:6px 10px 6px 0;vertical-align:top;line-height:1.5}
.lesespalte pre{
  font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--text-2);
  background:var(--flaeche);padding:10px 12px;border-radius:var(--r-chip);overflow-x:auto;
}

/* ══════════════════════════════════════════════════════════════════════
   Auszeichnungsebene 1: maschinelle Struktur

   Kodierung ist die FLÄCHE. Der `box-shadow` in derselben Farbe zieht die
   Tönung über die Zeilenhöhe hinaus — ohne ihn endet sie an der Schriftkante
   und die Zeilen wirken zerschnitten.

   Im Normtext steht kein Wort dazu. Was die Farben bedeuten, sagt allein die
   Legende darüber.
   ══════════════════════════════════════════════════════════════════════ */
.s{border-radius:var(--r-marke)}

body[data-struktur=dezent] .s-tatbestand{background:var(--tb-dezent);box-shadow:0 0 0 1px var(--tb-dezent)}
body[data-struktur=dezent] .s-rechtsfolge{background:var(--rf-dezent);box-shadow:0 0 0 1px var(--rf-dezent)}
body[data-struktur=dezent] .s-ausnahme{background:var(--au-dezent);box-shadow:0 0 0 1px var(--au-dezent)}

body[data-struktur=voll] .s-tatbestand{background:var(--tb-voll);box-shadow:0 0 0 2px var(--tb-voll)}
body[data-struktur=voll] .s-rechtsfolge{background:var(--rf-voll);box-shadow:0 0 0 2px var(--rf-voll)}
body[data-struktur=voll] .s-ausnahme{background:var(--au-voll);box-shadow:0 0 0 2px var(--au-voll)}

/* Stufe „aus“ entfernt jede Struktur-Tönung. Eigene Markierungen und
   Verwaltungsstellen bleiben in allen Stufen sichtbar — sie sind keine
   Struktur, sondern Nachweis und eigene Arbeit. */
body[data-struktur=aus] .s{background:transparent;box-shadow:none}

/* Aufzählungsmarken („1.“, „a)“) stehen im kanonischen Volltext und liegen
   deshalb rechnerisch innerhalb der Spannen — eine Rechtsfolge, die über eine
   Aufzählung läuft, schließt sie ein. Eingefärbt werden sie trotzdem nicht:
   Sie gliedern den Text, sie sind nicht sein Inhalt. Die Zeichenpositionen
   bleiben davon unberührt; es ändert sich nur, was man sieht. */
.lesespalte dt .s{background:transparent!important;box-shadow:none!important}

/* ── Legende ── */
.legende{
  display:flex;flex-wrap:wrap;align-items:center;gap:7px 14px;
  margin-bottom:18px;font-size:11.5px;color:var(--text-3);
}
.legende span{display:flex;align-items:center;gap:6px}
.legende .marke{width:22px;height:9px;border-radius:var(--r-marke);flex:none}
.legende .m-tatbestand{box-shadow:inset 0 0 0 1px var(--tb-rand)}
.legende .m-rechtsfolge{box-shadow:inset 0 0 0 1px var(--rf-rand)}
.legende .m-ausnahme{box-shadow:inset 0 0 0 1px var(--au-rand)}
body[data-struktur=dezent] .legende .m-tatbestand{background:var(--tb-dezent)}
body[data-struktur=dezent] .legende .m-rechtsfolge{background:var(--rf-dezent)}
body[data-struktur=dezent] .legende .m-ausnahme{background:var(--au-dezent)}
body[data-struktur=voll] .legende .m-tatbestand{background:var(--tb-voll)}
body[data-struktur=voll] .legende .m-rechtsfolge{background:var(--rf-voll)}
body[data-struktur=voll] .legende .m-ausnahme{background:var(--au-voll)}
.legende .m-eigen{background:rgba(242,199,68,.5);border-bottom:2px solid #C9A227}
.legende .m-verwaltung{border-bottom:2px dotted var(--vw)}
.legende .anmerkung{color:var(--text-5);flex-basis:100%}

/* ══════════════════════════════════════════════════════════════════════
   Auszeichnungsebene 2: eigene Markierung

   Kodierung ist der MARKER — halbdurchsichtige Fläche mit farbiger
   Unterkante. Damit bleibt sie von der maschinellen Struktur (volle Fläche,
   keine Kante) und von der Verwaltungsstelle (Punktlinie, keine Fläche) auf
   den ersten Blick unterscheidbar, auch wenn alle drei übereinander liegen.

   Farbe und Deckkraft stehen im style-Attribut, weil sie frei wählbar sind;
   alles Übrige steht hier.
   ══════════════════════════════════════════════════════════════════════ */
.eigen{
  border-radius:var(--r-marke) var(--r-marke) 0 0;
  padding:0 1px;cursor:pointer;
}
.eigen.gewaehlt{outline:2px solid rgba(20,22,26,.35);outline-offset:1px}

/* ── Werkzeugleiste an der Auswahl ── */
.auswahlleiste{
  position:absolute;z-index:70;display:none;align-items:center;gap:5px;
  padding:5px 6px;background:var(--weiss);
  border:1px solid var(--linie);border-radius:var(--r-karte);
  box-shadow:var(--schatten-popover);
}
.auswahlleiste.offen{display:flex}
.auswahlleiste .titel{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-4);margin-right:3px;white-space:nowrap;
}

/* ── Farbkreise ── */
.farbreihe{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.farbkreis{
  width:20px;height:20px;border-radius:50%;cursor:pointer;flex:none;
  border:0;padding:0;
}
.farbwaehler{
  -webkit-appearance:none;appearance:none;border:0;background:none;padding:0;
  width:22px;height:22px;cursor:pointer;flex:none;
}
.farbwaehler::-webkit-color-swatch-wrapper{padding:0}
.farbwaehler::-webkit-color-swatch{border:1px solid var(--linie);border-radius:50%}
.farbwaehler::-moz-color-swatch{border:1px solid var(--linie);border-radius:50%}
.hexwert{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}

/* ── Popover am Text ── */
.popover{
  position:absolute;z-index:70;display:none;flex-direction:column;gap:10px;
  width:300px;background:var(--weiss);
  border:1px solid var(--linie);border-radius:var(--r-karte);
  box-shadow:var(--schatten-popover);padding:12px 13px;
}
.popover.offen{display:flex}
.popover-kopf{display:flex;align-items:center;justify-content:space-between}
.popover-kopf .mono-etikett{font-size:9.5px;letter-spacing:.16em}
.popover-kopf button{color:var(--text-4);font-size:13px;line-height:1;padding:2px 4px}
.popover-kopf button:hover{color:var(--text)}
.popover hr{border:0;border-top:1px solid var(--linie-zart);margin:0}
.popover textarea{
  width:100%;min-height:56px;resize:vertical;font:inherit;font-size:12.5px;line-height:1.55;
  color:var(--text-2);background:var(--flaeche);
  border:1px solid var(--linie-schwach);border-radius:var(--r-knopf);padding:7px 8px;
}
.popover textarea:focus{outline:0;border-color:var(--linie-stark)}
.popover-fuss{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:11px;color:var(--text-5);
}
.popover-fuss button{color:var(--text-3);font-size:11px}
.popover-fuss button:hover{color:var(--warnrot,#B23B3B)}

/* ── Register „Markierungen“ ── */
.karte{
  cursor:pointer;border-left:2px solid var(--linie-schwach);
  padding:2px 0 2px 11px;margin-bottom:16px;
}
.karte:last-of-type{margin-bottom:0}
.karte.aktiv{background:var(--flaeche)}
.karte-kopf{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.karte-punkt{width:9px;height:9px;border-radius:50%;flex:none}
.karte-fundstelle{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.karte-datum{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-5)}
.karte-wortlaut{font-family:var(--serif);font-size:13.5px;line-height:1.5;color:var(--text);margin:0}
.karte-notiz{font-size:12.5px;line-height:1.55;color:var(--text-2b);margin:5px 0 0}
.karte-farbzeile{margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.karte-verschoben{
  font-size:11px;color:var(--text-4);margin:5px 0 0;
}

/* Verweis auf eine andere Norm. Die Unterkante ist heller als die Schrift —
   der Verweis soll im Lesefluss erkennbar sein, ohne ihn zu zerhacken. */
.lesespalte a.verweis{
  color:var(--verweis);border-bottom:1px solid var(--verweis-kante);
  white-space:nowrap;
}
.lesespalte a.verweis:hover{border-bottom-color:var(--verweis)}

/* Blättern zur Nachbarnorm */
.blaettern{
  display:flex;justify-content:space-between;gap:24px;
  max-width:calc(var(--lesespalte) + var(--rinne) + 24px);
  margin:44px 0 0 calc(var(--rinne) + 24px);
  border-top:1px solid var(--linie-schwach);padding-top:16px;
}
.blaettern button{text-align:left;max-width:46%}
.blaettern button:last-child{text-align:right}
.blaettern .richtung{
  display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-4);margin-bottom:3px;
}
.blaettern .wohin{font-family:var(--serif);font-size:14.5px;color:var(--text-2b);line-height:1.35}
.blaettern button:hover .wohin{color:var(--text)}

/* ── Rechter Apparat ── */
.apparat{
  width:var(--apparat);flex:none;
  border-left:1px solid var(--linie-schwach);
  position:sticky;top:0;max-height:100vh;overflow-y:auto;
  padding-bottom:40px;
}
.register{
  display:flex;justify-content:space-between;gap:8px;
  padding:0 16px;border-bottom:1px solid var(--linie-schwach);
  overflow-x:auto;scrollbar-width:none;
}
.register::-webkit-scrollbar{display:none}
.register button{flex:none}
.register button{
  font-size:12px;line-height:1;white-space:nowrap;
  padding:13px 0 11px;color:var(--text-4);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.register button:hover{color:var(--text-2b)}
.register button[aria-selected=true]{color:var(--text);border-bottom-color:var(--text)}
.registerinhalt{padding:16px}

/* Ehrlicher Platzhalter, solange ein Register noch nicht angebunden ist.
   Es wird nichts vorgetäuscht — die Ansicht sagt, was fehlt. */
.platzhalter{
  font-size:12.5px;line-height:1.6;color:var(--text-4);
  border:1px dashed var(--linie);border-radius:var(--r-karte);padding:12px 13px;margin:0;
}

/* ── Blöcke im Apparat ── */
.block{
  border-left:2px solid var(--linie-schwach);
  padding:2px 0 2px 12px;margin-bottom:18px;
}
.block:last-of-type{margin-bottom:0}
.block.betont{border-left-color:var(--verweis)}
.block>.mono-etikett{display:block;margin-bottom:5px}
.block p{margin:0 0 6px;font-size:13px;line-height:1.62;color:var(--text-2)}
.block p:last-child{margin-bottom:0}
.block .fundstelle{
  font-family:var(--mono);font-size:10.5px;color:var(--text-3);
  display:block;margin-bottom:4px;
}
.block .quelle{
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--vw);background:var(--vw-grund);border:1px solid var(--vw-rand);
  border-radius:var(--r-chip);padding:1px 5px;margin-right:6px;white-space:nowrap;
}
.block a{color:var(--verweis);border-bottom:1px solid var(--verweis-kante)}
.block .fehlt{color:var(--text-4);font-size:12.5px;line-height:1.6}

/* Fehlender Datensatz — sichtbar als fehlend, nicht überspielt. */
.fehlmeldung{
  border:1px dashed var(--linie);border-radius:var(--r-karte);
  padding:11px 12px;margin-bottom:18px;
}
.fehlmeldung .mono-etikett{display:block;margin-bottom:5px}
.fehlmeldung p{margin:0;font-size:12.5px;line-height:1.6;color:var(--text-4)}
.fehlmeldung code{font-family:var(--mono);font-size:11px;color:var(--text-3)}

/* Haftungssatz. Er steht auf jeder Ansicht mit Hinweisen und in der
   Druckfassung — das ist eine inhaltliche Auflage, keine Gestaltungsfrage. */
.haftung{
  margin-top:22px;padding-top:14px;border-top:1px solid var(--linie-zart);
  font-size:11.5px;line-height:1.6;color:var(--text-5);
}

/* ── Fehlermeldung ── */
.melder{
  max-width:var(--lesespalte);border:1px solid var(--linie-stark);border-radius:var(--r-karte);
  padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--text-2);background:var(--flaeche);
}
.melder code{
  font-family:var(--mono);font-size:12px;background:var(--weiss);
  border:1px solid var(--linie-schwach);padding:1px 5px;border-radius:var(--r-chip);
}
.melder strong{display:block;margin-bottom:6px;color:var(--text)}
.melder p{margin:0 0 8px}

/* ══════════════════════════════════════════════════════════════════════
   Stufe 768–1199 px: linke Spalte wird zur Schublade, Apparat auf 300 px
   ══════════════════════════════════════════════════════════════════════ */
.schubladen-knopf{display:none}
.verdunkelung{display:none}

/* Die Spezifikation lässt das Verhalten zwischen 390 und 1440 px ausdrücklich
   offen. Ab hier fehlt der Kopfleiste der Platz für die ausgeschriebene
   Beschriftung des Schalters. Sie entfällt sichtbar, bleibt aber über
   `aria-label` der Gruppe erhalten — für die Sprachausgabe ändert sich nichts. */
@media (max-width:1120px){
  .einfaerben>span{display:none}
}

@media (max-width:1199px){
  :root{--apparat:300px}
  /* Fünf Register verteilt auf 300 px schneiden „Markierungen“ ab. Die Zeile
     wird deshalb waagerecht schiebbar — dieselbe Lösung, die der Entwurf für
     die Mobilstufe vorsieht. */
  .register{justify-content:flex-start;gap:14px}
  .schubladen-knopf{
    display:inline-flex;align-items:center;gap:7px;flex:none;
    border:1px solid var(--linie);background:var(--weiss);color:var(--text-2b);
    border-radius:var(--r-knopf);padding:5px 10px;font-size:12.5px;white-space:nowrap;
  }
  .schubladen-knopf:hover{border-color:var(--text);color:var(--text)}
  .navspalte{
    position:fixed;left:0;top:0;bottom:0;z-index:60;width:var(--nav);
    background:var(--papier);border-right:1px solid var(--linie);
    max-height:none;transform:translateX(-100%);
    transition:transform 140ms ease-out;
  }
  body[data-schublade=offen] .navspalte{transform:translateX(0)}
  body[data-schublade=offen] .verdunkelung{
    display:block;position:fixed;inset:0;z-index:55;background:rgba(20,22,26,.28);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   Stufe < 768 px: eine Spalte.
   Der Apparat wird in Schritt 8 zum Blatt von unten; bis dahin steht er
   unter dem Normtext, damit nichts unerreichbar ist.
   ══════════════════════════════════════════════════════════════════════ */
@media (max-width:767px){
  .kopf{gap:10px;flex-wrap:wrap}
  .kopf .einfaerben>span{display:none}
  .kopf-knoepfe{display:none}
  .suchfeld{max-width:none;order:3;flex-basis:100%}
  .kopf-rechts{margin-left:auto}
  .raster{flex-direction:column}
  .hauptspalte{padding:22px 18px 60px;width:100%}
  .hauptspalte h1{font-size:23px;line-height:1.22}
  .leseraum{gap:14px}
  .lesespalte{font-size:16px;line-height:1.68}
  .apparat{
    width:auto;flex:none;position:static;max-height:none;
    border-left:0;border-top:1px solid var(--linie-schwach);align-self:stretch;
  }
  /* Tippziele mindestens 44 px hoch. */
  .normzeile{padding:11px 16px}
  .reiter{padding:12px 14px}
}
</style>
</head>
<body>

<header>
  <div class="kopf">
    <button class="schubladen-knopf" id="schublade-auf" aria-label="Normenverzeichnis öffnen">☰&nbsp;Normen</button>
    <span class="wortmarke">steuernorm</span>

    <label class="suchfeld" for="suche">
      <span class="kuerzel" aria-hidden="true">⌘K</span>
      <input id="suche" type="search" placeholder="Norm, Wortlaut oder Fundstelle …" autocomplete="off">
    </label>

    <div class="kopf-rechts">
      <div class="einfaerben">
        <span id="einfaerben-beschriftung">Tatbestand &amp; Rechtsfolge einfärben</span>
        <div class="stufen" role="radiogroup" id="stufen"
             aria-label="Tatbestand und Rechtsfolge einfärben">
          <button type="button" role="radio" data-stufe="aus" aria-checked="false">aus</button>
          <button type="button" role="radio" data-stufe="dezent" aria-checked="false">dezent</button>
          <button type="button" role="radio" data-stufe="voll" aria-checked="false">voll</button>
        </div>
      </div>
      <div class="trenner" aria-hidden="true"></div>
      <div class="kopf-knoepfe">
        <button type="button">Vergleichen</button>
        <button type="button">Mappe</button>
      </div>
    </div>
  </div>

  <div class="reiterleiste" id="reiterleiste" role="tablist" aria-label="Geöffnete Normen"></div>
</header>

<div class="verdunkelung" id="verdunkelung"></div>

<div class="auswahlleiste" id="auswahlleiste" role="toolbar" aria-label="Auswahl markieren">
  <span class="titel">Markieren</span>
  <div class="farbreihe" id="auswahl-farben"></div>
</div>

<div class="popover" id="popover" role="dialog" aria-label="Eigene Markierung">
  <div class="popover-kopf">
    <span class="mono-etikett">Eigene Markierung</span>
    <button type="button" id="popover-zu" aria-label="Schließen">×</button>
  </div>
  <div class="farbreihe" id="popover-farben"></div>
  <hr>
  <div class="farbreihe">
    <input type="color" class="farbwaehler" id="popover-waehler" aria-label="Eigene Farbe wählen">
    <span class="hexwert" id="popover-hex"></span>
  </div>
  <textarea id="popover-notiz" placeholder="Notiz …" aria-label="Notiz zur Markierung"></textarea>
  <div class="popover-fuss">
    <span>Nur für Sie sichtbar</span>
    <button type="button" id="popover-weg">Entfernen</button>
  </div>
</div>

<div class="raster">
  <nav class="navspalte" id="navspalte" aria-label="Normen des Gesetzes"></nav>
  <main class="hauptspalte" id="haupt"><p class="platzhalter">Wird geladen …</p></main>
  <aside class="apparat" id="apparat" aria-label="Apparat"></aside>
</div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   Zustand
   Abgebildet ist die Tabelle „Interaktion und Zustand" der Spezifikation.
   ══════════════════════════════════════════════════════════════════════ */
const S = {
  register: null,          // data/index.json
  gesetz: null,            // aktuell geladenes Gesetz
  abk: null,
  normId: null,
  strukturModus: "voll",   // aus | dezent | voll — global, localStorage
  geoeffnet: [],           // [{gesetz, norm}] — Sitzung überdauernd
  zuletzt: [],             // zuletzt gelesene Normen
  apparatRegister: "hinweise",
  anmerkungen: {},         // abk → annotations/<gesetz>.json .normen
  belege: {},              // abk → belege/<gesetz>.json
  struktur: {},            // abk → struktur/<gesetz>.json .normen
  markierungen: [],        // eigene Markierungen, localStorage
  aktiveMarkierung: null,  // id | null — flüchtig
  letzteFarbe: "#F2C744",  // localStorage
};

/* Voreinstellungen der Farbwahl, dazu ein freier Wähler. */
const PALETTE = [
  ["#F2C744", "Gelb"], ["#4E9A5F", "Grün"], ["#3B7BD1", "Blau"],
  ["#C4577A", "Rosa"], ["#8B7BC7", "Violett"], ["#7A8087", "Grau"],
];

const cacheGesetz = new Map();
const el = (id) => document.getElementById(id);

/* ── Speicher ──────────────────────────────────────────────────────── */
function merken(schluessel, wert){
  try { localStorage.setItem("sn." + schluessel, JSON.stringify(wert)); }
  catch (e) { /* Speicher gesperrt oder voll — die Sitzung läuft trotzdem */ }
}
function gemerkt(schluessel, ersatz){
  try {
    const roh = localStorage.getItem("sn." + schluessel);
    return roh === null ? ersatz : JSON.parse(roh);
  } catch (e) { return ersatz; }
}

/* ── Laden ─────────────────────────────────────────────────────────── */
async function holen(pfad){
  const antwort = await fetch(pfad, { cache: "no-cache" });
  if (!antwort.ok) throw new Error(pfad + " → " + antwort.status);
  return antwort.json();
}

async function gesetzLaden(abk){
  const schluessel = String(abk).toLowerCase();
  if (cacheGesetz.has(schluessel)) return cacheGesetz.get(schluessel);
  const eintrag = registerEintrag(schluessel);
  const gesetz = await holen("data/" + (eintrag ? eintrag.datei : schluessel + ".json"));
  cacheGesetz.set(schluessel, gesetz);
  return gesetz;
}

/**
 * Zutaten neben dem Normtext.
 *
 * Jede Datei ist für sich entbehrlich: Fehlt sie, bleibt der Eintrag leer und
 * die Oberfläche weist die Lücke aus. Der Normtext erscheint in jedem Fall.
 */
async function zutatenLaden(abk){
  const schluessel = String(abk).toLowerCase();

  if (!(abk in S.anmerkungen)){
    try { S.anmerkungen[abk] = (await holen("annotations/" + schluessel + ".json")).normen || {}; }
    catch (e) { S.anmerkungen[abk] = null; }
  }
  if (!(abk in S.belege)){
    try { S.belege[abk] = await holen("belege/" + schluessel + ".json"); }
    catch (e) { S.belege[abk] = null; }
  }
  if (!(abk in S.struktur)){
    try { S.struktur[abk] = (await holen("struktur/" + schluessel + ".json")).normen || {}; }
    catch (e) { S.struktur[abk] = null; }
  }
}

/** Segmente der laufenden Norm — leer, wenn es keinen Datensatz gibt. */
function strukturDerNorm(){
  const gesetz = S.struktur[S.abk];
  if (!gesetz) return null;
  const eintrag = gesetz[S.normId];
  return eintrag && Array.isArray(eintrag.segmente) ? eintrag.segmente : [];
}

/* ── Kleinigkeiten ─────────────────────────────────────────────────── */
function knopf(klasse, inhalt){
  const b = document.createElement("button");
  b.type = "button";
  if (klasse) b.className = klasse;
  if (inhalt !== undefined) b.textContent = inhalt;
  return b;
}

const registerEintrag = (abk) =>
  S.register ? S.register.gesetze.find(g => g.abk.toLowerCase() === String(abk).toLowerCase()) : null;

/**
 * Fassungsangabe aus den echten Daten.
 *
 * Der Entwurf zeigt „Fassung 23.12.2024". Dieses Datum steht im Bestand als
 * „zuletzt geändert durch Art. 4 G v. 23.12.2024 I Nr. 449" — es wird
 * herausgelesen, nicht gesetzt. Fehlt es, entfällt das Etikett; es wird
 * nichts erfunden.
 */
function fassungAus(gesetz){
  const stand = (gesetz.stand || []).find(x => x.typ === "Stand") || (gesetz.stand || [])[0];
  if (!stand) return null;
  const treffer = /(\d{1,2}\.\d{1,2}\.\d{4})/.exec(stand.text || "");
  return treffer ? treffer[1] : null;
}

/* ══════════════════════════════════════════════════════════════════════
   Struktur-Einfärbung — Schalter
   Die Wirkung auf den Normtext folgt in Schritt 4. Hier wird der Zustand
   gehalten und am Rumpf ausgewiesen, damit das CSS ihn später auswerten kann.
   ══════════════════════════════════════════════════════════════════════ */
function strukturSetzen(modus, nurAnzeige = false){
  const gueltig = ["aus", "dezent", "voll"].includes(modus) ? modus : "voll";
  if (!nurAnzeige){
    S.strukturModus = gueltig;
    merken("strukturModus", gueltig);
  }

  /* Ohne Datensatz gibt es nichts einzufärben. Der Schalter steht dann auf
     „aus" und ist gesperrt — mit einem Titel, der sagt, warum. Das ist der
     Unterschied zwischen „ausgeschaltet" und „nicht vorhanden". */
  const segmente = S.abk ? strukturDerNorm() : null;
  const moeglich = Array.isArray(segmente) && segmente.length > 0;
  const angezeigt = moeglich ? S.strukturModus : "aus";

  document.body.dataset.struktur = angezeigt;
  for (const b of el("stufen").querySelectorAll("button")){
    b.setAttribute("aria-checked", String(b.dataset.stufe === angezeigt));
    b.disabled = !moeglich;
    b.title = moeglich ? "" : "Für diese Norm liegt kein Strukturdatensatz vor.";
  }
  return { moeglich, angezeigt };
}

/* ══════════════════════════════════════════════════════════════════════
   Reiterleiste — geöffnete Normen
   ══════════════════════════════════════════════════════════════════════ */
function reiterOeffnen(abk, normId, wechseln = true){
  const vorhanden = S.geoeffnet.some(r => r.gesetz === abk && r.norm === normId);
  if (!vorhanden) S.geoeffnet.push({ gesetz: abk, norm: normId });
  merken("geoeffnet", S.geoeffnet);
  if (wechseln) location.hash = "#/" + abk.toLowerCase() + "/" + normId;
}

function reiterSchliessen(abk, normId){
  const stelle = S.geoeffnet.findIndex(r => r.gesetz === abk && r.norm === normId);
  if (stelle === -1) return;
  const warAktiv = S.abk === abk && S.normId === normId;
  S.geoeffnet.splice(stelle, 1);
  merken("geoeffnet", S.geoeffnet);
  if (!warAktiv){ reiterZeichnen(); return; }
  const nachfolger = S.geoeffnet[Math.min(stelle, S.geoeffnet.length - 1)];
  if (nachfolger) location.hash = "#/" + nachfolger.gesetz.toLowerCase() + "/" + nachfolger.norm;
  else reiterZeichnen();
}

function reiterZeichnen(){
  const leiste = el("reiterleiste");
  leiste.innerHTML = "";

  for (const eintrag of S.geoeffnet){
    const meta = registerEintrag(eintrag.gesetz);
    const norm = meta && meta.normen ? meta.normen.find(n => n.id === eintrag.norm) : null;
    const aktiv = eintrag.gesetz === S.abk && eintrag.norm === S.normId;

    const reiter = knopf("reiter");
    reiter.setAttribute("role", "tab");
    reiter.setAttribute("aria-selected", String(aktiv));
    reiter.draggable = true;
    reiter.dataset.stelle = String(S.geoeffnet.indexOf(eintrag));
    if (norm && norm.t) reiter.title = norm.t;

    const nr = document.createElement("span");
    nr.className = "nr";
    // Kein erfundener Text: Fehlt der Registereintrag, steht dort die Adresse.
    nr.textContent = (norm ? norm.e : "§ " + eintrag.norm) + " " + (meta ? meta.abk : eintrag.gesetz);
    reiter.appendChild(nr);
    reiter.onclick = () => { location.hash = "#/" + eintrag.gesetz.toLowerCase() + "/" + eintrag.norm; };

    const zu = document.createElement("span");
    zu.className = "zu";
    zu.textContent = "×";
    zu.setAttribute("role", "button");
    zu.tabIndex = 0;
    zu.setAttribute("aria-label", "Reiter schließen");
    zu.onclick = (e) => { e.stopPropagation(); reiterSchliessen(eintrag.gesetz, eintrag.norm); };
    zu.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " "){
        e.preventDefault(); e.stopPropagation();
        reiterSchliessen(eintrag.gesetz, eintrag.norm);
      }
    };
    reiter.appendChild(zu);

    leiste.appendChild(reiter);
  }

  reiterZiehenVerdrahten(leiste);

  const plus = knopf("reiter-plus", "+");
  plus.title = "Norm öffnen";
  plus.setAttribute("aria-label", "Norm öffnen");
  plus.onclick = () => el("suche").focus();
  leiste.appendChild(plus);

  const zahl = document.createElement("div");
  zahl.className = "reiter-zahl";
  const anzahl = S.geoeffnet.length;
  zahl.textContent = anzahl === 1 ? "1 geöffnete Norm" : anzahl + " geöffnete Normen";
  leiste.appendChild(zahl);
}

/**
 * Reiter per Ziehen umsortieren.
 *
 * Die Reihenfolge ist Arbeitsordnung: Wer sieben Normen offen hat, will sie
 * gruppieren können. Gearbeitet wird auf den Stellen im Zustand, nicht auf den
 * Knoten — nach dem Ablegen wird ohnehin neu gezeichnet.
 */
function reiterZiehenVerdrahten(leiste){
  let quelle = null;

  const aufraeumen = () => {
    for (const r of leiste.querySelectorAll(".reiter")){
      r.classList.remove("zieht", "ziel-links", "ziel-rechts");
    }
  };

  for (const reiter of leiste.querySelectorAll(".reiter")){
    reiter.addEventListener("dragstart", (e) => {
      quelle = Number(reiter.dataset.stelle);
      reiter.classList.add("zieht");
      e.dataTransfer.effectAllowed = "move";
      // Firefox startet das Ziehen nur mit gesetzten Daten.
      e.dataTransfer.setData("text/plain", String(quelle));
    });
    reiter.addEventListener("dragend", aufraeumen);

    reiter.addEventListener("dragover", (e) => {
      if (quelle === null) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const kasten = reiter.getBoundingClientRect();
      const linkeHaelfte = e.clientX < kasten.left + kasten.width / 2;
      reiter.classList.toggle("ziel-links", linkeHaelfte);
      reiter.classList.toggle("ziel-rechts", !linkeHaelfte);
    });
    reiter.addEventListener("dragleave", () => {
      reiter.classList.remove("ziel-links", "ziel-rechts");
    });

    reiter.addEventListener("drop", (e) => {
      e.preventDefault();
      if (quelle === null) return;
      const kasten = reiter.getBoundingClientRect();
      const linkeHaelfte = e.clientX < kasten.left + kasten.width / 2;
      let ziel = Number(reiter.dataset.stelle) + (linkeHaelfte ? 0 : 1);
      const [bewegt] = S.geoeffnet.splice(quelle, 1);
      if (quelle < ziel) ziel--;
      S.geoeffnet.splice(ziel, 0, bewegt);
      quelle = null;
      merken("geoeffnet", S.geoeffnet);
      reiterZeichnen();
    });
  }
}

/** Zum Reiter an der Stelle `index` wechseln — für die Tasten 1 bis 9. */
function reiterWechseln(index){
  const ziel = S.geoeffnet[index];
  if (!ziel) return;
  location.hash = "#/" + ziel.gesetz.toLowerCase() + "/" + ziel.norm;
}

/* ══════════════════════════════════════════════════════════════════════
   Linke Spalte — Normen des Gesetzes
   ══════════════════════════════════════════════════════════════════════ */
function navZeichnen(){
  const spalte = el("navspalte");
  spalte.innerHTML = "";
  if (!S.gesetz) return;

  const etikett = document.createElement("div");
  etikett.className = "mono-etikett";
  // Die Normenzahl kommt aus dem geladenen Gesetz, nicht aus einer Annahme.
  etikett.textContent = S.gesetz.abk + " · " + S.gesetz.normen.length + " Normen";
  spalte.appendChild(etikett);

  for (const norm of S.gesetz.normen){
    const zeile = knopf("normzeile");
    zeile.setAttribute("aria-current", String(norm.id === S.normId));
    zeile.title = (norm.enbez + " " + (norm.titel || "")).trim();

    const nr = document.createElement("span");
    nr.className = "nr";
    nr.textContent = norm.enbez;

    const titel = document.createElement("span");
    titel.className = "titel";
    titel.textContent = norm.titel || "";

    zeile.append(nr, titel);
    zeile.onclick = () => {
      document.body.dataset.schublade = "zu";
      reiterOeffnen(S.abk, norm.id);
    };
    spalte.appendChild(zeile);
  }

  if (S.zuletzt.length){
    const block = document.createElement("div");
    block.className = "zuletzt";
    const kappe = document.createElement("div");
    kappe.className = "mono-etikett";
    kappe.textContent = "Zuletzt";
    block.appendChild(kappe);

    const liste = document.createElement("div");
    liste.className = "zuletzt-liste";
    for (const eintrag of S.zuletzt.slice(0, 6)){
      const meta = registerEintrag(eintrag.gesetz);
      const norm = meta && meta.normen ? meta.normen.find(n => n.id === eintrag.norm) : null;
      const b = knopf("", (norm ? norm.e : "§ " + eintrag.norm) + " " + (meta ? meta.abk : eintrag.gesetz));
      b.onclick = () => { location.hash = "#/" + eintrag.gesetz.toLowerCase() + "/" + eintrag.norm; };
      liste.appendChild(b);
    }
    block.appendChild(liste);
    spalte.appendChild(block);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   Kanonischer Textindex

   Die Zeichenpositionen in struktur/ beziehen sich auf den kanonischen
   Volltext der Norm, den `tools/lib/gliederung.mjs` bildet:
   Satznummern entfernt, Auszeichnung durch Leerzeichen ersetzt, Leerraum
   zusammengezogen, kein Leerzeichen vor Satzzeichen.

   Hier wird DIESELBE Zeichenkette aus dem DOM aufgebaut — zusammen mit einer
   Karte, die jedem Zeichen seinen Textknoten zuordnet. Nur wenn beide Seiten
   identisch rechnen, sitzen die Farben an der richtigen Stelle. Weicht eine
   Seite ab, verschiebt sich alles ab der ersten Abweichung.
   ══════════════════════════════════════════════════════════════════════ */
function textindex(wurzel){
  const gehe = document.createTreeWalker(wurzel, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if (!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      // Satznummern blendet auch die Pipeline aus (entkerne).
      if (n.parentElement.closest(".sn")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    },
  });

  const knoten = [], karte = [];
  let text = "", n;

  const leerzeichen = (ref = null) => {
    if (text && !text.endsWith(" ")){ text += " "; karte.push(ref); }
  };

  const zeichen = (ch, ref) => {
    if (/\s/.test(ch)){ leerzeichen(ref); return; }
    // Kein Leerzeichen vor Satzzeichen — genau wie in entkerne().
    if (/[,.;:!?]/.test(ch) && text.endsWith(" ")){ text = text.slice(0, -1); karte.pop(); }
    text += ch;
    karte.push(ref);
  };

  while ((n = gehe.nextNode())){
    if (knoten.length) leerzeichen();
    knoten.push(n);
    for (let i = 0; i < n.nodeValue.length; i++) zeichen(n.nodeValue[i], { n, i });
  }
  if (text.endsWith(" ")){ text = text.slice(0, -1); karte.pop(); }
  return { text, karte, knoten };
}

/**
 * Legt Spannen über den Normtext, ohne ihn zu verändern.
 *
 * Gearbeitet wird zeichenweise: Jedes Zeichen bekommt seine Klasse, danach
 * werden gleich ausgezeichnete Nachbarn zu einem Element zusammengefasst. Das
 * ist der einzige Weg, der auch dann trägt, wenn eine Spanne mitten in einem
 * Textknoten beginnt oder über mehrere Knoten läuft.
 *
 * @returns {number} Zahl der Spannen, die ihre Stelle nicht gefunden haben
 */
function spannenLegen(wurzel, spannen){
  if (!spannen.length) return 0;
  const { text, karte, knoten } = textindex(wurzel);

  /* Je Zeichen wird eine LISTE von Spannen geführt, keine einzelne.
     Die drei Auszeichnungsebenen liegen übereinander: Eine Stelle kann
     zugleich Rechtsfolge, eigene Markierung und Verwaltungsstelle sein. Wer
     hier nur die zuletzt gesetzte Spanne behält, löscht die anderen beiden. */
  const belegung = new Map(knoten.map(n => [n, new Array(n.nodeValue.length).fill(null)]));
  let verwaist = 0;

  for (const spanne of spannen){
    const von = spanne.von;
    const bis = Math.min(spanne.bis, text.length);
    if (!Number.isInteger(von) || von < 0 || bis <= von || von >= text.length){ verwaist++; continue; }
    for (let pos = von; pos < bis; pos++){
      const ref = karte[pos];
      if (!ref) continue;
      const liste = belegung.get(ref.n);
      if (!liste[ref.i]) liste[ref.i] = [];
      liste[ref.i].push(spanne);
    }
  }

  /* Zwei Zeichen gehören in dasselbe Element, wenn genau dieselben Spannen auf
     ihnen liegen — in derselben Reihenfolge. */
  const kennung = (liste) => (liste ? liste.map(s => s.schluessel || s.klasse).join(" ") : "");

  for (const n of knoten){
    const roh = n.nodeValue;
    const belegt = belegung.get(n);
    if (!belegt.some(Boolean)) continue;

    const teil = document.createDocumentFragment();
    let start = 0;
    while (start < roh.length){
      const jetzt = kennung(belegt[start]);
      let ende = start + 1;
      while (ende < roh.length && kennung(belegt[ende]) === jetzt) ende++;
      const stueck = roh.slice(start, ende);

      if (!jetzt){
        teil.appendChild(document.createTextNode(stueck));
      } else {
        const liste = belegt[start];
        const s = document.createElement("span");
        s.className = liste.map(x => x.klasse).join(" ");
        const titel = liste.map(x => x.titel).filter(Boolean);
        if (titel.length) s.title = titel.join(" · ");
        for (const x of liste){
          if (x.datensatz) Object.assign(s.dataset, x.datensatz);
          if (x.stil) s.setAttribute("style", (s.getAttribute("style") || "") + x.stil);
        }
        s.textContent = stueck;
        teil.appendChild(s);
      }
      start = ende;
    }
    n.parentNode.replaceChild(teil, n);
  }
  return verwaist;
}

/* ══════════════════════════════════════════════════════════════════════
   Eigene Markierungen

   Sie liegen im Browser, nicht auf einem Server — es gibt keinen. Verankert
   wird über den WORTLAUT samt Umgebung, nicht über Zeichenpositionen: Eine
   Gesetzesänderung verschiebt jede Position, aber selten den markierten Satz.
   Findet eine Markierung ihre Stelle nicht mehr, geht sie nicht verloren; sie
   erscheint im Register mit dem Hinweis, dass der Text sich geändert hat.
   ══════════════════════════════════════════════════════════════════════ */
const KONTEXT = 40;   // Zeichen Umgebung je Seite

const hexZuRgba = (hex, alpha) => {
  const wert = parseInt(String(hex).replace("#", ""), 16);
  if (Number.isNaN(wert)) return `rgba(0,0,0,${alpha})`;
  return `rgba(${(wert >> 16) & 255},${(wert >> 8) & 255},${wert & 255},${alpha})`;
};

function markierungenLesen(){
  const alle = gemerkt("markierungen", []);
  return Array.isArray(alle) ? alle : [];
}
function markierungenSchreiben(liste){
  S.markierungen = liste;
  merken("markierungen", liste);
}
function markierungenDerNorm(){
  return S.markierungen.filter(m => m.gesetz === S.abk && m.norm === S.normId);
}

/** Sucht die gespeicherte Stelle wieder: erst mit Umgebung, dann ohne. */
function markierungVerorten(volltext, m){
  if (m.praefix){
    const mitKontext = volltext.indexOf(m.praefix + m.anker);
    if (mitKontext !== -1) return mitKontext + m.praefix.length;
  }
  return volltext.indexOf(m.anker);
}

/** Absatzangabe zur Fundstelle — aus struktur/, sonst leer. */
function fundstelleZu(von){
  const segmente = strukturDerNorm();
  if (!Array.isArray(segmente)) return "";
  const treffer = segmente.find(s => von >= s.von && von < s.bis)
    || segmente.find(s => s.von >= von);
  return treffer && treffer.pfad ? treffer.pfad : "";
}

function markierungAnlegen(anker, praefix, suffix, von){
  const eintrag = {
    id: String(Date.now()) + Math.random().toString(36).slice(2, 7),
    gesetz: S.abk,
    norm: S.normId,
    anker, praefix, suffix,
    fundstelle: fundstelleZu(von),
    farbe: S.letzteFarbe,
    notiz: "",
    datum: new Date().toISOString(),
    mappe: null,
  };
  markierungenSchreiben(S.markierungen.concat([eintrag]));
  return eintrag;
}

function markierungAendern(id, aenderung){
  markierungenSchreiben(S.markierungen.map(m => (m.id === id ? { ...m, ...aenderung } : m)));
}
function markierungLoeschen(id){
  markierungenSchreiben(S.markierungen.filter(m => m.id !== id));
  if (S.aktiveMarkierung === id) S.aktiveMarkierung = null;
}

/* ── Farbwahl ───────────────────────────────────────────────────────── */

/**
 * Eine Reihe Farbkreise.
 *
 * ALLE Klicks hier rufen `stopPropagation()`. Ohne das schließt der Klick auf
 * einen Kreis zugleich die Karte, auf der er liegt — die Auswahl wäre nach dem
 * ersten Klick wieder zu. Derselbe Fehler ist im Entwurf aufgetreten.
 */
function farbreiheFuellen(behaelter, aktuell, waehlen){
  behaelter.innerHTML = "";
  for (const [hex, name] of PALETTE){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "farbkreis";
    b.title = name;
    b.setAttribute("aria-label", "Farbe " + name);
    b.setAttribute("aria-pressed", String(String(aktuell).toLowerCase() === hex.toLowerCase()));
    b.style.background = hexZuRgba(hex, .45);
    b.style.boxShadow = String(aktuell).toLowerCase() === hex.toLowerCase()
      ? `0 0 0 2px #FFFFFF, 0 0 0 3.5px ${hex}`
      : `inset 0 0 0 1px ${hex}`;
    b.onclick = (e) => { e.stopPropagation(); waehlen(hex); };
    behaelter.appendChild(b);
  }
}

/* ── Werkzeugleiste an der Auswahl ──────────────────────────────────── */

function auswahlleisteZeigen(){
  const leiste = el("auswahlleiste");
  const auswahl = window.getSelection();
  if (!auswahl || auswahl.isCollapsed || !auswahl.rangeCount){ leiste.classList.remove("offen"); return; }

  const bereich = auswahl.getRangeAt(0);
  const lese = document.querySelector(".lesespalte");
  const text = auswahl.toString().replace(/\s+/g, " ").trim();
  if (!lese || !lese.contains(bereich.commonAncestorContainer) || text.length < 3){
    leiste.classList.remove("offen");
    return;
  }

  farbreiheFuellen(el("auswahl-farben"), S.letzteFarbe, (hex) => {
    S.letzteFarbe = hex;
    merken("letzteFarbe", hex);
    auswahlMarkieren(text);
  });

  const kasten = bereich.getBoundingClientRect();
  leiste.classList.add("offen");
  leiste.style.top = (window.scrollY + kasten.top - leiste.offsetHeight - 8) + "px";
  leiste.style.left = Math.max(8, window.scrollX + kasten.left) + "px";
}

function auswahlMarkieren(text){
  const lese = document.querySelector(".lesespalte");
  const { text: voll } = textindex(lese);
  const stelle = voll.indexOf(text);
  const praefix = stelle === -1 ? "" : voll.slice(Math.max(0, stelle - KONTEXT), stelle);
  const suffix = stelle === -1 ? "" : voll.slice(stelle + text.length, stelle + text.length + KONTEXT);

  const eintrag = markierungAnlegen(text, praefix, suffix, stelle);
  el("auswahlleiste").classList.remove("offen");
  window.getSelection().removeAllRanges();
  S.aktiveMarkierung = eintrag.id;
  S.apparatRegister = "markierungen";
  hauptZeichnen();
  apparatZeichnen();
}

/* ── Popover am Text ────────────────────────────────────────────────── */

function popoverOeffnen(id, ankerKnoten){
  const eintrag = S.markierungen.find(m => m.id === id);
  if (!eintrag) return;
  const pop = el("popover");

  farbreiheFuellen(el("popover-farben"), eintrag.farbe, (hex) => {
    markierungAendern(id, { farbe: hex });
    S.letzteFarbe = hex;
    merken("letzteFarbe", hex);
    popoverOeffnen(id, ankerKnoten);
    hauptZeichnen();
    apparatZeichnen();
  });

  const waehler = el("popover-waehler");
  waehler.value = /^#[0-9a-f]{6}$/i.test(eintrag.farbe) ? eintrag.farbe : "#F2C744";
  el("popover-hex").textContent = eintrag.farbe;
  waehler.oninput = (e) => {
    e.stopPropagation();
    markierungAendern(id, { farbe: e.target.value });
    el("popover-hex").textContent = e.target.value;
  };
  waehler.onchange = () => { hauptZeichnen(); apparatZeichnen(); popoverOeffnen(id, ankerKnoten); };
  waehler.onclick = (e) => e.stopPropagation();

  const notiz = el("popover-notiz");
  notiz.value = eintrag.notiz || "";
  notiz.oninput = () => markierungAendern(id, { notiz: notiz.value });
  notiz.onclick = (e) => e.stopPropagation();

  el("popover-weg").onclick = (e) => {
    e.stopPropagation();
    markierungLoeschen(id);
    popoverSchliessen();
    hauptZeichnen();
    apparatZeichnen();
  };

  pop.classList.add("offen");
  const kasten = ankerKnoten.getBoundingClientRect();
  const links = Math.min(
    Math.max(8, window.scrollX + kasten.left),
    window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 12,
  );
  pop.style.top = (window.scrollY + kasten.bottom + 8) + "px";
  pop.style.left = links + "px";
}

function popoverSchliessen(){
  el("popover").classList.remove("offen");
}

/* ══════════════════════════════════════════════════════════════════════
   Verweise im Normtext

   „§ 15 Abs. 2 EStG" wird anklickbar. Das ist die Arbeitsweise, die eine
   Gesetzessammlung ausmacht: Jede Norm hängt an den anderen. Der Wortlaut
   bleibt dabei unangetastet — es wird ausschließlich umschlossen, nie
   ergänzt, gekürzt oder umgestellt.
   ══════════════════════════════════════════════════════════════════════ */
/**
 * Verweismuster.
 *
 * Erfasst wird die Paragrafennummer, ein etwaiger Absatz- und Satzzusatz und
 * das Zielgesetz — als Kürzel („§ 32d EStG") ODER als ausgeschriebener Name.
 *
 * Der ausgeschriebene Name ist der Regelfall im Gesetzestext: Das SolzG
 * verweist auf „§ 43b DES EINKOMMENSTEUERGESETZES", nie auf „§ 43b EStG".
 * Wer nur nach Kürzeln sucht, hält diese Verweise für Verweise auf das eigene
 * Gesetz und verlinkt § 43b SolzG — eine Norm, die es nicht gibt.
 */
function verweisMuster(){
  const kuerzel = S.register.gesetze
    .map(g => g.abk.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
    .join("|");
  // Genitiv und Nominativ des Volltitels: „des Einkommensteuergesetzes",
  // „das Umsatzsteuergesetz". Der Titel kommt aus dem Register, nicht aus
  // einer eigenen Liste.
  const titel = S.register.gesetze
    .map(g => g.titel.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?:es|s)?")
    .join("|");
  return new RegExp(
    "§+\\s?(\\d+[a-z]?)"
    + "((?:\\s?Abs(?:atz|\\.)\\s?\\d+[a-z]?)?(?:\\s?(?:Satz|S\\.|Nummer|Nr\\.)\\s?\\d+)?)"
    + "(?:\\s(?:(" + kuerzel + ")\\b|(?:des|der|dem|das|die)\\s+(" + titel + ")))?",
    "g",
  );
}

/** Kürzel zum ausgeschriebenen Gesetzesnamen — über das Register, nicht geraten. */
function abkAusTitel(name){
  const rein = String(name).replace(/(?:es|s)$/, "");
  const treffer = S.register.gesetze.find(g => g.titel === rein || g.titel === name);
  return treffer ? treffer.abk : null;
}

/** Gibt es die Norm im Zielgesetz überhaupt? */
function normVorhanden(abk, nr){
  const eintrag = registerEintrag(abk);
  if (!eintrag || !Array.isArray(eintrag.normen)) return false;
  return eintrag.normen.some(n => String(n.id).toLowerCase() === String(nr).toLowerCase());
}

function verweiseSetzen(wurzel, eigenesAbk){
  const muster = verweisMuster();

  const gehe = document.createTreeWalker(wurzel, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => n.parentElement.closest("a") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const ziele = [];
  let n;
  while ((n = gehe.nextNode())) if (n.nodeValue.includes("§")) ziele.push(n);

  for (const knoten of ziele){
    const roh = knoten.nodeValue;
    muster.lastIndex = 0;
    const teil = document.createDocumentFragment();
    let letzte = 0, treffer;

    while ((treffer = muster.exec(roh)) !== null){
      if (muster.lastIndex <= treffer.index) muster.lastIndex = treffer.index + 1;

      const abk = (treffer[3] || "").trim()
        || (treffer[4] ? abkAusTitel(treffer[4].trim()) : null)
        || eigenesAbk;

      /* Kein Verweis ins Leere. Fehlt das Gesetz oder die Norm im Bestand,
         bleibt die Stelle unverlinkter Wortlaut — sichtbar unverändert, aber
         ohne Klick auf eine Seite, die es nicht gibt. */
      if (!normVorhanden(abk, treffer[1])) continue;

      /* Nur die Paragrafenangabe wird zum Verweis, nicht der nachgestellte
         Gesetzesname: „§ 43b" ist der Anker, „des Einkommensteuergesetzes"
         bleibt Fließtext. */
      const ankerLaenge = treffer[1].length + (treffer[2] || "").length
        + (treffer[0].indexOf(treffer[1]));
      const anker = treffer[0].slice(0, ankerLaenge);

      if (treffer.index > letzte) teil.appendChild(document.createTextNode(roh.slice(letzte, treffer.index)));
      const a = document.createElement("a");
      a.className = "verweis";
      a.href = "#/" + abk.toLowerCase() + "/" + treffer[1].toLowerCase();
      a.dataset.ziel = abk + " § " + treffer[1];   // für die Druckfassung
      a.textContent = anker;                        // wörtlich wie im Gesetz
      teil.appendChild(a);
      letzte = treffer.index + anker.length;
    }

    if (!letzte) continue;
    if (letzte < roh.length) teil.appendChild(document.createTextNode(roh.slice(letzte)));
    knoten.parentNode.replaceChild(teil, knoten);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   Mittelspalte

   Schritt 1 zeigt Kopf, Absatzrinne und den Wortlaut ohne jede Zutat.
   Einfärbung, eigene Markierungen und Verwaltungsstellen folgen in den
   Schritten 4 bis 6. Der Wortlaut wird dabei nie verändert.
   ══════════════════════════════════════════════════════════════════════ */
function hauptZeichnen(){
  const haupt = el("haupt");
  haupt.innerHTML = "";
  const gesetz = S.gesetz;
  const norm = gesetz.normen.find(n => n.id === S.normId) || gesetz.normen[0];
  S.normId = norm.id;

  /* Brotkrume */
  const krume = document.createElement("div");
  krume.className = "brotkrume";
  for (const stueck of [gesetz.abk.toUpperCase(), "›", norm.enbez]){
    const s = document.createElement("span");
    s.textContent = stueck;
    krume.appendChild(s);
  }
  haupt.appendChild(krume);

  /* Überschrift */
  const h1 = document.createElement("h1");
  h1.appendChild(document.createTextNode(norm.enbez + " "));
  if (norm.titel){
    const t = document.createElement("span");
    t.className = "titel";
    t.textContent = norm.titel;
    h1.appendChild(t);
  }
  haupt.appendChild(h1);

  /* Metazeile */
  const meta = document.createElement("div");
  meta.className = "meta";
  const fassung = fassungAus(gesetz);
  if (fassung){
    const e1 = document.createElement("span");
    e1.className = "etikett gefuellt";
    e1.textContent = "Fassung " + fassung;
    meta.appendChild(e1);
  }
  const anm = S.anmerkungen[S.abk] ? S.anmerkungen[S.abk][norm.id] : null;
  const e2 = document.createElement("span");
  e2.className = "etikett";
  // Der Status kommt aus annotations/; fehlt die Datei, wird das gesagt.
  e2.textContent = "Struktur: " + (anm && anm.status
    ? (STATUSNAME[anm.status] || anm.status)
    : "kein Datensatz");
  meta.appendChild(e2);
  const e3 = document.createElement("span");
  e3.textContent = "automatisch erzeugt, nicht redaktionell geprüft";
  meta.appendChild(e3);
  haupt.appendChild(meta);

  /* Leseraum: Absatzrinne und Lesespalte */
  const leseraum = document.createElement("div");
  leseraum.className = "leseraum";

  const rinne = document.createElement("div");
  rinne.className = "rinne";
  const lese = document.createElement("div");
  lese.className = "lesespalte";

  const marken = [];
  for (const abs of norm.abs){
    const block = document.createElement("div");
    block.className = "absatz";
    // Der Wortlaut kommt unverändert aus data/. Es wird nichts eingefügt.
    block.innerHTML = abs.html;
    lese.appendChild(block);
    if (abs.n) marken.push({ text: "(" + abs.n + ")", knoten: block });
  }

  /* Struktur-Einfärbung VOR den Verweisen: Sie rechnet auf dem kanonischen
     Volltext, und der darf zu diesem Zeitpunkt noch keine eingefügten
     Verweis-Elemente enthalten — Zeichen bleiben dieselben, aber die
     Knotengrenzen verschöben sich unnötig. */
  const stand = strukturSetzen(S.strukturModus, true);
  const segmente = strukturDerNorm();
  const spannen = [];

  if (stand.moeglich){
    for (const seg of segmente){
      spannen.push({
        von: seg.von,
        bis: seg.bis,
        klasse: "s s-" + seg.typ,
        schluessel: "s" + seg.von + "-" + seg.bis,
        titel: BESCHREIBUNG[seg.typ] || "",
        datensatz: seg.pfad ? { pfad: seg.pfad } : null,
      });
    }
  }

  /* Eigene Markierungen liegen ÜBER der Struktur, aber sie löschen sie nicht:
     spannenLegen führt je Zeichen eine Liste, beide Klassen bleiben stehen. */
  const { text: kanonisch } = textindex(lese);
  let verschoben = 0;
  for (const m of markierungenDerNorm()){
    const von = markierungVerorten(kanonisch, m);
    if (von === -1){ verschoben++; continue; }
    spannen.push({
      von,
      bis: von + m.anker.length,
      klasse: "eigen" + (S.aktiveMarkierung === m.id ? " gewaehlt" : ""),
      schluessel: "m" + m.id,
      titel: m.notiz || "Eigene Markierung",
      datensatz: { eigen: m.id },
      stil: `background:${hexZuRgba(m.farbe, .45)};border-bottom:2px solid ${m.farbe};`,
    });
  }

  const verwaist = spannenLegen(lese, spannen);

  /* Verweise anklickbar machen — nach dem Einsetzen des Wortlauts, damit die
     amtliche Auszeichnung unberührt bleibt. */
  verweiseSetzen(lese, gesetz.abk);

  // Die Rinne trägt nur Marken, wenn die Norm nummerierte Absätze hat.
  for (const [i, marke] of marken.entries()){
    const b = knopf("", marke.text);
    b.setAttribute("aria-current", String(i === 0));
    b.onclick = () => {
      marke.knoten.scrollIntoView({ block: "start", behavior: "smooth" });
      rinneSetzen(rinne, i);
    };
    rinne.appendChild(b);
  }

  const spalte = document.createElement("div");
  spalte.className = "lesespalte-huelle";
  spalte.append(legendeBauen(stand, segmente), lese);
  leseraum.append(rinne, spalte);
  haupt.appendChild(leseraum);

  if (verschoben){
    const w = fehlmeldung(
      "Eigene Markierungen",
      verschoben + " Markierung(en) finden ihre Textstelle nicht mehr. Der Gesetzestext"
      + " hat sich geändert; im Register „Markierungen“ stehen sie weiterhin.",
    );
    w.style.maxWidth = "var(--lesespalte)";
    w.style.marginTop = "18px";
    spalte.appendChild(w);
  }

  if (verwaist){
    const warnung = fehlmeldung(
      "Markierung",
      verwaist + " Segment(e) finden ihre Textstelle nicht. Der Gesetzestext wurde"
      + " vermutlich geändert; der Strukturdatensatz gehört nachgezogen.",
      "struktur/" + S.abk.toLowerCase() + ".json",
    );
    warnung.style.maxWidth = "var(--lesespalte)";
    warnung.style.marginTop = "18px";
    spalte.appendChild(warnung);
  }

  /* Klick auf eine eigene Markierung öffnet das Register und wählt die Karte;
     erneuter Klick hebt die Auswahl wieder auf. */
  lese.addEventListener("click", (e) => {
    const marke = e.target.closest(".eigen[data-eigen]");
    if (!marke) return;
    e.preventDefault();
    const id = marke.dataset.eigen;
    const schonAktiv = S.aktiveMarkierung === id;
    S.aktiveMarkierung = schonAktiv ? null : id;
    S.apparatRegister = "markierungen";
    hauptZeichnen();
    apparatZeichnen();
    if (schonAktiv){ popoverSchliessen(); return; }
    const neuerKnoten = document.querySelector('.eigen[data-eigen="' + id + '"]');
    if (neuerKnoten) popoverOeffnen(id, neuerKnoten);
  });

  rinneMitlaufen(rinne, marken);
  haupt.appendChild(blaetternBauen(gesetz, norm));

  document.title = norm.enbez + " " + gesetz.abk + (norm.titel ? " — " + norm.titel : "") + " · steuernorm";
}

/** Was die Farben bedeuten — für den Titel der Spanne, nicht für den Text. */
const BESCHREIBUNG = {
  tatbestand: "Tatbestand (maschinell erkannt)",
  rechtsfolge: "Rechtsfolge (maschinell erkannt)",
  ausnahme: "Ausnahme oder Vorbehalt (maschinell erkannt)",
};

/**
 * Die Legende ist der einzige Ort, an dem die Kategorien benannt werden.
 * Im Normtext selbst steht kein Wort dazu — das ist der Grund, warum es sie
 * überhaupt gibt.
 */
function legendeBauen(stand, segmente){
  const d = document.createElement("div");
  d.className = "legende";

  if (!stand.moeglich){
    const p = document.createElement("span");
    p.className = "anmerkung";
    p.textContent = segmente === null
      ? "Kein Strukturdatensatz für dieses Gesetz — der Wortlaut steht ohne Einfärbung."
      : "Für diese Norm wurde keine Struktur erkannt — der Wortlaut steht ohne Einfärbung.";
    d.appendChild(p);
    return d;
  }

  if (stand.angezeigt !== "aus"){
    const marke = (typ, beschriftung) => {
      const s = document.createElement("span");
      const m = document.createElement("span");
      m.className = "marke m-" + typ;
      s.append(m, document.createTextNode(beschriftung));
      return s;
    };
    d.appendChild(marke("tatbestand", "Tatbestand"));
    d.appendChild(marke("rechtsfolge", "Rechtsfolge"));
    d.appendChild(marke("ausnahme", "Ausnahme / Vorbehalt"));
  }

  const eigen = document.createElement("span");
  const me = document.createElement("span");
  me.className = "marke m-eigen";
  eigen.append(me, document.createTextNode("eigene Markierung"));
  d.appendChild(eigen);

  const vw = document.createElement("span");
  const mv = document.createElement("span");
  mv.className = "marke m-verwaltung";
  vw.append(mv, document.createTextNode("in Richtlinie / BMF-Schreiben"));
  d.appendChild(vw);

  const anmerkung = document.createElement("span");
  anmerkung.className = "anmerkung";
  anmerkung.textContent = stand.angezeigt === "aus"
    ? "Struktur ausgeblendet — reiner Wortlaut."
    : "Einfärbung maschinell erkannt, nicht redaktionell geprüft.";
  d.appendChild(anmerkung);

  return d;
}

/** Genau eine Marke der Rinne ist die aktuelle. */
function rinneSetzen(rinne, index){
  [...rinne.children].forEach((b, i) => b.setAttribute("aria-current", String(i === index)));
}

/**
 * Die Absatzmarke läuft beim Lesen mit.
 *
 * Ohne das ist die Rinne eine Sprungliste, die nie sagt, wo man gerade ist.
 * Der Beobachter meldet den Absatz, der das obere Drittel des Fensters füllt.
 */
function rinneMitlaufen(rinne, marken){
  if (!marken.length || !("IntersectionObserver" in window)) return;
  const wache = new IntersectionObserver((eintraege) => {
    for (const e of eintraege){
      if (!e.isIntersecting) continue;
      const index = marken.findIndex(m => m.knoten === e.target);
      if (index >= 0) rinneSetzen(rinne, index);
    }
  }, { rootMargin: "-15% 0px -70% 0px" });
  for (const m of marken) wache.observe(m.knoten);
}

/** Blättern zur vorigen und nächsten Norm desselben Gesetzes. */
function blaetternBauen(gesetz, norm){
  const nav = document.createElement("nav");
  nav.className = "blaettern";
  nav.setAttribute("aria-label", "Benachbarte Normen");
  const stelle = gesetz.normen.indexOf(norm);

  const mach = (ziel, richtung) => {
    const b = knopf("");
    if (!ziel){ b.style.visibility = "hidden"; b.setAttribute("aria-hidden", "true"); return b; }
    const r = document.createElement("span");
    r.className = "richtung";
    r.textContent = richtung;
    const w = document.createElement("span");
    w.className = "wohin";
    w.textContent = ziel.enbez + (ziel.titel ? " " + ziel.titel : "");
    b.append(r, w);
    b.onclick = () => { location.hash = "#/" + gesetz.abk.toLowerCase() + "/" + ziel.id; };
    return b;
  };

  nav.append(mach(gesetz.normen[stelle - 1], "zurück"), mach(gesetz.normen[stelle + 1], "weiter"));
  return nav;
}

/* ══════════════════════════════════════════════════════════════════════
   Rechter Apparat — Registerzeile
   Die Inhalte folgen in den Schritten 3 bis 6.
   ══════════════════════════════════════════════════════════════════════ */
const REGISTER = [
  ["hinweise", "Hinweise"],
  ["schema", "Schema"],
  ["verwaltung", "Verwaltung"],
  ["zitate", "Zitate"],
  ["markierungen", "Markierungen"],
];

/** Der Haftungssatz, wörtlich wie in der Spezifikation. */
const HAFTUNGSSATZ = "Hinweise sind eine Zutat dieser Seite und keine Rechtsberatung. "
  + "Maßgeblich ist die im Bundesgesetzblatt verkündete Fassung.";

/** Ein Block im Apparat: Mono-Überschrift, darunter Fließtext. */
function block(ueberschrift, betont = false){
  const d = document.createElement("div");
  d.className = "block" + (betont ? " betont" : "");
  const k = document.createElement("span");
  k.className = "mono-etikett";
  k.textContent = ueberschrift;
  d.appendChild(k);
  return d;
}

/** Sichtbare Fehlanzeige statt stillem Nichts. */
function fehlmeldung(ueberschrift, text, datei){
  const d = document.createElement("div");
  d.className = "fehlmeldung";
  const k = document.createElement("span");
  k.className = "mono-etikett";
  k.textContent = ueberschrift;
  const p = document.createElement("p");
  p.textContent = text;
  d.append(k, p);
  if (datei){
    const c = document.createElement("p");
    const code = document.createElement("code");
    code.textContent = datei;
    c.append(document.createTextNode("Erwartet in "), code);
    d.appendChild(c);
  }
  return d;
}

function haftungssatz(){
  const p = document.createElement("p");
  p.className = "haftung";
  p.textContent = HAFTUNGSSATZ;
  return p;
}

/**
 * Bedienelemente der Handbuchseite, die beim Abruf mitgelesen wurden.
 *
 * 728 der 1 005 Verwaltungsauszüge im Bestand (72 %) beginnen mit
 * „aufklappen Zuklappen" — das sind die Schaltflächen der BMF-Seite, nicht der
 * Wortlaut der Richtlinie. Sie stehen am Anfang jedes Auszugs und lassen ihn
 * so aussehen, als begänne die Richtlinie damit.
 *
 * Entfernt wird ausschließlich diese Seitenmöblierung am Anfang. Der amtliche
 * Wortlaut selbst bleibt unangetastet; das Änderungsverbot des BMF
 * (§ 14 UrhG) ist damit gewahrt — es wird nichts am Werk geändert, sondern
 * etwas entfernt, das nie zum Werk gehörte.
 *
 * Der Bestand in belege/ bleibt unverändert; die Bereinigung findet in der
 * Anzeige statt.
 */
const SEITENMOEBEL = /^(?:\s*(?:auf|zu)klappen\b[\s.:–-]*)+/i;

/** Kürzt einen Belegauszug auf Satzgrenze — Auszüge werden nie umgeschrieben. */
function aufSatzgrenze(text, grenze = 340){
  const roh = String(text || "").replace(SEITENMOEBEL, "").replace(/\s+/g, " ").trim();
  if (roh.length <= grenze) return roh;
  const stueck = roh.slice(0, grenze);
  const punkt = Math.max(stueck.lastIndexOf(". "), stueck.lastIndexOf("; "));
  return (punkt > 80 ? stueck.slice(0, punkt + 1) : stueck) + " …";
}

/* ══════════════════════════════════════════════════════════════════════
   Register „Hinweise"

   Gespeist wird ausschließlich aus dem Bestand: annotations/ liefert das
   Verfahren und seinen Status, belege/ die Verwaltungs- und
   Rechtsprechungsnachweise.

   Was der Entwurf zusätzlich zeigt — redaktionelle Anmerkungen je Absatz
   („Zu Absatz 1: Sechs Anknüpfungen …") —, gibt es im Repository nicht. Diese
   Sätze sind Entwurfstext, keine Daten. Sie werden deshalb NICHT abgetippt,
   sondern als fehlender Datensatz ausgewiesen.
   ══════════════════════════════════════════════════════════════════════ */
function hinweiseBauen(){
  const raus = document.createDocumentFragment();
  const anm = S.anmerkungen[S.abk] ? S.anmerkungen[S.abk][S.normId] : null;
  const belegDatei = S.belege[S.abk] || null;
  const beleg = belegDatei && belegDatei.normen ? belegDatei.normen[S.normId] : null;

  /* ── Redaktionelle Anmerkungen: nicht vorhanden ── */
  raus.appendChild(fehlmeldung(
    "Anmerkungen zu den Absätzen",
    "Für diese Norm liegen keine redaktionellen Anmerkungen vor. "
    + "Es werden keine erzeugt — was hier stünde, müsste geschrieben und geprüft sein.",
    "annotations/" + S.abk.toLowerCase() + ".json",
  ));

  /* ── Verwaltung ── */
  const verwaltung = (beleg && beleg.verwaltung) || [];
  if (verwaltung.length){
    for (const v of verwaltung.slice(0, 4)){
      const b = block("Verwaltung");
      const kopf = document.createElement("span");
      kopf.className = "fundstelle";
      if (v.quelle){
        const q = document.createElement("span");
        q.className = "quelle";
        q.textContent = v.quelle;
        kopf.appendChild(q);
      }
      kopf.appendChild(document.createTextNode(v.fundstelle || ""));
      b.appendChild(kopf);
      if (v.text){
        const p = document.createElement("p");
        p.textContent = aufSatzgrenze(v.text);
        b.appendChild(p);
      }
      if (v.url){
        const p = document.createElement("p");
        const a = document.createElement("a");
        a.href = v.url; a.target = "_blank"; a.rel = "noopener";
        a.textContent = "amtliche Fundstelle ↗";
        p.appendChild(a);
        b.appendChild(p);
      }
      raus.appendChild(b);
    }
  } else {
    const b = block("Verwaltung");
    const p = document.createElement("p");
    p.className = "fehlt";
    // Der Satz stammt aus belege/<gesetz>.json, er ist Bestand — nicht erfunden.
    p.textContent = (belegDatei && belegDatei.hinweis)
      || "Keine Verwaltungsanweisung zu dieser Norm im Bestand.";
    b.appendChild(p);
    raus.appendChild(b);
  }

  /* ── Rechtsprechung ── */
  const rechtsprechung = (beleg && beleg.rechtsprechung) || [];
  if (rechtsprechung.length){
    const b = block("Rechtsprechung");
    for (const e of rechtsprechung.slice(0, 5)){
      const p = document.createElement("p");
      const bezeichnung = [e.gericht, e.az, e.datum].filter(Boolean).join(" · ");
      if (e.url){
        const a = document.createElement("a");
        a.href = e.url; a.target = "_blank"; a.rel = "noopener";
        a.textContent = bezeichnung || "Entscheidung";
        p.appendChild(a);
      } else {
        p.textContent = bezeichnung || "Entscheidung";
      }
      b.appendChild(p);
    }
    raus.appendChild(b);
  } else {
    const b = block("Rechtsprechung");
    const p = document.createElement("p");
    p.className = "fehlt";
    p.textContent = "Keine Entscheidung zu dieser Norm im Bestand.";
    b.appendChild(p);
    raus.appendChild(b);
  }

  /* ── Verfahren: wie die maschinellen Zutaten zustande kamen ── */
  if (anm){
    const b = block("Verfahren");
    const p = document.createElement("p");
    p.textContent = anm.hinweis || "";
    b.appendChild(p);
    const teile = [];
    if (anm.status) teile.push("Status: " + STATUSNAME[anm.status] || anm.status);
    if (typeof anm.konfidenz === "number") teile.push("mittlere Konfidenz " + anm.konfidenz.toFixed(2));
    if (anm.laeufe) teile.push(anm.laeufe + " Modellläufe");
    if (teile.length){
      const q = document.createElement("p");
      q.className = "fehlt";
      q.textContent = teile.join(" · ");
      b.appendChild(q);
    }
    raus.appendChild(b);
  }

  raus.appendChild(haftungssatz());
  return raus;
}

const STATUSNAME = {
  belegt: "amtlich gestützt",
  konsens: "Modellkonsens",
  mehrheit: "mehrheitlich",
  uneinheitlich: "uneinheitlich",
  syntaktisch: "nur Syntaxanalyse",
  ohne_merkmale: "ohne Markierung",
};

/* ══════════════════════════════════════════════════════════════════════
   Register „Markierungen"
   ══════════════════════════════════════════════════════════════════════ */
function markierungenBauen(){
  const raus = document.createDocumentFragment();
  const eigene = markierungenDerNorm();

  if (!eigene.length){
    const p = document.createElement("p");
    p.className = "platzhalter";
    p.textContent = "Noch keine eigene Markierung in dieser Norm. "
      + "Stelle im Text auswählen, dann Farbe wählen.";
    raus.appendChild(p);
    raus.appendChild(markierungsFuss());
    return raus;
  }

  const lese = document.querySelector(".lesespalte");
  const kanonisch = lese ? textindex(lese).text : "";

  for (const m of eigene){
    const aktiv = S.aktiveMarkierung === m.id;
    const karte = document.createElement("div");
    karte.className = "karte" + (aktiv ? " aktiv" : "");
    karte.style.borderLeftColor = aktiv ? m.farbe : "";
    karte.tabIndex = 0;
    karte.setAttribute("role", "button");
    karte.setAttribute("aria-expanded", String(aktiv));

    const kopf = document.createElement("div");
    kopf.className = "karte-kopf";
    const punkt = document.createElement("span");
    punkt.className = "karte-punkt";
    punkt.style.background = hexZuRgba(m.farbe, .45);
    punkt.style.boxShadow = "inset 0 0 0 1px " + m.farbe;
    const fund = document.createElement("span");
    fund.className = "karte-fundstelle";
    fund.textContent = m.fundstelle || "ohne Fundstelle";
    const datum = document.createElement("span");
    datum.className = "karte-datum";
    datum.textContent = new Date(m.datum).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
    kopf.append(punkt, fund, datum);
    karte.appendChild(kopf);

    const wortlaut = document.createElement("p");
    wortlaut.className = "karte-wortlaut";
    wortlaut.textContent = "„" + m.anker + "“";
    karte.appendChild(wortlaut);

    if (m.notiz){
      const notiz = document.createElement("p");
      notiz.className = "karte-notiz";
      notiz.textContent = m.notiz;
      karte.appendChild(notiz);
    }

    /* Findet die Markierung ihre Stelle nicht mehr, wird das gesagt — sie
       verschwindet nicht. */
    if (kanonisch && markierungVerorten(kanonisch, m) === -1){
      const hinweis = document.createElement("p");
      hinweis.className = "karte-verschoben";
      hinweis.textContent = "Textstelle nicht gefunden — der Gesetzestext hat sich geändert.";
      karte.appendChild(hinweis);
    }

    if (aktiv){
      const zeile = document.createElement("div");
      zeile.className = "karte-farbzeile";
      const kreise = document.createElement("div");
      kreise.className = "farbreihe";
      farbreiheFuellen(kreise, m.farbe, (hex) => {
        markierungAendern(m.id, { farbe: hex });
        S.letzteFarbe = hex;
        merken("letzteFarbe", hex);
        hauptZeichnen();
        apparatZeichnen();
      });
      const waehler = document.createElement("input");
      waehler.type = "color";
      waehler.className = "farbwaehler";
      waehler.setAttribute("aria-label", "Eigene Farbe wählen");
      waehler.value = /^#[0-9a-f]{6}$/i.test(m.farbe) ? m.farbe : "#F2C744";
      // stopPropagation an JEDEM Klick der Farbzeile: sonst schließt der Klick
      // die Karte, auf der die Auswahl gerade steht.
      waehler.onclick = (e) => e.stopPropagation();
      waehler.oninput = (e) => { e.stopPropagation(); markierungAendern(m.id, { farbe: e.target.value }); };
      waehler.onchange = (e) => { e.stopPropagation(); hauptZeichnen(); apparatZeichnen(); };
      const hex = document.createElement("span");
      hex.className = "hexwert";
      hex.textContent = m.farbe;
      zeile.append(kreise, waehler, hex);
      zeile.onclick = (e) => e.stopPropagation();
      karte.appendChild(zeile);

      const fuss = document.createElement("div");
      fuss.className = "popover-fuss";
      fuss.style.marginTop = "9px";
