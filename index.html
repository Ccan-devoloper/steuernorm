<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>steuernorm — Textausgabe der Steuergesetze</title>
<meta name="description" content="Die deutschen Steuergesetze im Volltext, mit umschaltbaren Markierungen für Tatbestandsmerkmale und Rechtsfolgen sowie Prüfungsschemata.">
<style>
  :root{
    --papier:#FCFCFA; --tinte:#17181A; --gedeckt:#5E615C; --leise:#8E9089;
    --linie:#E4E4DE; --linie-stark:#C9C9C2; --feld:#F3F3EF;
    --tb:#FBEEA8; --tb-kante:#D9B417; --rf:#C6E7CE; --rf-kante:#3D8A55;
    --ausn:#F3D9D2; --ausn-kante:#B2593F;
    --warn:#8C3A2B;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--papier);color:var(--tinte);font-family:var(--sans);font-size:15px;line-height:1.5}
  a{color:inherit}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--tinte);outline-offset:2px;border-radius:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ---------- Kopf ---------- */
  header{position:sticky;top:0;z-index:40;background:rgba(252,252,250,.96);
    backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--linie)}
  .kopf{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .marke{font-family:var(--serif);font-size:19px;letter-spacing:-.01em;line-height:1;white-space:nowrap}
  .marke small{font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--leise);margin-left:8px}
  .suchfeld{flex:1 1 200px;min-width:140px;border:0;border-bottom:1px solid var(--linie);
    background:transparent;padding:6px 2px;font-size:13.5px}
  .suchfeld::placeholder{color:var(--leise)}
  .suchfeld:focus{outline:0;border-bottom-color:var(--tinte)}
  .schalter{display:flex;gap:6px}
  .schalter button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--linie);
    background:transparent;color:var(--leise);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;
    transition:border-color .12s,color .12s}
  .schalter button:hover{border-color:var(--linie-stark)}
  .schalter button[aria-pressed=true]{border-color:var(--tinte);color:var(--tinte);background:#fff}
  .swatch{width:12px;height:12px;border-radius:2px;border:1px solid var(--linie-stark);flex:none}
  .schalter button[aria-pressed=true] .swatch.tb{background:var(--tb);border-color:var(--tb-kante)}
  .schalter button[aria-pressed=true] .swatch.rf{background:var(--rf);border-color:var(--rf-kante)}
  .schalter button[aria-pressed=true] .swatch.ausn{background:var(--ausn);border-color:var(--ausn-kante)}
  .burger{display:none;border:0;background:transparent;padding:6px;cursor:pointer;color:var(--gedeckt)}

  /* Gesetzesleiste */
  .leiste{border-bottom:1px solid var(--linie);overflow-x:auto;-webkit-overflow-scrolling:touch}
  .leiste-innen{max-width:1500px;margin:0 auto;padding:0 16px;display:flex;gap:2px}
  .leiste button{border:0;background:transparent;padding:9px 10px;font-family:var(--mono);font-size:11px;
    letter-spacing:.09em;text-transform:uppercase;color:var(--leise);cursor:pointer;white-space:nowrap;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .leiste button:hover{color:var(--tinte)}
  .leiste button[aria-current=true]{color:var(--tinte);border-bottom-color:var(--tinte)}

  /* ---------- Gerüst ---------- */
  .huelle{max-width:1500px;margin:0 auto;display:flex;align-items:flex-start}
  nav.register{width:270px;flex:none;border-right:1px solid var(--linie);
    height:calc(100vh - 92px);position:sticky;top:92px;overflow-y:auto;padding:20px 14px 60px 16px}
  main{flex:1;min-width:0;padding:34px 32px 90px}
  aside.schema{width:350px;flex:none;border-left:1px solid var(--linie);
    height:calc(100vh - 92px);position:sticky;top:92px;overflow-y:auto;padding:34px 24px 80px}

  /* ---------- Register ---------- */
  .gl-kopf{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--leise);margin:18px 0 6px;line-height:1.4}
  .gl-kopf:first-child{margin-top:0}
  .reg-eintrag{display:flex;gap:8px;width:100%;text-align:left;border:0;border-left:1px solid var(--linie);
    background:transparent;padding:4px 6px 4px 11px;cursor:pointer;color:var(--gedeckt);align-items:baseline}
  .reg-eintrag:hover{border-left-color:var(--linie-stark);color:var(--tinte)}
  .reg-eintrag[aria-current=true]{border-left-color:var(--tinte);color:var(--tinte);background:var(--feld)}
  .reg-eintrag .nr{font-family:var(--serif);font-size:13px;white-space:nowrap}
  .reg-eintrag .tt{font-size:12px;color:var(--leise);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .reg-eintrag[aria-current=true] .tt{color:var(--gedeckt)}
  .punkt{width:5px;height:5px;border-radius:50%;background:var(--tb-kante);flex:none;align-self:center;margin-left:auto}

  /* ---------- Normtext ---------- */
  .norm-kopf{max-width:44rem}
  .augenbraue{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--leise)}
  h1{font-family:var(--serif);font-size:clamp(23px,4.4vw,31px);line-height:1.18;letter-spacing:-.015em;
    margin:6px 0 0;font-weight:400;display:flex;flex-wrap:wrap;gap:0 14px}
  h1 .titel{color:var(--gedeckt)}
  .stand{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;
    font-size:11.5px;color:var(--leise);border-top:1px solid var(--linie);padding-top:12px}
  .stand .veraltet{color:var(--warn)}
  .stand a{color:var(--leise)}

  .text{max-width:44rem;margin-top:26px;font-family:var(--serif);font-size:17px;line-height:1.78}
  .absatz{position:relative;padding-left:44px;margin-bottom:18px}
  .absatz>.az{position:absolute;left:0;top:5px;font-family:var(--mono);font-size:11px;color:var(--leise)}
  .text p{margin:0 0 10px}
  .text dl{margin:8px 0 8px 6px}
  .text dt{float:left;clear:left;font-family:var(--mono);font-size:12px;color:var(--leise);
    min-width:34px;padding-top:4px}
  .text dd{margin:0 0 6px 40px}
  .text .sn{font-family:var(--mono);font-size:9.5px;color:var(--linie-stark);vertical-align:super;
    margin-right:2px;-webkit-user-select:none;user-select:none}
  .text table{border-collapse:collapse;font-family:var(--sans);font-size:13.5px;margin:12px 0;width:100%}
  .text td{border-top:1px solid var(--linie);padding:6px 10px 6px 0;vertical-align:top;line-height:1.5}
  .text pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--gedeckt);
    background:var(--feld);padding:10px 12px;border-radius:3px;overflow-x:auto}
  .text h4{font-family:var(--sans);font-size:13px;letter-spacing:.02em;margin:16px 0 6px;color:var(--gedeckt)}
  .text a.verweis{text-decoration:none;border-bottom:1px solid var(--linie-stark);white-space:nowrap}
  .text a.verweis:hover{border-bottom-color:var(--tinte);background:var(--feld)}

  mark{background:transparent;color:inherit;padding:0 1px;border-radius:2px;
    -webkit-box-decoration-break:clone;box-decoration-break:clone}
  body[data-tb=an] mark.tb{background:var(--tb);box-shadow:inset 0 -2px 0 var(--tb-kante)}
  body[data-rf=an] mark.rf{background:var(--rf);box-shadow:inset 0 -2px 0 var(--rf-kante)}
  body[data-tb=an][data-rf=an] mark.tb.rf{background:linear-gradient(180deg,var(--tb) 0 50%,var(--rf) 50% 100%);box-shadow:inset 0 -2px 0 var(--rf-kante)}
  body[data-ausn=an] mark.ausn{background:var(--ausn);box-shadow:inset 0 -2px 0 var(--ausn-kante)}
  mark.unsicher{opacity:.55;box-shadow:inset 0 -2px 0 transparent;border-bottom:1px dashed var(--linie-stark)}

  .statusband{max-width:44rem;margin-top:20px;display:flex;align-items:baseline;gap:10px;
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--leise)}
  .statusband .plakette{border:1px solid var(--linie-stark);border-radius:2px;padding:2px 7px;letter-spacing:.12em}
  .statusband .plakette[data-s=konsens]{border-color:var(--rf-kante);color:var(--rf-kante)}
  .statusband .plakette[data-s=mehrheit]{border-color:var(--tb-kante);color:#8A7209}
  .statusband .plakette[data-s=uneinheitlich]{border-color:var(--ausn-kante);color:var(--ausn-kante)}

  .fussnote{max-width:44rem;margin-top:26px;border-left:2px solid var(--linie);padding-left:14px;
    font-size:12.5px;color:var(--leise);white-space:pre-wrap;font-family:var(--mono);line-height:1.6}
  .hinweis{max-width:44rem;margin-top:26px;border-left:2px solid var(--linie);padding-left:14px}
  .hinweis .kappe{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--leise);display:block;margin-bottom:4px}
  .hinweis p{margin:0;font-size:14px;line-height:1.65;color:var(--gedeckt)}

  .blaettern{max-width:44rem;display:flex;justify-content:space-between;gap:16px;margin-top:44px;
    border-top:1px solid var(--linie);padding-top:14px;font-size:13px}
  .blaettern button{border:0;background:transparent;cursor:pointer;color:var(--gedeckt);padding:4px 0;text-align:left}
  .blaettern button:hover{color:var(--tinte)}
  .blaettern button:last-child{text-align:right}
  .blaettern .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--leise);display:block}

  /* ---------- Schema ---------- */
  .schema-kappe{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--leise);margin:0 0 18px}
  ol.leiter{list-style:none;margin:0;padding:0 0 0 20px;border-left:1px solid var(--linie)}
  ol.leiter>li{position:relative;margin-bottom:16px}
  ol.leiter .rn{position:absolute;left:-56px;top:1px;width:34px;text-align:right;
    font-family:var(--mono);font-size:10.5px;color:var(--leise)}
  ol.leiter .schritt{font-family:var(--serif);font-size:14.5px;line-height:1.4;
    -webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:2px;padding:0 2px}
  body[data-tb=an] ol.leiter .schritt.tb{background:var(--tb)}
  body[data-rf=an] ol.leiter .schritt.rf{background:var(--rf)}
  body[data-ausn=an] ol.leiter .schritt.ausn{background:var(--ausn)}
  ol.leiter .junktor{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--leise);margin-left:6px}
  ol.leiter ul li .pf{font-family:var(--mono);font-size:9.5px;color:var(--leise);flex:none}
  ol.leiter li.schwach{opacity:.55}
  ol.leiter ul{list-style:none;margin:5px 0 0;padding:0}
  ol.leiter ul li{display:flex;gap:8px;font-size:12.5px;line-height:1.55;color:var(--gedeckt);margin-bottom:3px}
  ol.leiter ul li::before{content:"";flex:none;width:8px;height:1px;background:var(--linie-stark);margin-top:9px}
  .leer{font-size:13px;color:var(--leise);line-height:1.6}
  .leer code{font-family:var(--mono);font-size:11.5px;background:var(--feld);padding:1px 4px;border-radius:2px}

  .fuss{max-width:44rem;margin-top:56px;font-size:11.5px;line-height:1.7;color:var(--leise)}
  .fuss a{color:var(--leise)}

  .melder{max-width:44rem;border:1px solid var(--warn);border-radius:3px;padding:14px 16px;
    font-size:13.5px;line-height:1.6;color:var(--warn)}
  .melder code{font-family:var(--mono);font-size:12px;background:#fff;padding:1px 5px;border-radius:2px}

  /* ---------- Schmale Fenster ---------- */
  @media (max-width:1180px){
    aside.schema{display:none}
    .schema-unten{display:block!important;max-width:44rem;margin-top:44px;
      border-top:1px solid var(--linie);padding-top:26px}
    ol.leiter{padding-left:44px}
    ol.leiter .rn{left:-38px}
  }
  @media (max-width:860px){
    .burger{display:block;margin-left:-6px}
    nav.register{position:fixed;inset:0;z-index:50;width:auto;height:auto;background:var(--papier);
      border-right:0;padding:16px;display:none}
    nav.register.offen{display:block}
    main{padding:26px 18px 80px}
    .schliessen{display:flex!important}
  }
  .schliessen{display:none;justify-content:flex-end;margin-bottom:10px}
  .schliessen button{border:0;background:transparent;cursor:pointer;padding:6px;color:var(--gedeckt)}
</style>
</head>
<body data-tb="an" data-rf="an" data-ausn="an">

<header>
  <div class="kopf">
    <button class="burger" id="burger" aria-label="Normenregister öffnen">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4.5h14M2 9h14M2 13.5h14"/></svg>
    </button>
    <span class="marke">steuernorm<small>Textausgabe</small></span>
    <input class="suchfeld" id="suche" type="search" placeholder="Norm oder Stichwort, z. B. 15 oder Vorsteuer" autocomplete="off">
    <div class="schalter">
      <button id="btn-tb" aria-pressed="true"><span class="swatch tb"></span>Tatbestand</button>
      <button id="btn-rf" aria-pressed="true"><span class="swatch rf"></span>Rechtsfolge</button>
      <button id="btn-ausn" aria-pressed="true"><span class="swatch ausn"></span>Ausnahme</button>
    </div>
  </div>
  <div class="leiste"><div class="leiste-innen" id="leiste"></div></div>
</header>

<div class="huelle">
  <nav class="register" id="register" aria-label="Normen">
    <div class="schliessen"><button id="zu" aria-label="Register schließen">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 3l10 10M13 3L3 13"/></svg>
    </button></div>
    <div id="register-liste"></div>
  </nav>

  <main id="haupt"><p class="leer">Wird geladen …</p></main>

  <aside class="schema" id="schema-rechts"></aside>
</div>

<script>
"use strict";

const ABK_MUSTER = /\b(AO|BewG|EStG|KStG|UStG|GewStG|ErbStG|GrStG|FGO|GrEStG|UmwStG|AStG|SolzG|InvStG)\b/;

const S = {                 // Zustand
  register: null,           // data/index.json
  gesetz: null,             // aktuell geladenes Gesetz
  anmerkungen: {},          // abk -> annotations
  abk: null,
  normId: null,
  filter: "",
};
const cacheGesetz = new Map();
const el = (id) => document.getElementById(id);

/* --------------------------- Einstellungen --------------------------- */
function merken(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function gemerkt(k, fallback){ try{ return localStorage.getItem(k) ?? fallback; }catch(e){ return fallback; } }

function schalterSetzen(art, an){
  document.body.dataset[art] = an ? "an" : "aus";
  el("btn-" + art).setAttribute("aria-pressed", String(an));
  merken("marker-" + art, an ? "an" : "aus");
}

/* ------------------------------ Laden ------------------------------ */
async function holen(pfad){
  const r = await fetch(pfad, { cache: "no-cache" });
  if (!r.ok) throw new Error(pfad + " → " + r.status);
  return r.json();
}

async function gesetzLaden(abk){
  const schluessel = abk.toLowerCase();
  if (cacheGesetz.has(schluessel)) return cacheGesetz.get(schluessel);
  const eintrag = S.register.gesetze.find(g => g.abk === abk);
  const g = await holen("data/" + (eintrag ? eintrag.datei : schluessel + ".json"));
  cacheGesetz.set(schluessel, g);
  if (!(abk in S.anmerkungen)){
    try { S.anmerkungen[abk] = (await holen("annotations/" + schluessel + ".json")).normen; }
    catch(e){ S.anmerkungen[abk] = {}; }
  }
  return g;
}

/* --------------------------- Markierungen --------------------------- */
/* Kanonischer Textindex mit Zuordnung jedes Suchzeichens zum ursprünglichen Textknoten. */
function textindex(wurzel){
  const gehe = document.createTreeWalker(wurzel, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if (!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      if (n.parentElement.closest(".sn")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });

  const knoten = [], karte = [];
  let text = "", n;

  function leerzeichen(ref = null){
    if (text && !text.endsWith(" ")){
      text += " ";
      karte.push(ref);
    }
  }

  function zeichen(ch, ref){
    if (/\s/.test(ch)){
      leerzeichen(ref);
      return;
    }
    if (/[,.;:!?]/.test(ch) && text.endsWith(" ")){
      text = text.slice(0, -1);
      karte.pop();
    }
    text += ch;
    karte.push(ref);
  }

  while ((n = gehe.nextNode())){
    if (knoten.length) leerzeichen();
    knoten.push(n);
    for (let i = 0; i < n.nodeValue.length; i++){
      zeichen(n.nodeValue[i], { n, i });
    }
  }
  if (text.endsWith(" ")){
    text = text.slice(0, -1);
    karte.pop();
  }
  return { text, karte, knoten };
}

function fundstellen(text, phrase){
  const treffer = [];
  if (typeof phrase !== "string" || !phrase) return treffer;
  let von = 0, start;
  while ((start = text.indexOf(phrase, von)) !== -1){
    treffer.push([start, start + phrase.length]);
    von = start + Math.max(1, phrase.length);
  }
  return treffer;
}

function markierungenAnlegen(wurzel, anm){
  const { text, karte, knoten } = textindex(wurzel);
  const klassen = new Map(knoten.map(n => [n, new Uint8Array(n.nodeValue.length)]));
  const unsicher = new Map(knoten.map(n => [n, new Uint8Array(n.nodeValue.length)]));
  let verwaist = 0;

  const BIT = { tb: 1, rf: 2, ausn: 4 };

  /* Format 3: Jede Spanne trägt eine Position. Damit wird genau eine Fundstelle
     markiert statt jeder Wiederholung derselben Zeichenkette im Normtext. */
  const spannen = [];
  if (Array.isArray(anm.saetze)){
    for (const satz of anm.saetze){
      for (const el of satz.elemente || []){
        spannen.push({ art: el.art, text: el.text, von: el.von, konfidenz: el.konfidenz });
      }
    }
  } else {
    /* Rückfall auf das alte Format: ohne Position bleibt nur die Textsuche. */
    for (const art of ["tb", "rf", "ausn"]){
      const feld = art === "ausn" ? "ausnahmen" : art;
      for (const t of anm[feld] || []) spannen.push({ art, text: t, von: null, konfidenz: null });
    }
  }

  for (const sp of spannen){
    const bit = BIT[sp.art];
    if (!bit || typeof sp.text !== "string" || !sp.text) continue;

    let start = -1;
    if (Number.isInteger(sp.von) && text.substr(sp.von, sp.text.length) === sp.text){
      start = sp.von;                                  // Position stimmt auf den Zeichen genau
    } else {
      /* Der Text hat sich verschoben — in der Nähe der gespeicherten Position suchen,
         sonst im ganzen Normtext. Nur die ERSTE Fundstelle wird markiert. */
      const nahe = Number.isInteger(sp.von) ? Math.max(0, sp.von - 120) : 0;
      start = text.indexOf(sp.text, nahe);
      if (start === -1) start = text.indexOf(sp.text);
    }
    if (start === -1){ verwaist++; continue; }

    const schwach = typeof sp.konfidenz === "number" && sp.konfidenz < 0.5;
    for (let pos = start; pos < start + sp.text.length; pos++){
      const ref = karte[pos];
      if (!ref) continue;
      klassen.get(ref.n)[ref.i] |= bit;
      if (schwach) unsicher.get(ref.n)[ref.i] = 1;
    }
  }

  for (const n of knoten){
    const roh = n.nodeValue;
    const bits = klassen.get(n);
    const uns = unsicher.get(n);
    if (!bits.some(Boolean)) continue;
    const frag = document.createDocumentFragment();
    let start = 0;
    while (start < roh.length){
      const bit = bits[start], u = uns[start];
      let ende = start + 1;
      while (ende < roh.length && bits[ende] === bit && uns[ende] === u) ende++;
      const ausschnitt = roh.slice(start, ende);
      if (!bit){
        frag.appendChild(document.createTextNode(ausschnitt));
      } else {
        const mark = document.createElement("mark");
        const teile = [];
        if (bit & 1) teile.push("tb");
        if (bit & 2) teile.push("rf");
        if (bit & 4) teile.push("ausn");
        if (u) teile.push("unsicher");
        mark.className = teile.join(" ");
        mark.textContent = ausschnitt;
        frag.appendChild(mark);
      }
      start = ende;
    }
    n.parentNode.replaceChild(frag, n);
  }
  return verwaist;
}

/* --------------------------- Querverweise --------------------------- */
/* Verweise wie "§ 15 Abs. 2 EStG" anklickbar machen — das ist die
   Arbeitsweise, die dejure ausmacht: jede Norm hängt an den anderen. */
const VERWEIS = /§\s?(\d+[a-z]?)((?:\s?Abs(?:atz|\.)\s?\d+[a-z]?)?(?:\s?(?:Satz|S\.|Nummer|Nr\.)\s?\d+)?)(\s(?:AO|BewG|EStG|KStG|UStG|GewStG|ErbStG|GrStG|FGO|GrEStG|UmwStG|AStG|SolzG|InvStG))?/g;

function verweiseSetzen(wurzel, eigenesAbk){
  const bekannt = new Set(S.register.gesetze.map(g => g.abk));
  const gehe = document.createTreeWalker(wurzel, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => n.parentElement.closest("a") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const ziele = [];
  let n; while ((n = gehe.nextNode())) if (n.nodeValue.includes("§")) ziele.push(n);

  for (const knoten of ziele){
    VERWEIS.lastIndex = 0;
    const roh = knoten.nodeValue;
    if (!VERWEIS.test(roh)) continue;
    VERWEIS.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let letzte = 0, m;
    while ((m = VERWEIS.exec(roh))){
      const abk = (m[3] || "").trim() || eigenesAbk;
      if (!bekannt.has(abk)) continue;
      if (m.index > letzte) frag.appendChild(document.createTextNode(roh.slice(letzte, m.index)));
      const a = document.createElement("a");
      a.className = "verweis";
      a.href = "#/" + abk.toLowerCase() + "/" + m[1].toLowerCase();
      a.textContent = m[0];
      frag.appendChild(a);
      letzte = m.index + m[0].length;
    }
    if (!letzte) continue;
    if (letzte < roh.length) frag.appendChild(document.createTextNode(roh.slice(letzte)));
    knoten.parentNode.replaceChild(frag, knoten);
  }
}

/* ------------------------------ Register ------------------------------ */
function registerZeichnen(){
  const ziel = el("register-liste");
  ziel.innerHTML = "";
  if (!S.gesetz) return;
  const anm = S.anmerkungen[S.abk] || {};
  const f = S.filter.trim().toLowerCase();
  let letzteGl = null, gefunden = 0;

  for (const norm of S.gesetz.normen){
    if (f && !(norm.enbez + " " + norm.titel).toLowerCase().includes(f)
          && !norm.enbez.replace(/§\s*/, "").toLowerCase().startsWith(f)) continue;
    gefunden++;
    if (norm.gliederung && norm.gliederung !== letzteGl){
      letzteGl = norm.gliederung;
      const h = document.createElement("div");
      h.className = "gl-kopf";
      h.textContent = norm.gliederung;
      ziel.appendChild(h);
    }
    const b = document.createElement("button");
    b.className = "reg-eintrag";
    b.setAttribute("aria-current", String(norm.id === S.normId));
    b.innerHTML = '<span class="nr"></span><span class="tt"></span>';
    b.querySelector(".nr").textContent = norm.enbez;
    b.querySelector(".tt").textContent = norm.titel;
    if (anm[norm.id]){
      const p = document.createElement("span");
      p.className = "punkt";
      p.title = "Markierungen und Prüfungsschema vorhanden";
      b.appendChild(p);
    }
    b.onclick = () => { location.hash = "#/" + S.abk.toLowerCase() + "/" + norm.id; };
    ziel.appendChild(b);
  }
  if (!gefunden){
    const p = document.createElement("p");
    p.className = "leer";
    p.textContent = "Keine Norm in " + S.abk + " gefunden. Über die Gesetzesleiste lässt sich ein anderes Gesetz wählen.";
    ziel.appendChild(p);
  }
}

function leisteZeichnen(){
  const ziel = el("leiste");
  ziel.innerHTML = "";
  for (const g of S.register.gesetze){
    const b = document.createElement("button");
    b.textContent = g.abk;
    b.title = g.titel + " — " + g.anzahl + " Normen";
    b.setAttribute("aria-current", String(g.abk === S.abk));
    b.onclick = () => {
      const erste = (cacheGesetz.get(g.abk.toLowerCase())?.normen || g.normen)[0];
      location.hash = "#/" + g.abk.toLowerCase() + "/" + (erste ? erste.id : "1");
    };
    ziel.appendChild(b);
  }
}

/* ------------------------------ Schema ------------------------------ */
function schemaBauen(anm){
  const wrap = document.createElement("div");
  const k = document.createElement("p");
  k.className = "schema-kappe";
  k.textContent = "Prüfungsschema";
  wrap.appendChild(k);

  if (!anm || !Array.isArray(anm.schema) || !anm.schema.length){
    const p = document.createElement("p");
    p.className = "leer";
    p.textContent = anm && anm.typ === "anwendung"
      ? "Anwendungsvorschrift: regelt allein den zeitlichen Geltungsbereich einer Fassung. Ein Prüfungsschema gibt es dazu nicht."
      : "Für diese Norm wird kein Schema erzeugt.";
    wrap.appendChild(p);
    return wrap;
  }

  const ol = document.createElement("ol");
  ol.className = "leiter";
  for (const s of anm.schema){
    const li = document.createElement("li");
    const rn = document.createElement("span");
    rn.className = "rn"; rn.textContent = s.n || "";
    const t = document.createElement("span");
    t.className = "schritt" + (s.art ? " " + s.art : "");
    t.textContent = s.t;
    li.append(rn, t);

    if (s.junktor){
      const j = document.createElement("span");
      j.className = "junktor";
      j.textContent = s.junktor === "oder" ? "alternativ" : "kumulativ";
      li.appendChild(j);
    }

    if (Array.isArray(s.sub) && s.sub.length){
      const ul = document.createElement("ul");
      for (const x of s.sub){
        const l = document.createElement("li");
        if (typeof x === "string"){
          l.appendChild(document.createTextNode(x));
        } else {
          if (typeof x.konfidenz === "number" && x.konfidenz < 0.5) l.className = "schwach";
          const w = document.createElement("span");
          w.textContent = x.t;
          l.appendChild(w);
          if (x.pfad){
            const pf = document.createElement("span");
            pf.className = "pf"; pf.textContent = x.pfad;
            l.appendChild(pf);
          }
        }
        ul.appendChild(l);
      }
      li.appendChild(ul);
    }
    ol.appendChild(li);
  }
  wrap.appendChild(ol);
  return wrap;
}

/* Statusband: weist offen aus, wie die Annotation zustande kam. */
function statusband(anm){
  if (!anm || !anm.status) return null;
  const d = document.createElement("div");
  d.className = "statusband";
  const p = document.createElement("span");
  p.className = "plakette";
  p.dataset.s = anm.status;
  p.textContent = ({
    konsens: "Modellkonsens",
    mehrheit: "Mehrheitlich",
    uneinheitlich: "Uneinheitlich",
    syntaktisch: "Nur Syntaxanalyse",
    ohne_merkmale: "Ohne Markierung",
  })[anm.status] || anm.status;
  d.appendChild(p);

  const t = document.createElement("span");
  if (anm.status === "ohne_merkmale"){
    t.textContent = "keine Tatbestand-Rechtsfolge-Struktur";
  } else if (typeof anm.einstimmigkeit === "number"){
    t.textContent = Math.round(anm.einstimmigkeit * 100) + " % Übereinstimmung über "
      + anm.laeufe + " unabhängige Läufe · automatisch, nicht redaktionell geprüft";
  } else {
    t.textContent = "automatisch erzeugt, nicht redaktionell geprüft";
  }
  d.appendChild(t);
  return d;
}

/* ------------------------------ Norm ------------------------------ */
function tageSeit(iso){
  if (!iso) return null;
  return Math.round((Date.now() - new Date(iso).getTime()) / 86400000);
}

function normZeichnen(){
  const haupt = el("haupt");
  haupt.innerHTML = "";
  const g = S.gesetz;
  const norm = g.normen.find(n => n.id === S.normId) || g.normen[0];
  S.normId = norm.id;
  const anm = (S.anmerkungen[S.abk] || {})[norm.id];

  // Kopf
  const kopf = document.createElement("div");
  kopf.className = "norm-kopf";
  const eb = document.createElement("div");
  eb.className = "augenbraue";
  eb.textContent = g.titel;
  const h1 = document.createElement("h1");
  const sp1 = document.createElement("span"); sp1.textContent = norm.enbez;
  const sp2 = document.createElement("span"); sp2.className = "titel"; sp2.textContent = norm.titel;
  h1.append(sp1, document.createTextNode(" "), sp2);

  const stand = document.createElement("div");
  stand.className = "stand";
  const alter = tageSeit(g.builddate);
  const s1 = document.createElement("span");
  s1.textContent = "Stand der Daten: " + (g.builddate || "unbekannt");
  if (alter !== null && alter > 90){
    s1.classList.add("veraltet");
    s1.textContent += " — " + alter + " Tage alt, bitte aktualisieren";
  }
  stand.appendChild(s1);
  const fassung = (g.stand || []).find(x => x.typ === "Stand");
  if (fassung){ const s2 = document.createElement("span"); s2.textContent = fassung.text; stand.appendChild(s2); }
  const quelle = document.createElement("a");
  quelle.href = g.quelle; quelle.target = "_blank"; quelle.rel = "noopener";
  quelle.textContent = "amtliche Fassung ↗";
  stand.appendChild(quelle);
  kopf.append(eb, h1, stand);
  haupt.appendChild(kopf);

  // Text
  const text = document.createElement("div");
  text.className = "text";
  for (const a of norm.abs){
    const d = document.createElement("div");
    d.className = "absatz";
    if (a.n){ const az = document.createElement("span"); az.className = "az"; az.textContent = "(" + a.n + ")"; d.appendChild(az); }
    const inner = document.createElement("div");
    inner.innerHTML = a.html;
    d.appendChild(inner);
    text.appendChild(d);
  }
  haupt.appendChild(text);

  // Alle Markierungen in einem Durchgang gegen denselben kanonischen Text wie im Backend anlegen.
  const verwaist = anm ? markierungenAnlegen(text, anm) : 0;
  verweiseSetzen(text, S.abk);

  if (norm.fussnote){
    const f = document.createElement("div");
    f.className = "fussnote";
    f.textContent = norm.fussnote;
    haupt.appendChild(f);
  }

  const sb = statusband(anm);
  if (sb) haupt.appendChild(sb);

  if (anm && anm.hinweis){
    const h = document.createElement("div");
    h.className = "hinweis";
    const kappe = document.createElement("span"); kappe.className = "kappe"; kappe.textContent = "Hinweis";
    const p = document.createElement("p"); p.textContent = anm.hinweis;
    h.append(kappe, p);
    haupt.appendChild(h);
  }

  if (verwaist){
    const w = document.createElement("div");
    w.className = "hinweis";
    w.style.borderLeftColor = "var(--warn)";
    const kappe = document.createElement("span"); kappe.className = "kappe"; kappe.textContent = "Markierung";
    const p = document.createElement("p");
    p.textContent = verwaist + " Markierung(en) finden ihre Textstelle nicht mehr. Der Gesetzestext wurde vermutlich geändert; die Annotation gehört nachgezogen.";
    w.append(kappe, p);
    haupt.appendChild(w);
  }

  // Schema unterhalb (schmale Fenster) und rechts (breite)
  const unten = schemaBauen(anm);
  unten.className = "schema-unten";
  unten.style.display = "none";
  haupt.appendChild(unten);
  el("schema-rechts").innerHTML = "";
  el("schema-rechts").appendChild(schemaBauen(anm));

  // Blättern
  const i = g.normen.indexOf(norm);
  const nav = document.createElement("div");
  nav.className = "blaettern";
  const mach = (ziel, label) => {
    const b = document.createElement("button");
    if (!ziel){ b.style.visibility = "hidden"; return b; }
    b.innerHTML = '<span class="k"></span><span class="w"></span>';
    b.querySelector(".k").textContent = label;
    b.querySelector(".w").textContent = ziel.enbez + (ziel.titel ? " " + ziel.titel : "");
    b.onclick = () => { location.hash = "#/" + S.abk.toLowerCase() + "/" + ziel.id; };
    return b;
  };
  nav.append(mach(g.normen[i - 1], "zurück"), mach(g.normen[i + 1], "weiter"));
  haupt.appendChild(nav);

  const fuss = document.createElement("p");
  fuss.className = "fuss";
  fuss.innerHTML = 'Gesetzestexte aus <a href="https://www.gesetze-im-internet.de/" target="_blank" rel="noopener">Gesetze im Internet</a> (BMJ und Bundesamt für Justiz), amtliche Werke und nach § 5 Abs. 1 UrhG gemeinfrei. Maßgeblich ist allein die im Bundesgesetzblatt verkündete Fassung. Markierungen, Hinweise und Prüfungsschemata sind eine didaktische Zutat dieser Seite und keine Rechtsberatung.';
  haupt.appendChild(fuss);

  document.title = norm.enbez + " " + S.abk + (norm.titel ? " — " + norm.titel : "") + " · steuernorm";
  window.scrollTo({ top: 0 });
}

/* ------------------------------ Router ------------------------------ */
async function route(){
  if (!S.register) return;
  const teile = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("/").filter(Boolean);
  const abk = (teile[0] || gemerkt("letztes-gesetz", "estg")).toLowerCase();
  const eintrag = S.register.gesetze.find(g => g.abk.toLowerCase() === abk) || S.register.gesetze[0];
  S.abk = eintrag.abk;
  merken("letztes-gesetz", S.abk.toLowerCase());
  try{
    S.gesetz = await gesetzLaden(S.abk);
  }catch(err){
    el("haupt").innerHTML = '<div class="melder"><strong>' + S.abk + ' konnte nicht geladen werden.</strong><br>' + err.message + '</div>';
    return;
  }
  S.normId = teile[1] || S.gesetz.normen[0].id;
  if (!S.gesetz.normen.some(n => n.id === S.normId)) S.normId = S.gesetz.normen[0].id;
  leisteZeichnen();
  registerZeichnen();
  normZeichnen();
  el("register").classList.remove("offen");
  const treffer = el("register").querySelector('[aria-current=true]');
  if (treffer && treffer.scrollIntoView) treffer.scrollIntoView({ block: "nearest" });
}

/* ------------------------------ Start ------------------------------ */
async function start(){
  schalterSetzen("tb", gemerkt("marker-tb", "an") === "an");
  schalterSetzen("rf", gemerkt("marker-rf", "an") === "an");
  el("btn-tb").onclick = () => schalterSetzen("tb", document.body.dataset.tb !== "an");
  el("btn-rf").onclick = () => schalterSetzen("rf", document.body.dataset.rf !== "an");
  schalterSetzen("ausn", gemerkt("marker-ausn", "an") === "an");
  el("btn-ausn").onclick = () => schalterSetzen("ausn", document.body.dataset.ausn !== "an");
  el("burger").onclick = () => el("register").classList.add("offen");
  el("zu").onclick = () => el("register").classList.remove("offen");
  el("suche").oninput = (e) => { S.filter = e.target.value; registerZeichnen(); };
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== el("suche")){ e.preventDefault(); el("suche").focus(); }
    if (e.key === "Escape") el("register").classList.remove("offen");
  });
  window.addEventListener("hashchange", route);

  try{
    S.register = await holen("data/index.json");
  }catch(err){
    el("haupt").innerHTML =
      '<div class="melder"><strong>Die Gesetzesdaten fehlen oder sind nicht erreichbar.</strong>' +
      '<p>Ein Browser darf beim Öffnen über <code>file://</code> keine Dateien nachladen. Die Seite über einen Server aufrufen:</p>' +
      '<p><code>python3 -m http.server 8000</code> im Projektordner, dann <code>http://localhost:8000</code>.</p>' +
      '<p>Fehlen die Daten noch ganz, erzeugt <code>node tools/update.mjs</code> sie aus Gesetze im Internet.</p>' +
      '<p style="opacity:.7">' + err.message + '</p></div>';
    return;
  }
  route();
}
start();
</script>
