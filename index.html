 * Fassungsvergleich auch. Ohne sichtbare Nummer kann der Leser die Fundstelle
 * nicht im Text wiederfinden.
 *
 * Gezählt wird NICHT hier, sondern in `tools/struktur.mjs` aus derselben
 * Gliederung, die auch die Fundstellen bildet. Eine eigene Satzzählung im
 * Frontend wäre eine zweite Wahrheit und liefe früher oder später auseinander.
 *
 * DREI VORSICHTSMASSNAHMEN:
 *
 *   Nur wo ein Absatz mehr als einen Satz hat. Bei einem einzigen Satz sagt
 *   die Absatzbezeichnung schon alles, und eine „1" wäre bloßes Rauschen.
 *
 *   Nicht dort, wo die amtlichen Daten schon nummerieren — sonst stünde die
 *   Nummer doppelt. Welche Absätze das sind, wird VOR der ersten Einfügung
 *   festgestellt: Danach trägt jeder bearbeitete Absatz selbst eine.
 *
 *   Von hinten nach vorn. Jede Einfügung teilt einen Textknoten und verschiebt
 *   alles dahinter; wer vorn beginnt, trifft ab der zweiten Nummer daneben.
 */
function satznummernSetzen(wurzel, saetze){
  if (!saetze.length) return 0;

  const jeAbsatz = new Map();
  for (const s of saetze){
    const schluessel = s.absatz || "";
    if (!jeAbsatz.has(schluessel)) jeAbsatz.set(schluessel, []);
    jeAbsatz.get(schluessel).push(s);
  }
  const ziele = [];
  for (const liste of jeAbsatz.values()){
    if (liste.length > 1) ziele.push(...liste);
  }
  if (!ziele.length) return 0;

  const schonNummeriert = new Set(
    [...wurzel.querySelectorAll(".absatz")].filter(b => b.querySelector(".sn")));

  const { karte } = textindex(wurzel);
  ziele.sort((a, b) => b.von - a.von);

  let gesetzt = 0;
  for (const s of ziele){
    const ref = karte[s.von];
    if (!ref || !ref.n) continue;
    const block = ref.n.parentElement && ref.n.parentElement.closest(".absatz");
    if (block && schonNummeriert.has(block)) continue;

    const marke = document.createElement("span");
    marke.className = "sn";
    marke.textContent = String(s.nr);
    marke.title = s.pfad;

    /* Den Satz zusätzlich in eine eigene Hülle fassen, damit die satzweise
       Darstellung ihn zum Block machen kann. Das gelingt nur, wenn Anfang und
       Ende im selben Elternelement liegen — ein Satz, der über eine
       Aufzählung hinweggeht, ließe sich nicht ohne Bruch umschließen.
       `surroundContents` wirft in diesem Fall; dann bleibt es bei der Nummer,
       und der Satz läuft in der satzweisen Ansicht eben weiter. Lieber ein
       nicht umbrochener Satz als ein zerrissener Wortlaut. */
    const huelle = satzHuelle(karte, s);
    if (huelle){ huelle.prepend(marke); gesetzt++; continue; }

    if (ref.i === 0) ref.n.parentNode.insertBefore(marke, ref.n);
    else {
      const rest = ref.n.splitText(ref.i);
      rest.parentNode.insertBefore(marke, rest);
    }
    gesetzt++;
  }
  return gesetzt;
}

/**
 * Umschließt einen Satz mit `<span class="satz">` — oder gibt null zurück.
 *
 * Gearbeitet wird auf der Zeichenkarte des kanonischen Volltextes, dieselbe
 * Grundlage wie bei der Einfärbung. Die Hülle ist ein reines Anzeigemittel:
 * Sie fügt kein Zeichen ein, `textindex` läuft unverändert hindurch.
 */
function satzHuelle(karte, satz){
  const anfang = karte[satz.von];
  /* `bis` ist die Position NACH dem letzten Zeichen; die Karte endet dort
     womöglich schon, weil zwischen zwei Sätzen ein Leerzeichen steht. */
  let ende = null;
  for (let i = Math.min(satz.bis, karte.length) - 1; i > satz.von; i--){
    if (karte[i] && karte[i].n){ ende = karte[i]; break; }
  }
  if (!anfang || !anfang.n || !ende || !ende.n) return null;

  try {
    const bereich = document.createRange();
    bereich.setStart(anfang.n, anfang.i);
    bereich.setEnd(ende.n, ende.i + 1);
    const huelle = document.createElement("span");
    huelle.className = "satz";
    bereich.surroundContents(huelle);
    return huelle;
  } catch (fehler) {
    return null;   // Satz über Elementgrenzen — bleibt ungehüllt
  }
}

/* ── Kleinigkeiten ─────────────────────────────────────────────────── */
function knopf(klasse, inhalt){
  const b = document.createElement("button");
  b.type = "button";
  if (klasse) b.className = klasse;
  if (inhalt !== undefined) b.textContent = inhalt;
  return b;
}

const registerEintrag = (abk) =>
  S.register ? S.register.gesetze.find(g => g.abk.toLowerCase() === String(abk).toLowerCase()) : null;

/**
 * Fassungsangabe aus den echten Daten.
 *
 * Der Entwurf zeigt „Fassung 23.12.2024". Dieses Datum steht im Bestand als
 * „zuletzt geändert durch Art. 4 G v. 23.12.2024 I Nr. 449" — es wird
 * herausgelesen, nicht gesetzt. Fehlt es, entfällt das Etikett; es wird
 * nichts erfunden.
 */
function fassungAus(gesetz){
  const stand = (gesetz.stand || []).find(x => x.typ === "Stand") || (gesetz.stand || [])[0];
  if (!stand) return null;
  const treffer = /(\d{1,2}\.\d{1,2}\.\d{4})/.exec(stand.text || "");
  return treffer ? treffer[1] : null;
}

/* ══════════════════════════════════════════════════════════════════════
   Darstellung: hell · dunkel · System

   „System“ ist keine dritte Palette, sondern die Abwesenheit einer Wahl: Das
   Attribut wird entfernt, und die Medienabfrage entscheidet. Deshalb steht im
   CSS `:root:not([data-darstellung=hell])` — die ausdrückliche Wahl gewinnt
   in beide Richtungen.
   ══════════════════════════════════════════════════════════════════════ */
function darstellungSetzen(modus){
  const gueltig = ["system", "hell", "dunkel"].includes(modus) ? modus : "system";
  S.darstellung = gueltig;
  if (gueltig === "system") delete document.documentElement.dataset.darstellung;
  else document.documentElement.dataset.darstellung = gueltig;
  for (const b of el("darstellung").querySelectorAll("button")){
    b.setAttribute("aria-checked", String(b.dataset.modus === gueltig));
  }
  merken("darstellung", gueltig);
}

/**
 * Deckkraft der eigenen Markierung — aus der Gestaltungsmarke, nicht fest.
 *
 * Hell .45, dunkel .22. Die Farbe bleibt in beiden Modi dieselbe, damit die
 * Zuordnung erhalten bleibt; nur die Fläche tritt zurück, weil ein heller Ton
 * auf dunklem Grund blendet.
 */
/* ── Schriftgröße des Normtextes ──────────────────────────────────────
   Sieben Stufen von 15 bis 24 px. Nach unten begrenzt, weil darunter der
   Zeilenfall der 36-rem-Spalte kippt; nach oben, weil ein Absatz sonst
   seitenweise läuft. Der Wert wird gemerkt — wer einmal größer gestellt hat,
   will das beim nächsten Aufruf nicht erneut tun. */
const SCHRIFTSTUFEN = [15, 16, 17.5, 19, 20.5, 22, 24];

function schriftSetzen(px){
  const naechste = SCHRIFTSTUFEN.reduce(
    (a, b) => (Math.abs(b - px) < Math.abs(a - px) ? b : a), SCHRIFTSTUFEN[0]);
  S.leseschrift = naechste;
  document.documentElement.style.setProperty("--leseschrift", naechste + "px");
  const stelle = SCHRIFTSTUFEN.indexOf(naechste);
  el("schrift-wert").textContent = naechste + " px";
  el("schrift-kleiner").disabled = stelle === 0;
  el("schrift-groesser").disabled = stelle === SCHRIFTSTUFEN.length - 1;
  merken("leseschrift", naechste);
}

/* ── Spaltenbreiten ───────────────────────────────────────────────────
   216 px links und 340 px rechts sind der Entwurf, nicht das Maß aller
   Schirme. Im Verzeichnis brechen die Überschriften des UStG nach drei Wörtern
   ab, im Apparat steht ein UStAE-Auszug in einer schmalen Rinne. Beide Ränder
   sind jetzt zu ziehen, und die Breiten werden gemerkt.

   DIE MITTE HAT VORRANG. Geklemmt wird nicht nur an festen Grenzen, sondern
   auch am verbleibenden Platz: Der Normtext behält immer mindestens 420 px,
   sonst zöge man sich die Lesespalte zu, um das Verzeichnis zu weiten. Weil
   die Rechnung an der Fensterbreite hängt, wird sie beim Ändern der Größe
   wiederholt — eine Breite, die auf 1 920 px passte, passt auf 1 280 nicht. */
const SPALTEN_VORGABE = { nav: 216, apparat: 340 };
const SPALTEN_GRENZEN = { nav: [180, 560], apparat: [260, 680] };
const MITTE_MINDESTENS = 420;

function spalteKlemmen(welche, wert){
  const [min, max] = SPALTEN_GRENZEN[welche];
  const andere = welche === "nav" ? "apparat" : "nav";
  const platz = window.innerWidth - S.spalten[andere] - MITTE_MINDESTENS;
  return Math.round(Math.max(min, Math.min(max, platz, wert)));
}

function spalteSetzen(welche, wert, merkeEs = false){
  S.spalten[welche] = spalteKlemmen(welche, wert);
  document.documentElement.style.setProperty(
    welche === "nav" ? "--nav" : "--apparat", S.spalten[welche] + "px");
  const griff = el(welche === "nav" ? "griff-nav" : "griff-apparat");
  if (griff){
    const [min, max] = SPALTEN_GRENZEN[welche];
    griff.setAttribute("aria-valuenow", String(S.spalten[welche]));
    griff.setAttribute("aria-valuemin", String(min));
    griff.setAttribute("aria-valuemax", String(max));
    griff.setAttribute("aria-valuetext", S.spalten[welche] + " Pixel");
  }
  if (merkeEs) merken("spalten", S.spalten);
}

function spaltenSetzen(merkeEs = false){
  for (const welche of ["nav", "apparat"]) spalteSetzen(welche, S.spalten[welche], false);
  if (merkeEs) merken("spalten", S.spalten);
}

function griffVerdrahten(griff, welche){
  if (!griff) return;
  let zug = null;

  griff.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    zug = { x: e.clientX, breite: S.spalten[welche] };
    griff.setPointerCapture(e.pointerId);
    griff.dataset.zieht = "";
    /* Ohne das markiert der Zeiger beim Ziehen den halben Normtext. */
    document.body.style.userSelect = "none";
    document.body.style.cursor = "col-resize";
    e.preventDefault();
  });

  griff.addEventListener("pointermove", (e) => {
    if (!zug) return;
    /* Der Apparat sitzt rechts: Er wächst, wenn der Zeiger nach LINKS geht. */
    const richtung = welche === "nav" ? 1 : -1;
    spalteSetzen(welche, zug.breite + richtung * (e.clientX - zug.x));
  });

  const loslassen = () => {
    if (!zug) return;
    zug = null;
    delete griff.dataset.zieht;
    document.body.style.userSelect = "";
    document.body.style.cursor = "";
    /* Erst am Ende schreiben, nicht bei jedem Pixel. */
    merken("spalten", S.spalten);
  };
  griff.addEventListener("pointerup", loslassen);
  griff.addEventListener("pointercancel", loslassen);

  /* Doppelklick stellt die Vorgabe wieder her — schneller als zurückzuzielen. */
  griff.addEventListener("dblclick", () => spalteSetzen(welche, SPALTEN_VORGABE[welche], true));

  /* Mit der Tastatur: Pfeile in Sechzehnerschritten, mit Umschalt in
     Achtundvierzigern, Pos1 zurück auf die Vorgabe. Ein Griff, den man nur
     mit der Maus bewegen kann, ist für Tastaturnutzer kein Griff. */
  griff.addEventListener("keydown", (e) => {
    const schritt = e.shiftKey ? 48 : 16;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight"){
      e.preventDefault();
      const richtung = (e.key === "ArrowRight" ? 1 : -1) * (welche === "nav" ? 1 : -1);
      spalteSetzen(welche, S.spalten[welche] + richtung * schritt, true);
    } else if (e.key === "Home"){
      e.preventDefault();
      spalteSetzen(welche, SPALTEN_VORGABE[welche], true);
    }
  });
}

/**
 * Satzbild umschalten.
 *
 * Die Marke sitzt am `body`, nicht am Text: Umgeschaltet wird der Umbruch,
 * nicht der Inhalt. Neu gezeichnet werden muss deshalb nichts — die Hüllen
 * `<span class="satz">` liegen ohnehin im Text, sie werden nur von Zeile zu
 * Block. Das hält den Wechsel augenblicklich, auch bei § 8b KStG.
 */
/**
 * Höhe der klebenden Kopfleiste messen und als Marke ablegen.
 *
 * Sie steht nicht fest: Die Schalterzeile bricht je nach Fensterbreite in eine
 * zweite Reihe um, und die Reiterleiste fehlt auf Startseite und Trefferliste
 * ganz. Eine feste Zahl im CSS wäre auf der Hälfte der Fensterbreiten falsch —
 * mal klebte die linke Spalte zu tief, mal verschwände sie darunter.
 *
 * Ein `ResizeObserver` hält die Marke nach, ohne bei jedem Scrollen zu rechnen.
 */
function kopfhoeheMessen(){
  const kopf = document.querySelector("header");
  if (!kopf) return;
  const setze = () => {
    const kasten = kopf.getBoundingClientRect();
    const hoehe = Math.round(kasten.height);
    document.documentElement.style.setProperty("--kopfhoehe", hoehe + "px");

    /* Auf dem Telefon klebt nur vom Suchfeld abwärts. Gemessen statt gesetzt:
       Wie viele Zeilen die Schalter darüber belegen, hängt von der Breite ab. */
    let klebt = hoehe;
    if (window.matchMedia && window.matchMedia("(max-width: 767px)").matches){
      const feld = document.querySelector(".suchfeld");
      if (feld){
        const oben = feld.getBoundingClientRect().top - kasten.top;
        klebt = Math.max(56, Math.round(hoehe - oben + 8));
      }
    }
    document.documentElement.style.setProperty("--kopfklebt", klebt + "px");
  };
  setze();
  if (window.ResizeObserver) new ResizeObserver(setze).observe(kopf);
  else window.addEventListener("resize", setze);
}

function satzbildSetzen(bild){
  const gueltig = bild === "einzeln" ? "einzeln" : "fortlaufend";
  S.satzbild = gueltig;
  if (gueltig === "einzeln") document.body.dataset.satzbild = "einzeln";
  else delete document.body.dataset.satzbild;
  for (const b of el("satzbild").querySelectorAll("button")){
    b.setAttribute("aria-checked", String(b.dataset.bild === gueltig));
  }
  merken("satzbild", gueltig);
}

function schriftVerschieben(richtung){
  const stelle = SCHRIFTSTUFEN.indexOf(S.leseschrift);
  const ziel = Math.min(SCHRIFTSTUFEN.length - 1, Math.max(0, stelle + richtung));
  schriftSetzen(SCHRIFTSTUFEN[ziel]);
}

function eigenDeckkraft(){
  const wert = getComputedStyle(document.documentElement)
    .getPropertyValue("--eigen-deckkraft").trim();
  const zahl = Number.parseFloat(wert);
  return Number.isFinite(zahl) ? zahl : 0.45;
}

/* ══════════════════════════════════════════════════════════════════════
   Struktur-Einfärbung — Schalter
   Die Wirkung auf den Normtext folgt in Schritt 4. Hier wird der Zustand
   gehalten und am Rumpf ausgewiesen, damit das CSS ihn später auswerten kann.
   ══════════════════════════════════════════════════════════════════════ */
function strukturSetzen(modus, nurAnzeige = false){
  const gueltig = ["aus", "dezent", "voll"].includes(modus) ? modus : "voll";
  if (!nurAnzeige){
    S.strukturModus = gueltig;
    merken("strukturModus", gueltig);
  }

  /* Ohne Datensatz gibt es nichts einzufärben. Der Schalter steht dann auf
     „aus" und ist gesperrt — mit einem Titel, der sagt, warum. Das ist der
     Unterschied zwischen „ausgeschaltet" und „nicht vorhanden". */
  const segmente = S.abk ? strukturDerNorm() : null;
  const moeglich = Array.isArray(segmente) && segmente.length > 0;
  const angezeigt = moeglich ? S.strukturModus : "aus";

  document.body.dataset.struktur = angezeigt;
  for (const b of el("stufen").querySelectorAll("button")){
    b.setAttribute("aria-checked", String(b.dataset.stufe === angezeigt));
    b.disabled = !moeglich;
    b.title = moeglich ? "" : "Für diese Norm liegt kein Strukturdatensatz vor.";
  }
  return { moeglich, angezeigt };
}

/* ══════════════════════════════════════════════════════════════════════
   Reiterleiste — ein Reiter je GESETZ

   Ein Reiter steht für ein Gesetz, nicht für eine Norm. Wer im EStG von § 4
   zu § 6 springt, arbeitet weiter im EStG; ein zweiter Reiter dafür wäre
   Buchhaltung über den eigenen Weg, keine Arbeitsordnung. Nach zehn Minuten
   Lesen stünden zwanzig Reiter da, und keiner sagte etwas.

   Ein neues Gesetz bekommt dagegen einen eigenen Reiter — das ist der Fall,
   für den Reiter gedacht sind: zwei Gesetze nebeneinander offen halten.

   Der Reiter merkt sich, bei welcher Norm er stand. Wer zwischen zwei
   Gesetzen wechselt, kommt dorthin zurück, wo er aufgehört hat.
   ══════════════════════════════════════════════════════════════════════ */
function reiterOeffnen(abk, normId, wechseln = true){
  const vorhanden = S.geoeffnet.find(r => r.gesetz === abk);
  if (vorhanden) vorhanden.norm = normId;
  else S.geoeffnet.push({ gesetz: abk, norm: normId });
  merken("geoeffnet", S.geoeffnet);
  if (wechseln) location.hash = "#/" + abk.toLowerCase() + "/" + normId;
}

function reiterSchliessen(abk){
  const stelle = S.geoeffnet.findIndex(r => r.gesetz === abk);
  if (stelle === -1) return;
  const warAktiv = S.abk === abk;
  S.geoeffnet.splice(stelle, 1);
  merken("geoeffnet", S.geoeffnet);
  if (!warAktiv){ reiterZeichnen(); return; }
  const nachfolger = S.geoeffnet[Math.min(stelle, S.geoeffnet.length - 1)];
  if (nachfolger) location.hash = "#/" + nachfolger.gesetz.toLowerCase() + "/" + nachfolger.norm;
  else location.hash = "#/";
}

/**
 * Altbestand aufräumen.
 *
 * Bis Fassung 7 stand je NORM ein Reiter im Speicher. Wer die Seite schon
 * benutzt hat, hat dort Dutzende Einträge desselben Gesetzes liegen. Behalten
 * wird je Gesetz der zuletzt gelesene Stand, in der Reihenfolge des ersten
 * Auftretens — sonst springt die Leiste beim ersten Start durcheinander.
 */
function reiterEntdoppeln(){
  const je = new Map();
  for (const eintrag of S.geoeffnet){
    if (!eintrag || !eintrag.gesetz) continue;
    if (je.has(eintrag.gesetz)) je.get(eintrag.gesetz).norm = eintrag.norm;
    else je.set(eintrag.gesetz, { gesetz: eintrag.gesetz, norm: eintrag.norm });
  }
  S.geoeffnet = [...je.values()];
  merken("geoeffnet", S.geoeffnet);
}

function reiterZeichnen(){
  const leiste = el("reiterleiste");
  leiste.innerHTML = "";

  for (const eintrag of S.geoeffnet){
    const meta = registerEintrag(eintrag.gesetz);
    const norm = meta && meta.normen ? meta.normen.find(n => n.id === eintrag.norm) : null;
    const aktiv = eintrag.gesetz === S.abk;

    const reiter = knopf("reiter");
    reiter.setAttribute("role", "tab");
    reiter.setAttribute("aria-selected", String(aktiv));
    reiter.draggable = true;
    reiter.dataset.stelle = String(S.geoeffnet.indexOf(eintrag));
    /* Der Titel nennt das Gesetz ausgeschrieben — im Reiter steht nur das
       Kürzel, und „UmwStG" sagt nicht jedem etwas. */
    reiter.title = [meta ? meta.titel : eintrag.gesetz, norm && norm.t ? norm.t : null]
      .filter(Boolean).join(" — ");

    /* Das Kürzel steht vorn: Der Reiter ist das Gesetz. Die Norm dahinter ist
       der Stand, bei dem er zuletzt aufgeschlagen war. */
    const abk = document.createElement("span");
    abk.className = "reiter-abk";
    abk.textContent = meta ? meta.abk : eintrag.gesetz;
    const nr = document.createElement("span");
    nr.className = "nr";
    // Kein erfundener Text: Fehlt der Registereintrag, steht dort die Adresse.
    nr.textContent = norm ? norm.e : "§ " + eintrag.norm;
    reiter.append(abk, nr);
    reiter.onclick = () => { location.hash = "#/" + eintrag.gesetz.toLowerCase() + "/" + eintrag.norm; };

    const zu = document.createElement("span");
    zu.className = "zu";
    zu.textContent = "×";
    zu.setAttribute("role", "button");
    zu.tabIndex = 0;
    zu.setAttribute("aria-label", (meta ? meta.abk : eintrag.gesetz) + " schließen");
    zu.onclick = (e) => { e.stopPropagation(); reiterSchliessen(eintrag.gesetz); };
    zu.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " "){
        e.preventDefault(); e.stopPropagation();
        reiterSchliessen(eintrag.gesetz);
      }
    };
    reiter.appendChild(zu);

    leiste.appendChild(reiter);
  }

  reiterZiehenVerdrahten(leiste);

  const plus = knopf("reiter-plus", "+");
  plus.title = "Weiteres Gesetz öffnen";
  plus.setAttribute("aria-label", "Weiteres Gesetz öffnen");
  plus.onclick = () => { location.hash = "#/"; };
  leiste.appendChild(plus);

  const zahl = document.createElement("div");
  zahl.className = "reiter-zahl";
  const anzahl = S.geoeffnet.length;
  zahl.textContent = anzahl === 1 ? "1 geöffnetes Gesetz" : anzahl + " geöffnete Gesetze";
  leiste.appendChild(zahl);
}

/**
 * Reiter per Ziehen umsortieren.
 *
 * Die Reihenfolge ist Arbeitsordnung: Wer sieben Normen offen hat, will sie
 * gruppieren können. Gearbeitet wird auf den Stellen im Zustand, nicht auf den
 * Knoten — nach dem Ablegen wird ohnehin neu gezeichnet.
 */
function reiterZiehenVerdrahten(leiste){
  let quelle = null;

  const aufraeumen = () => {
    for (const r of leiste.querySelectorAll(".reiter")){
      r.classList.remove("zieht", "ziel-links", "ziel-rechts");
    }
  };

  for (const reiter of leiste.querySelectorAll(".reiter")){
    reiter.addEventListener("dragstart", (e) => {
      quelle = Number(reiter.dataset.stelle);
      reiter.classList.add("zieht");
      e.dataTransfer.effectAllowed = "move";
      // Firefox startet das Ziehen nur mit gesetzten Daten.
      e.dataTransfer.setData("text/plain", String(quelle));
    });
    reiter.addEventListener("dragend", aufraeumen);

    reiter.addEventListener("dragover", (e) => {
      if (quelle === null) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const kasten = reiter.getBoundingClientRect();
      const linkeHaelfte = e.clientX < kasten.left + kasten.width / 2;
      reiter.classList.toggle("ziel-links", linkeHaelfte);
      reiter.classList.toggle("ziel-rechts", !linkeHaelfte);
    });
    reiter.addEventListener("dragleave", () => {
      reiter.classList.remove("ziel-links", "ziel-rechts");
    });

    reiter.addEventListener("drop", (e) => {
      e.preventDefault();
      if (quelle === null) return;
      const kasten = reiter.getBoundingClientRect();
      const linkeHaelfte = e.clientX < kasten.left + kasten.width / 2;
      let ziel = Number(reiter.dataset.stelle) + (linkeHaelfte ? 0 : 1);
      const [bewegt] = S.geoeffnet.splice(quelle, 1);
      if (quelle < ziel) ziel--;
      S.geoeffnet.splice(ziel, 0, bewegt);
      quelle = null;
      merken("geoeffnet", S.geoeffnet);
      reiterZeichnen();
    });
  }
}

/** Zum Reiter an der Stelle `index` wechseln — für die Tasten 1 bis 9. */
function reiterWechseln(index){
  const ziel = S.geoeffnet[index];
  if (!ziel) return;
  location.hash = "#/" + ziel.gesetz.toLowerCase() + "/" + ziel.norm;
}

/* ══════════════════════════════════════════════════════════════════════
   Linke Spalte — Normen des Gesetzes
   ══════════════════════════════════════════════════════════════════════ */
function navZeichnen(){
  const spalte = el("navspalte");
  spalte.innerHTML = "";
  if (!S.gesetz) return;

  const etikett = document.createElement("div");
  etikett.className = "mono-etikett";
  // Die Normenzahl kommt aus dem geladenen Gesetz, nicht aus einer Annahme.
  etikett.textContent = S.gesetz.abk + " · " + S.gesetz.normen.length + " Normen";
  spalte.appendChild(etikett);

  for (const norm of S.gesetz.normen){
    const zeile = knopf("normzeile");
    zeile.setAttribute("aria-current", String(norm.id === S.normId));
    zeile.title = (norm.enbez + " " + (norm.titel || "")).trim();

    const nr = document.createElement("span");
    nr.className = "nr";
    nr.textContent = norm.enbez;

    const titel = document.createElement("span");
    titel.className = "titel";
    titel.textContent = norm.titel || "";

    zeile.append(nr, titel);
    zeile.onclick = () => {
      document.body.dataset.schublade = "zu";
      reiterOeffnen(S.abk, norm.id);
    };
    spalte.appendChild(zeile);
  }

  if (S.zuletzt.length){
    const block = document.createElement("div");
    block.className = "zuletzt";
    const kappe = document.createElement("div");
    kappe.className = "mono-etikett";
    kappe.textContent = "Zuletzt";
    block.appendChild(kappe);

    const liste = document.createElement("div");
    liste.className = "zuletzt-liste";
    for (const eintrag of S.zuletzt.slice(0, 6)){
      const meta = registerEintrag(eintrag.gesetz);
      const norm = meta && meta.normen ? meta.normen.find(n => n.id === eintrag.norm) : null;
      const b = knopf("", (norm ? norm.e : "§ " + eintrag.norm) + " " + (meta ? meta.abk : eintrag.gesetz));
      b.onclick = () => { location.hash = "#/" + eintrag.gesetz.toLowerCase() + "/" + eintrag.norm; };
      liste.appendChild(b);
    }
    block.appendChild(liste);
    spalte.appendChild(block);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   Kanonischer Textindex

   Die Zeichenpositionen in struktur/ beziehen sich auf den kanonischen
   Volltext der Norm, den `tools/lib/gliederung.mjs` bildet:
   Satznummern entfernt, Auszeichnung durch Leerzeichen ersetzt, Leerraum
   zusammengezogen, kein Leerzeichen vor Satzzeichen.

   Hier wird DIESELBE Zeichenkette aus dem DOM aufgebaut — zusammen mit einer
   Karte, die jedem Zeichen seinen Textknoten zuordnet. Nur wenn beide Seiten
   identisch rechnen, sitzen die Farben an der richtigen Stelle. Weicht eine
   Seite ab, verschiebt sich alles ab der ersten Abweichung.
   ══════════════════════════════════════════════════════════════════════ */
function textindex(wurzel){
  const gehe = document.createTreeWalker(wurzel, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if (!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      // Satznummern blendet auch die Pipeline aus (entkerne).
      if (n.parentElement.closest(".sn")) return NodeFilter.FILTER_REJECT;
      /* Die Absatzbezeichnung ist Anzeige, nicht Wortlaut: Sie steht in
         `abs.n`, nicht in `abs.html`, und der kanonische Volltext kennt sie
         nicht. Käme sie hier durch, verschöbe sich jede Zeichenposition der
         Struktur-Einfärbung um drei Zeichen je Absatz. */
      if (n.parentElement.closest(".an")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    },
  });

  const knoten = [], karte = [];
  let text = "", n;

  const leerzeichen = (ref = null) => {
    if (text && !text.endsWith(" ")){ text += " "; karte.push(ref); }
  };

  const zeichen = (ch, ref) => {
    if (/\s/.test(ch)){ leerzeichen(ref); return; }
    // Kein Leerzeichen vor Satzzeichen — genau wie in entkerne().
    if (/[,.;:!?]/.test(ch) && text.endsWith(" ")){ text = text.slice(0, -1); karte.pop(); }
    text += ch;
    karte.push(ref);
  };

  while ((n = gehe.nextNode())){
    if (knoten.length) leerzeichen();
    knoten.push(n);
    for (let i = 0; i < n.nodeValue.length; i++) zeichen(n.nodeValue[i], { n, i });
  }
  if (text.endsWith(" ")){ text = text.slice(0, -1); karte.pop(); }
  return { text, karte, knoten };
}

/**
 * Legt Spannen über den Normtext, ohne ihn zu verändern.
 *
 * Gearbeitet wird zeichenweise: Jedes Zeichen bekommt seine Klasse, danach
 * werden gleich ausgezeichnete Nachbarn zu einem Element zusammengefasst. Das
 * ist der einzige Weg, der auch dann trägt, wenn eine Spanne mitten in einem
 * Textknoten beginnt oder über mehrere Knoten läuft.
 *
 * @returns {number} Zahl der Spannen, die ihre Stelle nicht gefunden haben
 */
function spannenLegen(wurzel, spannen){
  if (!spannen.length) return 0;
  const { text, karte, knoten } = textindex(wurzel);

  /* Je Zeichen wird eine LISTE von Spannen geführt, keine einzelne.
     Die drei Auszeichnungsebenen liegen übereinander: Eine Stelle kann
     zugleich Rechtsfolge, eigene Markierung und Verwaltungsstelle sein. Wer
     hier nur die zuletzt gesetzte Spanne behält, löscht die anderen beiden. */
  const belegung = new Map(knoten.map(n => [n, new Array(n.nodeValue.length).fill(null)]));
  let verwaist = 0;

  for (const spanne of spannen){
    const von = spanne.von;
    const bis = Math.min(spanne.bis, text.length);
    if (!Number.isInteger(von) || von < 0 || bis <= von || von >= text.length){ verwaist++; continue; }
    for (let pos = von; pos < bis; pos++){
      const ref = karte[pos];
      if (!ref) continue;
      const liste = belegung.get(ref.n);
      if (!liste[ref.i]) liste[ref.i] = [];
      liste[ref.i].push(spanne);
    }
  }

  /* Zwei Zeichen gehören in dasselbe Element, wenn genau dieselben Spannen auf
     ihnen liegen — in derselben Reihenfolge. */
  const kennung = (liste) => (liste ? liste.map(s => s.schluessel || s.klasse).join(" ") : "");

  for (const n of knoten){
    const roh = n.nodeValue;
    const belegt = belegung.get(n);
    if (!belegt.some(Boolean)) continue;

    const teil = document.createDocumentFragment();
    let start = 0;
    while (start < roh.length){
      const jetzt = kennung(belegt[start]);
      let ende = start + 1;
      while (ende < roh.length && kennung(belegt[ende]) === jetzt) ende++;
      const stueck = roh.slice(start, ende);

      if (!jetzt){
        teil.appendChild(document.createTextNode(stueck));
      } else {
        const liste = belegt[start];
        const s = document.createElement("span");
        s.className = liste.map(x => x.klasse).join(" ");
        const titel = liste.map(x => x.titel).filter(Boolean);
        if (titel.length) s.title = titel.join(" · ");
        for (const x of liste){
          if (x.datensatz) Object.assign(s.dataset, x.datensatz);
          if (x.stil) s.setAttribute("style", (s.getAttribute("style") || "") + x.stil);
        }
        s.textContent = stueck;
        teil.appendChild(s);
      }
      start = ende;
    }
    n.parentNode.replaceChild(teil, n);
  }
  return verwaist;
}

/* ══════════════════════════════════════════════════════════════════════
   Eigene Markierungen

   Sie liegen im Browser, nicht auf einem Server — es gibt keinen. Verankert
   wird über den WORTLAUT samt Umgebung, nicht über Zeichenpositionen: Eine
   Gesetzesänderung verschiebt jede Position, aber selten den markierten Satz.
   Findet eine Markierung ihre Stelle nicht mehr, geht sie nicht verloren; sie
   erscheint im Register mit dem Hinweis, dass der Text sich geändert hat.
   ══════════════════════════════════════════════════════════════════════ */
const KONTEXT = 40;   // Zeichen Umgebung je Seite

const hexZuRgba = (hex, alpha) => {
  const wert = parseInt(String(hex).replace("#", ""), 16);
  if (Number.isNaN(wert)) return `rgba(0,0,0,${alpha})`;
  return `rgba(${(wert >> 16) & 255},${(wert >> 8) & 255},${wert & 255},${alpha})`;
};

function markierungenLesen(){
  const alle = gemerkt("markierungen", []);
  return Array.isArray(alle) ? alle : [];
}
function markierungenSchreiben(liste){
  S.markierungen = liste;
  merken("markierungen", liste);
}
function markierungenDerNorm(){
  return S.markierungen.filter(m => m.gesetz === S.abk && m.norm === S.normId);
}

/** Sucht die gespeicherte Stelle wieder: erst mit Umgebung, dann ohne. */
function markierungVerorten(volltext, m){
  if (m.praefix){
    const mitKontext = volltext.indexOf(m.praefix + m.anker);
    if (mitKontext !== -1) return mitKontext + m.praefix.length;
  }
  return volltext.indexOf(m.anker);
}

/** Absatzangabe zur Fundstelle — aus struktur/, sonst leer. */
function fundstelleZu(von){
  const segmente = strukturDerNorm();
  if (!Array.isArray(segmente)) return "";
  const treffer = segmente.find(s => von >= s.von && von < s.bis)
    || segmente.find(s => s.von >= von);
  return treffer && treffer.pfad ? treffer.pfad : "";
}

function markierungAnlegen(anker, praefix, suffix, von){
  const eintrag = {
    id: String(Date.now()) + Math.random().toString(36).slice(2, 7),
    gesetz: S.abk,
    norm: S.normId,
    anker, praefix, suffix,
    fundstelle: fundstelleZu(von),
    farbe: S.letzteFarbe,
    notiz: "",
    datum: new Date().toISOString(),
    mappe: null,
  };
  /* Eine Markierung gehört immer genau einer Mappe — der zuletzt benutzten.
     Sie wird angelegt, bevor die Markierung geschrieben wird, damit `mappe`
     schon beim ersten Schreiben stimmt und nicht in einem zweiten Durchgang
     nachgetragen werden muss. */
  eintrag.mappe = markierungInMappe(eintrag).id;
  markierungenSchreiben(S.markierungen.concat([eintrag]));
  return eintrag;
}

function markierungAendern(id, aenderung){
  markierungenSchreiben(S.markierungen.map(m => (m.id === id ? { ...m, ...aenderung } : m)));
}
function markierungLoeschen(id){
  markierungenSchreiben(S.markierungen.filter(m => m.id !== id));
  /* Sonst bliebe in der Mappe ein Eintrag stehen, der auf nichts mehr zeigt.
     Die Anzeige käme damit zurecht („Markierung nicht mehr im Bestand"), aber
     das ist die Anzeige für verlorene Datensätze, nicht für gelöschte. */
  let betroffen = false;
  for (const m of S.mappen){
    const vorher = m.eintraege.length;
    m.eintraege = m.eintraege.filter(e => e.markierungId !== id);
    if (m.eintraege.length !== vorher) betroffen = true;
  }
  if (betroffen){ mappenSchreiben(); if (el("mappe").classList.contains("offen")) mappeZeichnen(); }
  if (S.aktiveMarkierung === id) S.aktiveMarkierung = null;
}

/* ── Farbwahl ───────────────────────────────────────────────────────── */

/**
 * Eine Reihe Farbkreise.
 *
 * ALLE Klicks hier rufen `stopPropagation()`. Ohne das schließt der Klick auf
 * einen Kreis zugleich die Karte, auf der er liegt — die Auswahl wäre nach dem
 * ersten Klick wieder zu. Derselbe Fehler ist im Entwurf aufgetreten.
 */
function farbreiheFuellen(behaelter, aktuell, waehlen){
  behaelter.innerHTML = "";
  for (const [hex, name] of PALETTE){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "farbkreis";
    b.title = name;
    b.setAttribute("aria-label", "Farbe " + name);
    b.setAttribute("aria-pressed", String(String(aktuell).toLowerCase() === hex.toLowerCase()));
    b.style.background = hexZuRgba(hex, eigenDeckkraft());
    b.style.boxShadow = String(aktuell).toLowerCase() === hex.toLowerCase()
      ? `0 0 0 2px #FFFFFF, 0 0 0 3.5px ${hex}`
      : `inset 0 0 0 1px ${hex}`;
    b.onclick = (e) => { e.stopPropagation(); waehlen(hex); };
    behaelter.appendChild(b);
  }
}

/* ── Werkzeugleiste an der Auswahl ──────────────────────────────────── */

function auswahlleisteZeigen(){
  const leiste = el("auswahlleiste");
  const auswahl = window.getSelection();
  if (!auswahl || auswahl.isCollapsed || !auswahl.rangeCount){ leiste.classList.remove("offen"); return; }

  const bereich = auswahl.getRangeAt(0);
  const lese = document.querySelector(".lesespalte");
  const text = auswahl.toString().replace(/\s+/g, " ").trim();
  if (!lese || !lese.contains(bereich.commonAncestorContainer) || text.length < 3){
    leiste.classList.remove("offen");
    return;
  }

  farbreiheFuellen(el("auswahl-farben"), S.letzteFarbe, (hex) => {
    S.letzteFarbe = hex;
    merken("letzteFarbe", hex);
    auswahlMarkieren(text);
  });

  const kasten = bereich.getBoundingClientRect();
  leiste.classList.add("offen");
  leiste.style.top = (window.scrollY + kasten.top - leiste.offsetHeight - 8) + "px";
  leiste.style.left = Math.max(8, window.scrollX + kasten.left) + "px";
}

function auswahlMarkieren(text){
  const lese = document.querySelector(".lesespalte");
  const { text: voll } = textindex(lese);
  const stelle = voll.indexOf(text);
  const praefix = stelle === -1 ? "" : voll.slice(Math.max(0, stelle - KONTEXT), stelle);
  const suffix = stelle === -1 ? "" : voll.slice(stelle + text.length, stelle + text.length + KONTEXT);

  const eintrag = markierungAnlegen(text, praefix, suffix, stelle);
  el("auswahlleiste").classList.remove("offen");
  window.getSelection().removeAllRanges();
  S.aktiveMarkierung = eintrag.id;
  S.apparatRegister = "markierungen";
  hauptZeichnen();
  apparatZeichnen();
}

/* ── Popover am Text ────────────────────────────────────────────────── */

function popoverOeffnen(id, ankerKnoten){
  const eintrag = S.markierungen.find(m => m.id === id);
  if (!eintrag) return;
  const pop = el("popover");

  farbreiheFuellen(el("popover-farben"), eintrag.farbe, (hex) => {
    markierungAendern(id, { farbe: hex });
    S.letzteFarbe = hex;
    merken("letzteFarbe", hex);
    popoverOeffnen(id, ankerKnoten);
    hauptZeichnen();
    apparatZeichnen();
  });

  const waehler = el("popover-waehler");
  waehler.value = /^#[0-9a-f]{6}$/i.test(eintrag.farbe) ? eintrag.farbe : "#F2C744";
  el("popover-hex").textContent = eintrag.farbe;
  waehler.oninput = (e) => {
    e.stopPropagation();
    markierungAendern(id, { farbe: e.target.value });
    el("popover-hex").textContent = e.target.value;
  };
  waehler.onchange = () => { hauptZeichnen(); apparatZeichnen(); popoverOeffnen(id, ankerKnoten); };
  waehler.onclick = (e) => e.stopPropagation();

  /* Der Fuß sagt zweierlei: dass nichts davon das Gerät verlässt, und in
     welcher Mappe die Stelle liegt. Ohne die zweite Angabe ist nicht zu
     sehen, wohin eine Markierung gelaufen ist. */
  const mappe = mappeVonMarkierung(id);
  el("popover-mappe").textContent = mappe
    ? "Nur für Sie sichtbar · Mappe „" + mappe.name + "“"
    : "Nur für Sie sichtbar";

  const notiz = el("popover-notiz");
  notiz.value = eintrag.notiz || "";
  notiz.oninput = () => markierungAendern(id, { notiz: notiz.value });
  notiz.onclick = (e) => e.stopPropagation();

  el("popover-weg").onclick = (e) => {
    e.stopPropagation();
    markierungLoeschen(id);
    popoverSchliessen();
    hauptZeichnen();
    apparatZeichnen();
  };

  pop.classList.add("offen");
  const kasten = ankerKnoten.getBoundingClientRect();
  const links = Math.min(
    Math.max(8, window.scrollX + kasten.left),
    window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 12,
  );
  pop.style.top = (window.scrollY + kasten.bottom + 8) + "px";
  pop.style.left = links + "px";
}

function popoverSchliessen(){
  el("popover").classList.remove("offen");
}

/**
 * Setzt hinter jede Verwaltungsstelle ihren Fundstellen-Chip.
 *
 * Der Chip ist ein Verweiszeichen wie eine Fußnotenziffer, kein Wortlaut. Er
 * steht deshalb außerhalb der markierten Spanne, trägt `user-select:none` und
 * ist als Schaltfläche ausgezeichnet — wer den Normtext kopiert, bekommt den
 * Normtext.
 */
function chipsSetzen(wurzel, stellen){
  for (const v of stellen){
    if (!v.chip) continue;
    const teile = [...wurzel.querySelectorAll('[data-vw="' + v.id + '"]')];
    if (!teile.length) continue;
    const letztes = teile[teile.length - 1];
    if (letztes.nextElementSibling && letztes.nextElementSibling.classList.contains("vw-chip")) continue;
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "vw-chip";
    chip.dataset.vw = v.id;
    chip.textContent = v.chip;
    chip.setAttribute("aria-label",
      "Verwaltungsstelle " + [v.quelle, v.fundstelle].filter(Boolean).join(" "));
    letztes.after(chip);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   Mappe

   Die Sammelmappe ist der Ort, an dem Arbeit über die einzelne Sitzung hinaus
   bestehen bleibt — je Fall, je Seminar, je Frage. Sie liegt im Browser; ein
   Konto gibt es nicht, und der Fußsatz sagt das.

   Regeln der Spezifikation, die leicht untergehen:
     · Jede Markierung gehört GENAU EINER Mappe.
     · Es gibt immer mindestens eine Mappe; ist keine da, heißt sie „Ohne Titel“.
     · Eine Norm darf in mehreren Mappen liegen.
     · Eine Mappe zu löschen löscht ihre Markierungen mit — mit Rückfrage.
   ══════════════════════════════════════════════════════════════════════ */
const MAPPENFARBEN = ["#F2C744", "#3B7BD1", "#8B7BC7", "#4E9A5F", "#C4577A", "#7A8087"];

function mappenLesen(){
  const alle = gemerkt("mappen", []);
  return Array.isArray(alle) && alle.length ? alle : null;
}

/** Es gibt immer mindestens eine Mappe, und immer genau eine aktive. */
function mappenSichern(){
  if (!S.mappen.length){
    S.mappen = [{
      id: "m" + Date.now().toString(36),
      name: "Ohne Titel",
      farbe: MAPPENFARBEN[0],
      angelegt: new Date().toISOString(),
      eintraege: [],
    }];
    S.aktiveMappe = null;
    mappenSchreiben();
  }
  if (!S.mappen.some(m => m.id === S.aktiveMappe)){
    S.aktiveMappe = S.mappen[0].id;
    mappenSchreiben();
  }
}

/**
 * Markierungen aus der Zeit vor den Mappen einsortieren.
 *
 * Die Regel lautet: Jede Markierung liegt in genau einer Mappe. Wer den
 * Bestand vorher angelegt hat, hätte sonst Markierungen im Text, die in keiner
 * Mappe auftauchen — die Mappe sähe leer aus, obwohl markiert wurde.
 */
function mappenNachtragen(){
  mappenSichern();
  const bekannt = new Set(S.mappen.flatMap(m => m.eintraege.map(e => e.markierungId)));
  const offen = S.markierungen.filter(m => !bekannt.has(m.id));
  if (!offen.length) return;
  const ziel = aktiveMappe();
  for (const m of offen){
    ziel.eintraege.unshift({
      art: "markierung", gesetz: m.gesetz, normId: m.norm,
      markierungId: m.id, hinzugefuegt: m.datum,
    });
  }
  ziel.eintraege.sort((a, b) => String(b.hinzugefuegt).localeCompare(String(a.hinzugefuegt)));
  mappenSchreiben();
}

function mappenSchreiben(){
  merken("mappen", S.mappen);
  merken("aktiveMappe", S.aktiveMappe);
}

const aktiveMappe = () => S.mappen.find(m => m.id === S.aktiveMappe) || S.mappen[0];

/**
 * Die Mappe, in der eine Markierung liegt.
 *
 * Maßgeblich ist der Eintrag in der Mappe, nicht das Feld `mappe` an der
 * Markierung: Beim Verschieben wird der Eintrag umgehängt, und zwei Quellen
 * für dieselbe Auskunft laufen früher oder später auseinander.
 */
const mappeVonMarkierung = (id) =>
  S.mappen.find(m => m.eintraege.some(e => e.markierungId === id)) || null;

function mappeAnlegen(){
  const name = window.prompt("Name der neuen Mappe", "");
  if (name === null) return;
  const eintrag = {
    id: "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    name: name.trim() || "Ohne Titel",
    farbe: MAPPENFARBEN[S.mappen.length % MAPPENFARBEN.length],
    angelegt: new Date().toISOString(),
    eintraege: [],
  };
  S.mappen.push(eintrag);
  S.aktiveMappe = eintrag.id;
  mappenSchreiben();
  mappeZeichnen();
}

/** Fügt die offene Norm in die aktive Mappe ein. Doppelt geht nicht. */
function normInMappe(){
  const mappe = aktiveMappe();
  const schon = mappe.eintraege.some(e => e.art === "norm" && e.gesetz === S.abk && e.normId === S.normId);
  if (schon) return;
  mappe.eintraege.unshift({
    art: "norm", gesetz: S.abk, normId: S.normId,
    hinzugefuegt: new Date().toISOString(),
  });
  mappenSchreiben();
  mappeZeichnen();
}

/** Eine neue Markierung landet in der zuletzt benutzten Mappe. */
function markierungInMappe(markierung){
  mappenSichern();
  const mappe = aktiveMappe();
  mappe.eintraege.unshift({
    art: "markierung", gesetz: markierung.gesetz, normId: markierung.norm,
    markierungId: markierung.id, hinzugefuegt: markierung.datum,
  });
  mappenSchreiben();
  return mappe;
}

function mappeEintragEntfernen(mappeId, index){
  const mappe = S.mappen.find(m => m.id === mappeId);
  if (!mappe) return;
  mappe.eintraege.splice(index, 1);
  mappenSchreiben();
  mappeZeichnen();
}

function mappeUmbenennen(){
  const mappe = aktiveMappe();
  const name = window.prompt("Mappe umbenennen", mappe.name);
  if (name === null) return;
  mappe.name = name.trim() || "Ohne Titel";
  mappenSchreiben();
  mappeZeichnen();
}

function mappeLoeschen(){
  const mappe = aktiveMappe();
  const markierungen = mappe.eintraege.filter(e => e.art === "markierung").length;
  const frage = markierungen
    ? `Mappe „${mappe.name}“ löschen? ${markierungen} enthaltene Markierung(en) werden mitgelöscht.`
    : `Mappe „${mappe.name}“ löschen?`;
  if (!window.confirm(frage)) return;

  const ids = new Set(mappe.eintraege.filter(e => e.art === "markierung").map(e => e.markierungId));
  if (ids.size) markierungenSchreiben(S.markierungen.filter(m => !ids.has(m.id)));
  S.mappen = S.mappen.filter(m => m.id !== mappe.id);
  S.aktiveMappe = S.mappen.length ? S.mappen[0].id : null;
  mappenSichern();
  mappenSchreiben();
  mappeZeichnen();
  if (document.body.dataset.ansicht === "norm"){ hauptZeichnen(); apparatZeichnen(); }
}

/**
 * „Alle öffnen" legt jedes GESETZ der Mappe als Reiter an.
 *
 * Ein Reiter je Gesetz, nicht je Eintrag: Eine Mappe mit zwölf EStG-Normen
 * ergäbe sonst zwölf Reiter desselben Gesetzes. Aufgeschlagen wird der zuletzt
 * gesammelte Eintrag je Gesetz — der steht in der Mappe oben.
 */
function mappeAlleOeffnen(){
  const mappe = aktiveMappe();
  const normen = mappe.eintraege.filter(e => e.gesetz && e.normId);
  let erste = null;
  for (const e of normen){
    if (!S.geoeffnet.some(r => r.gesetz === e.gesetz)){
      S.geoeffnet.push({ gesetz: e.gesetz, norm: e.normId });
    }
    if (!erste) erste = e;
  }
  merken("geoeffnet", S.geoeffnet);
  mappeSchliessen();
  if (erste) location.hash = "#/" + erste.gesetz.toLowerCase() + "/" + erste.normId;
  else reiterZeichnen();
}

/* ── Anzeige ───────────────────────────────────────────────────────── */

function mappeZeichnen(){
  mappenSichern();
  const feld = el("mappe");
  feld.innerHTML = "";
  const mappe = aktiveMappe();

  /* Kopfzeile */
  const kopf = document.createElement("div");
  kopf.className = "mappe-kopf";
  const etikett = document.createElement("span");
  etikett.className = "mono-etikett";
  etikett.textContent = "Mappe";
  /* Kein Knopf, der nur eine Meldung aufmacht: Alle Mappen stehen ohnehin
     gleich darunter. Die Kopfzeile zählt sie und schließt. */
  const kopfzahl = document.createElement("span");
  kopfzahl.className = "mappe-kopf-zahl";
  kopfzahl.textContent = S.mappen.length + (S.mappen.length === 1 ? " Mappe" : " Mappen");
  const zu = knopf("", "×");
  zu.setAttribute("aria-label", "Mappe schließen");
  zu.onclick = mappeSchliessen;
  kopf.append(etikett, kopfzahl, zu);
  feld.appendChild(kopf);

  /* Liste der Mappen */
  const liste = document.createElement("div");
  liste.className = "mappe-liste";
  for (const m of S.mappen){
    const zeile = knopf("mappe-zeile");
    zeile.setAttribute("aria-current", String(m.id === mappe.id));
    const punkt = document.createElement("span");
    punkt.className = "mappe-punkt";
    punkt.style.background = m.farbe;
    const name = document.createElement("span");
    name.textContent = m.name;
    const zahl = document.createElement("span");
    zahl.className = "mappe-zahl";
    zahl.textContent = m.eintraege.length;
    zeile.append(punkt, name, zahl);
    zeile.onclick = () => { S.aktiveMappe = m.id; mappenSchreiben(); mappeZeichnen(); };
    liste.appendChild(zeile);
  }
  const neu = knopf("mappe-neu", "+  Neue Mappe anlegen");
  neu.onclick = mappeAnlegen;
  liste.appendChild(neu);
  feld.appendChild(liste);

  /* Inhalt der aktiven Mappe */
  const inhalt = document.createElement("div");
  inhalt.className = "mappe-inhalt";
  const ikopf = document.createElement("div");
  ikopf.className = "mappe-inhalt-kopf";
  const iname = document.createElement("span");
  iname.className = "mappe-name";
  iname.textContent = mappe.name;
  const imeta = document.createElement("span");
  imeta.className = "mappe-meta";
  const zahl = mappe.eintraege.length;
  imeta.textContent = zahl + (zahl === 1 ? " Eintrag" : " Einträge")
    + " · " + new Date(mappe.angelegt).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
  ikopf.append(iname, imeta);
  inhalt.appendChild(ikopf);

  const eintraege = document.createElement("div");
  eintraege.className = "mappe-eintraege";
  if (!mappe.eintraege.length){
    const p = document.createElement("p");
    p.className = "platzhalter";
    p.textContent = "Noch nichts gesammelt. Über „§ … hinzufügen“ kommt die offene Norm hinein; "
      + "eigene Markierungen landen von selbst hier.";
    eintraege.appendChild(p);
  }

  for (const [i, e] of mappe.eintraege.entries()){
    const karte = knopf("mappe-eintrag");
    const meta = registerEintrag(e.gesetz);
    const norm = meta && meta.normen ? meta.normen.find(n => n.id === e.normId) : null;
    const markierung = e.markierungId ? S.markierungen.find(m => m.id === e.markierungId) : null;

    /* Eine Markierung, deren Datensatz fehlt, wird als fehlend gezeigt —
       nicht stillschweigend übersprungen. */
    if (e.art === "markierung" && markierung) karte.style.borderLeftColor = markierung.farbe;

    const kzeile = document.createElement("div");
    kzeile.className = "mappe-eintrag-kopf";
    const stelle = document.createElement("span");
    stelle.className = "mappe-eintrag-stelle";
    stelle.textContent = e.art === "markierung"
      ? (markierung && markierung.fundstelle ? markierung.fundstelle : "ohne Fundstelle")
      : (norm ? norm.e + " " + meta.abk : "§ " + e.normId + " " + e.gesetz);
    const art = document.createElement("span");
    art.className = "mappe-eintrag-art";
    art.textContent = e.art === "markierung" ? "Markierung" : "Norm";
    const datum = document.createElement("span");
    datum.className = "mappe-eintrag-datum";
    datum.textContent = new Date(e.hinzugefuegt).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
    kzeile.append(stelle, art, datum);
    karte.appendChild(kzeile);

    const text = document.createElement("p");
    text.className = "mappe-eintrag-text";
    if (e.art === "markierung"){
      text.textContent = markierung
        ? "„" + markierung.anker + "“" + (markierung.notiz ? " — " + markierung.notiz : "")
        : "Markierung nicht mehr im Bestand.";
      if (!markierung) text.style.color = "var(--text-4)";
    } else {
      text.textContent = norm ? (norm.t || "ohne Überschrift")
        : "Datensatz " + e.gesetz + " ausstehend";
      if (!norm) text.style.color = "var(--text-4)";
    }
    karte.appendChild(text);

    karte.onclick = () => {
      mappeSchliessen();
      location.hash = "#/" + String(e.gesetz).toLowerCase() + "/" + e.normId;
    };
    karte.oncontextmenu = (ev) => {
      ev.preventDefault();
      if (window.confirm("Eintrag aus der Mappe entfernen?")) mappeEintragEntfernen(mappe.id, i);
    };
    eintraege.appendChild(karte);
  }
  inhalt.appendChild(eintraege);

  /* Knopfzeile */
  const knoepfe = document.createElement("div");
  knoepfe.className = "mappe-knoepfe";
  const norm = S.gesetz && S.normId ? S.gesetz.normen.find(n => n.id === S.normId) : null;
  const hinzu = knopf("", norm ? norm.enbez + " hinzufügen" : "Norm hinzufügen");
  hinzu.disabled = !norm || document.body.dataset.ansicht !== "norm";
  if (hinzu.disabled) hinzu.title = "Keine Norm geöffnet.";
  hinzu.onclick = normInMappe;
  const umbenennen = knopf("", "Umbenennen");
  umbenennen.onclick = mappeUmbenennen;
  const loeschen = knopf("", "Löschen");
  loeschen.onclick = mappeLoeschen;
  const oeffnen = knopf("rechts", "Alle öffnen");
  oeffnen.disabled = !mappe.eintraege.length;
  oeffnen.onclick = mappeAlleOeffnen;
  knoepfe.append(hinzu, umbenennen, loeschen, oeffnen);
  inhalt.appendChild(knoepfe);
  feld.appendChild(inhalt);

  const fuss = document.createElement("p");
  fuss.className = "mappe-fuss";
  // Ehrlich: Es gibt kein Konto. Die Mappen liegen im Browser.
  fuss.textContent = "Mappen liegen nur in diesem Browser. Eine Markierung gehört immer genau "
    + "einer Mappe; „Alle öffnen“ legt jede Norm der Mappe als Reiter an.";
  feld.appendChild(fuss);
}

function mappeOeffnen(){
  mappeZeichnen();
  const feld = el("mappe");
  feld.classList.add("offen");
  /* Fensterkoordinaten, kein `scrollY`: Das Feld liegt `fixed`. */
  const knopfKasten = el("knopf-mappe").getBoundingClientRect();
  const links = Math.min(
    knopfKasten.right - feld.offsetWidth,
    document.documentElement.clientWidth - feld.offsetWidth - 12,
  );
  feld.style.top = (knopfKasten.bottom + 8) + "px";
  feld.style.left = Math.max(8, links) + "px";
  el("knopf-mappe").setAttribute("aria-expanded", "true");
  /* Auf dem Telefon ist die Mappe ein Blatt von unten; die Marke schaltet den
     Schleier dahinter. Am Schreibtisch hat sie keine Wirkung. */
  document.body.dataset.mappe = "offen";
}

function mappeSchliessen(){
  el("mappe").classList.remove("offen");
  const k = el("knopf-mappe");
  if (k) k.setAttribute("aria-expanded", "false");
  delete document.body.dataset.mappe;
}

function mappeUmschalten(){
  if (el("mappe").classList.contains("offen")) mappeSchliessen();
  else mappeOeffnen();
}

/* ══════════════════════════════════════════════════════════════════════
   Fassungsvergleich

   Zwei Zeitstände derselben Norm nebeneinander, Wort für Wort verglichen.

   Die Fassungen stammen aus `fassungen/<gesetz>.json`, das der Git-Verlauf
   von `data/` speist — echte, datierte Zeitschnitte, keine nachgebaute
   Historie. Wo es nur einen Stand gibt, bleibt der Knopf gesperrt und sagt
   warum. Ein Vergleich mit sich selbst ist keiner.

   Struktur-Einfärbung und eigene Markierungen sind hier ausgeblendet: Im
   Vergleich zählt der Unterschied zwischen den Fassungen; drei weitere
   Farbebenen darüber machen ihn unlesbar.
   ══════════════════════════════════════════════════════════════════════ */

/** Fassungen der laufenden Norm, jüngste zuerst — leer ohne Datensatz. */
function fassungenDerNorm(abk = S.abk, normId = S.normId){
  const datei = S.fassungen[abk];
  if (!datei || !datei.normen) return [];
  const eintrag = datei.normen[normId];
  return eintrag && Array.isArray(eintrag.fassungen) ? eintrag.fassungen : [];
}

/**
 * Wortlaut einer Fassung.
 *
 * Die jüngste führt keinen eigenen — sie steht in `data/` und würde sonst
 * doppelt im Bestand liegen. Sie wird hier aus der geladenen Norm ergänzt.
 */
function fassungWortlaut(fassung){
  if (!fassung.aktuell) return fassung;
  const norm = S.gesetz.normen.find(n => n.id === S.normId);
  return norm
    ? { ...fassung, enbez: norm.enbez, titel: norm.titel, abs: norm.abs, fussnote: norm.fussnote ?? null }
    : { ...fassung, abs: [] };
}

/**
 * Reiner Text aus dem amtlichen HTML eines Absatzes.
 *
 * Zwischen zwei UNMITTELBAR benachbarten Elementen steht im Quelltext kein
 * Leerzeichen, und der Browser setzt auch keines. Ohne die eingefügte
 * Trennung klebte „vorzunehmen ist:nach der" zusammen, und der Wortvergleich
 * sähe ein Wort, wo zwei stehen — mit dem Ergebnis, dass jede Aufzählung als
 * geändert gälte.
 *
 * Maßgeblich ist `nextSibling`, nicht `nextElementSibling`: Letzteres
 * überspringt Text und träfe auch auf `<span>1</span>Der Beschluss … <span>2`
 * zu, wo die Satznummer schon durch den Text getrennt ist. Die Regel ist
 * dieselbe wie in der Anzeige (`dd>span+span::before`).
 */
function textAusHtml(html){
  const kasten = document.createElement("div");
  kasten.innerHTML = String(html || "");
  for (const knoten of [...kasten.querySelectorAll("*")]){
    /* Die Satznummer steht im Quelltext ohne Abstand vor dem Satz („<span
       class="sn">2</span>Nach diesem"); in der Lesespalte trennt sie eine
       Marge, hier ein Leerzeichen. Ohne das läse der Vergleich „2Nach" als
       ein Wort und meldete den ganzen Satz als geändert, sobald sich die
       Nummerierung verschiebt. */
    if (knoten.classList.contains("sn")){ knoten.after(document.createTextNode(" ")); continue; }
    const naechster = knoten.nextSibling;
    if (naechster && naechster.nodeType === 1) knoten.after(document.createTextNode(" "));
  }
  return kasten.textContent.replace(/\s+/g, " ").trim();
}

/** Wörter samt folgendem Leerraum — die Einheit des Vergleichs. */
const inWoerter = (text) => text.match(/\S+\s*/g) || [];

/* Über dieser Größe wird der Wortvergleich nicht mehr gerechnet. 1200 × 1200
   Wörter sind 1,4 Mio. Zellen; darüber steht die Wartezeit in keinem
   Verhältnis, und ein Absatz mit über 1200 Wörtern ist ohnehin keiner, den
   man wortweise liest. Dann wird der Absatz als Ganzes ausgewiesen. */
const VERGLEICH_GRENZE = 1200;

/**
 * Wortvergleich zweier Absätze über die längste gemeinsame Teilfolge.
 *
 * Ergebnis ist eine Folge von Stücken `{ art, text }` mit art ∈
 * gleich | weg | neu. „weg" steht nur links, „neu" nur rechts.
 */
function wortvergleich(alt, neu){
  const a = inWoerter(alt);
  const b = inWoerter(neu);
  if (a.length > VERGLEICH_GRENZE || b.length > VERGLEICH_GRENZE){
    return alt === neu
      ? [{ art: "gleich", text: alt }]
      : [{ art: "weg", text: alt }, { art: "neu", text: neu }];
  }

  /* Gleiche Ränder vorweg abschneiden. Das ist der Normalfall — geändert wird
     selten der ganze Absatz — und drückt die Tabelle auf einen Bruchteil. */
  let vorn = 0;
  while (vorn < a.length && vorn < b.length && a[vorn] === b[vorn]) vorn++;
  let hinten = 0;
  while (hinten < a.length - vorn && hinten < b.length - vorn
    && a[a.length - 1 - hinten] === b[b.length - 1 - hinten]) hinten++;

  const ka = a.slice(vorn, a.length - hinten);
  const kb = b.slice(vorn, b.length - hinten);

  /* Längste gemeinsame Teilfolge, Zeile für Zeile. */
  const n = ka.length, m = kb.length;
  const tafel = new Uint32Array((n + 1) * (m + 1));
  for (let i = n - 1; i >= 0; i--){
    for (let j = m - 1; j >= 0; j--){
      tafel[i * (m + 1) + j] = ka[i] === kb[j]
        ? tafel[(i + 1) * (m + 1) + j + 1] + 1
        : Math.max(tafel[(i + 1) * (m + 1) + j], tafel[i * (m + 1) + j + 1]);
    }
  }

  const stuecke = [];
  const anfuegen = (art, text) => {
    if (!text) return;
    const letztes = stuecke[stuecke.length - 1];
    if (letztes && letztes.art === art) letztes.text += text;
    else stuecke.push({ art, text });
  };

  anfuegen("gleich", a.slice(0, vorn).join(""));
  let i = 0, j = 0;
  while (i < n && j < m){
    if (ka[i] === kb[j]){ anfuegen("gleich", ka[i]); i++; j++; }
    else if (tafel[(i + 1) * (m + 1) + j] >= tafel[i * (m + 1) + j + 1]){ anfuegen("weg", ka[i]); i++; }
    else { anfuegen("neu", kb[j]); j++; }
  }
  while (i < n){ anfuegen("weg", ka[i]); i++; }
  while (j < m){ anfuegen("neu", kb[j]); j++; }
  anfuegen("gleich", a.slice(a.length - hinten).join(""));
  return stuecke;
}

/**
 * Absätze zweier Fassungen paarweise ordnen.
 *
 * Geordnet wird über die Absatznummer, nicht über die Reihenfolge: Fällt ein
 * Absatz weg oder kommt einer hinzu, verschöbe sich sonst alles danach und der
 * Vergleich zeigte lauter Änderungen, wo keine sind.
 */
function absatzpaare(alt, neu){
  const links = alt.abs || [];
  const rechts = neu.abs || [];
  const namen = [];
  const gesehen = new Set();
  for (const liste of [links, rechts]){
    for (const [i, a] of liste.entries()){
      const name = a.n || "o" + i;
      if (!gesehen.has(name)){ gesehen.add(name); namen.push(name); }
    }
  }
  const finde = (liste, name) => liste.find((a, i) => (a.n || "o" + i) === name) || null;
  return namen.map(name => ({ n: name, links: finde(links, name), rechts: finde(rechts, name) }));
}

/** Eine Zelle des Vergleichs: Stücke als ins/del, Gleiches als Text. */
function vergleichZelle(stuecke, seite){
  const zelle = document.createElement("div");
  zelle.className = "vergleich-zelle";
  for (const s of stuecke){
    if (s.art === "gleich"){ zelle.appendChild(document.createTextNode(s.text)); continue; }
    if (s.art === "weg" && seite !== "links") continue;
    if (s.art === "neu" && seite !== "rechts") continue;
    const marke = document.createElement(s.art === "weg" ? "del" : "ins");
    marke.className = s.art === "weg" ? "v-weg" : "v-neu";
    marke.textContent = s.text;
    zelle.appendChild(marke);
  }
  return zelle;
}

function vergleichZeichnen(){
  const haupt = el("haupt");
  haupt.innerHTML = "";
  const gesetz = S.gesetz;
  const norm = gesetz.normen.find(n => n.id === S.normId) || gesetz.normen[0];
  const alle = fassungenDerNorm();

  const druckkopf = document.createElement("div");
  druckkopf.className = "druckkopf";
  const dk1 = document.createElement("span"); dk1.textContent = "steuernorm";
  const dk2 = document.createElement("span");
  dk2.textContent = gesetz.abk + " · " + norm.enbez + " · Fassungsvergleich";
  druckkopf.append(dk1, dk2);
  haupt.appendChild(druckkopf);

  const krume = document.createElement("div");
  krume.className = "brotkrume";
  for (const stueck of [gesetz.abk.toUpperCase(), "›", norm.enbez, "›", "Fassungen"]){
    const s = document.createElement("span");
    s.textContent = stueck;
    krume.appendChild(s);
  }
  haupt.appendChild(krume);

  const h1 = document.createElement("h1");
  h1.appendChild(document.createTextNode(norm.enbez + " "));
  if (norm.titel){
    const t = document.createElement("span");
    t.className = "titel";
    t.textContent = norm.titel;
    h1.appendChild(t);
  }
  haupt.appendChild(h1);

  /* Weniger als zwei Fassungen: Es gibt nichts zu vergleichen, und das wird
     gesagt — samt der Datei, in der der zweite Stand stünde. */
  if (alle.length < 2){
    const kasten = document.createElement("div");
    kasten.className = "melder";
    const stark = document.createElement("strong");
    stark.textContent = "Von dieser Norm liegt nur ein Zeitstand vor.";
    const p = document.createElement("p");
    p.textContent = "Ein zweiter stünde in fassungen/"
      + gesetz.abk.toLowerCase() + ".json. Der Bestand kennt bisher nur den "
      + "geltenden Wortlaut; frühere Fassungen entstehen erst, wenn sich der "
      + "Text zwischen zwei Abrufen ändert.";
    kasten.append(stark, p);
    const zurueck = knopf("", "Zum Normtext");
    zurueck.onclick = () => { location.hash = "#/" + gesetz.abk.toLowerCase() + "/" + norm.id; };
    kasten.appendChild(zurueck);
    haupt.appendChild(kasten);
    reiterZeichnen();
    return;
  }

  /* Voreinstellung: die beiden jüngsten. Links steht immer die ältere.
     Die Wahl gilt für diese Norm; bei einer anderen fängt sie von vorn an,
     denn Datumsangaben können sich zwischen Normen zufällig gleichen. */
  const kennung = S.abk + "/" + norm.id;
  if (!S.vergleich || S.vergleich.norm !== kennung
      || !alle.some(f => f.id === S.vergleich.links)
      || !alle.some(f => f.id === S.vergleich.rechts)){
    S.vergleich = { norm: kennung, links: alle[1].id, rechts: alle[0].id };
  }
  const linksF = fassungWortlaut(alle.find(f => f.id === S.vergleich.links));
  const rechtsF = fassungWortlaut(alle.find(f => f.id === S.vergleich.rechts));

  /* Wählleiste */
  const leiste = document.createElement("div");
  leiste.className = "vergleich-leiste";
  const waehler = (seite) => {
    const w = document.createElement("select");
    w.className = "vergleich-wahl";
    w.setAttribute("aria-label", seite === "links" ? "Ältere Fassung" : "Jüngere Fassung");
    for (const f of alle){
      const o = document.createElement("option");
      o.value = f.id;
      o.textContent = f.abgerufen + (f.aktuell ? " · geltend" : "");
      o.selected = f.id === S.vergleich[seite];
      w.appendChild(o);
    }
    w.onchange = () => { S.vergleich = { ...S.vergleich, [seite]: w.value }; vergleichZeichnen(); };
    return w;
  };
  const gegen = document.createElement("span");
  gegen.className = "vergleich-gegen";
  gegen.textContent = "gegen";
  const zurueck = knopf("vergleich-zurueck", "Zum Normtext");
  zurueck.onclick = () => { location.hash = "#/" + gesetz.abk.toLowerCase() + "/" + norm.id; };
  leiste.append(waehler("links"), gegen, waehler("rechts"), zurueck);
  haupt.appendChild(leiste);

  /* Legende und Kennzeichnung des Maschinellen */
  const legende = document.createElement("div");
  legende.className = "vergleich-legende";
  for (const [klasse, name] of [["v-weg", "entfallen"], ["v-neu", "neu"]]){
    const marke = document.createElement("span");
    marke.className = "vergleich-marke " + klasse;
    marke.textContent = name;
    legende.appendChild(marke);
  }
  const hinweis = document.createElement("span");
  hinweis.className = "vergleich-hinweis";
  hinweis.textContent = "Wortvergleich maschinell erzeugt, nicht redaktionell geprüft";
  legende.appendChild(hinweis);
  haupt.appendChild(legende);

  /* Spaltenköpfe. Sie kleben, damit auch weit unten klar ist, welche Spalte
     welche Fassung zeigt. */
  const raster = document.createElement("div");
  raster.className = "vergleich-raster";
  for (const [seite, f] of [["links", linksF], ["rechts", rechtsF]]){
    const kopf = document.createElement("div");
    kopf.className = "vergleich-kopf " + seite;
    const datum = document.createElement("span");
    datum.className = "mono-etikett";
    datum.textContent = "Abgerufen " + f.abgerufen + (f.aktuell ? " · geltend" : "");
    const stand = document.createElement("span");
    stand.className = "vergleich-stand";
    // Maßgeblich ist die amtliche Standangabe, nicht das Abrufdatum.
    stand.textContent = f.stand || "ohne Standangabe";
    kopf.append(datum, stand);
    raster.appendChild(kopf);
  }

  /* Überschrift, Absätze, Fußnote — in dieser Reihenfolge. */
  const reihen = [];
  if ((linksF.titel || "") !== (rechtsF.titel || "")){
    reihen.push({ n: "Überschrift", links: linksF.titel || "", rechts: rechtsF.titel || "" });
  }
  for (const paar of absatzpaare(linksF, rechtsF)){
    reihen.push({
      n: "(" + paar.n + ")",
      links: paar.links ? textAusHtml(paar.links.html) : "",
      rechts: paar.rechts ? textAusHtml(paar.rechts.html) : "",
      fehltLinks: !paar.links,
      fehltRechts: !paar.rechts,
    });
  }
  if ((linksF.fussnote || "") !== (rechtsF.fussnote || "")){
    reihen.push({ n: "Fußnote", links: linksF.fussnote || "", rechts: rechtsF.fussnote || "" });
  }

  let geaendert = 0;
  for (const reihe of reihen){
    const stuecke = wortvergleich(reihe.links, reihe.rechts);
    const gleich = stuecke.every(s => s.art === "gleich");
    if (!gleich) geaendert++;

    for (const seite of ["links", "rechts"]){
      const zelle = vergleichZelle(stuecke, seite);
      zelle.classList.add(seite);
      if (!gleich) zelle.classList.add("geaendert");
      const marke = document.createElement("span");
      marke.className = "vergleich-nummer";
      marke.textContent = reihe.n;
      zelle.prepend(marke);
      /* Eine leere Seite bleibt nicht leer stehen. Ohne den Satz sähe eine
         neu hinzugekommene Fußnote links wie ein Anzeigefehler aus. */
      const fehlt = seite === "links"
        ? (reihe.fehltLinks || !reihe.links)
        : (reihe.fehltRechts || !reihe.rechts);
      if (fehlt){
        zelle.classList.add("fehlt");
        const leer = document.createElement("em");
        leer.textContent = "In dieser Fassung nicht enthalten.";
        zelle.appendChild(leer);
      }
      raster.appendChild(zelle);
    }
  }
  haupt.appendChild(raster);

  const bilanz = document.createElement("p");
  bilanz.className = "vergleich-bilanz";
  bilanz.textContent = geaendert === 0
    ? "Kein Unterschied im Wortlaut. Die beiden Zeitstände unterscheiden sich "
      + "nur in Angaben außerhalb des Textes."
    : geaendert + (geaendert === 1 ? " Abschnitt weicht ab." : " Abschnitte weichen ab.")
      + " Maßgeblich ist allein der im Bundesgesetzblatt verkündete Wortlaut.";
  haupt.appendChild(bilanz);

  const quelle = document.createElement("p");
  quelle.className = "vergleich-quelle";
  const datei = S.fassungen[S.abk];
  quelle.textContent = (datei && datei.hinweis) || "";
  if (quelle.textContent) haupt.appendChild(quelle);

  reiterZeichnen();
  document.title = norm.enbez + " " + gesetz.abk + " — Fassungsvergleich · steuernorm";
}

/**
 * Zustand des Knopfes „Vergleichen".
 *
 * Kein Knopf ohne Funktion: Wo es nur einen Zeitstand gibt, bleibt er gesperrt
 * und sagt im Titel, woran es liegt — statt eine leere Ansicht zu öffnen.
 */
function vergleichKnopfSetzen(){
  const k = el("knopf-vergleichen");
  if (!k) return;
  const norm = document.body.dataset.ansicht === "norm"
    || document.body.dataset.ansicht === "vergleich";
  const zahl = norm ? fassungenDerNorm().length : 0;
  k.disabled = zahl < 2;
  k.title = !norm
    ? "Fassungsvergleich — erst mit geöffneter Norm."
    : zahl < 2
      ? "Von dieser Norm liegt nur ein Zeitstand vor (fassungen/"
        + String(S.abk).toLowerCase() + ".json)."
      : zahl + " Zeitstände dieser Norm vergleichen";
  k.onclick = () => {
    location.hash = "#/" + String(S.abk).toLowerCase() + "/" + S.normId + "/fassungen";
  };
}

/* ══════════════════════════════════════════════════════════════════════
   Verweise im Normtext

   „§ 15 Abs. 2 EStG" wird anklickbar. Das ist die Arbeitsweise, die eine
   Gesetzessammlung ausmacht: Jede Norm hängt an den anderen. Der Wortlaut
   bleibt dabei unangetastet — es wird ausschließlich umschlossen, nie
   ergänzt, gekürzt oder umgestellt.
   ══════════════════════════════════════════════════════════════════════ */
/**
 * Verweismuster.
 *
 * Erfasst wird die Paragrafennummer, ein etwaiger Absatz- und Satzzusatz und
 * das Zielgesetz — als Kürzel („§ 32d EStG") ODER als ausgeschriebener Name.
 *
 * Der ausgeschriebene Name ist der Regelfall im Gesetzestext: Das SolzG
 * verweist auf „§ 43b DES EINKOMMENSTEUERGESETZES", nie auf „§ 43b EStG".
 * Wer nur nach Kürzeln sucht, hält diese Verweise für Verweise auf das eigene
 * Gesetz und verlinkt § 43b SolzG — eine Norm, die es nicht gibt.
 */
function verweisMuster(){
  const kuerzel = S.register.gesetze
    .map(g => g.abk.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
    .join("|");
  // Genitiv und Nominativ des Volltitels: „des Einkommensteuergesetzes",
  // „das Umsatzsteuergesetz". Der Titel kommt aus dem Register, nicht aus
  // einer eigenen Liste.
  const titel = S.register.gesetze
    .map(g => g.titel.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?:es|s)?")
    .join("|");
  return new RegExp(
    "§+\\s?(\\d+[a-z]?)"
    + "((?:\\s?Abs(?:atz|\\.)\\s?\\d+[a-z]?)?(?:\\s?(?:Satz|S\\.|Nummer|Nr\\.)\\s?\\d+)?)"
    + "(?:\\s(?:(" + kuerzel + ")\\b|(?:des|der|dem|das|die)\\s+(" + titel + ")))?",
    "g",
  );
}

/** Kürzel zum ausgeschriebenen Gesetzesnamen — über das Register, nicht geraten. */
function abkAusTitel(name){
  const rein = String(name).replace(/(?:es|s)$/, "");
  const treffer = S.register.gesetze.find(g => g.titel === rein || g.titel === name);
  return treffer ? treffer.abk : null;
}

/** Gibt es die Norm im Zielgesetz überhaupt? */
function normVorhanden(abk, nr){
  const eintrag = registerEintrag(abk);
  if (!eintrag || !Array.isArray(eintrag.normen)) return false;
  return eintrag.normen.some(n => String(n.id).toLowerCase() === String(nr).toLowerCase());
}

function verweiseSetzen(wurzel, eigenesAbk){
  const muster = verweisMuster();

  const gehe = document.createTreeWalker(wurzel, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => n.parentElement.closest("a") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const ziele = [];
  let n;
  while ((n = gehe.nextNode())) if (n.nodeValue.includes("§")) ziele.push(n);

  for (const knoten of ziele){
    const roh = knoten.nodeValue;
    muster.lastIndex = 0;
    const teil = document.createDocumentFragment();
    let letzte = 0, treffer;

    while ((treffer = muster.exec(roh)) !== null){
      if (muster.lastIndex <= treffer.index) muster.lastIndex = treffer.index + 1;

      const abk = (treffer[3] || "").trim()
        || (treffer[4] ? abkAusTitel(treffer[4].trim()) : null)
        || eigenesAbk;

      /* Kein Verweis ins Leere. Fehlt das Gesetz oder die Norm im Bestand,
         bleibt die Stelle unverlinkter Wortlaut — sichtbar unverändert, aber
         ohne Klick auf eine Seite, die es nicht gibt. */
      if (!normVorhanden(abk, treffer[1])) continue;

      /* Nur die Paragrafenangabe wird zum Verweis, nicht der nachgestellte
         Gesetzesname: „§ 43b" ist der Anker, „des Einkommensteuergesetzes"
         bleibt Fließtext. */
      const ankerLaenge = treffer[1].length + (treffer[2] || "").length
        + (treffer[0].indexOf(treffer[1]));
      const anker = treffer[0].slice(0, ankerLaenge);

      if (treffer.index > letzte) teil.appendChild(document.createTextNode(roh.slice(letzte, treffer.index)));
      const a = document.createElement("a");
      a.className = "verweis";
      a.href = "#/" + abk.toLowerCase() + "/" + treffer[1].toLowerCase();
      a.dataset.ziel = abk + " § " + treffer[1];   // für die Druckfassung
      a.textContent = anker;                        // wörtlich wie im Gesetz
      teil.appendChild(a);
      letzte = treffer.index + anker.length;
    }

    if (!letzte) continue;
    if (letzte < roh.length) teil.appendChild(document.createTextNode(roh.slice(letzte)));
    knoten.parentNode.replaceChild(teil, knoten);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   Mittelspalte

   Schritt 1 zeigt Kopf, Absatzrinne und den Wortlaut ohne jede Zutat.
   Einfärbung, eigene Markierungen und Verwaltungsstellen folgen in den
   Schritten 4 bis 6. Der Wortlaut wird dabei nie verändert.
   ══════════════════════════════════════════════════════════════════════ */
function hauptZeichnen(){
  const haupt = el("haupt");
  haupt.innerHTML = "";
  const gesetz = S.gesetz;
  const norm = gesetz.normen.find(n => n.id === S.normId) || gesetz.normen[0];
  S.normId = norm.id;

  /* Kopf- und Fußzeile der Druckfassung. Am Bildschirm unsichtbar. */
  const druckkopf = document.createElement("div");
  druckkopf.className = "druckkopf";
  const dk1 = document.createElement("span"); dk1.textContent = "steuernorm";
  const dk2 = document.createElement("span");
  dk2.textContent = gesetz.abk + " · " + norm.enbez;
  druckkopf.append(dk1, dk2);
  haupt.appendChild(druckkopf);

  /* Brotkrume */
  const krume = document.createElement("div");
  krume.className = "brotkrume";
  for (const stueck of [gesetz.abk.toUpperCase(), "›", norm.enbez]){
    const s = document.createElement("span");
    s.textContent = stueck;
    krume.appendChild(s);
  }
  haupt.appendChild(krume);

  /* Überschrift */
  const h1 = document.createElement("h1");
  h1.appendChild(document.createTextNode(norm.enbez + " "));
  if (norm.titel){
    const t = document.createElement("span");
    t.className = "titel";
    t.textContent = norm.titel;
    h1.appendChild(t);
  }
  haupt.appendChild(h1);

  /* Metazeile */
  const meta = document.createElement("div");
  meta.className = "meta";
  const fassung = fassungAus(gesetz);
  if (fassung){
    const e1 = document.createElement("span");
    e1.className = "etikett gefuellt";
    e1.textContent = "Fassung " + fassung;
    meta.appendChild(e1);
  }
  const anm = S.anmerkungen[S.abk] ? S.anmerkungen[S.abk][norm.id] : null;
  const e2 = document.createElement("span");
  e2.className = "etikett";
  // Der Status kommt aus annotations/; fehlt die Datei, wird das gesagt.
  e2.textContent = "Struktur: " + (anm && anm.status
    ? (STATUSNAME[anm.status] || anm.status)
    : "kein Datensatz");
  meta.appendChild(e2);
  const e3 = document.createElement("span");
  e3.textContent = "automatisch erzeugt, nicht redaktionell geprüft";
  meta.appendChild(e3);
  haupt.appendChild(meta);

  /* Leseraum: Absatzrinne und Lesespalte */
  const leseraum = document.createElement("div");
  leseraum.className = "leseraum";

  const rinne = document.createElement("div");
  rinne.className = "rinne";
  const lese = document.createElement("div");
  lese.className = "lesespalte";

  const marken = [];
  for (const abs of norm.abs){
    const block = document.createElement("div");
    block.className = "absatz";
    // Der Wortlaut kommt unverändert aus data/. Es wird nichts eingefügt.
    block.innerHTML = abs.html;

    /* Die Absatzbezeichnung steht im Text, wie bei dejure und lxgesetze.
       Sie ist keine Ergänzung zum Wortlaut, sondern seine amtliche Adresse —
       sie steht in `data/` als `abs.n` und wurde bisher nur in der Rinne
       gezeigt, wo sie beim Lesen niemand sucht.

       ZWEI DINGE MÜSSEN DABEI STIMMEN. Erstens darf sie nicht in den
       kanonischen Volltext geraten: Die Struktur-Einfärbung rechnet in
       Zeichenpositionen, und drei zusätzliche Zeichen je Absatz verschöben
       jede Farbe. `textindex` blendet `.an` deshalb aus, genau wie die
       Satznummern. Zweitens trägt sie `user-select:none`, damit sie beim
       Markieren und Kopieren nicht im Wortlaut landet. */
    if (abs.n){
      const marke = document.createElement("span");
      marke.className = "an";
      marke.textContent = "(" + abs.n + ")";
      const erstes = block.firstElementChild;
      if (erstes && erstes.tagName === "P") erstes.prepend(marke);
      else block.prepend(marke);
    }

    lese.appendChild(block);
    if (abs.n) marken.push({ text: "(" + abs.n + ")", knoten: block });
  }

  /* Satznummern VOR der Einfärbung. Sie sind — wie die Absatzbezeichnung —
     aus dem kanonischen Volltext ausgeblendet; die Zeichenpositionen der
     Struktur bleiben deshalb unberührt, ganz gleich in welcher Reihenfolge. */
  satznummernSetzen(lese, saetzeDerNorm());

  /* Struktur-Einfärbung VOR den Verweisen: Sie rechnet auf dem kanonischen
     Volltext, und der darf zu diesem Zeitpunkt noch keine eingefügten
     Verweis-Elemente enthalten — Zeichen bleiben dieselben, aber die
     Knotengrenzen verschöben sich unnötig. */
  const stand = strukturSetzen(S.strukturModus, true);
  const segmente = strukturDerNorm();
  const spannen = [];

  if (stand.moeglich){
    for (const seg of segmente){
      spannen.push({
        von: seg.von,
        bis: seg.bis,
        klasse: "s s-" + seg.typ,
        schluessel: "s" + seg.von + "-" + seg.bis,
        titel: BESCHREIBUNG[seg.typ] || "",
        datensatz: seg.pfad ? { pfad: seg.pfad } : null,
      });
    }
  }

  /* Eigene Markierungen liegen ÜBER der Struktur, aber sie löschen sie nicht:
     spannenLegen führt je Zeichen eine Liste, beide Klassen bleiben stehen. */
  const { text: kanonisch } = textindex(lese);
  let verschoben = 0;
  for (const m of markierungenDerNorm()){
    const von = markierungVerorten(kanonisch, m);
    if (von === -1){ verschoben++; continue; }
    spannen.push({
      von,
      bis: von + m.anker.length,
      klasse: "eigen" + (S.aktiveMarkierung === m.id ? " gewaehlt" : ""),
      schluessel: "m" + m.id,
      titel: m.notiz || "Eigene Markierung",
      datensatz: { eigen: m.id },
      stil: `background:${hexZuRgba(m.farbe, eigenDeckkraft())};border-bottom:2px solid ${m.farbe};`,
    });
  }

  /* Verwaltungsstellen: Punktlinie, darunter bleibt alles sichtbar. */
  const stellen = verwaltungDerNorm();
  let vwOhneStelle = 0;
  for (const v of stellen){
    const von = markierungVerorten(kanonisch, { anker: v.anker, praefix: v.praefix });
    if (von === -1){ vwOhneStelle++; continue; }
    spannen.push({
      von,
      bis: von + v.anker.length,
      klasse: "vw" + (S.aktiveVerwaltung === v.id ? " gewaehlt" : ""),
      schluessel: "v" + v.id,
      titel: [v.quelle, v.fundstelle].filter(Boolean).join(" · "),
      datensatz: { vw: v.id },
    });
  }

  const verwaist = spannenLegen(lese, spannen);
  chipsSetzen(lese, stellen);

  /* Verweise anklickbar machen — nach dem Einsetzen des Wortlauts, damit die
     amtliche Auszeichnung unberührt bleibt. */
  verweiseSetzen(lese, gesetz.abk);

  // Die Rinne trägt nur Marken, wenn die Norm nummerierte Absätze hat.
  for (const [i, marke] of marken.entries()){
    const b = knopf("", marke.text);
    b.setAttribute("aria-current", String(i === 0));
    b.onclick = () => {
      marke.knoten.scrollIntoView({ block: "start", behavior: "smooth" });
      rinneSetzen(rinne, i);
    };
    rinne.appendChild(b);
  }

  const spalte = document.createElement("div");
  spalte.className = "lesespalte-huelle";
  spalte.append(legendeBauen(stand, segmente), lese);
  leseraum.append(rinne, spalte);
  haupt.appendChild(leseraum);

  if (vwOhneStelle){
    const w = fehlmeldung(
      "Verwaltungsstellen",
      vwOhneStelle + " Verwaltungsstelle(n) finden ihren Ankertext nicht im Normtext."
      + " Der Datensatz gehört gegen die geltende Fassung geprüft.",
      "verwaltung/" + S.abk.toLowerCase() + ".json",
    );
    w.style.maxWidth = "var(--lesespalte)";
    w.style.marginTop = "18px";
    spalte.appendChild(w);
  }

  if (verschoben){
    const w = fehlmeldung(
      "Eigene Markierungen",
      verschoben + " Markierung(en) finden ihre Textstelle nicht mehr. Der Gesetzestext"
      + " hat sich geändert; im Register „Markierungen“ stehen sie weiterhin.",
    );
    w.style.maxWidth = "var(--lesespalte)";
    w.style.marginTop = "18px";
    spalte.appendChild(w);
  }

  if (verwaist){
    const warnung = fehlmeldung(
      "Markierung",
      verwaist + " Segment(e) finden ihre Textstelle nicht. Der Gesetzestext wurde"
      + " vermutlich geändert; der Strukturdatensatz gehört nachgezogen.",
      "struktur/" + S.abk.toLowerCase() + ".json",
    );
    warnung.style.maxWidth = "var(--lesespalte)";
