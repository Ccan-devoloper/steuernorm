    warnung.style.marginTop = "18px";
    spalte.appendChild(warnung);
  }

  /* Klick auf eine eigene Markierung öffnet das Register und wählt die Karte;
     erneuter Klick hebt die Auswahl wieder auf. */
  lese.addEventListener("click", (e) => {
    const marke = e.target.closest(".eigen[data-eigen]");
    if (!marke) return;
    e.preventDefault();
    const id = marke.dataset.eigen;
    const schonAktiv = S.aktiveMarkierung === id;
    S.aktiveMarkierung = schonAktiv ? null : id;
    S.apparatRegister = "markierungen";
    hauptZeichnen();
    apparatZeichnen();
    if (schonAktiv){ popoverSchliessen(); return; }
    const neuerKnoten = document.querySelector('.eigen[data-eigen="' + id + '"]');
    if (neuerKnoten) popoverOeffnen(id, neuerKnoten);
  });

  /* Klick auf Punktlinie oder Chip öffnet das Register „Verwaltung“. */
  lese.addEventListener("click", (e) => {
    const stelle = e.target.closest("[data-vw]");
    if (!stelle) return;
    e.preventDefault();
    const id = stelle.dataset.vw;
    S.aktiveVerwaltung = S.aktiveVerwaltung === id ? null : id;
    S.apparatRegister = "verwaltung";
    hauptZeichnen();
    apparatZeichnen();
  });

  /* Auf schmalen Fenstern führt eine Zeile in den Apparat — mit den Zahlen,
     die tatsächlich dahinter stehen. */
  haupt.appendChild(blattgriffBauen());

  rinneMitlaufen(rinne, marken);
  haupt.appendChild(blaetternBauen(gesetz, norm));
  const druckfuss = document.createElement("p");
  druckfuss.className = "druckfuss";
  const heute = new Date().toLocaleDateString("de-DE");
  druckfuss.textContent = location.href
    + " · abgerufen am " + heute
    + " · Quelle: Gesetze im Internet (BMJ/BfJ)"
    + " · Struktur maschinell erkannt, nicht redaktionell geprüft."
    + " Maßgeblich ist die im Bundesgesetzblatt verkündete Fassung.";
  haupt.appendChild(druckfuss);

  werkzeugleisteBauen();

  document.title = norm.enbez + " " + gesetz.abk + (norm.titel ? " — " + norm.titel : "") + " · steuernorm";
}

function legendeBauen(stand, segmente){

      : "Für diese Norm wurde keine Struktur erkannt — der Wortlaut steht ohne Einfärbung.";

    ? "Struktur ausgeblendet — reiner Wortlaut."
    : "Einfärbung maschinell erkannt, nicht redaktionell geprüft.";
  d.appendChild(anmerkung);

  return d;
}

/**
 * Werkzeugleiste am Fuß der Mobilansicht.
 * Sie spiegelt die Kopfschalter, die dort keinen Platz haben.
 */
function werkzeugleisteBauen(){
  const leiste = el("werkzeugleiste");
  leiste.innerHTML = "";
  const teile = [];

  /* Einfärben und Apparat gibt es nur, wo ein Normtext liegt. Mappe und
     Gesetze stehen in jeder Ansicht — auf dem Telefon ist die Kopfzeile der
     Knöpfe ausgeblendet, die Leiste ist dort der einzige Weg zur Mappe. */
  if (document.body.dataset.ansicht === "norm"){
    const stand = strukturSetzen(S.strukturModus, true);
    const STUFEN = ["aus", "dezent", "voll"];
    const einfaerben = knopf("pille", "Einfärben: " + stand.angezeigt);
    einfaerben.disabled = !stand.moeglich;
    if (!stand.moeglich) einfaerben.title = "Für diese Norm liegt kein Strukturdatensatz vor.";
    einfaerben.onclick = () => {
      const naechste = STUFEN[(STUFEN.indexOf(S.strukturModus) + 1) % STUFEN.length];
      strukturSetzen(naechste);
      hauptZeichnen();
    };

    const apparat = knopf("pille", "Apparat");
    apparat.onclick = () => blattSetzen(true);
    teile.push(einfaerben, apparat);
  }

  /* „Fassungen" nur, wo es mehr als einen Zeitstand gibt — sonst gar nicht.
     Ein gesperrter Schalter kostet auf 390 px Platz, den er nicht wert ist. */
  if ((document.body.dataset.ansicht === "norm" && fassungenDerNorm().length >= 2)
      || document.body.dataset.ansicht === "vergleich"){
    const vergleich = knopf("pille",
      document.body.dataset.ansicht === "vergleich" ? "Normtext" : "Fassungen");
    vergleich.onclick = () => {
      location.hash = document.body.dataset.ansicht === "vergleich"
        ? "#/" + String(S.abk).toLowerCase() + "/" + S.normId
        : "#/" + String(S.abk).toLowerCase() + "/" + S.normId + "/fassungen";
    };
    teile.push(vergleich);
  }

  const mappe = knopf("pille", "Mappe");
  mappe.id = "leiste-mappe";
  mappe.onclick = (e) => { e.stopPropagation(); mappeUmschalten(); };

  const start = knopf("pille", "Gesetze");
  start.onclick = () => { location.hash = "#/"; };

  teile.push(mappe, start);
  leiste.append(...teile);
}

/** Genau eine Marke der Rinne ist die aktuelle. */
function rinneSetzen(rinne, index){
  [...rinne.children].forEach((b, i) => b.setAttribute("aria-current", String(i === index)));
}

/**
 * Die Absatzmarke läuft beim Lesen mit.
 *
 * Ohne das ist die Rinne eine Sprungliste, die nie sagt, wo man gerade ist.
 * Der Beobachter meldet den Absatz, der das obere Drittel des Fensters füllt.
 */
function rinneMitlaufen(rinne, marken){
  if (!marken.length || !("IntersectionObserver" in window)) return;
  const wache = new IntersectionObserver((eintraege) => {
    for (const e of eintraege){
      if (!e.isIntersecting) continue;
      const index = marken.findIndex(m => m.knoten === e.target);
      if (index >= 0) rinneSetzen(rinne, index);
    }
  }, { rootMargin: "-15% 0px -70% 0px" });
  for (const m of marken) wache.observe(m.knoten);
}

/** Blättern zur vorigen und nächsten Norm desselben Gesetzes. */
function blaetternBauen(gesetz, norm){
  const nav = document.createElement("nav");
  nav.className = "blaettern";
  nav.setAttribute("aria-label", "Benachbarte Normen");
  const stelle = gesetz.normen.indexOf(norm);

  const mach = (ziel, richtung) => {
    const b = knopf("");
    if (!ziel){ b.style.visibility = "hidden"; b.setAttribute("aria-hidden", "true"); return b; }
    const r = document.createElement("span");
    r.className = "richtung";
    r.textContent = richtung;
    const w = document.createElement("span");
    w.className = "wohin";
    w.textContent = ziel.enbez + (ziel.titel ? " " + ziel.titel : "");
    b.append(r, w);
    b.onclick = () => { location.hash = "#/" + gesetz.abk.toLowerCase() + "/" + ziel.id; };
    return b;
  };

  nav.append(mach(gesetz.normen[stelle - 1], "zurück"), mach(gesetz.normen[stelle + 1], "weiter"));
  return nav;
}

  + "Maßgeblich ist die im Bundesgesetzblatt verkündete Fassung.";

/**
 * Bedienelemente der Handbuchseite, die beim Abruf mitgelesen wurden.
 *
 * 728 der 1 005 Verwaltungsauszüge im Bestand (72 %) beginnen mit
 * „aufklappen Zuklappen" — das sind die Schaltflächen der BMF-Seite, nicht der
 * Wortlaut der Richtlinie. Sie stehen am Anfang jedes Auszugs und lassen ihn
 * so aussehen, als begänne die Richtlinie damit.
 *
 * Entfernt wird ausschließlich diese Seitenmöblierung am Anfang. Der amtliche
 * Wortlaut selbst bleibt unangetastet; das Änderungsverbot des BMF
 * (§ 14 UrhG) ist damit gewahrt — es wird nichts am Werk geändert, sondern
 * etwas entfernt, das nie zum Werk gehörte.
 *
 * Der Bestand in belege/ bleibt unverändert; die Bereinigung findet in der
 * Anzeige statt.
 */
const SEITENMOEBEL = /^(?:\s*(?:auf|zu)klappen\b[\s.:–-]*)+/i;

/** Kürzt einen Belegauszug auf Satzgrenze — Auszüge werden nie umgeschrieben. */
function aufSatzgrenze(text, grenze = 340){
  const roh = String(text || "").replace(SEITENMOEBEL, "").replace(/\s+/g, " ").trim();
  if (roh.length <= grenze) return roh;
  const stueck = roh.slice(0, grenze);
  const punkt = Math.max(stueck.lastIndexOf(". "), stueck.lastIndexOf("; "));
  return (punkt > 80 ? stueck.slice(0, punkt + 1) : stueck) + " …";
}

/* ══════════════════════════════════════════════════════════════════════
   Register „Hinweise"

   Gespeist wird ausschließlich aus dem Bestand: annotations/ liefert das
   Verfahren und seinen Status, belege/ die Verwaltungs- und
   Rechtsprechungsnachweise.

   Was der Entwurf zusätzlich zeigt — redaktionelle Anmerkungen je Absatz
   („Zu Absatz 1: Sechs Anknüpfungen …") —, gibt es im Repository nicht. Diese
   Sätze sind Entwurfstext, keine Daten. Sie werden deshalb NICHT abgetippt,
   sondern als fehlender Datensatz ausgewiesen.
   ══════════════════════════════════════════════════════════════════════ */
function hinweiseBauen(){
  const raus = document.createDocumentFragment();
  const anm = S.anmerkungen[S.abk] ? S.anmerkungen[S.abk][S.normId] : null;
  const belegDatei = S.belege[S.abk] || null;
  const beleg = belegDatei && belegDatei.normen ? belegDatei.normen[S.normId] : null;

  /* ── Redaktionelle Anmerkungen: nicht vorhanden ── */
  raus.appendChild(fehlmeldung(
    "Anmerkungen zu den Absätzen",
    "Für diese Norm liegen keine redaktionellen Anmerkungen vor. "
    + "Es werden keine erzeugt — was hier stünde, müsste geschrieben und geprüft sein.",
    "annotations/" + S.abk.toLowerCase() + ".json",
  ));

  /* ── Verwaltung ── */
  const verwaltung = (beleg && beleg.verwaltung) || [];
  if (verwaltung.length){
    for (const v of verwaltung.slice(0, 4)){
      const b = block("Verwaltung");
      const kopf = document.createElement("span");
      kopf.className = "fundstelle";
      if (v.quelle){
        const q = document.createElement("span");
        q.className = "quelle";
        q.textContent = v.quelle;
        kopf.appendChild(q);
      }
      kopf.appendChild(document.createTextNode(v.fundstelle || ""));
      b.appendChild(kopf);
      if (v.text){
        const p = document.createElement("p");
        p.textContent = aufSatzgrenze(v.text);
        b.appendChild(p);
      }
      if (v.url){
        const p = document.createElement("p");
        const a = document.createElement("a");
        a.href = v.url; a.target = "_blank"; a.rel = "noopener";
        a.textContent = "amtliche Fundstelle ↗";
        p.appendChild(a);
        b.appendChild(p);
      }
      raus.appendChild(b);
    }
  } else {
    const b = block("Verwaltung");
    const p = document.createElement("p");
    p.className = "fehlt";
    // Der Satz stammt aus belege/<gesetz>.json, er ist Bestand — nicht erfunden.
    p.textContent = (belegDatei && belegDatei.hinweis)
      || "Keine Verwaltungsanweisung zu dieser Norm im Bestand.";
    b.appendChild(p);
    raus.appendChild(b);
  }

  /* ── Rechtsprechung ── */
  const rechtsprechung = (beleg && beleg.rechtsprechung) || [];
  if (rechtsprechung.length){
    const b = block("Rechtsprechung");
    for (const e of rechtsprechung.slice(0, 5)){
      const p = document.createElement("p");
      const bezeichnung = [e.gericht, e.az, e.datum].filter(Boolean).join(" · ");
      if (e.url){
        const a = document.createElement("a");
        a.href = e.url; a.target = "_blank"; a.rel = "noopener";
        a.textContent = bezeichnung || "Entscheidung";
        p.appendChild(a);
      } else {
        p.textContent = bezeichnung || "Entscheidung";
      }
      b.appendChild(p);
    }
    raus.appendChild(b);
  } else {
    const b = block("Rechtsprechung");
    const p = document.createElement("p");
    p.className = "fehlt";
    p.textContent = "Keine Entscheidung zu dieser Norm im Bestand.";
    b.appendChild(p);
    raus.appendChild(b);
  }

  /* ── Verfahren: wie die maschinellen Zutaten zustande kamen ── */
  if (anm){
    const b = block("Verfahren");
    const p = document.createElement("p");
    p.textContent = anm.hinweis || "";
    b.appendChild(p);
    const teile = [];
    if (anm.status) teile.push("Status: " + STATUSNAME[anm.status] || anm.status);
    if (typeof anm.konfidenz === "number") teile.push("mittlere Konfidenz " + anm.konfidenz.toFixed(2));
    if (anm.laeufe) teile.push(anm.laeufe + " Modellläufe");
    if (teile.length){
      const q = document.createElement("p");
      q.className = "fehlt";
      q.textContent = teile.join(" · ");
      b.appendChild(q);
    }
    raus.appendChild(b);
  }

  raus.appendChild(haftungssatz());
  return raus;
}

const STATUSNAME = {
  belegt: "amtlich gestützt",
  konsens: "Modellkonsens",
  mehrheit: "mehrheitlich",
  uneinheitlich: "uneinheitlich",
  syntaktisch: "nur Syntaxanalyse",
  ohne_merkmale: "ohne Markierung",
};

/* ══════════════════════════════════════════════════════════════════════
   Register „Markierungen"
   ══════════════════════════════════════════════════════════════════════ */
function markierungenBauen(){
  const raus = document.createDocumentFragment();
  const eigene = markierungenDerNorm();

  if (!eigene.length){
    const p = document.createElement("p");
    p.className = "platzhalter";
    p.textContent = "Noch keine eigene Markierung in dieser Norm. "
      + "Stelle im Text auswählen, dann Farbe wählen.";
    raus.appendChild(p);
    raus.appendChild(markierungsFuss());
    return raus;
  }

  const lese = document.querySelector(".lesespalte");
  const kanonisch = lese ? textindex(lese).text : "";

  for (const m of eigene){
    const aktiv = S.aktiveMarkierung === m.id;
    const karte = document.createElement("div");
    karte.className = "karte" + (aktiv ? " aktiv" : "");
    karte.style.borderLeftColor = aktiv ? m.farbe : "";
    karte.tabIndex = 0;
    karte.setAttribute("role", "button");
    karte.setAttribute("aria-expanded", String(aktiv));

    const kopf = document.createElement("div");
    kopf.className = "karte-kopf";
    const punkt = document.createElement("span");
    punkt.className = "karte-punkt";
    punkt.style.background = hexZuRgba(m.farbe, eigenDeckkraft());
    punkt.style.boxShadow = "inset 0 0 0 1px " + m.farbe;
    const fund = document.createElement("span");
    fund.className = "karte-fundstelle";
    fund.textContent = m.fundstelle || "ohne Fundstelle";
    const datum = document.createElement("span");
    datum.className = "karte-datum";
    datum.textContent = new Date(m.datum).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
    kopf.append(punkt, fund, datum);
    karte.appendChild(kopf);

    const wortlaut = document.createElement("p");
    wortlaut.className = "karte-wortlaut";
    wortlaut.textContent = "„" + m.anker + "“";
    karte.appendChild(wortlaut);

    if (m.notiz){
      const notiz = document.createElement("p");
      notiz.className = "karte-notiz";
      notiz.textContent = m.notiz;
      karte.appendChild(notiz);
    }

    /* Findet die Markierung ihre Stelle nicht mehr, wird das gesagt — sie
       verschwindet nicht. */
    if (kanonisch && markierungVerorten(kanonisch, m) === -1){
      const hinweis = document.createElement("p");
      hinweis.className = "karte-verschoben";
      hinweis.textContent = "Textstelle nicht gefunden — der Gesetzestext hat sich geändert.";
      karte.appendChild(hinweis);
    }

    if (aktiv){
      const zeile = document.createElement("div");
      zeile.className = "karte-farbzeile";
      const kreise = document.createElement("div");
      kreise.className = "farbreihe";
      farbreiheFuellen(kreise, m.farbe, (hex) => {
        markierungAendern(m.id, { farbe: hex });
        S.letzteFarbe = hex;
        merken("letzteFarbe", hex);
        hauptZeichnen();
        apparatZeichnen();
      });
      const waehler = document.createElement("input");
      waehler.type = "color";
      waehler.className = "farbwaehler";
      waehler.setAttribute("aria-label", "Eigene Farbe wählen");
      waehler.value = /^#[0-9a-f]{6}$/i.test(m.farbe) ? m.farbe : "#F2C744";
      // stopPropagation an JEDEM Klick der Farbzeile: sonst schließt der Klick
      // die Karte, auf der die Auswahl gerade steht.
      waehler.onclick = (e) => e.stopPropagation();
      waehler.oninput = (e) => { e.stopPropagation(); markierungAendern(m.id, { farbe: e.target.value }); };
      waehler.onchange = (e) => { e.stopPropagation(); hauptZeichnen(); apparatZeichnen(); };
      const hex = document.createElement("span");
      hex.className = "hexwert";
      hex.textContent = m.farbe;
      zeile.append(kreise, waehler, hex);
      zeile.onclick = (e) => e.stopPropagation();
      karte.appendChild(zeile);

      const fuss = document.createElement("div");
      fuss.className = "popover-fuss";
      fuss.style.marginTop = "9px";
      const notizKnopf = knopf("", m.notiz ? "Notiz ändern" : "Notiz hinzufügen");
      notizKnopf.onclick = (e) => {
        e.stopPropagation();
        const neu = window.prompt("Notiz zu „" + m.anker.slice(0, 60) + "“", m.notiz || "");
        if (neu === null) return;
        markierungAendern(m.id, { notiz: neu });
        apparatZeichnen();
        hauptZeichnen();
      };
      const weg = knopf("", "Entfernen");
      weg.onclick = (e) => {
        e.stopPropagation();
        markierungLoeschen(m.id);
        hauptZeichnen();
        apparatZeichnen();
      };
      fuss.append(notizKnopf, weg);
      karte.appendChild(fuss);
    }

    const umschalten = () => {
      S.aktiveMarkierung = S.aktiveMarkierung === m.id ? null : m.id;
      popoverSchliessen();
      hauptZeichnen();
      apparatZeichnen();
    };
    karte.onclick = umschalten;
    karte.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); umschalten(); }
    };
    raus.appendChild(karte);
  }

  raus.appendChild(markierungsFuss());
  return raus;
}

function markierungsFuss(){
  const p = document.createElement("p");
  p.className = "haftung";
  // Ehrlich: Es gibt kein Konto und keinen Server. Die Daten liegen im Browser.
  p.textContent = "Markierungen liegen nur in diesem Browser. "
    + "Sie werden nicht übertragen und gehen verloren, wenn die Websitedaten gelöscht werden.";
  return p;
}

/* ══════════════════════════════════════════════════════════════════════
   Register „Verwaltung"
   ══════════════════════════════════════════════════════════════════════ */
function verwaltungBauen(){
  const raus = document.createDocumentFragment();
  const datei = S.verwaltung[S.abk];
  const stellen = verwaltungDerNorm();

  if (!datei){
    raus.appendChild(fehlmeldung(
      "Kein Datensatz",
      "Für dieses Gesetz liegt keine Zuordnung von Verwaltungsanweisungen vor.",
      "verwaltung/" + S.abk.toLowerCase() + ".json",
    ));
    raus.appendChild(haftungssatz());
    return raus;
  }

  /* Ein Beispieldatensatz sagt das von sich aus — an erster Stelle, nicht im
     Kleingedruckten. Er zeigt den Aufbau des Formats, er ist kein Nachweis. */
  if (datei.beispiel){
    const warnung = fehlmeldung("Beispieldatensatz", datei.hinweis || "");
    warnung.style.borderColor = "var(--vw-rand)";
    raus.appendChild(warnung);
  }

  if (!stellen.length){
    const p = document.createElement("p");
    p.className = "platzhalter";
    p.textContent = "Zu dieser Norm ist keine Verwaltungsanweisung zugeordnet.";
    raus.appendChild(p);
    raus.appendChild(haftungssatz());
    return raus;
  }

  for (const v of stellen){
    const aktiv = S.aktiveVerwaltung === v.id;
    const karte = document.createElement("div");
    karte.className = "karte vw-karte" + (aktiv ? " aktiv" : "");
    karte.tabIndex = 0;
    karte.setAttribute("role", "button");

    const kopf = document.createElement("div");
    kopf.className = "karte-kopf";
    if (v.quelle){
      const q = document.createElement("span");
      q.className = "quelle";
      q.textContent = v.quelle;
      kopf.appendChild(q);
    }
    const fund = document.createElement("span");
    fund.className = "karte-fundstelle";
    fund.textContent = v.fundstelle || "";
    kopf.appendChild(fund);
    karte.appendChild(kopf);

    const wortlaut = document.createElement("p");
    wortlaut.className = "karte-wortlaut";
    wortlaut.textContent = "„" + v.anker + "“";
    karte.appendChild(wortlaut);

    if (v.erlaeuterung){
      const p = document.createElement("p");
      p.className = "karte-notiz";
      p.textContent = v.erlaeuterung;
      karte.appendChild(p);
    }
    if (v.beleg){
      const b = document.createElement("span");
      b.className = "vw-beleg";
      b.textContent = v.beleg;
      karte.appendChild(b);
    }
    if (v.url){
      const p = document.createElement("p");
      const a = document.createElement("a");
      a.href = v.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "amtliche Fundstelle ↗";
      p.appendChild(a);
      karte.appendChild(p);
    }

    const umschalten = () => {
      S.aktiveVerwaltung = S.aktiveVerwaltung === v.id ? null : v.id;
      hauptZeichnen();
      apparatZeichnen();
    };
    karte.onclick = umschalten;
    karte.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); umschalten(); }
    };
    raus.appendChild(karte);
  }

  raus.appendChild(haftungssatz());
  return raus;
}

/* ══════════════════════════════════════════════════════════════════════
   Register „Schema"

   Der Aufbau der Norm in Stufen, aus annotations/. Das ist eine strukturierte
   Wiedergabe des Normaufbaus, kein Prüfungsschema im juristischen Sinn: Es
   endet an der Normgrenze, und die Reihenfolge ist gesetzt, nicht abgeleitet.
   Genau so steht es auch darunter.
   ══════════════════════════════════════════════════════════════════════ */
function schemaBauen(){
  const raus = document.createDocumentFragment();
  const anm = S.anmerkungen[S.abk] ? S.anmerkungen[S.abk][S.normId] : null;
  const schema = anm && Array.isArray(anm.schema) ? anm.schema : [];

  if (!schema.length){
    raus.appendChild(fehlmeldung(
      "Kein Schema",
      anm ? "Für diese Norm wird kein Schema erzeugt — sie hat keine Tatbestand-Rechtsfolge-Struktur."
          : "Für dieses Gesetz liegen keine Annotationen vor.",
      "annotations/" + S.abk.toLowerCase() + ".json",
    ));
    raus.appendChild(haftungssatz());
    return raus;
  }

  for (const b of schema){
    const abschnitt = block(b.absatz ? b.absatz + (b.rolle ? " · " + b.rolle : "") : (b.rolle || "Aufbau"));
    for (const stufe of b.schritte || []){
      const kopf = document.createElement("p");
      kopf.style.fontWeight = "500";
      kopf.textContent = (stufe.n ? stufe.n + " " : "") + stufe.t
        + (stufe.junktor ? (stufe.junktor === "oder" ? " (alternativ)" : " (kumulativ)") : "");
      abschnitt.appendChild(kopf);
      for (const unter of stufe.sub || []){
        const p = document.createElement("p");
        p.style.paddingLeft = "12px";
        p.style.color = "var(--text-2b)";
        p.textContent = "— " + (typeof unter === "string" ? unter : unter.t);
        if (typeof unter === "object" && unter.pfad) p.title = unter.pfad;
        abschnitt.appendChild(p);
      }
    }
    raus.appendChild(abschnitt);
  }

  const p = document.createElement("p");
  p.className = "haftung";
  p.textContent = "Strukturierte Wiedergabe des Normaufbaus, maschinell erzeugt. "
    + "Kein Prüfungsschema im juristischen Sinn: Es endet an der Normgrenze, "
    + "und die Reihenfolge ist gesetzt, nicht abgeleitet.";
  raus.appendChild(p);
  return raus;
}

/* ══════════════════════════════════════════════════════════════════════
   Register „Zitate" — welche Normen auf diese verweisen
   ══════════════════════════════════════════════════════════════════════ */
function zitateBauen(){
  const raus = document.createDocumentFragment();
  const schluessel = S.abk.toLowerCase() + "/" + S.normId;
  const quellen = (S.verweise && S.verweise[schluessel]) || [];

  if (!S.verweise){
    raus.appendChild(fehlmeldung("Kein Verweisindex",
      "Der Rückverweisindex fehlt.", "data/verweise.json"));
    return raus;
  }
  if (!quellen.length){
    const p = document.createElement("p");
    p.className = "platzhalter";
    p.textContent = "Keine Norm im Bestand verweist auf diese Vorschrift.";
    raus.appendChild(p);
    return raus;
  }

  const kappe = document.createElement("p");
  kappe.className = "mono-etikett";
  kappe.style.marginBottom = "10px";
  kappe.textContent = quellen.length + (quellen.length === 1 ? " Vorschrift" : " Vorschriften");
  raus.appendChild(kappe);

  const wolke = document.createElement("div");
  wolke.className = "zitatwolke";
  for (const q of quellen){
    const [abk, id] = q.split("/");
    const meta = registerEintrag(abk);
    const norm = meta && meta.normen ? meta.normen.find(n => n.id === id) : null;
    const b = knopf("zitat");
    if (meta && meta.abk !== S.abk){
      const g = document.createElement("span");
      g.className = "zitat-gesetz";
      g.textContent = meta.abk;
      b.appendChild(g);
    }
    b.appendChild(document.createTextNode(norm ? norm.e : "§ " + id));
    if (norm && norm.t) b.title = norm.t;
    b.onclick = () => { location.hash = "#/" + abk + "/" + id; };
    wolke.appendChild(b);
  }
  raus.appendChild(wolke);

  const p = document.createElement("p");
  p.className = "haftung";
  p.textContent = "Automatisch aus dem Wortlaut der Verweisungen gewonnen. "
    + "Verweise über Rechtsverordnungen und Verwaltungsanweisungen sind nicht erfasst.";
  raus.appendChild(p);
  return raus;
}

  const zeile = document.createElement("div");

  for (const [schluessel, beschriftung] of REGISTER){
    const b = knopf("", beschriftung);
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(schluessel === S.apparatRegister));
    b.onclick = () => { S.apparatRegister = schluessel; apparatZeichnen(); };
    zeile.appendChild(b);
  }

  const inhalt = document.createElement("div");
  inhalt.className = "registerinhalt";

  if (S.apparatRegister === "hinweise"){
    inhalt.appendChild(hinweiseBauen());
  } else if (S.apparatRegister === "markierungen"){
    inhalt.appendChild(markierungenBauen());
  } else if (S.apparatRegister === "verwaltung"){
    inhalt.appendChild(verwaltungBauen());
  } else if (S.apparatRegister === "schema"){
    inhalt.appendChild(schemaBauen());
  } else if (S.apparatRegister === "zitate"){
    inhalt.appendChild(zitateBauen());
  } else {

    const name = (REGISTER.find(r => r[0] === S.apparatRegister) || ["", ""])[1];
    p.textContent = "Register „" + name + "“ — noch nicht angebunden. "

  apparat.appendChild(inhalt);
}

/* ══════════════════════════════════════════════════════════════════════
   Trefferliste

   Gesucht wird in dem, was geladen ist. Normen, deren Volltext noch nicht
   vorliegt, erscheinen grau mit dem Vermerk „Datensatz … ausstehend" — nie mit
   erfundenem Wortlaut.
   ══════════════════════════════════════════════════════════════════════ */
/* ── Fundstellen lesen ───────────────────────────────────────────────
   „§ 5 EStG" steht in keinem Wortlaut: Die Abkürzung des Gesetzes gehört zur
   Adresse, nicht zum Text. Die reine Volltextsuche fand deshalb null Treffer
   für genau die Eingabe, die am nächsten liegt — sie suchte die Zeichenfolge
   „§ 5 estg" in Überschriften und Absätzen, wo sie nie steht.

   Gelesen wird gegen das Register: Es führt alle vierzehn Gesetze mit Nummer
   und Überschrift, auch ohne geladenen Volltext. Erkannt werden „§ 5 EStG",
   „§5 EStG", „EStG § 5", „EStG 5", „§ 5 Abs. 2 EStG", „Anlage 3 EStG" und der
   ausgeschriebene Gesetzesname. Was keine Norm des Bestands trifft, wird nicht
   erkannt — dann bleibt es bei der Volltextsuche. Erfunden wird nichts. */
const ADRESSGLEICH = (s) => String(s).replace(/\s+/g, "").toLowerCase();

function adresseLesen(begriff){
  if (!S.register) return null;
  const roh = String(begriff).replace(/ /g, " ").trim();
  if (!roh) return null;

  /* Das Gesetz: ein eigenes Wort, das einer Abkürzung gleicht — sonst der
     ausgeschriebene Titel, längste zuerst, damit „Erbschaftsteuer- und
     Schenkungsteuergesetz" nicht an einem kürzeren Namen hängen bleibt. */
  let abk = null;
  let rest = roh;
  for (const wort of roh.split(/[\s,;()]+/).filter(Boolean)){
    const rein = wort.replace(/[.:]+$/, "");
    const g = S.register.gesetze.find(x => x.abk.toLowerCase() === rein.toLowerCase());
    if (g){ abk = g.abk; rest = rest.replace(wort, " "); break; }
  }
  if (!abk){
    for (const g of [...S.register.gesetze].sort((a, b) => b.titel.length - a.titel.length)){
      const i = rest.toLowerCase().indexOf(g.titel.toLowerCase());
      if (i < 0) continue;
      abk = g.abk;
      rest = rest.slice(0, i) + " " + rest.slice(i + g.titel.length);
      break;
    }
  }

  /* Die Nummer: hinter dem Paragrafenzeichen, sonst die erste freistehende
     Zahl. „Anlage" ist im Bestand eine eigene Bezeichnungsform. */
  const anlage = /\bAnlagen?\s*(\d+[a-z]?)/i.exec(rest);
  const nachZeichen = /§+\s*(\d+[a-z]?)/i.exec(rest);
  const freieZahl = /(?:^|\s)(\d+[a-z]?)(?=$|[\s,.;:)])/.exec(rest);
  let enbez = null;
  if (anlage) enbez = "Anlage " + anlage[1];
  else {
    const m = nachZeichen || freieZahl;
    if (m) enbez = "§ " + m[1].toLowerCase();
  }
  if (!enbez) return null;

  /* Bleibt außer der Adresse noch etwas stehen, ist die Eingabe mehr als eine
     Fundstelle — „§ 5 EStG Gewinn" will gelesen, nicht angesprungen werden. */
  const uebrig = rest
    .replace(/§+/g, " ")
    .replace(/\bAnlagen?\b/gi, " ")
    .replace(/\bAbs(?:atz|ätze|\.)?\b/gi, " ")
    .replace(/\bSatz\b|\bSätze\b|\bS\./gi, " ")
    .replace(/\bNummer\b|\bNr\.?\b/gi, " ")
    .replace(/\bBuchstabe\b/gi, " ")
    .replace(/\d+[a-z]?/g, " ")
    .replace(/[\s.,;:()§-]+/g, "");

  return {
    abk,
    enbez,
    absatz: (/\bAbs(?:atz|\.)?\s*(\d+[a-z]?)/i.exec(rest) || [])[1] || null,
    rein: uebrig === "",
  };
}

/**
 * Normen, auf die eine Adresse zeigt.
 *
 * Ohne genanntes Gesetz zeigt „§ 5" auf vierzehn Normen — das eigene Gesetz
 * zuerst, denn wer im EStG liest und „§ 5" tippt, meint in aller Regel das
 * EStG. Der Gesetzesfilter der Trefferliste wird hier NICHT angewandt: Er
 * gehört zur Liste, nicht zur Adresse.
 */
function adressTreffer(adresse){
  if (!adresse || !S.register) return [];
  let gesetze = adresse.abk
    ? [registerEintrag(adresse.abk)].filter(Boolean)
    : [...S.register.gesetze];
  if (!adresse.abk && S.abk){
    gesetze.sort((a, b) => (b.abk === S.abk ? 1 : 0) - (a.abk === S.abk ? 1 : 0));
  }

  const raus = [];
  for (const meta of gesetze){
    const eintrag = (meta.normen || []).find(n => ADRESSGLEICH(n.e) === ADRESSGLEICH(adresse.enbez));
    if (!eintrag) continue;
    const geladen = cacheGesetz.get(meta.abk.toLowerCase());
    const norm = geladen ? geladen.normen.find(n => String(n.id) === String(eintrag.id)) : null;
    raus.push({
      abk: meta.abk, id: eintrag.id, enbez: eintrag.e, titel: eintrag.t || "",
      ausstehend: !norm, text: norm ? normVolltext(norm) : "", stelle: -1, adresse: true,
    });
  }
  return raus;
}

/**
 * Wohin eine Eingabe führt.
 *
 * Eine vollständige Fundstelle ist keine Frage, sondern eine Adresse: „§ 5
 * EStG" gehört auf die Norm, nicht auf eine Trefferliste mit einem Eintrag.
 * Alles andere — auch „§ 5" ohne Gesetz, das vierzehn Normen treffen kann —
 * geht in die Liste.
 */
function sucheZiel(begriff){
  const adresse = adresseLesen(begriff);
  if (adresse && adresse.abk && adresse.rein){
    const ziele = adressTreffer(adresse);
    if (ziele.length === 1) return "#/" + ziele[0].abk.toLowerCase() + "/" + ziele[0].id;
  }
  return "#/suche/" + encodeURIComponent(begriff);
}

function sucheOeffnen(begriff){
  location.hash = sucheZiel(begriff);
}

/* ── Vorschläge ──────────────────────────────────────────────────────
   Bisher gab das Feld während der Eingabe nichts zurück: Man tippte blind und
   erfuhr erst nach Enter, ob etwas dahinter steckt. Die Vorschläge kommen aus
   dem Register — Kürzel, Nummer und Überschrift aller 1 537 Normen liegen mit
   `data/index.json` bereits im Speicher, ohne dass ein Volltext geladen sein
   müsste. Angeboten wird nur, was es gibt; die letzte Zeile führt immer in die
   Volltextsuche, damit der Weg über Enter nie verstellt ist. */
const VORSCHLAEGE_MAX = 8;

function vorschlaege(begriff){
  if (!S.register) return [];
  const roh = String(begriff).trim();
  if (roh.length < 2) return [];
  const suche = roh.toLowerCase();
  const liste = [];
  const gesehen = new Set();
  const dazu = (v) => {
    if (gesehen.has(v.ziel)) return;
    gesehen.add(v.ziel);
    liste.push(v);
  };

  /* 1. Die Fundstelle — der genaueste Treffer, den eine Eingabe haben kann. */
  for (const t of adressTreffer(adresseLesen(roh))){
    dazu({
      ziel: "#/" + t.abk.toLowerCase() + "/" + t.id,
      kopf: t.enbez + " " + t.abk, bei: t.titel, marke: "Fundstelle",
    });
    if (liste.length >= 4) break;
  }

  /* 2. Ganze Gesetze. */
  for (const g of S.register.gesetze){
    if (!(g.abk.toLowerCase().startsWith(suche) || g.titel.toLowerCase().includes(suche))) continue;
    dazu({ ziel: "#/" + g.abk.toLowerCase(), kopf: g.abk, bei: g.titel, marke: g.anzahl + " Normen" });
  }

  /* 3. Überschriften. Was vorne beginnt, steht vor dem, was mittendrin trifft. */
  const kopfzeilen = [];
  for (const meta of S.register.gesetze){
    for (const n of meta.normen || []){
      const t = (n.t || "").toLowerCase();
      if (!t.includes(suche)) continue;
      kopfzeilen.push({ rang: t.startsWith(suche) ? 0 : 1, meta, n });
    }
  }
  kopfzeilen.sort((a, b) => a.rang - b.rang);
  for (const k of kopfzeilen){
    if (liste.length >= VORSCHLAEGE_MAX - 1) break;
    dazu({
      ziel: "#/" + k.meta.abk.toLowerCase() + "/" + k.n.id,
      kopf: k.n.e + " " + k.meta.abk, bei: k.n.t || "", marke: "Überschrift",
    });
  }

  /* 4. Der Ausweg in den Wortlaut steht immer zuletzt. */
  liste.length = Math.min(liste.length, VORSCHLAEGE_MAX - 1);
  liste.push({
    ziel: "#/suche/" + encodeURIComponent(roh),
    kopf: "Im Wortlaut suchen", bei: "„" + roh + "“", marke: "Enter",
  });
  return liste;
}

/**
 * Bedienung eines Suchfelds.
 *
 * Beide Felder — das schlanke in der Kopfleiste und das große auf der
 * Startseite — bekommen dieselbe Liste und dieselben Tasten: Pfeile wählen,
 * Enter geht, Escape schließt erst die Liste und dann das Feld.
 */
function suchfeldVerdrahten(eingabe, huelle){
  const liste = document.createElement("div");
  liste.className = "vorschlaege";
  liste.setAttribute("role", "listbox");
  liste.setAttribute("aria-label", "Vorschläge");
  liste.hidden = true;
  huelle.appendChild(liste);

  eingabe.setAttribute("role", "combobox");
  eingabe.setAttribute("aria-autocomplete", "list");
  eingabe.setAttribute("aria-expanded", "false");
  eingabe.setAttribute("autocomplete", "off");

  let stand = [];
  let wahl = -1;

  const schliessen = () => {
    liste.hidden = true;
    liste.innerHTML = "";
    stand = [];
    wahl = -1;
    eingabe.setAttribute("aria-expanded", "false");
  };

  const auswahlZeigen = () => {
    [...liste.children].forEach((k, i) => {
      k.setAttribute("aria-selected", String(i === wahl));
      if (i === wahl && k.scrollIntoView) k.scrollIntoView({ block: "nearest" });
    });
  };

  const gehen = (v) => { schliessen(); eingabe.blur(); location.hash = v.ziel; };

  const zeichnen = () => {
    stand = vorschlaege(eingabe.value);
    liste.innerHTML = "";
    wahl = -1;
    if (!stand.length){ schliessen(); return; }
    for (const v of stand){
      const b = knopf("vorschlag");
      b.setAttribute("role", "option");
      b.setAttribute("aria-selected", "false");
      const k = document.createElement("span"); k.className = "vkopf"; k.textContent = v.kopf;
      const t = document.createElement("span"); t.className = "vbei"; t.textContent = v.bei;
      const m = document.createElement("span"); m.className = "vmarke"; m.textContent = v.marke;
      b.append(k, t, m);
      /* `mousedown` abfangen: Sonst verlöre das Feld den Fokus, bevor der Klick
         beim Knopf ankommt, und die Liste wäre schon zu. */
      b.addEventListener("mousedown", (e) => e.preventDefault());
      b.onclick = () => gehen(v);
      liste.appendChild(b);
    }
    liste.hidden = false;
    eingabe.setAttribute("aria-expanded", "true");
  };

  eingabe.addEventListener("input", zeichnen);
  eingabe.addEventListener("focus", () => { if (eingabe.value.trim()) zeichnen(); });

  eingabe.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      if (liste.hidden) zeichnen();
      if (liste.hidden) return;               // nichts anzubieten
      e.preventDefault();
      wahl = e.key === "ArrowDown"
        ? (wahl + 1) % stand.length
        : (wahl <= 0 ? stand.length - 1 : wahl - 1);
      auswahlZeigen();
      return;
    }
    if (e.key === "Enter"){
      e.preventDefault();
      if (wahl >= 0 && stand[wahl]){ gehen(stand[wahl]); return; }
      const begriff = eingabe.value.trim();
      schliessen();
      if (begriff) sucheOeffnen(begriff);
      return;
    }
    if (e.key === "Escape" && !liste.hidden){
      /* Das erste Escape schließt nur die Liste; Text und Fokus bleiben. Erst
         das zweite geht an die Seite und schließt Schublade oder Blatt. */
      e.stopPropagation();
      schliessen();
    }
  });

  document.addEventListener("click", (e) => {
    if (!huelle.isConnected) return;          // Startseite neu gezeichnet
    if (!huelle.contains(e.target)) schliessen();
  });

  return { zeichnen, schliessen };
}

function normVolltext(norm){
  if (norm.__vt) return norm.__vt;
  const roh = (norm.abs || []).map(a => a.html || "").join(" ")
    .replace(/<[^>]+>/g, " ").replace(/&sect;/g, "§").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&")
    .replace(/\s+/g, " ").trim();
  Object.defineProperty(norm, "__vt", { value: roh, enumerable: false });
  return roh;
}

function trefferliste(begriff){
  const suche = begriff.toLowerCase();
  const treffer = [];
  const gesehen = new Set();

  /* Die Fundstelle zuerst. Sie steht auch dann in der Liste, wenn der Volltext
     des Gesetzes noch nicht geladen ist — das Register kennt sie. */
  for (const t of adressTreffer(adresseLesen(begriff))){
    if (S.filterGesetze.size && !S.filterGesetze.has(t.abk)) continue;
    treffer.push(t);
    gesehen.add(t.abk + "/" + t.id);
  }

  for (const meta of S.register.gesetze){
    if (S.filterGesetze.size && !S.filterGesetze.has(meta.abk)) continue;
    const geladen = cacheGesetz.get(meta.abk.toLowerCase());
    if (!geladen){
      /* Nicht geladen: Der Registereintrag trägt Nummern und Titel, mehr nicht.
         Diese Treffer werden als ausstehend gezeigt. */
      for (const n of meta.normen || []){
        if (gesehen.has(meta.abk + "/" + n.id)) continue;
        if (!((n.e + " " + (n.t || "")).toLowerCase().includes(suche))) continue;
        treffer.push({ abk: meta.abk, id: n.id, enbez: n.e, titel: n.t || "", ausstehend: true });
        if (treffer.length > 300) return treffer;
      }
      continue;
    }
    for (const norm of geladen.normen){
      if (gesehen.has(meta.abk + "/" + norm.id)) continue;
      const kopf = (norm.enbez + " " + (norm.titel || "")).toLowerCase();
      const text = normVolltext(norm);
      const imKopf = kopf.includes(suche);
      const stelle = text.toLowerCase().indexOf(suche);
      if (!imKopf && stelle === -1) continue;
      treffer.push({
        abk: meta.abk, id: norm.id, enbez: norm.enbez, titel: norm.titel || "",
        ausstehend: false, text, stelle,
      });
      if (treffer.length > 300) return treffer;
    }
  }
  return treffer;
}

function trefferZeichnen(begriff){
  document.body.dataset.ansicht = "suche";
  werkzeugleisteBauen();
  vergleichKnopfSetzen();
  const haupt = el("haupt");
  haupt.className = "breit";
  haupt.innerHTML = "";
  el("navspalte").innerHTML = "";
  el("apparat").innerHTML = "";
  el("suche").value = begriff;

  const raster = document.createElement("div");
  raster.className = "trefferraster";

  /* ── Filterspalte ── */
  const filter = document.createElement("div");
  filter.className = "filterspalte";
  const fk = document.createElement("p");
  fk.className = "spaltenkopf";
  fk.textContent = "Gesetze";
  filter.appendChild(fk);

  const alle = trefferliste(begriff);
  const zahlProGesetz = new Map();
  for (const t of alle) zahlProGesetz.set(t.abk, (zahlProGesetz.get(t.abk) || 0) + 1);

  for (const g of S.register.gesetze){
    const b = knopf("filterzeile");
    const kasten = document.createElement("span");
    kasten.textContent = S.filterGesetze.has(g.abk) ? "☑" : "☐";
    const name = document.createElement("span");
    name.textContent = g.abk;
    const zahl = document.createElement("span");
    zahl.className = "zahl";
    zahl.textContent = zahlProGesetz.get(g.abk) || 0;
    b.append(kasten, name, zahl);
    b.setAttribute("aria-pressed", String(S.filterGesetze.has(g.abk)));
    b.onclick = () => {
      if (S.filterGesetze.has(g.abk)) S.filterGesetze.delete(g.abk);
      else S.filterGesetze.add(g.abk);
      trefferZeichnen(begriff);
    };
    filter.appendChild(b);
  }

  /* Hier stand ein Knopf „12 Gesetze laden". Wer ihn nicht drückte, bekam für
     zwölf von vierzehn Gesetzen eine Null — eine Suche, die zwölf Gesetze
     übergeht und das nur im Kleingedruckten sagt, ist keine Suche. Die
     Volltexte kommen jetzt von selbst nach; der Fortschritt steht daneben. */
  const offen = ungeladeneGesetze();
  if (offen.length){
    const p = document.createElement("p");
    p.className = "ladestand";
    p.id = "ladestand";
    p.textContent = ladesatz();
    filter.appendChild(p);
  }
  /* Was nicht erreichbar war, wird gesagt und nicht überspielt. */
  if (volltextFehlt.size){
    const p = document.createElement("p");
    p.className = "ladestand";
    p.textContent = "Nicht erreichbar: " + [...volltextFehlt].join(", ")
      + " — dort wurde nur in Nummer und Überschrift gesucht.";
    filter.appendChild(p);
  }

  /* ── Trefferspalte ── */
  const spalte = document.createElement("div");
  spalte.className = "trefferspalte";
  const kopf = document.createElement("div");
  kopf.className = "trefferkopf";
  const h1 = document.createElement("h1");
  h1.textContent = alle.length + (alle.length === 1 ? " Treffer für „" : " Treffer für „") + begriff + "“";
  kopf.appendChild(h1);
  spalte.appendChild(kopf);

  if (!alle.length){
    const p = document.createElement("p");
    p.className = "platzhalter";
    p.style.maxWidth = "var(--lesespalte)";
    p.textContent = offen.length
      ? "Noch kein Treffer. Die Volltexte der übrigen Gesetze werden gerade "
        + "geladen; die Liste füllt sich dann von selbst."
      : "Kein Treffer in den " + S.register.gesetze.length + " Gesetzen des Bestands."
        + (volltextFehlt.size ? " Nicht jedes Gesetz war erreichbar — siehe links." : "");
    spalte.appendChild(p);
  }

  for (const t of alle.slice(0, 80)){
    const b = knopf("treffer" + (t.ausstehend ? " ausstehend" : ""));
    const zeile = document.createElement("div");
    zeile.className = "treffer-kopf";
    const nr = document.createElement("span"); nr.className = "treffer-nr"; nr.textContent = t.enbez;
    const titel = document.createElement("span"); titel.className = "treffer-titel"; titel.textContent = t.titel;
    const chip = document.createElement("span"); chip.className = "treffer-gesetz"; chip.textContent = t.abk;
    zeile.append(nr, titel, chip);
    b.appendChild(zeile);

    const text = document.createElement("p");
    text.className = "treffer-text";
    if (t.ausstehend){
      text.textContent = "Wortlaut noch nicht geladen.";
    } else if (t.stelle >= 0){
      const von = Math.max(0, t.stelle - 90);
      const bis = Math.min(t.text.length, t.stelle + begriff.length + 150);
      text.appendChild(document.createTextNode((von ? "… " : "") + t.text.slice(von, t.stelle)));
      const m = document.createElement("mark");
      m.textContent = t.text.slice(t.stelle, t.stelle + begriff.length);
      text.appendChild(m);
      text.appendChild(document.createTextNode(t.text.slice(t.stelle + begriff.length, bis) + (bis < t.text.length ? " …" : "")));
    } else {
      text.textContent = t.text.slice(0, 190) + (t.text.length > 190 ? " …" : "");
    }
    b.appendChild(text);

    const fund = document.createElement("span");
    fund.className = "treffer-fund";
    fund.textContent = t.adresse
      ? "Fundstelle · " + t.abk + " " + t.enbez
        + (t.ausstehend ? " · Wortlaut noch nicht geladen" : "")
      : t.ausstehend
        ? "Datensatz " + t.abk + " ausstehend"
        : t.abk + " " + t.enbez;
    b.appendChild(fund);

    b.onclick = () => { location.hash = "#/" + t.abk.toLowerCase() + "/" + t.id; };
    spalte.appendChild(b);
  }

  raster.append(filter, spalte);
  haupt.appendChild(raster);
  reiterZeichnen();
  document.title = "„" + begriff + "“ — Suche · steuernorm";
  if (offen.length) volltexteNachladen(begriff);
}

/* ── Volltexte nachladen ──────────────────────────────────────────────
   Die Suche liest den Wortlaut aus `data/<gesetz>.json`; geladen wird sonst
   nur, was man aufschlägt. Auf der Trefferliste wird der Rest nachgeholt —
   einmalig gut vier Megabyte, die der Dienstarbeiter danach vorhält, sodass
   die Suche auch ohne Netz vollständig bleibt.

   Ein Gesetz, dessen Datei fehlt, wird vermerkt und nicht erneut versucht:
   Sonst bliebe es immer „ungeladen“ und der Lauf riefe sich endlos selbst. */
const volltextFehlt = new Set();
let volltextLauf = 0;

const ungeladeneGesetze = () => S.register.gesetze.filter(
  g => !cacheGesetz.has(g.abk.toLowerCase()) && !volltextFehlt.has(g.abk));

function ladesatz(){
  const alle = S.register.gesetze.length;
  return "Volltexte werden geladen … " + (alle - ungeladeneGesetze().length) + " von " + alle;
}

async function volltexteNachladen(begriff){
  const mein = ++volltextLauf;
  const laeuftNoch = () => mein === volltextLauf && document.body.dataset.ansicht === "suche";

  for (const g of [...ungeladeneGesetze()]){
    try { await gesetzLaden(g.abk); }
    catch (e) { volltextFehlt.add(g.abk); }
    if (!laeuftNoch()) return;
    const stand = el("ladestand");
    if (stand) stand.textContent = ladesatz();
  }
  if (laeuftNoch()) trefferZeichnen(begriff);
}

/* ══════════════════════════════════════════════════════════════════════
   Wegweiser
   ══════════════════════════════════════════════════════════════════════ */
/* Nur der jüngste Aufruf zählt.
   `wegweiser` wartet zweimal auf das Netz (Gesetz, dann Zutaten). Wer in
   dieser Zeit weiterklickt, startet einen zweiten Lauf; ohne Schranke schreibt
   der langsamere zuletzt und die Seite zeigt das vorletzte Ziel. Bei 9 MB
   Annotationen zum EStG ist das kein Randfall, sondern zwei zügige Klicks. */
let wegweiserLauf = 0;

async function wegweiser(){
  if (!S.register) return;
  const meinLauf = ++wegweiserLauf;
  const ueberholt = () => meinLauf !== wegweiserLauf;
  popoverSchliessen();

  const roh = location.hash.replace(/^#\/?/, "");
  const teile = roh.split("/").map(decodeURIComponent).filter(Boolean);

  /* Leerer Pfad → Startseite. Der Einstieg ist nicht die zuletzt gelesene
     Norm, sondern die Übersicht; wer weiterlesen will, findet sie unter
     „Zuletzt gelesen". */
  if (!teile.length){
    hauptStilZuruecksetzen();
    startseiteZeichnen();
    return;
  }

  if (teile[0] === "suche"){
    hauptStilZuruecksetzen();
    trefferZeichnen(teile.slice(1).join("/"));
    return;
  }

  const abkRoh = teile[0].toLowerCase();
  const eintrag = registerEintrag(abkRoh) || S.register.gesetze[0];
  S.abk = eintrag.abk;
  merken("letztesGesetz", S.abk.toLowerCase());

  try {
    S.gesetz = await gesetzLaden(S.abk);
    if (ueberholt()) return;
  } catch (fehler) {
    if (ueberholt()) return;
    const haupt = el("haupt");
    haupt.innerHTML = "";
    const kasten = document.createElement("div");
    kasten.className = "melder";
    const stark = document.createElement("strong");
    stark.textContent = S.abk + " konnte nicht geladen werden.";
    const p = document.createElement("p");
    p.textContent = fehler.message;
    kasten.append(stark, p);
    haupt.appendChild(kasten);
    return;
  }

  /* Nur das Gesetz genannt → Gesetzesübersicht. */
  if (teile.length === 1){
    hauptStilZuruecksetzen();
    uebersichtZeichnen();
    return;
  }

  S.normId = teile[1];
  if (!S.gesetz.normen.some(n => n.id === S.normId)) S.normId = S.gesetz.normen[0].id;

  await zutatenLaden(S.abk);
  if (ueberholt()) return;
  S.aktiveMarkierung = null;
  S.aktiveVerwaltung = null;
  popoverSchliessen();
  blattSetzen(false);

  /* Die aufgerufene Norm ist immer geöffnet. */
  reiterOeffnen(S.abk, S.normId, false);

  /* Zuletzt gelesen — ohne Dubletten, jüngste zuerst. */
  S.zuletzt = [{ gesetz: S.abk, norm: S.normId }]
    .concat(S.zuletzt.filter(x => !(x.gesetz === S.abk && x.norm === S.normId)))
    .slice(0, 12);
  merken("zuletzt", S.zuletzt);

  hauptStilZuruecksetzen();

  /* Dritter Pfadteil „fassungen" → Vergleichsansicht. Sie steckt im Verweis,
     damit sie sich verschicken und mit dem Rücksprung verlassen lässt. */
  if (teile[2] === "fassungen"){
    document.body.dataset.ansicht = "vergleich";
    navZeichnen();
    vergleichZeichnen();
    vergleichKnopfSetzen();
    werkzeugleisteBauen();
    const gewaehlt = el("navspalte").querySelector('[aria-current=true]');
    if (gewaehlt && gewaehlt.scrollIntoView) gewaehlt.scrollIntoView({ block: "nearest" });
    window.scrollTo({ top: 0 });
    return;
  }

  document.body.dataset.ansicht = "norm";
  reiterZeichnen();
  navZeichnen();
  hauptZeichnen();
  apparatZeichnen();
  vergleichKnopfSetzen();

  const aktiv = el("navspalte").querySelector('[aria-current=true]');
  if (aktiv && aktiv.scrollIntoView) aktiv.scrollIntoView({ block: "nearest" });
  window.scrollTo({ top: 0 });
}

/* ══════════════════════════════════════════════════════════════════════
   Start
   ══════════════════════════════════════════════════════════════════════ */
async function start(){
  S.darstellung = gemerkt("darstellung", "system");
  darstellungSetzen(S.darstellung);
  for (const b of el("darstellung").querySelectorAll("button")){
    b.onclick = () => {
      darstellungSetzen(b.dataset.modus);
      // Die Marker-Deckkraft steckt in erzeugten style-Attributen und muss
      // beim Moduswechsel neu gerechnet werden.
      if (document.body.dataset.ansicht === "norm"){ hauptZeichnen(); apparatZeichnen(); }
    };
  }
  /* Folgt die Seite der Systemvorgabe, muss sie auf deren Wechsel reagieren. */
  if (window.matchMedia){
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (S.darstellung !== "system") return;
      if (document.body.dataset.ansicht === "norm"){ hauptZeichnen(); apparatZeichnen(); }
    });
  }

  kopfhoeheMessen();
  satzbildSetzen(gemerkt("satzbild", "fortlaufend"));
  for (const b of el("satzbild").querySelectorAll("button")){
    b.onclick = () => satzbildSetzen(b.dataset.bild);
  }

  schriftSetzen(Number(gemerkt("leseschrift", 17.5)) || 17.5);
  el("schrift-kleiner").onclick = () => schriftVerschieben(-1);
  el("schrift-groesser").onclick = () => schriftVerschieben(1);

  /* Spaltenbreiten: gemerkte Werte, aber gegen das AKTUELLE Fenster geklemmt.
     Wer auf 1 920 px gezogen hat und auf 1 280 px wiederkommt, soll die Mitte
     wiederfinden und nicht zwei Randspalten mit einem Spalt dazwischen. */
  const gemerkteSpalten = gemerkt("spalten", null);
  if (gemerkteSpalten && typeof gemerkteSpalten === "object"){
    for (const welche of ["nav", "apparat"]){
      const wert = Number(gemerkteSpalten[welche]);
      if (Number.isFinite(wert)) S.spalten[welche] = wert;
    }
  }
  spaltenSetzen();
  griffVerdrahten(el("griff-nav"), "nav");
  griffVerdrahten(el("griff-apparat"), "apparat");
  window.addEventListener("resize", () => spaltenSetzen());

  S.strukturModus = gemerkt("strukturModus", "voll");
  S.markierungen = markierungenLesen();
  S.mappen = mappenLesen() || [];
  S.aktiveMappe = gemerkt("aktiveMappe", null);
  mappenNachtragen();
  S.letzteFarbe = gemerkt("letzteFarbe", "#F2C744");
  S.geoeffnet = gemerkt("geoeffnet", []);
  reiterEntdoppeln();
  S.zuletzt = gemerkt("zuletzt", []);
  strukturSetzen(S.strukturModus);

  for (const b of el("stufen").querySelectorAll("button")){
    b.onclick = () => { strukturSetzen(b.dataset.stufe); hauptZeichnen(); };
  }

  el("schublade-auf").onclick = () => {
    document.body.dataset.schublade =
      document.body.dataset.schublade === "offen" ? "zu" : "offen";
  };
  el("verdunkelung").onclick = () => {
    document.body.dataset.schublade = "zu";
    blattSetzen(false);
    mappeSchliessen();
  };

  el("knopf-mappe").onclick = (e) => { e.stopPropagation(); mappeUmschalten(); };
  el("mappe").onclick = (e) => e.stopPropagation();

  document.addEventListener("keydown", (e) => {
    const imFeld = /^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || "");

    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){
      e.preventDefault();
      el("suche").focus();
      el("suche").select();
      return;
    }
    /* ⌘W / Strg+W schließt den Reiter. Der Browser fängt die Tastenfolge in
       vielen Fällen selbst ab; wo er sie durchlässt, arbeitet sie hier. */
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "w"){
      if (S.abk){
        e.preventDefault();
        reiterSchliessen(S.abk);
      }
      return;
    }
    /* 1 bis 9 wechseln den Reiter — nur außerhalb von Eingabefeldern. */
    if (!imFeld && !e.metaKey && !e.ctrlKey && !e.altKey && /^[1-9]$/.test(e.key)){
      e.preventDefault();
      reiterWechseln(Number(e.key) - 1);
      return;
    }
    if (e.key === "Escape"){
      document.body.dataset.schublade = "zu";
      blattSetzen(false);
      popoverSchliessen();
      mappeSchliessen();
      el("auswahlleiste").classList.remove("offen");
      if (imFeld) document.activeElement.blur();
    }
  });

  /* Auswahl im Normtext: Werkzeugleiste zeigen. */
  document.addEventListener("selectionchange", () => requestAnimationFrame(auswahlleisteZeigen));
  window.addEventListener("scroll", () => {
    el("auswahlleiste").classList.remove("offen");
    popoverSchliessen();
  }, { passive: true });

  el("popover-zu").onclick = popoverSchliessen;
  el("popover").onclick = (e) => e.stopPropagation();
  document.addEventListener("click", (e) => {
    /* Die Mappe schließt beim Klick daneben. Der Klick auf ihren eigenen Knopf
       ist ausgenommen — sonst schlösse dieser Zuhörer sie in demselben
       Ereignis wieder, in dem der Knopf sie öffnet. */
    if (!el("mappe").contains(e.target)
        && !e.target.closest("#knopf-mappe")
        && !e.target.closest("#leiste-mappe")) mappeSchliessen();

    if (el("popover").contains(e.target)) return;
    if (e.target.closest(".eigen[data-eigen]")) return;
    if (e.target.closest(".auswahlleiste")) return;
    popoverSchliessen();
  });

  suchfeldVerdrahten(el("suche"), el("suche").closest(".suchhuelle"));
  el("wortmarke").onclick = () => { location.hash = "#/"; };

  window.addEventListener("hashchange", wegweiser);

  try {
    S.register = await holen("data/index.json");
    // Rückverweise sind eine Zutat: Fehlt die Datei, arbeitet alles andere weiter.
    try { S.verweise = (await holen("data/verweise.json")).normen; }
    catch (e) { S.verweise = null; }
  } catch (fehler) {
    el("haupt").innerHTML =
      '<div class="melder"><strong>Die Gesetzesdaten fehlen oder sind nicht erreichbar.</strong>'
      + '<p>Ein Browser darf beim Öffnen über <code>file://</code> keine Dateien nachladen. '
      + 'Die Seite über einen Server aufrufen:</p>'
      + '<p><code>python3 -m http.server 8000</code> im Projektordner, dann <code>http://localhost:8000</code>.</p>'
      + '<p style="color:var(--text-4)">' + fehler.message + '</p></div>';
    return;
  }

  wegweiser();
}

start();

/* Offlinezugriff. Der Arbeiter liegt neben index.html; der relative Pfad hält
   seinen Geltungsbereich auf dem Veröffentlichungsverzeichnis. Über file://
   gibt es keinen Arbeiter; die Seite läuft dann wie bisher. */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
