<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>steuernorm — Arbeitsplatz</title>
<meta name="description" content="Die deutschen Steuergesetze im Volltext, mit maschinell erkannter Struktur von Tatbestand und Rechtsfolge, eigenen Markierungen und Verwaltungsstellen.">

<!-- Schriften liegen im Repository, nicht bei Google.

     Zwei Gründe: Die Seite arbeitet ohne Netz — von dort kämen die Schriften
     dann nicht, und der Normtext fiele auf eine Systemschrift zurück, womit
     Zeilenfall und Spaltenbreite nicht mehr stimmen. Und es geht bei jedem
     Aufruf eine Anfrage weniger an einen Dritten.

     Erneuern mit: node tools/schriften-holen.mjs -->
<link rel="stylesheet" href="schriften/schriften.css">

<style>
/* ══════════════════════════════════════════════════════════════════════
   Gestaltungsmarken

   Alle Werte stammen aus der Übergabespezifikation, Abschnitt
   „Gestaltungsmarken". Sie stehen hier einmal und werden nirgends sonst
   als fester Wert wiederholt — genau daran ist die bisherige Fassung
   gescheitert: Die Kopfleiste trug einen fest eingetragenen Hellwert und
   blieb deshalb im Dunkelmodus weiß.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  /* ── Flächen ── */
  --papier:#FCFCFC;          /* Seitengrund */
  --leiste:#F1F3F5;          /* Kopf, Reiterleiste, Fußzeilen */
  --flaeche:#F7F8F9;         /* zurückgesetzte Karten und Hinweiskästen */
  --zeile-aktiv:#EFF2F5;     /* aktive Zeile in Navigation und Trefferliste */
  --zeile-weich:#F4F6F8;     /* überfahrene Zeile */
  --weiss:#FFFFFF;

  /* ── Schrift ── */
  --text:#14161A;            /* primär */
  --text-2:#3B4149;
  --text-2b:#4B525B;
  --text-3:#6C737C;          /* Metadaten */
  --text-4:#8B929B;          /* Zähler, schwach */
  --text-5:#9AA1A9;
  --text-6:#B4BAC1;          /* sehr schwach */
  --titel-2:#5A616A;         /* zweiter Teil der Normüberschrift */

  /* ── Linien ── */
  --linie-stark:#C4C9CF;
  --linie:#D8DBE0;
  --linie-schwach:#E4E7EA;
  --linie-zart:#F0F2F4;      /* Listentrenner */

  /* ── Verweis ── */
  --verweis:#2F5FA8;
  --verweis-kante:#C6D5EA;

  /* ── Verwaltung (Richtlinie, BMF-Schreiben) ── */
  --vw:#6A4C93;
  --vw-grund:#F3F0F8;
  --vw-rand:#D9CFEA;

  /* ── Treffer in der Suche ── */
  --treffer:#FBEEA8;
  --treffer-ohne:#EDEFF1;    /* Treffer ohne geladenen Datensatz */

  /* ── Struktur-Einfärbung: Tatbestand · Rechtsfolge · Ausnahme ── */
  --tb-dezent:#FAF3E4;  --tb-voll:#F3E3B8;  --tb-rand:#E0CE9E;
  --rf-dezent:#EDF4EE;  --rf-voll:#D6E9DB;  --rf-rand:#B4D2BC;
  --au-dezent:#FBEEEC;  --au-voll:#F5D9D4;  --au-rand:#E3B7B0;

  /* ── Schriften ── */
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  /* ── Maße ── */
  --nav:216px;               /* linke Spalte */
  --apparat:340px;           /* rechter Apparat */
  /* Lesespalte. Das Übergabepaket nannte 36 rem (576 px) — rund 66 Zeichen je
     Zeile und damit das typografische Optimum. Bei 1440 px stehen aber 820 px
     zur Verfügung; 244 davon blieben leer, während der Normtext in eine
     schmale Rinne gepresst wurde. Gesetzestexte lesen sich anders als Prosa:
     Man springt, vergleicht Absätze und verfolgt Verweise, statt Zeile für
     Zeile zu lesen — dafür sind weniger Umbrüche mehr wert als die reine
     Leseoptimierung. 46 rem sind rund 84 Zeichen; das ist die Breite, die auch
     dejure und lxgesetze fahren.

     Eine Obergrenze bleibt es trotzdem: Auf einem 1920er Schirm wächst die
     Spalte nicht weiter mit, sonst liefen die Zeilen ins Unlesbare. Wo weniger
     Platz ist, schrumpft sie von selbst — `.lesespalte-huelle` ist ein
     Flexkind mit `max-width`, keine feste Breite. */
  --lesespalte:46rem;
  --rinne:34px;              /* Absatzmarken links vom Text */
  /* Höhe der klebenden Kopfleiste. Wird von `kopfhoeheMessen()` gesetzt, weil
     sie nicht feststeht: Die Schalterzeile bricht je nach Fensterbreite um,
     und die Reiterleiste fehlt auf Startseite und Trefferliste ganz. Alles,
     was ebenfalls klebt, rechnet mit dieser Marke — sonst verschwände es
     unter der Kopfleiste. 0 als Vorgabe: Vor dem ersten Messen verhält sich
     die Seite wie bisher. */
  --kopfhoehe:0px;
  /* Der Teil der Kopfleiste, der beim Scrollen WIRKLICH stehen bleibt. Am
     Schreibtisch die ganze; auf dem Telefon nur Suchfeld und Reiter, weil die
     volle Leiste dort 217 von 844 px belegt — ein Viertel des Schirms für
     Werkzeuge, die man beim Lesen nicht ständig braucht. Alles, was ebenfalls
     klebt, rechnet mit DIESER Marke, nicht mit der vollen Höhe. */
  --kopfklebt:0px;
  /* Schriftgröße des Normtextes. Eine Marke, keine feste Zahl: Der Regler in
     der Kopfleiste schreibt sie um, und alles, was am Normtext hängt
     (Lesespalte, Fassungsvergleich), folgt von selbst. */
  --leseschrift:17.5px;

  /* ── Radien ── */
  --r-marke:2px;             /* Textmarkierung */
  --r-chip:3px;              /* Mono-Chip */
  --r-knopf:5px;
  --r-feld:6px;
  --r-karte:7px;             /* Karte, Popover */
  --r-pille:999px;

  /* ── Schatten ── */
  --schatten-popover:0 8px 24px rgba(20,22,26,.13);
  --schatten-blatt:0 -8px 28px rgba(20,22,26,.12);
  --schatten-feld:0 1px 2px rgba(20,22,26,.05);

  /* ── Was sonst als fester Wert im Regelwerk gelandet wäre ──
     Jeder dieser sechs Werte stand bis eben mitten in einer Regel und hätte
     den Moduswechsel überstanden. Genau daran ist der Bestand gescheitert:
     Die Kopfleiste trug einen festen Hellwert und blieb im Dunkelmodus weiß. */
  --legende-eigen:rgba(242,199,68,.5);   /* Marke „eigene Markierung“ in der Legende */
  --legende-eigen-kante:#C9A227;
  --auswahlrahmen:rgba(20,22,26,.35);    /* Rahmen um die gewählte Markierung */
  --vw-karte:#F8F7FA;                    /* Grund der aktiven Verwaltungskarte */
  --schleier-schublade:rgba(20,22,26,.28);
  --schleier-blatt:rgba(20,22,26,.58);
  --warnrot:#B23B3B;

  /* Deckkraft der eigenen Markierung. Im Dunkelmodus sinkt sie von .45 auf
     .22 — die Farbe bleibt dieselbe, damit die Zuordnung zwischen den Modi
     erhalten bleibt, aber die Fläche blendet nicht. Das JavaScript liest
     diesen Wert aus, statt .45 fest einzubauen. */
  --eigen-deckkraft:.45;

  color-scheme:light;
}

/* ══════════════════════════════════════════════════════════════════════
   Dunkelmodus

   Zwei Regelblöcke, wie im Bestand und in der Spezifikation:

     :root[data-darstellung=dunkel]                   ausdrückliche Wahl
     @media (prefers-color-scheme:dark) auf
       :root:not([data-darstellung=hell])             Systemvorgabe

   Der zweite Block greift nur, wenn NICHT ausdrücklich hell gewählt wurde.
   Damit gewinnt die Wahl in beide Richtungen, und „System“ ist schlicht die
   Abwesenheit einer Wahl.

   Die Werte stammen aus der Spezifikation, Abschnitt „Farben — Dunkelmodus“.
   Sie sind aus der Dunkelpalette des Bestands abgeleitet und auf die kühlere
   Hellpalette umgestimmt — nicht algorithmisch invertiert. Die Struktur-Töne
   sind eigens gewählt, weil helle Flächen auf dunklem Grund blenden.
   ══════════════════════════════════════════════════════════════════════ */
@media (prefers-color-scheme:dark){
  :root:not([data-darstellung=hell]){
    --papier:#15161A;
    --leiste:#1D1F24;
    --flaeche:#1A1C21;
    --zeile-aktiv:#23262C;
    --zeile-weich:#202227;
    --weiss:#15161A;              /* „weiß“ meint hier die erhabene Fläche */

    --text:#E7E9EC;
    --text-2:#C6CBD1;
    --text-2b:#B9BEC5;
    --text-3:#9AA1AA;
    --text-4:#7C838C;
    --text-5:#727982;
    --text-6:#666D76;
    --titel-2:#9AA1AA;

    --linie-stark:#3E4147;
    --linie:#2F3238;
    --linie-schwach:#282A2F;
    --linie-zart:#202227;

    --verweis:#7FA9E0;
    --verweis-kante:#35486B;

    --vw:#A98FD6;
    --vw-grund:#241F30;
    --vw-rand:#3A3050;
    --vw-karte:#1F1B29;

    --treffer:#574A16;
    --treffer-ohne:#262930;

    --tb-dezent:#2E2A17;  --tb-voll:#463D14;  --tb-rand:#C9AE4A;
    --rf-dezent:#192720;  --rf-voll:#1C3826;  --rf-rand:#6FB588;
    --au-dezent:#2A1E1D;  --au-voll:#3E2621;  --au-rand:#CE8B72;

    --legende-eigen:rgba(242,199,68,.22);
    --legende-eigen-kante:#F2C744;
    --auswahlrahmen:rgba(231,233,236,.42);
    --schleier-schublade:rgba(0,0,0,.5);
    --schleier-blatt:rgba(0,0,0,.66);
    --warnrot:#E08A8A;

    /* Fläche der eigenen Markierung: dieselbe Farbe, geringere Deckkraft. */
    --eigen-deckkraft:.22;

    --schatten-popover:0 8px 24px rgba(0,0,0,.5);
    --schatten-blatt:0 -8px 28px rgba(0,0,0,.45);
    --schatten-feld:0 1px 2px rgba(0,0,0,.3);

    color-scheme:dark;
  }
}

:root[data-darstellung=dunkel]{
  --papier:#15161A;
  --leiste:#1D1F24;
  --flaeche:#1A1C21;
  --zeile-aktiv:#23262C;
  --zeile-weich:#202227;
  --weiss:#15161A;              /* „weiß“ meint hier die erhabene Fläche */

  --text:#E7E9EC;
  --text-2:#C6CBD1;
  --text-2b:#B9BEC5;
  --text-3:#9AA1AA;
  --text-4:#7C838C;
  --text-5:#727982;
  --text-6:#666D76;
  --titel-2:#9AA1AA;

  --linie-stark:#3E4147;
  --linie:#2F3238;
  --linie-schwach:#282A2F;
  --linie-zart:#202227;

  --verweis:#7FA9E0;
  --verweis-kante:#35486B;

  --vw:#A98FD6;
  --vw-grund:#241F30;
  --vw-rand:#3A3050;
  --vw-karte:#1F1B29;

  --treffer:#574A16;
  --treffer-ohne:#262930;

  --tb-dezent:#2E2A17;  --tb-voll:#463D14;  --tb-rand:#C9AE4A;
  --rf-dezent:#192720;  --rf-voll:#1C3826;  --rf-rand:#6FB588;
  --au-dezent:#2A1E1D;  --au-voll:#3E2621;  --au-rand:#CE8B72;

  --legende-eigen:rgba(242,199,68,.22);
  --legende-eigen-kante:#F2C744;
  --auswahlrahmen:rgba(231,233,236,.42);
  --schleier-schublade:rgba(0,0,0,.5);
  --schleier-blatt:rgba(0,0,0,.66);
  --warnrot:#E08A8A;

  /* Fläche der eigenen Markierung: dieselbe Farbe, geringere Deckkraft. */
  --eigen-deckkraft:.22;

  --schatten-popover:0 8px 24px rgba(0,0,0,.5);
  --schatten-blatt:0 -8px 28px rgba(0,0,0,.45);
  --schatten-feld:0 1px 2px rgba(0,0,0,.3);

  color-scheme:dark;
}

/* Die Druckfassung ist IMMER hell — unabhängig von der Einstellung und von
   der Systemvorgabe. Tonwerte auf Papier folgen anderen Regeln als am Schirm,
   und ein dunkler Grund wird nicht gedruckt, sondern weggelassen; übrig bliebe
   heller Text auf Weiß. */
@media print{
  :root,:root[data-darstellung=dunkel]{
    --papier:#FCFCFC; --leiste:#F1F3F5; --flaeche:#F7F8F9; --weiss:#FFFFFF;
    --text:#14161A; --text-2:#3B4149; --text-2b:#4B525B; --text-3:#6C737C;
    --text-4:#8B929B; --text-5:#9AA1A9; --text-6:#B4BAC1; --titel-2:#5A616A;
    --linie-stark:#C4C9CF; --linie:#D8DBE0; --linie-schwach:#E4E7EA; --linie-zart:#F0F2F4;
    --verweis:#2F5FA8; --verweis-kante:#C6D5EA;
    --vw:#6A4C93; --vw-grund:#F3F0F8; --vw-rand:#D9CFEA;
    color-scheme:light;
  }
}

/* ══════════════════════════════════════════════════════════════════════
   Grundlagen
   ══════════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--papier);
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* Der Fokusrahmen bleibt sichtbar — er ist die einzige Orientierung für alle,
   die mit der Tastatur arbeiten. */
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:var(--r-marke)}

/* Übergänge sparsam: 120–160 ms für Popover und Blatt, sonst keine Bewegung. */
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* ══════════════════════════════════════════════════════════════════════
   Kopfleiste
   ══════════════════════════════════════════════════════════════════════ */
/* Die Kopfleiste bleibt stehen. Suchfeld, Einfärbung, Satzbild, Schriftgrad
   und die Reiter sind Werkzeuge, die man beim Lesen braucht — nicht nur am
   Anfang einer Norm. § 8b KStG hat 12 428 Zeichen; wer dort unten steht,
   scrollte bisher erst nach oben, um ein Gesetz zu wechseln.

   z-index 40: über dem Text, aber UNTER Schublade (60), Blatt (60), Schleier
   (55) und Mappe (70). Wenn die Schublade aufgeht, soll sie die Kopfleiste
   verdecken, nicht darunter durchlaufen. */
header{position:sticky;top:0;z-index:40}

/* `flex-wrap` als Notausgang: Reicht der Platz in einer Reihe nicht mehr für
   Wortmarke, Suchfeld und Schalter, rutschen die Schalter in eine zweite Reihe.
   Ohne das schrumpfte allein das Suchfeld — bei 1024 px auf 26 Pixel, ein
   Streifen ohne erkennbaren Zweck. Es hat deshalb unten eine Grenze. */
.kopf{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;row-gap:8px;
  padding:10px 16px;
  background:var(--leiste);
  border-bottom:1px solid var(--linie);
}
.wortmarke{font-family:var(--serif);font-size:16px;font-weight:600;white-space:nowrap}

.suchfeld{
  /* Die untere Grenze ist gemessen, nicht gegriffen: Kürzel, Abstand, Rahmen
     und der Platzhalter „Norm, Wortlaut oder Fundstelle …“ brauchen zusammen
     rund 260 px. Darunter ist das Feld kein Suchfeld mehr, sondern ein
     Streifen. Was nicht mehr in die Reihe passt, wandert nach unten — dafür
     trägt `.kopf` sein `flex-wrap`. */
  flex:1 1 260px;min-width:260px;display:flex;align-items:center;gap:10px;
  background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-feld);
  padding:7px 12px;max-width:520px;box-shadow:var(--schatten-feld);
  cursor:text;
}
.suchfeld .kuerzel{font-family:var(--mono);font-size:11px;color:var(--text-4);flex:none}
.suchfeld input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:13.5px;color:var(--text)}
.suchfeld input::placeholder{color:var(--text-4)}
.suchfeld input:focus{outline:0}
.suchfeld:focus-within{border-color:var(--text)}

/* ── Vorschläge unter dem Suchfeld ──
   Die Liste hängt an ihrem Feld, nicht am Seitenkörper: Beide Suchfelder — das
   in der Kopfleiste und das große auf der Startseite — bekommen dieselbe
   Hülle und dieselbe Liste. `z-index` gilt innerhalb der Kopfleiste; die liegt
   als Ganzes auf 40 und damit über dem Text. */
.suchhuelle{position:relative}
.vorschlaege{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:70;
  background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-feld);
  box-shadow:var(--schatten-popover);
  max-height:min(60vh,420px);overflow-y:auto;
}
.vorschlaege[hidden]{display:none}
.vorschlag{
  display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
  padding:8px 12px;font-size:13px;color:var(--text-2b);
}
.vorschlag+.vorschlag{border-top:1px solid var(--linie-zart)}
.vorschlag:hover,.vorschlag[aria-selected=true]{background:var(--zeile-aktiv)}
.vorschlag .vkopf{font-family:var(--serif);font-size:14px;color:var(--text);white-space:nowrap;flex:none}
.vorschlag .vbei{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-3);font-size:12.5px}
.vorschlag .vmarke{font-family:var(--mono);font-size:10px;color:var(--text-5);white-space:nowrap;flex:none}

/* Umbrechen statt überlaufen. Mit vier Schaltergruppen passt die Zeile
   unterhalb von 1440 px nicht mehr in einer Reihe; eine zweite Reihe ist
   besser als ein waagerechter Bildlauf über die ganze Seite. */
.kopf-rechts{display:flex;align-items:center;gap:14px;margin-left:auto;flex-wrap:wrap;row-gap:8px}
.kopfgruppe{display:flex;align-items:center;gap:8px}
.kopfgruppe>span{font-size:12.5px;color:var(--text-3);white-space:nowrap}
.stufen{display:flex;border:1px solid var(--linie);border-radius:var(--r-knopf);overflow:hidden;background:var(--weiss)}
.stufen button{padding:5px 10px;font-size:12.5px;line-height:1;color:var(--text-2b);background:var(--weiss)}
.stufen button[aria-checked=true]{background:var(--text);color:var(--papier)}
.stufen button:disabled{color:var(--text-6);cursor:not-allowed}
#schrift button{font-family:var(--mono);font-size:14px;padding:3px 9px;line-height:1.2}
.schrift-wert{
  font-family:var(--mono);font-size:11px;color:var(--text-3);
  min-width:34px;text-align:center;align-self:center;
  border-left:1px solid var(--linie);border-right:1px solid var(--linie);
  padding:5px 0;background:var(--weiss);
}
.trenner{width:1px;height:22px;background:var(--linie);flex:none}
.kopf-knoepfe{display:flex;gap:6px;font-size:12.5px}
.kopf-knoepfe button{
  border:1px solid var(--linie);background:var(--weiss);color:var(--text-2b);
  border-radius:var(--r-knopf);padding:5px 10px;white-space:nowrap;
}
.kopf-knoepfe button:hover:not(:disabled){border-color:var(--text);color:var(--text)}
.kopf-knoepfe button:disabled,.stufen button:disabled{
  color:var(--text-5);border-color:var(--linie-schwach);cursor:not-allowed;
}

/* ══════════════════════════════════════════════════════════════════════
   Reiterleiste — GEÖFFNETE Normen, nicht die Normen des Gesetzes
   ══════════════════════════════════════════════════════════════════════ */
.reiterleiste{
  display:flex;align-items:stretch;gap:0;padding:0 16px;
  background:var(--leiste);border-bottom:1px solid var(--linie);
  overflow-x:auto;scrollbar-width:none;
}
.reiterleiste::-webkit-scrollbar{display:none}
.reiter{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;font-size:13px;color:var(--text-3);
  border:1px solid transparent;white-space:nowrap;flex:none;
}
.reiter-abk{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--text-4)}
.reiter[aria-selected=true] .reiter-abk{color:var(--text-2b)}
.reiter .nr{font-family:var(--serif);margin-left:-4px}
.reiter .zu{color:var(--text-6);font-size:13px;line-height:1;padding:2px}
.reiter .zu:hover{color:var(--text)}
.reiter[aria-selected=true]{
  background:var(--papier);border-color:var(--linie);border-bottom-color:var(--papier);
  border-radius:var(--r-knopf) var(--r-knopf) 0 0;margin-bottom:-1px;color:var(--text);
}
.reiter[aria-selected=true] .zu{color:var(--text-4)}
.reiter-plus{display:flex;align-items:center;padding:8px 12px;font-size:15px;color:var(--text-4);flex:none}
.reiter-plus:hover{color:var(--text)}
/* Beim Umsortieren per Ziehen: der gezogene Reiter tritt zurück, das Ziel
   bekommt eine Kante an der Seite, an der eingefügt wird. */
.reiter[draggable=true]{cursor:grab}
.reiter.zieht{opacity:.4}
.reiter.ziel-links{box-shadow:inset 2px 0 0 var(--text)}
.reiter.ziel-rechts{box-shadow:inset -2px 0 0 var(--text)}
.reiter-zahl{
  display:flex;align-items:center;margin-left:auto;padding-left:16px;
  font-size:11.5px;color:var(--text-4);white-space:nowrap;flex:none;
}

/* ══════════════════════════════════════════════════════════════════════
   Grundraster: 216 · flexibel · 340
   ══════════════════════════════════════════════════════════════════════ */
.raster{display:flex;align-items:flex-start}

/* ── Linke Spalte ── */
.navspalte{
  width:var(--nav);flex:none;
  border-right:1px solid var(--linie-schwach);
  padding:18px 0 60px;
  position:sticky;top:var(--kopfklebt);max-height:calc(100vh - var(--kopfklebt));overflow-y:auto;
}
.mono-etikett{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-4);
}
.navspalte>.mono-etikett{padding:0 16px 8px}
.normzeile{
  display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;
  padding:6px 16px;border-left:2px solid transparent;background:transparent;
}
.normzeile:hover{background:var(--zeile-weich)}
.normzeile .nr{font-family:var(--serif);font-size:13.5px;color:var(--text-2b);white-space:nowrap}
.normzeile .titel{font-size:12.5px;color:var(--text-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.normzeile[aria-current=true]{background:var(--zeile-aktiv);border-left-color:var(--text)}
.normzeile[aria-current=true] .nr{color:var(--text)}
.normzeile[aria-current=true] .titel{color:var(--titel-2)}
.zuletzt{margin-top:22px;padding:0 16px}
.zuletzt .mono-etikett{margin-bottom:8px}
.zuletzt-liste{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--text-3);align-items:flex-start}
.zuletzt-liste button:hover{color:var(--text)}

/* ── Griffe zwischen den Spalten ──
   216 und 340 px sind eine Setzung, keine Wahrheit: Im Verzeichnis brechen
   lange Überschriften nach drei Wörtern ab („Innergemeinschaftlic…"), und im
   Apparat steht ein UStAE-Auszug in einer Spalte von 340 px. Wer einen breiten
   Schirm hat, soll ihn hergeben können.

   Der Griff liegt ÜBER der Trennlinie statt neben ihr: Die negativen Ränder
   heben seine neun Pixel wieder auf, damit er im Raster keine Breite kostet
   und die Spalten dort bleiben, wo sie ohne ihn wären. Sichtbar wird er erst
   unter dem Zeiger oder im Tastaturfokus — eine dauerhaft gezeichnete
   Doppellinie zwischen den Spalten wäre lauter als die Sache wert ist. */
.griff{
  flex:none;width:9px;margin:0 -4px;z-index:2;
  position:sticky;top:var(--kopfklebt);height:calc(100vh - var(--kopfklebt));
  display:flex;align-items:center;justify-content:center;
  cursor:col-resize;background:transparent;border:0;padding:0;
  touch-action:none;   /* sonst scrollt das Telefon, statt zu ziehen */
}
.griff::before{
  content:"";width:1px;height:100%;background:transparent;
  transition:background 120ms ease-out,width 120ms ease-out;
}
.griff:hover::before,
.griff:focus-visible::before,
.griff[data-zieht]::before{background:var(--text-4);width:3px}
.griff:focus-visible{outline:0}
/* Ohne die zugehörige Spalte hat der Griff nichts zu greifen. */
body[data-ansicht=start] .griff,
body[data-ansicht=uebersicht] .griff,
body[data-ansicht=suche] .griff,
body[data-ansicht=vergleich] #griff-apparat{display:none}

/* ── Mittelspalte ── */
.hauptspalte{flex:1;min-width:0;padding:30px 32px 70px}
.brotkrume{
  display:flex;align-items:baseline;gap:10px;
  font-family:var(--mono);font-size:11px;color:var(--text-4);letter-spacing:.06em;
}
.hauptspalte h1{
  font-family:var(--serif);font-size:30px;line-height:1.2;font-weight:400;
  margin:10px 0 0;letter-spacing:-.015em;
}
.hauptspalte h1 .titel{color:var(--titel-2)}
.meta{
  margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  font-size:12px;color:var(--text-3);
}
.etikett{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--linie);border-radius:var(--r-chip);padding:3px 8px;color:var(--text-3);
}
.etikett.gefuellt{background:var(--leiste);color:var(--text-2b)}

/* Der Normtext steht in der Mitte der Seite, nicht am linken Rand — wie bei
   dejure und lxgesetze. Zentriert wird der ganze Block aus Kopf, Metazeile,
   Rinne und Lesespalte: Stünde nur die Lesespalte mittig, hinge die
   Überschrift daneben. Der Ausschluss der Blätterleiste ist Absicht, sie
   trägt ihre eigene Breite. */
body[data-ansicht=norm] .hauptspalte > *{
  max-width:calc(var(--lesespalte) + var(--rinne) + 24px);
  margin-left:auto;margin-right:auto;
}
body[data-ansicht=norm] .blaettern{margin-left:auto;margin-right:auto}

/* Leseraum: Absatzrinne und Lesespalte */
.leseraum{display:flex;gap:24px;margin-top:30px;align-items:flex-start}
/* Die Rinne klebt. Seit die Absatzbezeichnung im Text steht, wäre ein
   Stapel Nummern oben links nur eine Wiederholung; mitlaufend ist er etwas
   anderes — eine Standanzeige, die beim Scrollen sagt, in welchem Absatz man
   liest, und mit einem Klick zu jedem anderen springt. `rinneMitlaufen`
   setzt die Hervorhebung dafür bereits. */
.rinne{
  flex:none;width:var(--rinne);display:flex;flex-direction:column;gap:2px;
  padding-top:4px;position:sticky;top:calc(var(--kopfklebt) + 12px);align-self:flex-start;
  max-height:calc(100vh - var(--kopfklebt) - 24px);overflow-y:auto;scrollbar-width:none;
}
.rinne::-webkit-scrollbar{display:none}
.rinne button{
  font-family:var(--mono);font-size:10.5px;color:var(--text-5);
  border-right:2px solid var(--linie-schwach);text-align:right;padding:2px 6px 2px 0;
}
.rinne button:hover{color:var(--text-2b)}
.rinne button[aria-current=true]{color:var(--text);border-right-color:var(--text)}
.lesespalte-huelle{flex:1;min-width:0;max-width:var(--lesespalte)}
.lesespalte{max-width:var(--lesespalte)}

/* Lesetypografie. Der Wortlaut kommt unverändert aus data/; hier wird
   ausschließlich gesetzt, nicht ergänzt. */
.lesespalte{font-family:var(--serif);font-size:var(--leseschrift);line-height:1.8;color:var(--text)}
.lesespalte p{margin:0 0 12px}
.lesespalte .absatz{
  margin-bottom:10px;
  /* Ein Sprung zu „(4a)" landete sonst hinter der klebenden Kopfleiste. */
  scroll-margin-top:calc(var(--kopfklebt) + 14px);
}
.lesespalte dl{margin:8px 0 12px}
.lesespalte dt{
  float:left;clear:left;font-family:var(--mono);font-size:12.5px;color:var(--text-5);
  min-width:34px;padding-top:6px;
}
.lesespalte dd{margin:0 0 8px 40px}
/* Aufzählungsglieder liegen in den amtlichen Daten als ZWEI benachbarte
   <span> vor — Bedingung und Anordnung:
     <dd><span>… vorzunehmen ist:</span><span>nach der nach Absatz 2 …</span></dd>
   Zwischen zwei Elementen steht im Quelltext kein Leerzeichen, der Browser
   setzt also keines. Angezeigt wurde deshalb „vorzunehmen ist:nach der“.
   Die verkündete Fassung hat an dieser Stelle ein Leerzeichen; es wird hier
   als Trennung zwischen zwei Elementen wiederhergestellt. Am Wortlaut ändert
   das nichts — es wird kein Wort eingefügt, gekürzt oder ersetzt. */
.lesespalte dd>span+span::before{content:" ";white-space:pre}
/* Satznummer. In `em`, nicht in `px`: Sie soll mit dem Schriftgrad des
   Normtextes mitwachsen — bei 24 px Lesetext wäre eine 10-px-Ziffer nicht mehr
   zu erkennen. Der Ton ist deutlich dunkler als zuvor (--text-6 war so hell,
   dass die Nummer im Fließtext verschwand) und trägt die Verweisfarbe: Sie
   IST ein Verweis — auf die Fundstelle, die im `title` steht. */
.lesespalte .sn{
  font-family:var(--mono);font-size:.62em;font-weight:600;
  color:var(--verweis);vertical-align:super;line-height:0;
  margin-right:.22em;-webkit-user-select:none;user-select:none;
  cursor:help;
}
/* Absatzbezeichnung im Text. `user-select:none` ist keine Kosmetik: Ohne das
   landete „(1)" beim Markieren im Ankertext, und der findet sich im
   kanonischen Volltext dann nicht wieder. */
.lesespalte .an{
  font-family:var(--sans);font-weight:600;font-size:.9em;color:var(--text-2b);
  margin-right:.45em;-webkit-user-select:none;user-select:none;
}
.lesespalte table{border-collapse:collapse;font-family:var(--sans);font-size:13.5px;margin:12px 0;width:100%}
.lesespalte td{border-top:1px solid var(--linie-schwach);padding:6px 10px 6px 0;vertical-align:top;line-height:1.5}
.lesespalte pre{
  font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--text-2);
  background:var(--flaeche);padding:10px 12px;border-radius:var(--r-chip);overflow-x:auto;
}

/* ══════════════════════════════════════════════════════════════════════
   Auszeichnungsebene 1: maschinelle Struktur

   Kodierung ist die FLÄCHE. Der `box-shadow` in derselben Farbe zieht die
   Tönung über die Zeilenhöhe hinaus — ohne ihn endet sie an der Schriftkante
   und die Zeilen wirken zerschnitten.

   Im Normtext steht kein Wort dazu. Was die Farben bedeuten, sagt allein die
   Legende darüber.
   ══════════════════════════════════════════════════════════════════════ */
.s{border-radius:var(--r-marke)}

body[data-struktur=dezent] .s-tatbestand{background:var(--tb-dezent);box-shadow:0 0 0 1px var(--tb-dezent)}
body[data-struktur=dezent] .s-rechtsfolge{background:var(--rf-dezent);box-shadow:0 0 0 1px var(--rf-dezent)}
body[data-struktur=dezent] .s-ausnahme{background:var(--au-dezent);box-shadow:0 0 0 1px var(--au-dezent)}

body[data-struktur=voll] .s-tatbestand{background:var(--tb-voll);box-shadow:0 0 0 2px var(--tb-voll)}
body[data-struktur=voll] .s-rechtsfolge{background:var(--rf-voll);box-shadow:0 0 0 2px var(--rf-voll)}
body[data-struktur=voll] .s-ausnahme{background:var(--au-voll);box-shadow:0 0 0 2px var(--au-voll)}

/* Stufe „aus“ entfernt jede Struktur-Tönung. Eigene Markierungen und
   Verwaltungsstellen bleiben in allen Stufen sichtbar — sie sind keine
   Struktur, sondern Nachweis und eigene Arbeit. */
body[data-struktur=aus] .s{background:transparent;box-shadow:none}

/* Aufzählungsmarken („1.“, „a)“) stehen im kanonischen Volltext und liegen
   deshalb rechnerisch innerhalb der Spannen — eine Rechtsfolge, die über eine
   Aufzählung läuft, schließt sie ein. Eingefärbt werden sie trotzdem nicht:
   Sie gliedern den Text, sie sind nicht sein Inhalt. Die Zeichenpositionen
   bleiben davon unberührt; es ändert sich nur, was man sieht. */
.lesespalte dt .s{background:transparent!important;box-shadow:none!important}

/* ── Legende ── */
.legende{
  display:flex;flex-wrap:wrap;align-items:center;gap:7px 14px;
  margin-bottom:18px;font-size:11.5px;color:var(--text-3);
}
.legende span{display:flex;align-items:center;gap:6px}
.legende .marke{width:22px;height:9px;border-radius:var(--r-marke);flex:none}
.legende .m-tatbestand{box-shadow:inset 0 0 0 1px var(--tb-rand)}
.legende .m-rechtsfolge{box-shadow:inset 0 0 0 1px var(--rf-rand)}
.legende .m-ausnahme{box-shadow:inset 0 0 0 1px var(--au-rand)}
body[data-struktur=dezent] .legende .m-tatbestand{background:var(--tb-dezent)}
body[data-struktur=dezent] .legende .m-rechtsfolge{background:var(--rf-dezent)}
body[data-struktur=dezent] .legende .m-ausnahme{background:var(--au-dezent)}
body[data-struktur=voll] .legende .m-tatbestand{background:var(--tb-voll)}
body[data-struktur=voll] .legende .m-rechtsfolge{background:var(--rf-voll)}
body[data-struktur=voll] .legende .m-ausnahme{background:var(--au-voll)}
.legende .m-eigen{background:var(--legende-eigen);border-bottom:2px solid var(--legende-eigen-kante)}
.legende .m-verwaltung{border-bottom:2px dotted var(--vw)}
.legende .anmerkung{color:var(--text-5);flex-basis:100%}

/* ══════════════════════════════════════════════════════════════════════
   Auszeichnungsebene 2: eigene Markierung

   Kodierung ist der MARKER — halbdurchsichtige Fläche mit farbiger
   Unterkante. Damit bleibt sie von der maschinellen Struktur (volle Fläche,
   keine Kante) und von der Verwaltungsstelle (Punktlinie, keine Fläche) auf
   den ersten Blick unterscheidbar, auch wenn alle drei übereinander liegen.

   Farbe und Deckkraft stehen im style-Attribut, weil sie frei wählbar sind;
   alles Übrige steht hier.
   ══════════════════════════════════════════════════════════════════════ */
.eigen{
  border-radius:var(--r-marke) var(--r-marke) 0 0;
  padding:0 1px;cursor:pointer;
}
.eigen.gewaehlt{outline:2px solid var(--auswahlrahmen);outline-offset:1px}

/* ── Werkzeugleiste an der Auswahl ── */
.auswahlleiste{
  position:absolute;z-index:70;display:none;align-items:center;gap:5px;
  padding:5px 6px;background:var(--weiss);
  border:1px solid var(--linie);border-radius:var(--r-karte);
  box-shadow:var(--schatten-popover);
}
.auswahlleiste.offen{display:flex}
.auswahlleiste .titel{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-4);margin-right:3px;white-space:nowrap;
}

/* ── Farbkreise ── */
.farbreihe{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.farbkreis{
  width:20px;height:20px;border-radius:50%;cursor:pointer;flex:none;
  border:0;padding:0;
}
.farbwaehler{
  -webkit-appearance:none;appearance:none;border:0;background:none;padding:0;
  width:22px;height:22px;cursor:pointer;flex:none;
}
.farbwaehler::-webkit-color-swatch-wrapper{padding:0}
.farbwaehler::-webkit-color-swatch{border:1px solid var(--linie);border-radius:50%}
.farbwaehler::-moz-color-swatch{border:1px solid var(--linie);border-radius:50%}
.hexwert{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}

/* ── Popover am Text ── */
.popover{
  position:absolute;z-index:70;display:none;flex-direction:column;gap:10px;
  width:300px;background:var(--weiss);
  border:1px solid var(--linie);border-radius:var(--r-karte);
  box-shadow:var(--schatten-popover);padding:12px 13px;
}
.popover.offen{display:flex}
.popover-kopf{display:flex;align-items:center;justify-content:space-between}
.popover-kopf .mono-etikett{font-size:9.5px;letter-spacing:.16em}
.popover-kopf button{color:var(--text-4);font-size:13px;line-height:1;padding:2px 4px}
.popover-kopf button:hover{color:var(--text)}
.popover hr{border:0;border-top:1px solid var(--linie-zart);margin:0}
.popover textarea{
  width:100%;min-height:56px;resize:vertical;font:inherit;font-size:12.5px;line-height:1.55;
  color:var(--text-2);background:var(--flaeche);
  border:1px solid var(--linie-schwach);border-radius:var(--r-knopf);padding:7px 8px;
}
.popover textarea:focus{outline:0;border-color:var(--linie-stark)}
.popover-fuss{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:11px;color:var(--text-5);
}
.popover-fuss button{color:var(--text-3);font-size:11px}
.popover-fuss button:hover{color:var(--warnrot)}

/* ── Register „Markierungen“ ── */
.karte{
  cursor:pointer;border-left:2px solid var(--linie-schwach);
  padding:2px 0 2px 11px;margin-bottom:16px;
}
.karte:last-of-type{margin-bottom:0}
.karte.aktiv{background:var(--flaeche)}
.karte-kopf{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.karte-punkt{width:9px;height:9px;border-radius:50%;flex:none}
.karte-fundstelle{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.karte-datum{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-5)}
.karte-wortlaut{font-family:var(--serif);font-size:13.5px;line-height:1.5;color:var(--text);margin:0}
.karte-notiz{font-size:12.5px;line-height:1.55;color:var(--text-2b);margin:5px 0 0}
.karte-farbzeile{margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.karte-verschoben{
  font-size:11px;color:var(--text-4);margin:5px 0 0;
}

/* ══════════════════════════════════════════════════════════════════════
   Auszeichnungsebene 3: Verwaltungsstelle

   Kodierung ist die PUNKTLINIE — keine Fläche, keine durchgezogene Kante.
   Damit bleibt sie unter einer Struktur-Tönung und unter einer eigenen
   Markierung sichtbar. Dahinter steht ein Mono-Chip mit der Fundstelle; die
   Farbe allein trägt die Information also nicht.
   ══════════════════════════════════════════════════════════════════════ */
.vw{border-bottom:2px dotted var(--vw);cursor:pointer;padding-bottom:1px}
.vw.gewaehlt{background:var(--vw-grund)}

/* Der Chip ist ein Verweiszeichen, kein Wortlaut. `user-select:none` hält ihn
   aus der Zwischenablage heraus: Wer den Normtext kopiert, bekommt den
   Normtext — nicht die Fundstellen dieser Seite. */
.vw-chip{
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--vw);background:var(--vw-grund);border:1px solid var(--vw-rand);
  border-radius:var(--r-chip);padding:1px 4px;margin-left:3px;
  vertical-align:3px;cursor:pointer;white-space:nowrap;
  -webkit-user-select:none;user-select:none;
}
.vw-chip:hover{border-color:var(--vw)}

/* ── Karten im Register „Verwaltung“ ── */
.karte.vw-karte.aktiv{background:var(--vw-karte)}
.karte.vw-karte.aktiv{border-left-color:var(--vw)}
.vw-beleg{
  font-family:var(--mono);font-size:10px;color:var(--text-4);
  display:block;margin-top:6px;
}

.zitatwolke{display:flex;flex-wrap:wrap;gap:6px}
.zitat{
  border:1px solid var(--linie);border-radius:var(--r-chip);padding:3px 8px;
  font-family:var(--serif);font-size:12.5px;color:var(--text-2b);
}
.zitat:hover{border-color:var(--text);color:var(--text);background:var(--flaeche)}
.zitat-gesetz{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-4);margin-right:5px;
}

/* ══════════════════════════════════════════════════════════════════════
   Mappe — Sammelmappe für Normen und markierte Stellen
   ══════════════════════════════════════════════════════════════════════ */
/* `fixed`, nicht `absolute`: Die Mappe hängt an einem Knopf in der klebenden
   Kopfleiste. Dokumentkoordinaten liefen beim Scrollen unter ihr weg, während
   der Knopf stehen bliebe. */
.mappe{
  position:fixed;z-index:70;display:none;flex-direction:column;
  width:392px;background:var(--weiss);
  border:1px solid var(--linie);border-radius:8px;
  box-shadow:var(--schatten-popover);overflow:hidden;
}
.mappe.offen{display:flex}
.mappe-kopf{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px 10px;border-bottom:1px solid var(--linie-zart);
}
.mappe-kopf-zahl{
  margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-4);
}
.mappe-kopf button{font-size:16px;line-height:1;color:var(--text-4);padding:0 2px}
.mappe-kopf button:hover{color:var(--text)}
.mappe-liste{padding:6px}
.mappe-zeile{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:7px 9px;border-radius:var(--r-knopf);font-size:13.5px;color:var(--text-2b);
}
.mappe-zeile:hover{background:var(--zeile-weich)}
.mappe-zeile[aria-current=true]{background:var(--zeile-aktiv);color:var(--text)}
.mappe-punkt{width:6px;height:6px;border-radius:50%;flex:none}
.mappe-zahl{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-4)}
.mappe-neu{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:9px;margin-top:4px;border-top:1px solid var(--linie-zart);
  font-size:13px;color:var(--text-3);
}
.mappe-neu:hover{color:var(--text)}

.mappe-inhalt{background:var(--flaeche);border-top:1px solid var(--linie-zart);padding:12px 14px}
.mappe-inhalt-kopf{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.mappe-name{font-family:var(--serif);font-size:15px;color:var(--text)}
.mappe-meta{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-4)}
.mappe-eintraege{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto}
.mappe-eintrag{
  display:block;width:100%;text-align:left;
  background:var(--weiss);border:1px solid var(--linie-schwach);
  border-left:2px solid var(--linie-schwach);border-radius:var(--r-knopf);
  padding:8px 10px;
}
.mappe-eintrag:hover{border-color:var(--linie-stark)}
.mappe-eintrag-kopf{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mappe-eintrag-stelle{font-family:var(--mono);font-size:11px;color:var(--text-2b)}
.mappe-eintrag-art{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-4);border:1px solid var(--linie-schwach);border-radius:var(--r-chip);padding:1px 5px;
}
.mappe-eintrag-datum{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--text-5)}
.mappe-eintrag-text{font-size:12.5px;line-height:1.5;color:var(--text-2);margin:0}
.mappe-knoepfe{
  display:flex;gap:8px;padding:12px 14px 0;border-top:1px solid var(--linie-zart);margin-top:12px;
}
.mappe-knoepfe button{
  border:1px solid var(--linie);background:var(--weiss);color:var(--text-2b);
  border-radius:var(--r-knopf);padding:5px 10px;font-size:12.5px;white-space:nowrap;
}
.mappe-knoepfe button:hover:not(:disabled){border-color:var(--text);color:var(--text)}
.mappe-knoepfe button:disabled{color:var(--text-5);border-color:var(--linie-schwach);cursor:not-allowed}
.mappe-knoepfe .rechts{margin-left:auto}
.mappe-fuss{
  padding:10px 14px 12px;font-size:11px;line-height:1.55;color:var(--text-5);
}

/* ══════════════════════════════════════════════════════════════════════
   Fassungsvergleich

   Zwei Spalten, Wort für Wort verglichen. Die Farben kommen aus denselben
   Marken wie die Struktur-Einfärbung und folgen damit dem Dunkelmodus von
   selbst — ein fester Hellwert überstünde den Moduswechsel.
   ══════════════════════════════════════════════════════════════════════ */
.vergleich-leiste{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin:0 0 14px;padding-bottom:14px;border-bottom:1px solid var(--linie-schwach);
}
.vergleich-wahl{
  font-family:var(--mono);font-size:12px;color:var(--text-2b);
  background:var(--weiss);border:1px solid var(--linie);border-radius:var(--r-knopf);
  padding:5px 8px;
}
.vergleich-gegen{font-size:12px;color:var(--text-4)}
.vergleich-zurueck{
  margin-left:auto;border:1px solid var(--linie);border-radius:var(--r-knopf);
  padding:5px 10px;font-size:12.5px;color:var(--text-2b);background:var(--weiss);
}
.vergleich-zurueck:hover{border-color:var(--text);color:var(--text)}
.vergleich-legende{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.vergleich-marke{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 7px;border-radius:var(--r-chip);
}
.vergleich-hinweis{font-size:11px;color:var(--text-4)}

.vergleich-raster{display:grid;grid-template-columns:1fr 1fr;gap:1px 18px;align-items:start}
.vergleich-kopf{
  position:sticky;top:var(--kopfklebt);z-index:3;background:var(--papier);
  display:flex;flex-direction:column;gap:3px;
  padding:8px 0 9px;border-bottom:1px solid var(--linie);margin-bottom:6px;
}
.vergleich-stand{font-size:11.5px;line-height:1.45;color:var(--text-3)}
.vergleich-zelle{
  /* Zwei Spalten nebeneinander: etwas kleiner als der einspaltige Lesetext,
     aber demselben Regler unterworfen. */
  font-family:var(--serif);font-size:calc(var(--leseschrift) - 3px);
  line-height:1.7;color:var(--text);
  padding:10px 12px;border-radius:var(--r-knopf);
  border:1px solid transparent;
}
.vergleich-zelle.geaendert{background:var(--flaeche);border-color:var(--linie-zart)}
.vergleich-zelle.fehlt em{color:var(--text-4);font-size:12.5px}
.vergleich-nummer{
  display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  color:var(--text-4);margin-bottom:5px;
}
/* Entfallenes und Neues. Beides trägt zusätzlich zur Fläche eine Kante —
   Farbe allein trägt die Auskunft nicht, wenn sie nicht unterschieden wird. */
del.v-weg,.vergleich-marke.v-weg{
  background:var(--au-voll);box-shadow:0 0 0 1px var(--au-rand);
  text-decoration:line-through;text-decoration-thickness:1px;
  border-radius:2px;
}
ins.v-neu,.vergleich-marke.v-neu{
  background:var(--rf-voll);box-shadow:0 0 0 1px var(--rf-rand);
  text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;
  border-radius:2px;
}
.vergleich-bilanz{
  margin:20px 0 0;padding-top:14px;border-top:1px solid var(--linie-schwach);
  font-size:12.5px;line-height:1.6;color:var(--text-3);
}
.vergleich-quelle{margin:8px 0 0;font-size:11px;line-height:1.6;color:var(--text-5)}

/* ══════════════════════════════════════════════════════════════════════
   Satzweise Darstellung

   Zwei Satzbilder derselben Norm. Fortlaufend ist die amtliche Form: Ein
   Absatz ist ein Fließtext, so steht er im Bundesgesetzblatt. Satzweise
   bricht ihn auf — jeder Satz eine Zeile, die Absatzbezeichnung darüber.

   Das ist kein Eingriff in den Wortlaut, sondern in den Umbruch: Es wird
   kein Zeichen eingefügt, gekürzt oder umgestellt. Wer den Text kopiert,
   bekommt in beiden Ansichten dasselbe.

   Warum es hilft: Ein Absatz des Steuerrechts trägt regelmäßig vier bis sechs
   Sätze mit je eigener Anordnung. Fortlaufend gesetzt muss der Leser die
   Satzgrenzen selbst finden, um „Satz 3" zu treffen; satzweise stehen sie da.
   ══════════════════════════════════════════════════════════════════════ */
body[data-satzbild=einzeln] .lesespalte .satz{
  display:block;
  margin-bottom:.72em;
}
body[data-satzbild=einzeln] .lesespalte .satz:last-child{margin-bottom:0}
/* Die Absatzbezeichnung rückt auf eine eigene Zeile und bekommt Luft — sie
   gliedert dann sichtbar, statt am ersten Satz zu kleben. */
body[data-satzbild=einzeln] .lesespalte .an{
  display:block;
  font-size:1em;
  margin:0 0 .5em;
}
body[data-satzbild=einzeln] .lesespalte .absatz{margin-bottom:1.35em}
/* Ohne Hülle kein Umbruch: Sätze über Elementgrenzen bleiben fortlaufend.
   Damit das nicht wie ein Fehler aussieht, rücken sie wenigstens ab. */
body[data-satzbild=einzeln] .lesespalte p{margin-bottom:.72em}

/* Verweis auf eine andere Norm. Die Unterkante ist heller als die Schrift —
   der Verweis soll im Lesefluss erkennbar sein, ohne ihn zu zerhacken. */
.lesespalte a.verweis{
  color:var(--verweis);border-bottom:1px solid var(--verweis-kante);
  white-space:nowrap;
}
.lesespalte a.verweis:hover{border-bottom-color:var(--verweis)}

/* Blättern zur Nachbarnorm */
.blaettern{
  display:flex;justify-content:space-between;gap:24px;
  max-width:calc(var(--lesespalte) + var(--rinne) + 24px);
  margin:44px 0 0 calc(var(--rinne) + 24px);
  border-top:1px solid var(--linie-schwach);padding-top:16px;
}
.blaettern button{text-align:left;max-width:46%}
.blaettern button:last-child{text-align:right}
.blaettern .richtung{
  display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-4);margin-bottom:3px;
}
.blaettern .wohin{font-family:var(--serif);font-size:14.5px;color:var(--text-2b);line-height:1.35}
.blaettern button:hover .wohin{color:var(--text)}

/* ── Rechter Apparat ── */
.apparat{
  width:var(--apparat);flex:none;
  border-left:1px solid var(--linie-schwach);
  position:sticky;top:var(--kopfklebt);max-height:calc(100vh - var(--kopfklebt));overflow-y:auto;
  padding-bottom:40px;
}
.register{
  display:flex;justify-content:space-between;gap:8px;
  padding:0 16px;border-bottom:1px solid var(--linie-schwach);
  overflow-x:auto;scrollbar-width:none;
}
.register::-webkit-scrollbar{display:none}
.register button{flex:none}
.register button{
  font-size:12px;line-height:1;white-space:nowrap;
  padding:13px 0 11px;color:var(--text-4);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.register button:hover{color:var(--text-2b)}
.register button[aria-selected=true]{color:var(--text);border-bottom-color:var(--text)}
.registerinhalt{padding:16px}

/* Ehrlicher Platzhalter, solange ein Register noch nicht angebunden ist.
   Es wird nichts vorgetäuscht — die Ansicht sagt, was fehlt. */
.platzhalter{
  font-size:12.5px;line-height:1.6;color:var(--text-4);
  border:1px dashed var(--linie);border-radius:var(--r-karte);padding:12px 13px;margin:0;
}

/* ── Blöcke im Apparat ── */
.block{
  border-left:2px solid var(--linie-schwach);
  padding:2px 0 2px 12px;margin-bottom:18px;
}
.block:last-of-type{margin-bottom:0}
.block.betont{border-left-color:var(--verweis)}
.block>.mono-etikett{display:block;margin-bottom:5px}
.block p{margin:0 0 6px;font-size:13px;line-height:1.62;color:var(--text-2)}
.block p:last-child{margin-bottom:0}
.block .fundstelle{
  font-family:var(--mono);font-size:10.5px;color:var(--text-3);
  display:block;margin-bottom:4px;
}
.block .quelle{
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--vw);background:var(--vw-grund);border:1px solid var(--vw-rand);
  border-radius:var(--r-chip);padding:1px 5px;margin-right:6px;white-space:nowrap;
}
.block a{color:var(--verweis);border-bottom:1px solid var(--verweis-kante)}
.block .fehlt{color:var(--text-4);font-size:12.5px;line-height:1.6}

/* Fehlender Datensatz — sichtbar als fehlend, nicht überspielt. */
.fehlmeldung{
  border:1px dashed var(--linie);border-radius:var(--r-karte);
  padding:11px 12px;margin-bottom:18px;
}
.fehlmeldung .mono-etikett{display:block;margin-bottom:5px}
.fehlmeldung p{margin:0;font-size:12.5px;line-height:1.6;color:var(--text-4)}
.fehlmeldung code{font-family:var(--mono);font-size:11px;color:var(--text-3)}

/* Haftungssatz. Er steht auf jeder Ansicht mit Hinweisen und in der
   Druckfassung — das ist eine inhaltliche Auflage, keine Gestaltungsfrage. */
.haftung{
  margin-top:22px;padding-top:14px;border-top:1px solid var(--linie-zart);
  font-size:11.5px;line-height:1.6;color:var(--text-5);
}

/* ── Fehlermeldung ── */
.melder{
  max-width:var(--lesespalte);border:1px solid var(--linie-stark);border-radius:var(--r-karte);
  padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--text-2);background:var(--flaeche);
}
.melder code{
  font-family:var(--mono);font-size:12px;background:var(--weiss);
  border:1px solid var(--linie-schwach);padding:1px 5px;border-radius:var(--r-chip);
}
.melder strong{display:block;margin-bottom:6px;color:var(--text)}
.melder p{margin:0 0 8px}

/* ══════════════════════════════════════════════════════════════════════
   Startseite, Gesetzesübersicht, Trefferliste
   ══════════════════════════════════════════════════════════════════════ */
body[data-ansicht=start] .navspalte,
body[data-ansicht=start] .apparat,
body[data-ansicht=uebersicht] .navspalte,
body[data-ansicht=uebersicht] .apparat,
body[data-ansicht=suche] .navspalte,
body[data-ansicht=suche] .apparat{display:none}
/* Im Vergleich bleibt das Normenverzeichnis stehen — man springt von hier
   zur nächsten Norm. Der Apparat geht: Er zeigt Hinweise zur geltenden
   Fassung, und neben zwei Zeitständen ist nicht zu sagen, zu welchem. */
body[data-ansicht=vergleich] .apparat{display:none}
/* Die Einfärbung gilt dem Normtext; im Vergleich ist sie ausgeblendet, also
   darf ihr Schalter dort auch nicht bedienbar dastehen. Die Schriftgröße
   BLEIBT dort — der Vergleich zeigt Normtext, nur zweispaltig. */
/* Der Fassungsvergleich stellt Wortlaute gegenüber, nicht Satzbilder — die
   Zellen tragen keine Satzhüllen, der Umschalter liefe dort ins Leere. */
body[data-ansicht=vergleich] .einfaerben,
body[data-ansicht=vergleich] #satzbildgruppe,
body[data-ansicht=vergleich] .trenner-einfaerben{display:none}
body[data-ansicht=start] .reiterleiste,
body[data-ansicht=suche] .reiterleiste{display:none}
/* Ohne Normtext gibt es nichts einzufärben und nichts zu vergrößern — beide
   Schalter gehören dort nicht hin. Die Darstellung (hell/dunkel) bleibt: Sie
   gilt der ganzen Seite, nicht dem Normtext, und war bis hierher versehentlich
   mit ausgeblendet, weil sie dieselbe Klasse trug. */
body[data-ansicht=start] .einfaerben,
body[data-ansicht=uebersicht] .einfaerben,
body[data-ansicht=suche] .einfaerben,
body[data-ansicht=start] .schriftgruppe,
body[data-ansicht=uebersicht] .schriftgruppe,
body[data-ansicht=suche] .schriftgruppe,
body[data-ansicht=start] .trenner-einfaerben,
body[data-ansicht=uebersicht] .trenner-einfaerben,
body[data-ansicht=suche] .trenner-einfaerben{display:none}
/* Auf der Startseite steht das große Suchfeld — die Kopfleiste bleibt schlank. */
body[data-ansicht=start] .suchfeld{display:none}
.breit{width:100%;padding:0}
.mitte{max-width:920px;margin:0 auto;padding:76px 96px}
.mitte h1{
  font-family:var(--serif);font-size:38px;line-height:1.15;letter-spacing:-.02em;
  font-weight:400;margin:0 0 26px;
}
.mitte h1 .zweite{display:block;color:var(--titel-2)}
.grossfeld{
  display:flex;align-items:center;gap:12px;
  border:1px solid var(--linie-stark);border-radius:8px;background:var(--weiss);
  padding:13px 16px;box-shadow:var(--schatten-feld);
}
.grossfeld input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15px}
.grossfeld input:focus{outline:0}
.grossfeld .enter{font-family:var(--mono);font-size:10px;color:var(--text-4);white-space:nowrap}
.haeufig{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:var(--text-3)}
.pille{
  border:1px solid var(--linie);border-radius:var(--r-pille);padding:4px 11px;
  font-size:12.5px;color:var(--text-2b);background:var(--weiss);
}
.pille:hover{border-color:var(--text);color:var(--text)}
.pille[aria-pressed=true]{background:var(--text);color:var(--papier);border-color:var(--text)}

.zweispalt{display:grid;grid-template-columns:1fr 300px;gap:48px;margin-top:56px;align-items:start}
.spaltenkopf{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-4);margin:0 0 12px;
}
.gesetzraster{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px}
.gesetzzeile{
  display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
  padding:7px 8px;border-radius:var(--r-knopf);
}
.gesetzzeile:hover{background:var(--zeile-weich)}
.gesetzzeile .abk{font-family:var(--serif);font-size:14.5px;color:var(--text);white-space:nowrap}
.gesetzzeile .name{font-size:12.5px;color:var(--text-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gesetzzeile .zahl{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-5)}
.kasten{
  background:var(--flaeche);border:1px solid var(--linie-schwach);
  border-radius:var(--r-karte);padding:16px;
}
.kasten p{margin:0 0 8px;font-size:12.5px;line-height:1.6;color:var(--text-2b)}
.kasten p:last-child{margin-bottom:0}

/* ── Gesetzesübersicht ── */
.uebersicht{max-width:1040px;margin:0 auto;padding:44px 48px 80px}
.uebersicht h1{font-family:var(--serif);font-size:32px;line-height:1.2;font-weight:400;margin:8px 0 0;letter-spacing:-.015em}
.verzeichnis{display:flex;flex-direction:column}
.verzeichniszeile{
  display:flex;align-items:baseline;gap:14px;width:100%;text-align:left;
  padding:9px 6px;border-bottom:1px solid var(--linie-zart);
}
.verzeichniszeile:hover{background:var(--zeile-weich)}
.verzeichniszeile .nr{font-family:var(--serif);font-size:14.5px;width:56px;flex:none;color:var(--text)}
.verzeichniszeile .tt{font-size:13.5px;color:var(--text-2b)}
.verzeichniszeile .abs{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-5);white-space:nowrap}

/* ── Trefferliste ── */
.trefferraster{display:flex;align-items:flex-start}
.filterspalte{width:var(--nav);flex:none;padding:22px 16px 60px;border-right:1px solid var(--linie-schwach)}
.filterzeile{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;color:var(--text-2b);width:100%;text-align:left}
.ladestand{font-size:11.5px;line-height:1.55;color:var(--text-4);margin:14px 0 0}
.filterzeile .zahl{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-5)}
.trefferspalte{flex:1;min-width:0;padding:22px 32px 70px}
.trefferkopf{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.trefferkopf h1{font-family:var(--serif);font-size:20px;font-weight:400;margin:0}
.treffer{
  display:block;width:100%;text-align:left;
  padding:14px 0;border-bottom:1px solid var(--linie-zart);
}
.treffer:hover{background:var(--zeile-weich)}
.treffer-kopf{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
.treffer-nr{font-family:var(--serif);font-size:16.5px;color:var(--text)}
.treffer-titel{font-size:13px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.treffer-gesetz{
  margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-4);border:1px solid var(--linie);border-radius:var(--r-chip);padding:2px 6px;flex:none;
}
.treffer-text{font-family:var(--serif);font-size:15px;line-height:1.62;color:var(--text-2);margin:0}
.treffer-text mark{background:var(--treffer);color:var(--text);padding:0 1px;border-radius:var(--r-marke)}
.treffer-fund{font-family:var(--mono);font-size:10px;color:var(--text-5);display:block;margin-top:6px}
/* Norm ohne geladenen Datensatz: grau, ohne Gelb, mit Fundstellenhinweis.
   Niemals erfundener Wortlaut. */
.treffer.ausstehend .treffer-nr,
.treffer.ausstehend .treffer-text{color:var(--text-4)}
.treffer.ausstehend .treffer-text mark{background:var(--treffer-ohne);color:var(--text-3)}

/* ══════════════════════════════════════════════════════════════════════
   Stufe 768–1199 px: linke Spalte wird zur Schublade, Apparat auf 300 px
   ══════════════════════════════════════════════════════════════════════ */
.schubladen-knopf{display:none}
.verdunkelung{display:none}

/* Die Spezifikation lässt das Verhalten zwischen 390 und 1440 px ausdrücklich
   offen. Ab hier fehlt der Kopfleiste der Platz für die ausgeschriebene
   Beschriftung des Schalters. Sie entfällt sichtbar, bleibt aber über
   `aria-label` der Gruppe erhalten — für die Sprachausgabe ändert sich nichts.

   Die Schwelle lag bei 1340 px und war zu niedrig: Die vier Beschriftungen
   nehmen zusammen rund 330 px, und die gingen bis dahin dem Suchfeld ab — bei
   1440 px blieben ihm 73 Pixel. Eine Beschriftung, die man ohnehin am Schalter
   abliest, wiegt weniger als ein benutzbares Suchfeld. */
@media (max-width:1600px){
  .kopfgruppe>span{display:none}
}

@media (max-width:1199px){
  :root{--apparat:300px}
  /* Das Verzeichnis ist hier eine Schublade über allem, keine Spalte — an
     ihrem Rand gibt es nichts zu ziehen. */
  #griff-nav{display:none}
  /* Fünf Register verteilt auf 300 px schneiden „Markierungen“ ab. Die Zeile
     wird deshalb waagerecht schiebbar — dieselbe Lösung, die der Entwurf für
     die Mobilstufe vorsieht. */
  .register{justify-content:flex-start;gap:14px}
  .schubladen-knopf{
    display:inline-flex;align-items:center;gap:7px;flex:none;
    border:1px solid var(--linie);background:var(--weiss);color:var(--text-2b);
    border-radius:var(--r-knopf);padding:5px 10px;font-size:12.5px;white-space:nowrap;
  }
  .schubladen-knopf:hover{border-color:var(--text);color:var(--text)}
  .navspalte{
    position:fixed;left:0;top:0;bottom:0;z-index:60;width:var(--nav);
    background:var(--papier);border-right:1px solid var(--linie);
    max-height:none;transform:translateX(-100%);
    transition:transform 140ms ease-out;
  }
  body[data-schublade=offen] .navspalte{transform:translateX(0)}
  body[data-schublade=offen] .verdunkelung{
    display:block;position:fixed;inset:0;z-index:55;background:var(--schleier-schublade);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   Stufe < 768 px: eine Spalte.
   Der Apparat wird in Schritt 8 zum Blatt von unten; bis dahin steht er
   unter dem Normtext, damit nichts unerreichbar ist.
   ══════════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════════
   Mobil: der Apparat wird zum Blatt von unten

   Auf 390 px ist eine dritte Spalte nicht darstellbar. Der Apparat fährt
   deshalb als Blatt über den Text — mit Griff, Radius oben und Schatten nach
   oben. Dahinter tritt der Normtext zurück und wird festgehalten: Scrollt er
   mit, verliert man beim Lesen im Blatt die Stelle.
   ══════════════════════════════════════════════════════════════════════ */
.blattgriff{
  display:none;
  width:100%;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 18px;background:var(--leiste);
  border-top:1px solid var(--linie-schwach);border-bottom:1px solid var(--linie-schwach);
  font-size:12.5px;color:var(--text-2b);
}
.blattgriff .pfeil{color:var(--text-4);font-size:13px}
.werkzeugleiste{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;
  gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  background:var(--leiste);border-top:1px solid var(--linie);
  overflow-x:auto;scrollbar-width:none;
}
.werkzeugleiste::-webkit-scrollbar{display:none}
.werkzeugleiste button{flex:none;min-height:44px}

@media (max-width:767px){
  .kopf{gap:10px;flex-wrap:wrap}
  .kopf .einfaerben>span{display:none}
  .kopf-knoepfe{display:none}
  /* Teilweise klebend: Die Leiste schiebt sich nach oben aus dem Bild, bis
     nur noch Suchfeld und Reiter stehen. Der bekannte Kniff — der negative
     Versatz ist genau der Teil, der verschwinden darf. */
  header{top:calc(var(--kopfklebt) - var(--kopfhoehe))}
  /* Die Absatzmarken laufen hier waagerecht; angeheftet stünden sie als
     zweite Leiste unter der ersten. */
  .rinne{position:static;max-height:none}
  /* Drei Schaltergruppen passen auf 390 px nicht nebeneinander. Die
     Einfärbung entfällt hier — sie steht als Pille in der Werkzeugleiste am
     Fuß, und zweimal derselbe Schalter ist einer zu viel. Schrift und
     Darstellung bleiben; sie haben dort keine Entsprechung. */
  .einfaerben,.trenner-einfaerben{display:none}
  .kopf-rechts{flex-wrap:wrap;row-gap:8px}
  .suchfeld{max-width:none;order:3;flex-basis:100%}
  .kopf-rechts{margin-left:auto}
  .raster{flex-direction:column}
  /* Der Apparat sitzt hier unter dem Text und später als Blatt von unten.
     Waagerecht ziehen hat auf einer Spalte keinen Sinn. */
  #griff-apparat{display:none}
  .hauptspalte{padding:22px 18px 60px;width:100%}
  .hauptspalte h1{font-size:23px;line-height:1.22}
  .leseraum{gap:14px}
  .lesespalte{font-size:16px;line-height:1.68}
  .apparat{
    width:auto;flex:none;position:static;max-height:none;
    border-left:0;border-top:1px solid var(--linie-schwach);align-self:stretch;
  }
  /* Tippziele mindestens 44 px hoch. */
  .normzeile{padding:11px 16px}
  .reiter{padding:12px 14px}
  .rinne button{min-height:32px;padding:6px 8px}

  /* Absatzmarken laufen waagerecht statt senkrecht. */
  .leseraum{display:block}
  .rinne{
    flex-direction:row;flex-wrap:nowrap;width:auto;overflow-x:auto;
    scrollbar-width:none;gap:6px;padding:0 0 12px;
  }
  .rinne::-webkit-scrollbar{display:none}
  .rinne button{
    border-right:0;border-bottom:2px solid var(--linie-schwach);
    text-align:center;flex:none;
  }
  .rinne button[aria-current=true]{border-bottom-color:var(--text)}

  .blattgriff{display:flex}
  .werkzeugleiste{display:flex}
  main.hauptspalte{padding-bottom:80px}

  /* Der Apparat als Blatt */
  .apparat{
    /* `top:auto` ist nötig: Die Grundregel setzt `top:0` für die klebende
       Spalte. Bliebe es stehen, spannte sich das Blatt von oben nach unten
       statt 78 % von unten. */
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:60;
    width:auto;height:78vh;max-height:78vh;
    background:var(--papier);
    border:0;border-top:1px solid var(--linie);
    border-radius:16px 16px 0 0;
    box-shadow:var(--schatten-blatt);
    transform:translateY(100%);
    transition:transform 150ms ease-out;
    overflow-y:auto;padding-bottom:24px;
  }
  body[data-blatt=offen] .apparat{transform:translateY(0)}
  body[data-blatt=offen] .verdunkelung{
    display:block;position:fixed;inset:0;z-index:55;background:var(--schleier-blatt);
  }
  /* Der Text hinter dem Blatt wird festgehalten. */
  body[data-blatt=offen]{overflow:hidden}
  .blatt-kopf{
    position:sticky;top:0;z-index:2;background:var(--papier);
    padding:8px 0 4px;display:flex;justify-content:center;
  }
  .blatt-kopf::before{
    content:"";width:38px;height:4px;border-radius:999px;background:var(--linie-stark);
  }
  .register{justify-content:flex-start;gap:18px;padding:0 18px}
  .registerinhalt{padding:16px 18px}

  /* Die Mappe als Blatt von unten. 392 px hängen an keinem Telefonrand; und
     der Knopf, an dem sie sonst hängt, ist hier ausgeblendet. Die von der
     Anzeige gesetzten Koordinaten müssen deshalb überschrieben werden — sie
     stehen im style-Attribut und gewinnen ohne `!important`. */
  .mappe{
    position:fixed;right:0;bottom:0;
    top:auto!important;left:0!important;
    width:auto;max-height:82vh;overflow-y:auto;
    border:0;border-top:1px solid var(--linie);border-radius:16px 16px 0 0;
    box-shadow:var(--schatten-blatt);
  }
  .mappe-eintraege{max-height:none}
  body[data-mappe=offen] .verdunkelung{
    display:block;position:fixed;inset:0;z-index:65;background:var(--schleier-blatt);
  }

  /* Fassungsvergleich: eine Spalte, Paar für Paar untereinander. Zwei
     Textspalten auf 390 px wären je 175 px breit — darin steht kein Satz.
     Die Reihenfolge im DOM ist bereits ältere/jüngere je Abschnitt, das
     Stapeln braucht deshalb nur die eine Spalte. */
  .vergleich-raster{grid-template-columns:1fr;gap:0}
  /* Nebeneinander sagt der Spaltenkopf, welche Fassung eine Zelle zeigt.
     Untereinander sagt es niemand — deshalb klebt hier die Wählleiste, die
     beide Daten nennt und zugleich das Umschalten von jeder Stelle erlaubt,
     und jede Zelle trägt ihre Fassung an der Nummer. */
  .vergleich-leiste{
    position:sticky;top:var(--kopfklebt);z-index:4;background:var(--papier);
    margin:0 0 12px;padding:10px 0 12px;
  }
  .vergleich-kopf{position:static;padding:8px 0;margin-bottom:0;border-bottom:0}
  .vergleich-kopf.links{border-bottom:1px solid var(--linie-zart)}
  .vergleich-kopf.rechts{border-bottom:1px solid var(--linie);margin-bottom:6px}
  .vergleich-zelle{padding:12px 12px 14px}
  .vergleich-zelle.links{margin-top:10px}
  .vergleich-zelle.rechts{margin-bottom:14px;border-bottom:1px solid var(--linie-zart)}
  /* Ohne Marke wäre auf dem Telefon nicht zu sehen, welche Zelle welche
     Fassung zeigt — nebeneinander sagt das der Spaltenkopf, untereinander
     niemand. */
  .vergleich-zelle.links .vergleich-nummer::after{content:" · ältere Fassung"}
  .vergleich-zelle.rechts .vergleich-nummer::after{content:" · jüngere Fassung"}
}

/* ══════════════════════════════════════════════════════════════════════
   Druckfassung

   Gedruckt wird der Normtext, nicht die Anwendung. Die Struktur-Einfärbung
   entfällt: Tonwerte sind auf Papier unzuverlässig, im Graustufendruck werden
   aus drei Farben drei kaum unterscheidbare Graustufen — und eine Einfärbung,
   die man nicht auseinanderhalten kann, ist schlimmer als keine.

   Eigene Markierungen bleiben, aber als Kante statt als Fläche. Hinweise
   werden zum Fußapparat.
   ══════════════════════════════════════════════════════════════════════ */
@media print{
  @page{size:A4;margin:18mm 16mm 20mm}

  header,.navspalte,.werkzeugleiste,.blattgriff,.auswahlleiste,.popover,
  .mappe,.verdunkelung,.blaettern,.rinne,.legende,.reiterleiste{display:none!important}

  body{background:#fff;color:#000;font-size:10.5pt}
  .raster{display:block}
  .hauptspalte{padding:0;width:auto}
  .leseraum{display:block}
  .lesespalte-huelle,.lesespalte{max-width:none}

  /* Kopf der Druckseite */
  .druckkopf{
    display:flex!important;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:8pt;letter-spacing:.08em;text-transform:uppercase;
    border-bottom:1px solid #14161A;padding-bottom:6pt;margin-bottom:14pt;
  }
  .brotkrume{display:none}
  .hauptspalte h1{font-family:var(--serif);font-size:19pt;line-height:1.22;margin:0}
  .meta{margin-top:6pt;font-size:8.5pt;color:#444}
  .meta .etikett{border:0;padding:0;margin-right:10pt;font-size:8pt;background:none}

  .lesespalte{font-size:11pt;line-height:1.62;color:#000}
  .lesespalte p{margin:0 0 7pt}
  .lesespalte .absatz{margin-bottom:7pt}

  /* Struktur-Einfärbung wird NICHT ausgegeben. */
  .lesespalte .s{background:transparent!important;box-shadow:none!important}

  /* Eigene Markierung: Kante statt Fläche. */
  .lesespalte .eigen{
    background:transparent!important;
    border-bottom:1pt solid #000!important;
  }
  /* Verwaltungsstelle bleibt als Punktlinie, der Chip als Kürzel. */
  .lesespalte .vw{border-bottom:1pt dotted #000!important}
  .vw-chip{border:0!important;background:none!important;color:#444!important;font-size:7.5pt}

  /* Verweise: der Klick fehlt auf Papier, das Ziel wird ausgeschrieben. */
  .lesespalte a.verweis{color:#000;border-bottom:0;text-decoration:none}

  /* Der Apparat wird zum Fußapparat unter einer Linie. */
  .apparat{
    position:static!important;width:auto!important;max-height:none!important;
    border:0!important;border-top:1px solid var(--linie-stark)!important;
    border-radius:0!important;box-shadow:none!important;transform:none!important;
    margin-top:16pt;padding:10pt 0 0!important;overflow:visible!important;
    page-break-inside:avoid;
  }
  .register,.blatt-kopf{display:none!important}
  .registerinhalt{padding:0!important}
  .block{border-left:0;padding-left:0;margin-bottom:9pt}
  .block p{font-size:9pt;line-height:1.5}
  .fehlmeldung{border:0;padding:0;margin-bottom:9pt}
  .fehlmeldung p{font-size:9pt}
  .haftung{font-size:8pt;color:#444;border-top:1px solid var(--linie-stark);margin-top:10pt}

  .druckfuss{
    display:block!important;
    font-family:var(--mono);font-size:7.5pt;color:#444;
    border-top:1px solid var(--linie);margin-top:12pt;padding-top:5pt;
  }

  .karte,.zitat,.platzhalter{page-break-inside:avoid}

  /* Fassungsvergleich auf Papier. Die Wählleiste ist ein Bedienelement und
     entfällt; die Fassungen stehen in den Spaltenköpfen. Entfallenes und
     Neues tragen im Graustufendruck Strich und Unterstreichung, nicht
     Farbe — zwei Tonwerte lassen sich auf Papier nicht auseinanderhalten. */
  .vergleich-leiste{display:none!important}
  .vergleich-raster{gap:0 12pt}
  .vergleich-kopf{position:static!important;background:none!important;padding:0 0 5pt}
  .vergleich-zelle{
    font-size:10pt;line-height:1.55;color:#000;padding:6pt 0 0;
    background:none!important;border:0!important;page-break-inside:avoid;
  }
  del.v-weg{background:none!important;box-shadow:none!important;color:#444}
  ins.v-neu{background:none!important;box-shadow:none!important;font-weight:600}
  .vergleich-legende{font-size:8pt;color:#444;margin-bottom:8pt}
  .vergleich-marke{background:none!important;box-shadow:none!important;padding:0}
  .vergleich-bilanz,.vergleich-quelle{font-size:8pt;color:#444}
}

/* Nur im Druck sichtbar. */
.druckkopf,.druckfuss{display:none}

</style>
</head>
<body>

<header>
  <div class="kopf">
    <button class="schubladen-knopf" id="schublade-auf" aria-label="Normenverzeichnis öffnen">☰&nbsp;Normen</button>
    <button type="button" class="wortmarke" id="wortmarke" aria-label="Zur Startseite">steuernorm</button>

    <label class="suchfeld suchhuelle" for="suche">
      <span class="kuerzel" aria-hidden="true">⌘K</span>
      <input id="suche" type="search" placeholder="Norm, Wortlaut oder Fundstelle …" autocomplete="off">
    </label>

    <div class="kopf-rechts">
      <div class="kopfgruppe einfaerben">
        <span id="einfaerben-beschriftung">Tatbestand &amp; Rechtsfolge einfärben</span>
        <div class="stufen" role="radiogroup" id="stufen"
             aria-label="Tatbestand und Rechtsfolge einfärben">
          <button type="button" role="radio" data-stufe="aus" aria-checked="false">aus</button>
          <button type="button" role="radio" data-stufe="dezent" aria-checked="false">dezent</button>
          <button type="button" role="radio" data-stufe="voll" aria-checked="false">voll</button>
        </div>
      </div>
      <div class="trenner trenner-einfaerben" aria-hidden="true"></div>
      <div class="kopfgruppe schriftgruppe" id="satzbildgruppe">
        <span id="satzbild-beschriftung">Satzbild</span>
        <div class="stufen" role="radiogroup" id="satzbild"
             aria-label="Absatz fortlaufend oder Satz für Satz">
          <button type="button" role="radio" data-bild="fortlaufend" aria-checked="false">fortlaufend</button>
          <button type="button" role="radio" data-bild="einzeln" aria-checked="false">satzweise</button>
        </div>
      </div>
      <div class="trenner trenner-einfaerben" aria-hidden="true"></div>
      <div class="kopfgruppe schriftgruppe" id="schriftgruppe">
        <span id="schrift-beschriftung">Schrift</span>
        <div class="stufen" id="schrift" role="group" aria-label="Schriftgröße des Normtextes">
          <button type="button" id="schrift-kleiner" aria-label="Normtext kleiner">−</button>
          <span class="schrift-wert" id="schrift-wert" aria-live="polite"></span>
          <button type="button" id="schrift-groesser" aria-label="Normtext größer">+</button>
        </div>
      </div>
      <div class="trenner" aria-hidden="true"></div>
      <div class="kopfgruppe">
        <span id="darstellung-beschriftung">Darstellung</span>
        <div class="stufen" role="radiogroup" id="darstellung"
             aria-label="Darstellung hell, dunkel oder nach Systemvorgabe">
          <button type="button" role="radio" data-modus="hell" aria-checked="false">hell</button>
          <button type="button" role="radio" data-modus="dunkel" aria-checked="false">dunkel</button>
          <button type="button" role="radio" data-modus="system" aria-checked="false">System</button>
        </div>
      </div>
      <div class="trenner" aria-hidden="true"></div>
      <div class="kopf-knoepfe">
        <!-- Kein Knopf ohne Funktion: „Vergleichen" bleibt gesperrt, bis
             Schritt 12 ihn anbindet, und sagt im Titel, warum. Ein Knopf, der
             ins Leere klickt, ist schlechter als einer, der sichtbar noch
             nicht kann. -->
        <button type="button" id="knopf-vergleichen" disabled
                title="Fassungsvergleich — folgt in Schritt 12 (fassungen/&lt;gesetz&gt;.json).">Vergleichen</button>
        <button type="button" id="knopf-mappe" aria-haspopup="dialog" aria-expanded="false"
                title="Sammelmappe für Normen und markierte Stellen">Mappe</button>
      </div>
    </div>
  </div>

  <div class="reiterleiste" id="reiterleiste" role="tablist" aria-label="Geöffnete Normen"></div>
</header>

<div class="verdunkelung" id="verdunkelung"></div>

<div class="auswahlleiste" id="auswahlleiste" role="toolbar" aria-label="Auswahl markieren">
  <span class="titel">Markieren</span>
  <div class="farbreihe" id="auswahl-farben"></div>
</div>

<div class="mappe" id="mappe" role="dialog" aria-label="Mappe"></div>

<div class="popover" id="popover" role="dialog" aria-label="Eigene Markierung">
  <div class="popover-kopf">
    <span class="mono-etikett">Eigene Markierung</span>
    <button type="button" id="popover-zu" aria-label="Schließen">×</button>
  </div>
  <div class="farbreihe" id="popover-farben"></div>
  <hr>
  <div class="farbreihe">
    <input type="color" class="farbwaehler" id="popover-waehler" aria-label="Eigene Farbe wählen">
    <span class="hexwert" id="popover-hex"></span>
  </div>
  <textarea id="popover-notiz" placeholder="Notiz …" aria-label="Notiz zur Markierung"></textarea>
  <div class="popover-fuss">
    <span id="popover-mappe">Nur für Sie sichtbar</span>
    <button type="button" id="popover-weg">Entfernen</button>
  </div>
</div>

<div class="werkzeugleiste" id="werkzeugleiste" role="group" aria-label="Werkzeuge"></div>

<div class="raster">
  <nav class="navspalte" id="navspalte" aria-label="Normen des Gesetzes"></nav>
  <div class="griff" id="griff-nav" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="Breite des Normenverzeichnisses"
       title="Ziehen zum Verbreitern · Doppelklick setzt zurück"></div>
  <main class="hauptspalte" id="haupt"><p class="platzhalter">Wird geladen …</p></main>
  <div class="griff" id="griff-apparat" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="Breite des Apparats"
       title="Ziehen zum Verbreitern · Doppelklick setzt zurück"></div>
  <aside class="apparat" id="apparat" aria-label="Apparat"></aside>
</div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   Zustand
   Abgebildet ist die Tabelle „Interaktion und Zustand" der Spezifikation.
   ══════════════════════════════════════════════════════════════════════ */
const S = {
  register: null,          // data/index.json
  gesetz: null,            // aktuell geladenes Gesetz
  abk: null,
  normId: null,
  strukturModus: "voll",   // aus | dezent | voll — global, localStorage
  geoeffnet: [],           // [{gesetz, norm}] — Sitzung überdauernd
  zuletzt: [],             // zuletzt gelesene Normen
  apparatRegister: "hinweise",
  anmerkungen: {},         // abk → annotations/<gesetz>.json .normen
  belege: {},              // abk → belege/<gesetz>.json
  struktur: {},            // abk → struktur/<gesetz>.json .normen
  verweise: null,          // data/verweise.json .normen — Rückverweise
  verwaltung: {},          // abk → verwaltung/<gesetz>.json
  aktiveVerwaltung: null,  // id | null — flüchtig
  fassungen: {},           // abk → fassungen/<gesetz>.json
  vergleich: null,         // { links, rechts } — gewählte Fassungen
  markierungen: [],        // eigene Markierungen, localStorage
  aktiveMarkierung: null,  // id | null — flüchtig
  mappen: [],              // Sammelmappen, localStorage
  aktiveMappe: null,
  darstellung: "system",   // system | hell | dunkel — global, localStorage
  leseschrift: 17.5,       // px, Schriftgröße des Normtextes, localStorage
  satzbild: "fortlaufend", // fortlaufend | einzeln — localStorage
  spalten: { nav: 216, apparat: 340 }, // Breite links/rechts in px, localStorage
  letzteFarbe: "#F2C744",  // localStorage
  filterGesetze: new Set(),// Trefferliste: eingeschränkte Auswahl
};

/* Voreinstellungen der Farbwahl, dazu ein freier Wähler. */
const PALETTE = [
  ["#F2C744", "Gelb"], ["#4E9A5F", "Grün"], ["#3B7BD1", "Blau"],
  ["#C4577A", "Rosa"], ["#8B7BC7", "Violett"], ["#7A8087", "Grau"],
];

const cacheGesetz = new Map();
const el = (id) => document.getElementById(id);

/* ── Speicher ──────────────────────────────────────────────────────── */
function merken(schluessel, wert){
  try { localStorage.setItem("sn." + schluessel, JSON.stringify(wert)); }
  catch (e) { /* Speicher gesperrt oder voll — die Sitzung läuft trotzdem */ }
}
function gemerkt(schluessel, ersatz){
  try {
    const roh = localStorage.getItem("sn." + schluessel);
    return roh === null ? ersatz : JSON.parse(roh);
  } catch (e) { return ersatz; }
}

/* ── Laden ─────────────────────────────────────────────────────────── */
async function holen(pfad){
  const antwort = await fetch(pfad, { cache: "no-cache" });
  if (!antwort.ok) throw new Error(pfad + " → " + antwort.status);
  return antwort.json();
}

async function gesetzLaden(abk){
  const schluessel = String(abk).toLowerCase();
  if (cacheGesetz.has(schluessel)) return cacheGesetz.get(schluessel);
  const eintrag = registerEintrag(schluessel);
  const gesetz = await holen("data/" + (eintrag ? eintrag.datei : schluessel + ".json"));
  cacheGesetz.set(schluessel, gesetz);
  return gesetz;
}

/**
 * Zutaten neben dem Normtext.
 *
 * Jede Datei ist für sich entbehrlich: Fehlt sie, bleibt der Eintrag leer und
 * die Oberfläche weist die Lücke aus. Der Normtext erscheint in jedem Fall.
 */
async function zutatenLaden(abk){
  const schluessel = String(abk).toLowerCase();

  if (!(abk in S.anmerkungen)){
    try { S.anmerkungen[abk] = (await holen("annotations/" + schluessel + ".json")).normen || {}; }
    catch (e) { S.anmerkungen[abk] = null; }
  }
  if (!(abk in S.belege)){
    try { S.belege[abk] = await holen("belege/" + schluessel + ".json"); }
    catch (e) { S.belege[abk] = null; }
  }
  if (!(abk in S.struktur)){
    try { S.struktur[abk] = (await holen("struktur/" + schluessel + ".json")).normen || {}; }
    catch (e) { S.struktur[abk] = null; }
  }
  if (!(abk in S.verwaltung)){
    try { S.verwaltung[abk] = await holen("verwaltung/" + schluessel + ".json"); }
    catch (e) { S.verwaltung[abk] = null; }
  }
  if (!(abk in S.fassungen)){
    try { S.fassungen[abk] = await holen("fassungen/" + schluessel + ".json"); }
    catch (e) { S.fassungen[abk] = null; }
  }
}

/** Verwaltungsstellen der laufenden Norm — leer, wenn es keine Datei gibt. */
function verwaltungDerNorm(){
  const datei = S.verwaltung[S.abk];
  if (!datei || !datei.normen) return [];
  const eintrag = datei.normen[S.normId];
  return eintrag && Array.isArray(eintrag.stellen) ? eintrag.stellen : [];
}

/** Segmente der laufenden Norm — leer, wenn es keinen Datensatz gibt. */
function strukturDerNorm(){
  const gesetz = S.struktur[S.abk];
  if (!gesetz) return null;
  const eintrag = gesetz[S.normId];
  return eintrag && Array.isArray(eintrag.segmente) ? eintrag.segmente : [];
}

/** Satzgrenzen der laufenden Norm — leer, wenn es keinen Datensatz gibt. */
function saetzeDerNorm(){
  const gesetz = S.struktur[S.abk];
  if (!gesetz) return [];
  const eintrag = gesetz[S.normId];
  return eintrag && Array.isArray(eintrag.saetze) ? eintrag.saetze : [];
}

/**
 * Satznummern in den Text setzen.
 *
 * WARUM ÜBERHAUPT. Die amtlichen Daten führen Satznummern nur bei 260 von
 * 1 537 Normen als `<span class="sn">`; bei den übrigen steht im Quelltext
 * keine. Die ADRESSE gibt es trotzdem überall — die Gliederung spricht von
 * „Abs. 3 Satz 2", die Verwaltungsanweisungen zitieren so, und der
