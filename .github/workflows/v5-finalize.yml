name: V5 finalisieren

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v5-finalize.yml"

permissions:
  contents: write

jobs:
  finalisieren:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: V5-Bestand abschließend prüfen
        run: |
          set -euo pipefail
          test ! -e .v5-bootstrap
          test ! -e .github/workflows/v5-bootstrap.yml
          grep -F '"version": "4.0.0"' package.json
          grep -F 'name: Modellzugang prüfen' .github/workflows/annotationen.yml
          grep -F 'GEMINI_API_KEY' .github/workflows/annotationen.yml
          grep -F 'gemini-2.5-flash' tools/lib/modell.mjs
          node tools/pruefen.mjs | tee /tmp/pruefen.txt
          grep -F '1537 Normen · 23570 Spannen · 1414 markierbar' /tmp/pruefen.txt
          grep -F '0 Fehler, 0 Warnungen.' /tmp/pruefen.txt
          node tools/konsistenz.mjs --min 5 | tee /tmp/konsistenz.txt
          grep -F '12 verdächtige Markierungen' /tmp/konsistenz.txt
          node - <<'NODE'
          const a = require('./annotations/astg.json');
          const s = require('./annotations/solzg.json');
          if (a.normen['15'].schema.length !== 11) throw new Error('Stichprobe a');
          const e1 = a.normen['15'].saetze.flatMap(x => x.elemente || []).find(e =>
            e.pfad === 'Abs. 1 Satz 1' && e.art === 'rf' && Array.isArray(e.teile) &&
            e.teile.length === 2 && String(e.anzeige || '').endsWith('zugerechnet'));
          if (!e1) throw new Error('Stichprobe b');
          const sol = s.normen['2'].saetze.flatMap(x => x.elemente || []);
          if (!sol.some(e => e.art === 'rf' && e.text === 'Abgabepflichtig') ||
              sol.some(e => e.art === 'tb' && e.text === 'Abgabepflichtig')) throw new Error('Stichprobe c');
          if (!a.normen['15'].saetze.flatMap(x => x.elemente || []).some(e =>
            e.pfad.startsWith('Abs. 2') && e.art === 'def')) throw new Error('Stichprobe d');
          NODE

      - name: Einen endgültigen Commit erzeugen
        run: |
          set -euo pipefail
          rm -f .github/workflows/v5-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'Umbau v5: Satzklammer, mehrteilige Spannen, Absatz-Schema, Typografie' | git commit-tree "$tree" -p 2dd46086574352cf22790acc4252b4e0ba1825b9)"
          git push --force origin "$commit":main
