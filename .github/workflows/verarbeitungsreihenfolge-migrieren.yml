name: KI-Verarbeitungsreihenfolge optimieren

# Einmaliger Migrationsworkflow; nach erfolgreicher Ausführung wird er entfernt.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verarbeitungsreihenfolge-migrieren.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrieren:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Reihenfolge und Produktivaufruf anpassen
        id: migration
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node tools/migriere-verarbeitungsreihenfolge.mjs 2>&1 | tee /tmp/migration.log

      - name: Änderung oder Diagnose veröffentlichen
        if: always()
        shell: bash
        env:
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            printf 'Status: %s\n' "$MIGRATION_OUTCOME"
            printf 'Zeit: %s\n\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            cat /tmp/migration.log 2>/dev/null || true
          } > reports/reihenfolge-migration.txt
          git config user.name "steuernorm-workflow-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tools/ki-annotieren.mjs .github/workflows/ki-vollannotation.yml reports/reihenfolge-migration.txt
          git commit -m "Kleine Gesetze im KI-Vollaufbau priorisieren"
          git pull --rebase origin main
          git push
          test "$MIGRATION_OUTCOME" = "success"
