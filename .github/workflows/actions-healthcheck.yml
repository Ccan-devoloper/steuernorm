name: GitHub Actions Selbsttest

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/actions-healthcheck.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Erfolgreichen Actions-Start protokollieren
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          printf 'GitHub Actions produktiv erreichbar: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > reports/actions-healthcheck.txt
          git config user.name "steuernorm-actions-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/actions-healthcheck.txt
          git commit -m "GitHub Actions Selbsttest erfolgreich"
          git pull --rebase origin main
          git push
