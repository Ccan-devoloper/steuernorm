name: Website veröffentlichen

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "sw.js"
      - "wirtschaftsgesetze.html"
      - "data/**"
      - "annotations/**"
      - "belege/**"
      - "struktur/**"
      - "verwaltung/**"
      - "fassungen/**"
      - "schriften/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows:
      - "Annotationen erzeugen"
      - "Gesetzestexte täglich aktualisieren"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: steuernorm-pages
  # Der jüngste Lauf gewinnt.
  #
  # Hier stand `false`, mit der Begründung, eine abgebrochene Veröffentlichung
  # sei schlimmer als eine wartende. Die Begründung war falsch, und sie hat
  # drei Tage lang jede Veröffentlichung verhindert: In einer Gruppe hält
  # GitHub genau EINEN wartenden Lauf. Kommt ein dritter, wird der wartende
  # abgeräumt. Da jeder Push zwei Läufe auslöst — den Push selbst und den
  # Abschluss von „Annotationen erzeugen“ —, war ab dem 11. August ein Lauf
  # vom 11. August dauerhaft in der Warteschlange, und alle 18 Läufe danach
  # sind hinter ihm abgeräumt worden, ohne dass etwas online ging.
  #
  # Abbrechen ist hier gefahrlos, denn jeder Lauf checkt `ref: main` aus, nicht
  # seinen eigenen Commit: Der überlebende Lauf veröffentlicht immer den
  # neuesten Stand, einschließlich dessen, was der abgebrochene mitgebracht
  # hätte. Und der jüngste Lauf ist derjenige, der nie abgebrochen wird.
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Aktuellen Stand auschecken
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Statische Website zusammenstellen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp sw.js _site/sw.js
          cp wirtschaftsgesetze.html _site/wirtschaftsgesetze.html
          cp -a data _site/data
          cp -a annotations _site/annotations
          # Ohne diese bleibt die Oberfläche live ohne Einfärbung, ohne
          # Verwaltungsstellen, ohne Belege und ohne Fassungsvergleich — sie
          # degradiert dann sauber, aber eben zu einer halben Ausgabe.
          cp -a belege _site/belege
          cp -a struktur _site/struktur
          cp -a verwaltung _site/verwaltung
          cp -a fassungen _site/fassungen
          cp -a schriften _site/schriften
          touch _site/.nojekyll

          # Nachweis, dass wirklich alles mitgeht.
          for ordner in data annotations belege struktur verwaltung fassungen schriften; do
            test -d "_site/$ordner" || { echo "::error::_site/$ordner fehlt"; exit 1; }
          done
          test -s _site/struktur/solzg.json
          test -s _site/verwaltung/solzg.json
          test -s _site/fassungen/gewstg.json

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Erfolgreiche Veröffentlichung protokollieren
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p reports
          cat > reports/pages-status.json <<JSON
          {
            "status": "veroeffentlicht",
            "zeitpunkt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "url": "$PAGE_URL",
            "commit": "$(git rev-parse HEAD)",
            "workflow_lauf": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          }
          JSON
          git config user.name "github-pages-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/pages-status.json
          if git diff --cached --quiet; then
            echo "Veröffentlichungsstatus unverändert."
          else
            git commit -m "Pages-Veröffentlichung protokollieren"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
