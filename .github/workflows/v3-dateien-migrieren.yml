name: Format-3-Dateien übernehmen

# Einmaliger Pull-Request-Lauf; übernimmt das hochgeladene Frontend in den PR-Branch.
on:
  pull_request:
    paths:
      - ".github/workflows/v3-dateien-migrieren.yml"
      - ".migration/index.*.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrieren:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Pull-Request-Branch auschecken
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Original-Frontend zusammensetzen und Format 2 bereinigen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import pathlib

          teile = sorted(pathlib.Path('.migration').glob('index.*.b64'))
          if len(teile) != 4:
              raise SystemExit(f'Erwartet 4 Frontend-Teile, gefunden: {len(teile)}')
          kodiert = ''.join(datei.read_text(encoding='utf-8').strip() for datei in teile)
          html = gzip.decompress(base64.b64decode(kodiert))
          pruefsumme = hashlib.sha256(html).hexdigest()
          erwartet = '8176187c04bf53996d715913ba90a36d8ec975a753a629b66bd282f3b2005607'
          if pruefsumme != erwartet:
              raise SystemExit(f'Frontend-Prüfsumme falsch: {pruefsumme}')
          pathlib.Path('index.html').write_bytes(html)
          print(f'Original-Frontend übernommen: {len(html)} Bytes, SHA-256 {pruefsumme}')
          PY

          cat > package.json <<'JSON'
          {
            "name": "steuernorm",
            "version": "3.0.0",
            "private": true,
            "description": "Deutsche Steuergesetze mit vollautomatischer, positionsgebundener Tatbestand-/Rechtsfolge-Annotation",
            "type": "module",
            "scripts": {
              "start": "python3 -m http.server 8000",
              "update": "node tools/update.mjs",
              "annotieren": "node tools/annotieren.mjs",
              "pruefen": "node tools/pruefen.mjs",
              "eval": "node tools/eval.mjs"
            },
            "license": "MIT"
          }
          JSON

          rm -f \
            tools/ki-annotieren.mjs \
            tools/annotationen.mjs \
            tools/pruefen-v2.mjs \
            tools/pruefen-fortschritt.mjs \
            tools/naechstes-gesetz.mjs \
            tools/lib/text.mjs \
            tools/lib/quellen.mjs \
            config/referenzquellen.json \
            docs/ki-annotation.md \
            reports/annotation-progress.json \
            reports/annotation-progress.md \
            reports/ki-lauf-status.json
          rm -rf .migration

      - name: Übernommenen Stand prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test "$(wc -c < index.html)" -eq 35011
          grep -q 'btn-ausn' index.html
          grep -q -- '--ausn' index.html
          node tools/pruefen.mjs --streng

      - name: Änderung in den Pull-Request-Branch schreiben
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "steuernorm-v3-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Migrationsänderungen."
          else
            git commit -m "Format-3-Frontend vollständig übernehmen"
            git pull --rebase --autostash origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi
