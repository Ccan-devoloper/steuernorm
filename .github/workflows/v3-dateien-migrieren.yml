name: Format-3-Dateien übernehmen

# Einmaliger Pull-Request-Lauf; übernimmt das hochgeladene Paket in den PR-Branch.
on:
  pull_request:
    paths:
      - ".github/workflows/v3-dateien-migrieren.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrieren:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Pull-Request-Branch auschecken
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Archivdateien übernehmen und Format 2 bereinigen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/steuernorm-v3
          mkdir -p /tmp/steuernorm-v3
          python3 - <<'PY'
          import base64
          import pathlib
          import zipfile

          wurzel = pathlib.Path('.')
          roh = (wurzel / '.migration/v3-payload.b64').read_text(encoding='utf-8')
          archiv = pathlib.Path('/tmp/steuernorm-v3.zip')
          archiv.write_bytes(base64.b64decode(roh))
          with zipfile.ZipFile(archiv) as datei:
              datei.testzip()
              datei.extractall('/tmp/steuernorm-v3')
          PY

          cp /tmp/steuernorm-v3/index.html index.html
          cp /tmp/steuernorm-v3/README-v3.md README-v3.md
          cp /tmp/steuernorm-v3/README-v3.md README.md
          cp /tmp/steuernorm-v3/tools/eval.mjs tools/eval.mjs

          cat > package.json <<'JSON'
          {
            "name": "steuernorm",
            "version": "3.0.0",
            "private": true,
            "description": "Deutsche Steuergesetze mit vollautomatischer, positionsgebundener Tatbestand-/Rechtsfolge-Annotation",
            "type": "module",
            "scripts": {
              "start": "python3 -m http.server 8000",
              "update": "node tools/update.mjs",
              "annotieren": "node tools/annotieren.mjs",
              "pruefen": "node tools/pruefen.mjs",
              "eval": "node tools/eval.mjs"
            },
            "license": "MIT"
          }
          JSON

          rm -f \
            tools/ki-annotieren.mjs \
            tools/annotationen.mjs \
            tools/pruefen-v2.mjs \
            tools/pruefen-fortschritt.mjs \
            tools/naechstes-gesetz.mjs \
            tools/lib/text.mjs \
            tools/lib/quellen.mjs \
            config/referenzquellen.json \
            docs/ki-annotation.md \
            reports/annotation-progress.json \
            reports/annotation-progress.md \
            reports/ki-lauf-status.json
          rm -rf .migration

      - name: Übernommenen Stand prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'btn-ausn' index.html
          grep -q -- '--ausn' index.html
          node tools/pruefen.mjs --streng

      - name: Änderung in den Pull-Request-Branch schreiben
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "steuernorm-v3-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Migrationsänderungen."
          else
            git commit -m "Format-3-Frontend und Dokumentation übernehmen"
            git pull --rebase --autostash origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi
