name: V4-Produktdaten erzeugen

on:
  pull_request:
    paths:
      - ".github/workflows/v4-produktdaten-erzeugen.yml"
      - "config/handbuecher.json"
      - "tools/annotieren.mjs"
      - "tools/lib/handbuch.mjs"

permissions:
  contents: write
  models: read

concurrency:
  group: v4-produktdaten-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  erzeugen:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Produktdaten-Branch auschecken
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: V4-Code vorab prüfen
        shell: bash
        run: |
          set -euo pipefail
          find tools -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node -e 'JSON.parse(require("fs").readFileSync("config/handbuecher.json", "utf8"))'
          node tools/pruefen.mjs --streng
          node tools/konsistenz.mjs

      - name: Amtlichen Sammelhost prüfen
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const urls = [
            'https://amtliche-handbuecher.bundesfinanzministerium.de/ao/2025/Meta/Inhaltsverzeichnis/inhalt.html',
            'https://amtliche-handbuecher.bundesfinanzministerium.de/esth/2025/Meta/Inhaltsverzeichnis/inhalt.html',
          ];
          const warten = ms => new Promise(r => setTimeout(r, ms));
          let letzterFehler = null;
          for (let versuch = 1; versuch <= 5; versuch++) {
            for (const url of urls) {
              try {
                const r = await fetch(url, {
                  headers: {
                    'User-Agent': 'steuernorm/4 (+https://github.com/Ccan-devoloper/steuernorm)',
                    'Accept': 'text/html,application/xhtml+xml',
                  },
                  redirect: 'follow',
                  signal: AbortSignal.timeout(60000),
                });
                const html = await r.text();
                const links = (html.match(/<a\b/gi) || []).length;
                const paragrafen = (html.match(/§|&sect;|&#167;/gi) || []).length;
                console.log(`Versuch ${versuch}: ${url} → Status ${r.status}; ${html.length} Zeichen; ${links} Links; ${paragrafen} Paragraphenzeichen.`);
                if (r.ok && links >= 5 && paragrafen >= 5 && !/Radware Bot Manager/i.test(html)) process.exit(0);
                letzterFehler = `${url}: HTTP ${r.status}, ${links} Links, ${paragrafen} Paragraphenzeichen`;
              } catch (fehler) {
                letzterFehler = `${url}: ${fehler.message}`;
                console.warn(`Versuch ${versuch}: ${letzterFehler}`);
              }
            }
            if (versuch < 5) await warten(Math.min(2000 * 2 ** (versuch - 1), 20000));
          }
          throw new Error(`Der amtliche Sammelhost liefert nach fünf Versuchen kein verwendbares Inhaltsverzeichnis: ${letzterFehler}`);
          NODE

      - name: Amtliche Handbuchkarten erzeugen
        shell: bash
        env:
          MIN_KARTEN_TREFFER: "5"
        run: |
          set -euo pipefail
          for versuch in 1 2 3; do
            echo "Kartenlauf ${versuch}/3"
            rm -f config/handbuch-karte-*.json
            if node tools/belege.mjs --karte; then
              exit 0
            fi
            [ "$versuch" -eq 3 ] && exit 1
            sleep $((versuch * 15))
          done

      - name: SolzG-Belegsnapshot gezielt abrufen
        shell: bash
        env:
          MAX_BELEGABRUFE: "30"
        run: |
          set -euo pipefail
          node tools/belege.mjs --nur solzg --max 30

      - name: Amtliche Belege und Rechtsprechung abrufen
        shell: bash
        env:
          MAX_BELEGABRUFE: "400"
        run: |
          set -euo pipefail
          node tools/belege.mjs --max 400

      - name: Belegbestand prüfen
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const bericht = JSON.parse(fs.readFileSync('reports/belege.json', 'utf8'));
          const dateien = fs.readdirSync('belege').filter(n => n.endsWith('.json'));
          const karten = fs.readdirSync('config').filter(n => n.startsWith('handbuch-karte-') && n.endsWith('.json'));
          if (karten.length < 8) throw new Error(`Nur ${karten.length} Handbuchkarten erzeugt.`);
          if (!dateien.length) throw new Error('Keine Belegdateien erzeugt.');
          if (!Number.isFinite(bericht.abrufe) || bericht.abrufe < 1) throw new Error('Kein echter Belegabruf nachgewiesen.');
          for (const name of karten) {
            const karte = JSON.parse(fs.readFileSync(`config/${name}`, 'utf8'));
            if (Object.keys(karte.paragrafen || {}).length < 5) throw new Error(`${name}: zu wenige Paragrafen.`);
          }
          const solzg = JSON.parse(fs.readFileSync('belege/solzg.json', 'utf8'));
          const solzgNormen = Object.values(solzg.normen || {});
          if (solzgNormen.length < 6) throw new Error(`SolzG-Belegsnapshot enthält nur ${solzgNormen.length} Normen.`);
          if (solzgNormen.filter(n => n.abgerufen).length < 6) throw new Error('SolzG-Belegabrufe wurden nicht vollständig protokolliert.');
          console.log(`${karten.length} Karten, ${dateien.length} Belegdateien, ${bericht.abrufe} Abrufe; SolzG vollständig abgerufen.`);
          NODE

      - name: SolzG mit Mehrfachmodell, Gegenprobe und Belegprobe aufwerten
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KI_MODELLE: openai/gpt-4.1-mini,openai/gpt-4o-mini
          KI_LAEUFE: "3"
          MAX_MODELLAUFRUFE: "160"
        run: |
          set -euo pipefail
          node tools/annotieren.mjs --nur solzg --laeufe 3 --aufwerten

      - name: Produktive KI- und Belegwirkung nachweisen
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('annotations/solzg.json', 'utf8'));
          const b = JSON.parse(fs.readFileSync('belege/solzg.json', 'utf8'));
          const bericht = JSON.parse(fs.readFileSync('reports/annotation.json', 'utf8'));
          if (!String(a.verfahren || '').includes('mehrfachlauf')) throw new Error(`SolzG-Verfahren: ${a.verfahren}`);
          if (!String(a.verfahren || '').includes('gegenprobe')) throw new Error('Gegenprobe fehlt.');
          if (Number(a.laeufe || 0) < 1) throw new Error('Kein Modelllauf nachgewiesen.');
          if (!Number.isFinite(bericht.modellaufrufe) || bericht.modellaufrufe < 1) throw new Error('Keine echten Modellaufrufe nachgewiesen.');
          const normen = Object.values(a.normen || {});
          if (!normen.some(n => String(n.verfahren || '').includes('mehrfachlauf'))) throw new Error('Keine Norm mit Mehrfachlauf.');
          if (!Object.values(b.normen || {}).some(n => n.abgerufen)) throw new Error('Kein SolzG-Belegsnapshot vorhanden.');
          if (!normen.every(n => Array.isArray(n.belege))) throw new Error('Belegfelder fehlen in erzeugten Annotationen.');
          console.log(`${a.verfahren}; ${a.laeufe} Läufe; ${bericht.modellaufrufe} Modellaufrufe; ${normen.length} Normen.`);
          NODE
          node tools/pruefen.mjs --streng
          node tools/konsistenz.mjs --schreiben

      - name: Erzeugte Produktdaten festschreiben
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "steuernorm-produktdaten-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A belege annotations config/handbuch-karte-*.json reports pruefbericht-ki.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Keine Produktdatenänderungen.'
          else
            git commit -m "V4-Belege und KI-Konsens produktiv erzeugen"
            git pull --rebase --autostash origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi
