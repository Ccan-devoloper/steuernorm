name: Belege sammeln

on:
  pull_request:
    paths:
      - "config/handbuecher.json"
      - "tools/belege.mjs"
      - "tools/lib/handbuch.mjs"
      - "tools/lib/rechtsprechung.mjs"
      - ".github/workflows/belege.yml"
  push:
    branches:
      - main
    paths:
      - "config/handbuecher.json"
      - "tools/belege.mjs"
      - "tools/lib/handbuch.mjs"
      - "tools/lib/rechtsprechung.mjs"
      - ".github/workflows/belege.yml"
  schedule:
    - cron: "40 3 * * 1"
  workflow_dispatch:
    inputs:
      karte:
        description: "Verzeichnisbäume der Handbücher neu aufbauen"
        type: boolean
        required: false
        default: false
      nur:
        description: "Nur diese Gesetze (kommagetrennt, leer = alle)"
        required: false
        default: ""
      max:
        description: "Höchstzahl der Abrufe je Lauf"
        required: false
        default: "1200"

permissions:
  contents: write

concurrency:
  group: belege-${{ github.ref }}
  cancel-in-progress: false

jobs:
  konfiguration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Belegmodule und Handbuchkonfiguration prüfen
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/belege.mjs
          node --check tools/lib/handbuch.mjs
          node --check tools/lib/rechtsprechung.mjs
          node - <<'NODE'
          const fs = require("fs");
          const c = JSON.parse(fs.readFileSync("config/handbuecher.json", "utf8"));
          if (!Array.isArray(c.handbuecher) || c.handbuecher.length !== 8) {
            throw new Error(`Acht amtliche Handbuchanbindungen erwartet, gefunden: ${c.handbuecher?.length ?? 0}.`);
          }
          for (const h of c.handbuecher) {
            if (!h.gesetz || !h.start || !h.prefix || !h.jahrgang) {
              throw new Error(`Unvollständiger Handbucheintrag: ${JSON.stringify(h)}`);
            }
            if (!h.start.startsWith(h.prefix)) {
              throw new Error(`${h.gesetz}: Startadresse liegt nicht unter dem Prefix.`);
            }
          }
          console.log(`${c.handbuecher.length} Handbuchanbindungen formal gültig.`);
          NODE

  belege:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Handbuchkarten aufbauen
        if: inputs.karte == true || hashFiles('config/handbuch-karte-*.json') == ''
        env:
          INPUT_NUR: ${{ inputs.nur }}
          MIN_KARTEN_TREFFER: "5"
        shell: bash
        run: |
          set -euo pipefail
          args=(--karte)
          [ -n "${INPUT_NUR:-}" ] && args+=(--nur "$INPUT_NUR")
          for versuch in 1 2 3; do
            if node tools/belege.mjs "${args[@]}"; then
              exit 0
            fi
            [ "$versuch" -eq 3 ] && exit 1
            sleep $((versuch * 15))
          done

      - name: Belegbestand vollständig aufbauen
        env:
          INPUT_NUR: ${{ inputs.nur }}
          INPUT_MAX: ${{ inputs.max }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          max="${INPUT_MAX:-1200}"
          if [ "$EVENT_NAME" = "push" ]; then
            max="5000"
          fi
          args=(--max "$max")
          [ -n "${INPUT_NUR:-}" ] && args+=(--nur "$INPUT_NUR")
          echo "Abrufgrenze: $max"
          node tools/belege.mjs "${args[@]}"

      - name: Belegbestand vollständig prüfen
        env:
          INPUT_NUR: ${{ inputs.nur }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const register = JSON.parse(fs.readFileSync("data/index.json", "utf8"));
          const normiere = (v) => String(v || "").toLowerCase().replace(/\.json$/, "").replace(/[^a-z0-9]/g, "");
          const nur = new Set(String(process.env.INPUT_NUR || "").split(",").map(normiere).filter(Boolean));
          const ausgewaehlt = nur.size
            ? register.gesetze.filter((m) => [m.abk, m.slug, m.datei].some((v) => nur.has(normiere(v))))
            : register.gesetze;
          const karten = fs.readdirSync("config").filter((n) => n.startsWith("handbuch-karte-") && n.endsWith(".json"));
          if (!nur.size && karten.length !== 8) throw new Error(`Acht Handbuchkarten erwartet, gefunden: ${karten.length}.`);
          for (const name of karten) {
            const karte = JSON.parse(fs.readFileSync(`config/${name}`, "utf8"));
            if (Object.keys(karte.paragrafen || {}).length < 5) throw new Error(`${name}: Karte ist leer oder unvollständig.`);
          }
          const fehler = [];
          let gesamtNormen = 0;
          let protokolliert = 0;
          const gesetze = [];
          for (const meta of ausgewaehlt) {
            const daten = JSON.parse(fs.readFileSync(`data/${meta.datei}`, "utf8"));
            const pfad = `belege/${meta.datei}`;
            if (!fs.existsSync(pfad)) { fehler.push(`${meta.abk}: Belegdatei fehlt`); continue; }
            const belege = JSON.parse(fs.readFileSync(pfad, "utf8"));
            if (belege.abk !== daten.abk || !belege.normen) { fehler.push(`${meta.abk}: Belegdatei formal unvollständig`); continue; }
            gesamtNormen += daten.normen.length;
            const fehlende = daten.normen.filter((norm) => !belege.normen[String(norm.id)]);
            const ohneAbruf = daten.normen.filter((norm) => !belege.normen[String(norm.id)]?.abgerufen);
            const normen = Object.values(belege.normen);
            protokolliert += daten.normen.length - ohneAbruf.length;
            gesetze.push({
              abk: daten.abk,
              normen: daten.normen.length,
              mitVerwaltung: normen.filter((n) => n.verwaltung?.length).length,
              mitRechtsprechung: normen.filter((n) => n.rechtsprechung?.length).length,
            });
            if (fehlende.length) fehler.push(`${meta.abk}: ${fehlende.length} Normeinträge fehlen`);
            if (ohneAbruf.length) fehler.push(`${meta.abk}: ${ohneAbruf.length} Normen ohne Abrufprotokoll`);
          }
          if (!nur.size && register.gesetze.length !== 14) fehler.push(`14 Gesetze erwartet, gefunden: ${register.gesetze.length}`);
          if (!ausgewaehlt.length) fehler.push("Die Gesetzesauswahl ist leer");
          if (fehler.length) throw new Error(`Belegbestand nicht vollständig:\n- ${fehler.join("\n- ")}`);
          let bisher = {};
          try { bisher = JSON.parse(fs.readFileSync("reports/belege.json", "utf8")); } catch {}
          const bericht = {
            ...bisher,
            erzeugt: new Date().toISOString(),
            abrufe: Number(bisher.abrufe || 0),
            gesetze,
            gepruefteGesetze: ausgewaehlt.length,
            gepruefteNormen: gesamtNormen,
            abrufeProtokolliert: protokolliert,
          };
          if (!nur.size) {
            bericht.vollstaendig = true;
            bericht.gesetzeGesamt = register.gesetze.length;
            bericht.normenGesamt = gesamtNormen;
          }
          fs.mkdirSync("reports", { recursive: true });
          fs.writeFileSync("reports/belege.json", `${JSON.stringify(bericht, null, 2)}\n`);
          console.log(`${ausgewaehlt.length} Gesetze, ${gesamtNormen} Normen und ${karten.length} Handbuchkarten vollständig geprüft.`);
          NODE

      - name: Änderungen festschreiben
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A belege config/handbuch-karte-*.json reports/belege.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Amtliche Belege vollständig aktualisiert ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Zusammenfassung
        if: always()
        shell: bash
        run: |
          {
            echo "## Belegschicht"
            echo ""
            if [ -f reports/belege.json ]; then
              node -e '
                const b = require("./reports/belege.json");
                console.log(`${b.abrufe} neue Abrufe · ${b.abrufeProtokolliert ?? "?"} protokollierte Normen · vollständig=${Boolean(b.vollstaendig)}`);
                console.log("");
                console.log("| Gesetz | Normen | mit Verwaltungsbeleg | mit Rechtsprechung |");
                console.log("|---|---:|---:|---:|");
                for (const g of b.gesetze || []) console.log(`| ${g.abk} | ${g.normen} | ${g.mitVerwaltung} | ${g.mitRechtsprechung} |`);
              '
            else
              echo "Kein Bericht erzeugt."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
