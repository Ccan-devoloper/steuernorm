name: Strenge KI-Prüfung aktivieren

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ki-pipefail-migrieren.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrieren:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Workflow härten
        run: node tools/migriere-ki-pipefail.mjs

      - name: Änderung veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "steuernorm-workflow-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .github/workflows/ki-vollannotation.yml
          git commit -m "Prüffehler im KI-Workflow strikt weitergeben"
          git pull --rebase origin main
          git push
