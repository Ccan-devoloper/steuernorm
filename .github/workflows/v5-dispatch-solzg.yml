name: V5 SolzG-Modelllauf starten

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v5-dispatch-solzg.yml"

permissions:
  contents: write
  actions: write

jobs:
  starten-und-auswerten:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Finalen V5-Stand bestätigen
        id: basis
        run: |
          set -euo pipefail
          final_commit="$(git rev-parse HEAD^)"
          test "$(git log -1 --format=%s "$final_commit")" = "Umbau v5: Satzklammer, mehrteilige Spannen, Absatz-Schema, Typografie"
          test "$(git rev-parse "$final_commit^")" = "2dd46086574352cf22790acc4252b4e0ba1825b9"
          test ! -e .v5-bootstrap
          test ! -e .github/workflows/v5-bootstrap.yml
          test ! -e .github/workflows/v5-finalize.yml
          echo "final_commit=$final_commit" >> "$GITHUB_OUTPUT"

      - name: Annotationen erzeugen für SolzG auslösen
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/annotationen.yml/dispatches" \
            -d '{"ref":"main","inputs":{"nur":"solzg","laeufe":"1","ohne_ki":"false"}}')"
          test "$code" = "204"
          run_id=""
          run_url=""
          for _ in $(seq 1 30); do
            curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/annotationen.yml/runs?event=workflow_dispatch&branch=main&per_page=10" > /tmp/runs.json
            read -r run_id run_url < <(START="$start" node - <<'NODE'
          const fs = require('fs');
          const start = Date.parse(process.env.START);
          const data = JSON.parse(fs.readFileSync('/tmp/runs.json', 'utf8'));
          const run = (data.workflow_runs || [])
            .filter(r => Date.parse(r.created_at) >= start - 5000)
            .sort((a,b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
          if (run) process.stdout.write(`${run.id} ${run.html_url}`);
          NODE
            )
            [ -n "$run_id" ] && break
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "Gestarteter Workflow-Lauf: $run_url" >> "$GITHUB_STEP_SUMMARY"

      - name: SolzG-Lauf bis zum Abschluss beobachten
        id: warten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          conclusion=""
          run_url=""
          for _ in $(seq 1 150); do
            curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /tmp/run.json
            read -r status conclusion run_url < <(node - <<'NODE'
          const r = require('/tmp/run.json');
          process.stdout.write(`${r.status || ''} ${r.conclusion || '-'} ${r.html_url || ''}`);
          NODE
            )
            if [ "$status" = "completed" ]; then break; fi
            sleep 10
          done
          test "$status" = "completed"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

      - name: Modellzugang prüfen aus den Logs lesen
        id: logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.warten.outputs.run_url }}
          CONCLUSION: ${{ steps.warten.outputs.conclusion }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/run-logs
          curl -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/logs" \
            -o /tmp/run-logs.zip
          unzip -q /tmp/run-logs.zip -d /tmp/run-logs
          RUN_ID="$RUN_ID" RUN_URL="$RUN_URL" CONCLUSION="$CONCLUSION" node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const files = [];
          const walk = d => { for (const n of fs.readdirSync(d)) { const p=path.join(d,n); fs.statSync(p).isDirectory()?walk(p):files.push(p); } };
          walk('/tmp/run-logs');
          const text = files.map(f => fs.readFileSync(f,'utf8')).join('\n');
          const hit = text.match(/Gemini-API antwortet mit HTTP \d+/) ||
            text.match(/GEMINI_API_KEY ist nicht gesetzt[^\n]*/);
          const result = {
            workflow_run: Number(process.env.RUN_ID),
            url: process.env.RUN_URL,
            conclusion: process.env.CONCLUSION,
            modellzugang: hit ? hit[0].trim() : 'Keine Modellzugang-Meldung in den Logs gefunden'
          };
          fs.writeFileSync('/tmp/modellzugang-v5.json', JSON.stringify(result, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Modellzugang prüfen\n\n${result.modellzugang}\n\nLauf: ${result.url}\n`);
          console.log(result.modellzugang);
          NODE

      - name: Ergebnis sichern und main wiederherstellen
        env:
          FINAL_COMMIT: ${{ steps.basis.outputs.final_commit }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --orphan agent/v5-model-result
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p reports
          cp /tmp/modellzugang-v5.json reports/modellzugang-v5.json
          git add reports/modellzugang-v5.json
          git commit -m "V5-Modellzugang protokollieren"
          git push --force origin HEAD:agent/v5-model-result
          git push --force origin "$FINAL_COMMIT":main
