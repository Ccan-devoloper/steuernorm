name: Verbleibende Verwaltungsbelege abschließen

on:
  push:
    branches: [main]
    paths: [".github/workflows/verwaltung-neuaufbau.yml"]

permissions: { contents: write }

concurrency:
  group: verwaltung-neuaufbau
  cancel-in-progress: true

jobs:
  gesetz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        gesetz: [estg, bewg, grstg]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with: { node-version: "22" }

      - name: Verwaltungsseiten gedrosselt parallel abrufen
        env:
          GESETZ: ${{ matrix.gesetz }}
          VERWALTUNG_PARALLEL: "6"
          VERWALTUNG_PAUSE_MS: "1000"
        run: |
          set -euo pipefail
          node tools/verwaltung-parallel.mjs "$GESETZ"

      - name: Gesetzesbestand streng prüfen
        env:
          GESETZ: ${{ matrix.gesetz }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const gesetz = process.env.GESETZ;
          const daten = require(`./data/${gesetz}.json`);
          const belege = require(`./belege/${gesetz}.json`);
          const normen = Object.values(belege.normen || {});
          const fehlende = daten.normen.filter((n) => !belege.normen?.[String(n.id)]);
          const ohneAbruf = daten.normen.filter((n) => !belege.normen?.[String(n.id)]?.abgerufen);
          const mitVerwaltung = normen.filter((n) => Array.isArray(n.verwaltung) && n.verwaltung.length).length;
          if (fehlende.length || ohneAbruf.length || mitVerwaltung < 1) {
            throw new Error(`${gesetz}: fehlend=${fehlende.length}, ohneAbruf=${ohneAbruf.length}, mitVerwaltung=${mitVerwaltung}`);
          }
          console.log(`${gesetz}: ${mitVerwaltung}/${normen.length} Normen mit Verwaltungsbeleg.`);
          NODE

      - name: Gesetzesbestand konfliktfest festschreiben
        env:
          GESETZ: ${{ matrix.gesetz }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "belege/${GESETZ}.json"
          if git diff --cached --quiet; then
            echo "${GESETZ}: keine Änderung"
            exit 0
          fi
          git commit -m "Verwaltungsbelege ${GESETZ^^} vollständig neu aufbauen"
          for versuch in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((versuch * 5))
          done
          echo "${GESETZ}: Push nach fünf Versuchen fehlgeschlagen" >&2
          exit 1

  abschluss:
    needs: gesetz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with: { node-version: "22" }

      - name: Gesamtbestand fachlich und strukturell prüfen
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          node - <<'NODE'
          const fs = require('fs');
          const register = require('./data/index.json');
          const config = require('./config/handbuecher.json');
          const slug = (s) => String(s || '').toLowerCase().replace(/\.json$/, '').replace(/[^a-z0-9]/g, '');
          const fehler = [], gesetze = [];
          let normenGesamt = 0, abrufeProtokolliert = 0;

          const karten = fs.readdirSync('config').filter((n) => /^handbuch-karte-.*\.json$/.test(n));
          if (karten.length !== 8) fehler.push(`Acht Handbuchkarten erwartet, gefunden: ${karten.length}`);
          for (const name of karten) {
            if (Object.keys(require(`./config/${name}`).paragrafen || {}).length < 5) fehler.push(`${name}: Karte unvollständig`);
          }

          for (const meta of register.gesetze) {
            const daten = require(`./data/${meta.datei}`);
            const pfad = `belege/${meta.datei}`;
            if (!fs.existsSync(pfad)) { fehler.push(`${meta.abk}: Belegdatei fehlt`); continue; }
            const belege = require(`./${pfad}`), normen = Object.values(belege.normen || {});
            const fehlende = daten.normen.filter((n) => !belege.normen?.[String(n.id)]);
            const ohneAbruf = daten.normen.filter((n) => !belege.normen?.[String(n.id)]?.abgerufen);
            const mitVerwaltung = normen.filter((n) => n.verwaltung?.length).length;
            const mitRechtsprechung = normen.filter((n) => n.rechtsprechung?.length).length;
            if (fehlende.length) fehler.push(`${meta.abk}: ${fehlende.length} Normeinträge fehlen`);
            if (ohneAbruf.length) fehler.push(`${meta.abk}: ${ohneAbruf.length} Abrufprotokolle fehlen`);
            normenGesamt += daten.normen.length;
            abrufeProtokolliert += daten.normen.length - ohneAbruf.length;
            gesetze.push({ abk: daten.abk, normen: daten.normen.length, mitVerwaltung, mitRechtsprechung });
          }

          for (const handbuch of config.handbuecher) {
            const meta = register.gesetze.find((m) => slug(m.abk) === slug(handbuch.gesetz));
            const bilanz = gesetze.find((g) => g.abk === handbuch.gesetz);
            if (!meta || !bilanz) fehler.push(`${handbuch.gesetz}: Handbuch nicht dem Gesetzesregister zugeordnet`);
            else if (bilanz.mitVerwaltung < 1) fehler.push(`${handbuch.gesetz}: kein Verwaltungsbeleg extrahiert`);
          }

          if (register.gesetze.length !== 14) fehler.push(`14 Gesetze erwartet, gefunden: ${register.gesetze.length}`);
          if (normenGesamt !== 1537) fehler.push(`1537 Normen erwartet, gefunden: ${normenGesamt}`);
          if (abrufeProtokolliert !== normenGesamt) fehler.push(`${normenGesamt - abrufeProtokolliert} Abrufprotokolle fehlen insgesamt`);
          if (fehler.length) throw new Error(`Gesamtbestand nicht vollständig:\n- ${fehler.join('\n- ')}`);

          const bericht = {
            erzeugt: new Date().toISOString(),
            gesetze,
            gepruefteGesetze: 14,
            gepruefteNormen: normenGesamt,
            abrufeProtokolliert,
            vollstaendig: true,
            verwaltungVollstaendig: true,
            gesetzeGesamt: 14,
            normenGesamt,
            handbuecherGesamt: 8,
          };
          fs.writeFileSync('reports/belege.json', `${JSON.stringify(bericht, null, 2)}\n`);
          fs.writeFileSync('reports/belege-status.json', `${JSON.stringify({ status: 'vollstaendig', zeitpunkt: new Date().toISOString(), gesetze: 14, normen: normenGesamt, handbuecher: 8 }, null, 2)}\n`);
          console.log(`14 Gesetze, ${normenGesamt} Normen und acht Handbücher vollständig geprüft.`);
          NODE

      - name: Temporäre Diagnose entfernen und Abschluss festschreiben
        run: |
          set -euo pipefail
          rm -f .github/workflows/verwaltung-neuaufbau.yml .github/workflows/handbuch-diagnose.yml
          rm -f reports/handbuch-diagnose.json reports/verwaltung-status-*.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A reports .github/workflows/verwaltung-neuaufbau.yml .github/workflows/handbuch-diagnose.yml
          git commit -m "V4-Verwaltungsbelege vollständig abschließen"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
