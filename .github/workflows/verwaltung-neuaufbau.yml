name: Verwaltungsbelege getrennt neu aufbauen

on:
  push:
    branches: [main]
    paths: [".github/workflows/verwaltung-neuaufbau.yml"]

permissions: { contents: write }

concurrency:
  group: verwaltung-neuaufbau
  cancel-in-progress: false

jobs:
  gesetz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        gesetz: [ao, estg, ustg, kstg, gewstg, erbstg, bewg, grstg]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Verwaltungsbelege neu abrufen
        env:
          GESETZ: ${{ matrix.gesetz }}
        shell: bash
        run: |
          set -euo pipefail
          erfolgreich=false
          for versuch in 1 2 3; do
            echo "${GESETZ}: Versuch ${versuch}/3"
            node tools/belege.mjs --nur "$GESETZ" --verwaltung-erzwingen --ohne-rechtsprechung --max 1200
            if node - "$GESETZ" <<'NODE'
          const fs = require('fs');
          const gesetz = process.argv[2];
          const datei = JSON.parse(fs.readFileSync(`belege/${gesetz}.json`, 'utf8'));
          const normen = Object.values(datei.normen || {});
          const mitVerwaltung = normen.filter((n) => Array.isArray(n.verwaltung) && n.verwaltung.length).length;
          const mitAbruf = normen.filter((n) => n.abgerufen).length;
          console.log(`${gesetz}: ${mitVerwaltung} Normen mit Verwaltungsbeleg, ${mitAbruf}/${normen.length} mit Abrufprotokoll.`);
          if (!normen.length || mitAbruf !== normen.length || mitVerwaltung < 1) process.exit(1);
          NODE
            then
              erfolgreich=true
              break
            fi
            sleep $((versuch * 30))
          done
          [ "$erfolgreich" = true ] || { echo "${GESETZ}: keine verwertbaren Verwaltungsbelege extrahiert" >&2; exit 1; }
      - name: Gesetzesbestand festschreiben
        env:
          GESETZ: ${{ matrix.gesetz }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- reports/belege.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "belege/${GESETZ}.json"
          if git diff --cached --quiet; then
            echo "${GESETZ}: keine Änderung"
          else
            git commit -m "Verwaltungsbelege ${GESETZ^^} neu aufbauen"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

  abschluss:
    needs: gesetz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Gesamtbestand fachlich und strukturell prüfen
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const register = require('./data/index.json');
          const config = require('./config/handbuecher.json');
          const slug = (s) => String(s || '').toLowerCase().replace(/\.json$/, '').replace(/[^a-z0-9]/g, '');
          const fehler = [];
          const gesetze = [];
          let normenGesamt = 0;
          let abrufeProtokolliert = 0;

          const karten = fs.readdirSync('config').filter((n) => /^handbuch-karte-.*\.json$/.test(n));
          if (karten.length !== 8) fehler.push(`Acht Handbuchkarten erwartet, gefunden: ${karten.length}`);
          for (const name of karten) {
            const karte = require(`./config/${name}`);
            if (Object.keys(karte.paragrafen || {}).length < 5) fehler.push(`${name}: Karte unvollständig`);
          }

          for (const meta of register.gesetze) {
            const daten = require(`./data/${meta.datei}`);
            const pfad = `belege/${meta.datei}`;
            if (!fs.existsSync(pfad)) { fehler.push(`${meta.abk}: Belegdatei fehlt`); continue; }
            const belege = require(`./${pfad}`);
            const normen = Object.values(belege.normen || {});
            const fehlende = daten.normen.filter((n) => !belege.normen?.[String(n.id)]);
            const ohneAbruf = daten.normen.filter((n) => !belege.normen?.[String(n.id)]?.abgerufen);
            const mitVerwaltung = normen.filter((n) => n.verwaltung?.length).length;
            const mitRechtsprechung = normen.filter((n) => n.rechtsprechung?.length).length;
            if (fehlende.length) fehler.push(`${meta.abk}: ${fehlende.length} Normeinträge fehlen`);
            if (ohneAbruf.length) fehler.push(`${meta.abk}: ${ohneAbruf.length} Abrufprotokolle fehlen`);
            normenGesamt += daten.normen.length;
            abrufeProtokolliert += daten.normen.length - ohneAbruf.length;
            gesetze.push({ abk: daten.abk, normen: daten.normen.length, mitVerwaltung, mitRechtsprechung });
          }

          for (const handbuch of config.handbuecher) {
            const meta = register.gesetze.find((m) => slug(m.abk) === slug(handbuch.gesetz));
            const bilanz = gesetze.find((g) => g.abk === handbuch.gesetz);
            if (!meta || !bilanz) fehler.push(`${handbuch.gesetz}: Handbuch nicht dem Gesetzesregister zugeordnet`);
            else if (bilanz.mitVerwaltung < 1) fehler.push(`${handbuch.gesetz}: kein Verwaltungsbeleg extrahiert`);
          }

          if (register.gesetze.length !== 14) fehler.push(`14 Gesetze erwartet, gefunden: ${register.gesetze.length}`);
          if (normenGesamt !== 1537) fehler.push(`1537 Normen erwartet, gefunden: ${normenGesamt}`);
          if (fehler.length) throw new Error(`Gesamtbestand nicht vollständig:\n- ${fehler.join('\n- ')}`);

          const bericht = {
            erzeugt: new Date().toISOString(),
            gesetze,
            gepruefteGesetze: register.gesetze.length,
            gepruefteNormen: normenGesamt,
            abrufeProtokolliert,
            vollstaendig: true,
            verwaltungVollstaendig: true,
            gesetzeGesamt: register.gesetze.length,
            normenGesamt,
          };
          fs.mkdirSync('reports', { recursive: true });
          fs.writeFileSync('reports/belege.json', `${JSON.stringify(bericht, null, 2)}\n`);
          fs.writeFileSync('reports/belege-status.json', `${JSON.stringify({ status: 'vollstaendig', zeitpunkt: new Date().toISOString(), gesetze: register.gesetze.length, normen: normenGesamt, handbuecher: config.handbuecher.length }, null, 2)}\n`);
          console.log(`${register.gesetze.length} Gesetze, ${normenGesamt} Normen und ${config.handbuecher.length} Handbücher vollständig geprüft.`);
          NODE
      - name: Temporäre Diagnose entfernen und Abschluss festschreiben
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verwaltung-neuaufbau.yml .github/workflows/handbuch-diagnose.yml reports/handbuch-diagnose.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A reports .github/workflows/verwaltung-neuaufbau.yml .github/workflows/handbuch-diagnose.yml
          git commit -m "V4-Verwaltungsbelege vollständig abschließen"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
