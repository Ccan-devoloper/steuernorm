name: Gesetzestexte und KI-Annotationen aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: steuernorm-gesetzesupdate
  cancel-in-progress: false

env:
  KI_MODELL: openai/gpt-4.1-mini
  MIN_QUELLEN: "4"
  REQUIRE_AI: "1"

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Bisherigen Stand sichern
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/steuernorm-backup
          mkdir -p /tmp/steuernorm-backup
          cp -a data /tmp/steuernorm-backup/data
          cp -a annotations /tmp/steuernorm-backup/annotations

      - name: Aktuelle XML-Daten laden und konvertieren
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! node tools/update-von-github.mjs; then
            echo "::error::Die Gesetzesaktualisierung war nicht vollständig. Der bisherige Stand wird wiederhergestellt."
            rm -rf data annotations
            cp -a /tmp/steuernorm-backup/data data
            cp -a /tmp/steuernorm-backup/annotations annotations
            exit 1
          fi

      - name: Geänderte Normen mit KI und Logik neu annotieren
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/ki-annotieren.mjs

      - name: Vollständigkeit, Quellen und Textspannen prüfen
        run: node tools/pruefen-v2.mjs | tee pruefbericht.txt

      - name: Änderungen veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cache .tmp
          git config user.name "steuernorm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data annotations reports pruefbericht.txt
          if git diff --cached --quiet; then
            echo "Keine Änderungen am Gesetzes- oder Annotationsbestand."
          else
            git commit -m "Gesetze und KI-Annotationen aktualisieren"
            git push
          fi
