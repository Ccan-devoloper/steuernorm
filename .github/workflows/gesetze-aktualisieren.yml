name: Gesetzestexte täglich aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steuernorm-gesetzesupdate
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          # Der Fassungsvergleich liest die früheren Zeitstände aus dem
          # Git-Verlauf von data/. Mit der Voreinstellung (depth 1) sähe
          # tools/fassungen.mjs genau einen Abruf und fände nie eine zweite
          # Fassung.
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Bisherigen Gesetzesstand sichern
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/steuernorm-data-backup
          cp -a data /tmp/steuernorm-data-backup

      - name: Aktuelle XML-Daten laden und konvertieren
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! node tools/update-von-github.mjs; then
            echo "::error::Die Gesetzesaktualisierung war nicht vollständig. Der bisherige Datenstand wird wiederhergestellt."
            rm -rf data
            cp -a /tmp/steuernorm-data-backup data
            exit 1
          fi

      - name: Vollständigen Gesetzesbestand prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -s data/index.json
          # verweise.json ist ein abgeleiteter Index, kein Gesetz — nicht mitzählen.
          anzahl="$(find data -maxdepth 1 -type f -name '*.json' ! -name 'index.json' ! -name 'verweise.json' | wc -l)"
          test "$anzahl" -eq 14
          for datei in data/*.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$datei"
          done

      - name: Rückverweise neu berechnen
        shell: bash
        run: |
          set -euo pipefail
          # „Zitiert von" wird aus dem Wortlaut gewonnen und muss dem neuen
          # Gesetzesstand folgen; sonst zeigt der Index auf entfallene Normen.
          node tools/verweise.mjs
          test -s data/verweise.json

      - name: Änderungen veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp
          git config user.name "steuernorm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine Änderungen am Gesetzesbestand."
          else
            git commit -m "Gesetzestexte aktualisieren"
            git push
          fi

      - name: Fassungen fortschreiben
        shell: bash
        run: |
          set -euo pipefail
          # NACH dem Commit: Das Werkzeug liest den Verlauf, der neue Stand
          # muss also schon darin stehen. Ändert sich nichts am Wortlaut,
          # bleibt die Datei gleich und es wird nichts committet.
          node tools/fassungen.mjs
          git add fassungen
          if git diff --cached --quiet; then
            echo "Keine neuen Fassungen."
          else
            git commit -m "Fassungen fortschreiben"
            git push
          fi
