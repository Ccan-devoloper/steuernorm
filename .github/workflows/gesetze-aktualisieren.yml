name: Gesetzestexte täglich aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steuernorm-gesetzesupdate
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Bisherigen Datenstand sichern
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/steuernorm-data-backup
          cp -a data /tmp/steuernorm-data-backup

      - name: Aktuelle XML-Daten laden und konvertieren
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node tools/update-von-github.mjs
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Die Gesetzesaktualisierung war nicht vollständig. Der bisherige Datenstand bleibt erhalten."
            rm -rf data
            cp -a /tmp/steuernorm-data-backup data
            exit "$status"
          fi

      - name: Daten und Markierungen prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -s data/index.json
          anzahl="$(find data -maxdepth 1 -type f -name '*.json' ! -name 'index.json' | wc -l)"
          test "$anzahl" -eq 14
          for datei in data/*.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$datei"
          done
          node tools/pruefen.mjs | tee pruefbericht.txt

      - name: Änderungen veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "steuernorm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data pruefbericht.txt
          if git diff --cached --quiet; then
            echo "Keine Änderungen am Gesetzesbestand."
          else
            git commit -m "Gesetzestexte aktualisieren"
            git push
          fi
