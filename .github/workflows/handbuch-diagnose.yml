name: Handbuchstruktur diagnostizieren

on:
  push:
    branches: [main]
    paths: [".github/workflows/handbuch-diagnose.yml"]

permissions: { contents: write }

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Amtliche Seiten untersuchen
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { abschnitteAus } from './tools/lib/handbuch.mjs';
          const config = JSON.parse(fs.readFileSync('config/handbuecher.json', 'utf8'));
          const kurz = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
          const ausgabe = [];
          for (const hb of config.handbuecher) {
            const karte = JSON.parse(fs.readFileSync(`config/handbuch-karte-${kurz(hb.gesetz)}.json`, 'utf8'));
            const [nr, eintrag] = Object.entries(karte.paragrafen)[0];
            const antwort = await fetch(eintrag.url, { headers: { 'User-Agent': 'steuernorm/4 (+https://github.com/Ccan-devoloper/steuernorm)', Accept: 'text/html' }, redirect: 'follow' });
            const html = await antwort.text();
            const headings = [...html.matchAll(/<h([1-6])\b[^>]*>([\s\S]*?)<\/h\1>/gi)].map((m) => ({ ebene: Number(m[1]), text: m[2].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() })).filter((h) => h.text).slice(0, 80);
            const marker = [];
            for (const wort of ['Richtlinie', 'Hinweise', 'Anwendungserlass', 'UStAE', 'AEAO', 'R 1', 'H 1', '1.1.']) {
              const i = html.indexOf(wort);
              if (i >= 0) marker.push({ wort, ausschnitt: html.slice(Math.max(0, i - 250), i + 500) });
            }
            ausgabe.push({ gesetz: hb.gesetz, nr, url: eintrag.url, status: antwort.status, zeichen: html.length, headings, marker, extrahiert: abschnitteAus(html).map((a) => ({ titel: a.titel, zeichen: a.text.length })).slice(0, 20) });
          }
          fs.mkdirSync('reports', { recursive: true });
          fs.writeFileSync('reports/handbuch-diagnose.json', `${JSON.stringify({ erzeugt: new Date().toISOString(), ausgabe }, null, 2)}\n`);
          NODE
      - name: Diagnose festschreiben
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/handbuch-diagnose.json
          git commit -m "BMF-Handbuchstruktur protokollieren"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
