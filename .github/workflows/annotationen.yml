name: Annotationen erzeugen

on:
  pull_request:
    paths:
      - "index.html"
      - "config/handbuecher.json"
      - "tools/annotieren.mjs"
      - "tools/belege.mjs"
      - "tools/pruefen.mjs"
      - "tools/eval.mjs"
      - "tools/konsistenz.mjs"
      - "tools/lib/**"
      - ".github/workflows/annotationen.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "belege/**"
      - "annotations/**"
      - "config/handbuecher.json"
      - "tools/annotieren.mjs"
      - "tools/belege.mjs"
      - "tools/pruefen.mjs"
      - "tools/eval.mjs"
      - "tools/konsistenz.mjs"
      - "tools/lib/**"
      - ".github/workflows/annotationen.yml"
  schedule:
    - cron: "10 5 * * *"
  workflow_run:
    workflows:
      - "Gesetzestexte täglich aktualisieren"
      - "Belege sammeln"
    types: [completed]
  workflow_dispatch:
    inputs:
      nur:
        description: "Nur diese Gesetze (kommagetrennt, leer = alle)"
        required: false
        default: ""
      gold:
        description: "Nur die 45 Normen des Goldstandards — genau ein Tagesbudget, und alles davon messbar"
        type: boolean
        required: false
        default: false
      laeufe:
        description: "Unabhängige Modellläufe je Norm"
        required: false
        default: "3"
      ohne_ki:
        description: "Nur Syntaxanalyse, keine Modellaufrufe"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  # "models: read" ist entfallen: GitHub Models wurde am 30.07.2026 vollständig
  # abgeschaltet. Der Modellzugang läuft jetzt über die KOSTENLOSE Gemini-Freistufe
  # (Google AI Studio) und das Secret GEMINI_API_KEY, siehe unten.


concurrency:
  group: annotationen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: V4-Pipeline deterministisch prüfen
        run: |
          set -euo pipefail
          find tools -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node -e 'JSON.parse(require("fs").readFileSync("config/handbuecher.json","utf8"))'
          # Der Modellabgleich muss ohne Netz prüfbar sein: Er entscheidet, ob
          # ein Lauf überhaupt startet, und ein Fehler darin fällt sonst erst
          # nach zwanzig Minuten verbranntem Kontingent auf.
          node -e '
            const m = await import("./tools/lib/modell.mjs");
            const da = ["gemini-2.0-flash","gemini-3-flash","gemini-3-pro","gemini-3-flash-image"];
            const gleich = (a,b,was) => {
              if (JSON.stringify(a) !== JSON.stringify(b)) {
                console.error("Modellabgleich falsch bei " + was + ": " + JSON.stringify(a));
                process.exit(1);
              }
            };
            gleich(m.modelleAbgleichen(["gemini-3-flash"], da).modelle, ["gemini-3-flash"], "vorhanden");
            gleich(m.modelleAbgleichen(["gemini-9-pro"], da).modelle, ["gemini-3-pro"], "pro bleibt pro");
            gleich(m.modelleAbgleichen(["gemini-2.5-flash"], []).modelle, [], "kein Ersatz");
            // Sonderzwecke dürfen nie als Ersatz für ein Flash-Modell gelten:
            // die reine Zeichenkettensortierung wählte hier omni-flash-preview.
            gleich(m.modelleOrdnen(da, "flash"), ["gemini-3-flash","gemini-2.0-flash"], "Ordnung nach Fassung, kein Sonderzweck");
            gleich(m.modelleAbgleichen([], da).modelle, ["gemini-3-flash","gemini-2.0-flash"], "automatische Wahl");
            // Feste Fassung vor wanderndem Alias vor Vorschau: Der Bericht hält
            // fest, womit annotiert wurde, und ein Alias sagt darin nichts.
            gleich(
              m.modelleOrdnen(["gemini-flash-latest","gemini-2.0-flash","gemini-3-flash-preview"], "flash"),
              ["gemini-2.0-flash","gemini-flash-latest","gemini-3-flash-preview"],
              "Endfassung vor Alias vor Vorschau");
            // Und der Fehler, der den Lauf zweimal angehalten hat: KI_MODELLE=""
            // muss „automatisch wählen" heißen, nicht „nimm die Voreinstellung".
            gleich(("" ?? "fallback").split(",").filter(Boolean), [], "leeres KI_MODELLE heißt automatisch");
            gleich(m.modelleAbgleichen(["gemini-2.5-flash"], da).modelle, ["gemini-3-flash"], "Ersatz aus der Familie");
            console.log("Modellabgleich ok");
          ' --input-type=module
          node tools/annotieren.mjs --nur solzg --ohne-ki --laeufe 1
          node tools/pruefen.mjs --nur solzg --streng
          node tools/konsistenz.mjs --nur solzg

          # Der Anbieter steckt in der Umgebung, nicht im Code. Geprüft wird
          # beides: die Voreinstellung und ein fremder Endpunkt mit Schrägstrich
          # am Ende — der darf keinen doppelten erzeugen.
          node --input-type=module -e '
            const m = await import("./tools/lib/modell.mjs");
            if (m.ENDPUNKT !== "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions")
              throw new Error("Voreinstellung verschoben: " + m.ENDPUNKT);
            console.log("Voreinstellung ok");
          '
          KI_ENDPUNKT="https://api.example.test/v1/" node --input-type=module -e '
            const m = await import("./tools/lib/modell.mjs");
            if (m.ENDPUNKT !== "https://api.example.test/v1/chat/completions")
              throw new Error("Endpunkt falsch zusammengesetzt: " + m.ENDPUNKT);
            if (m.MODELLLISTE !== "https://api.example.test/v1/models")
              throw new Error("Modellliste falsch zusammengesetzt: " + m.MODELLLISTE);
            console.log("Anbieterwechsel ok");
          '

          # Der Normfilter trägt den Messlauf: Er muss genau die Normen des
          # Goldstandards auswählen und den Bestand dabei unangetastet lassen.
          node tools/annotieren.mjs --gold --ohne-ki --trocken 2>&1 | tee filter.txt
          grep -q "Normfilter: 45 Normen in 14 Gesetzen" filter.txt
          node - <<'NODE'
          const vorher = require('./annotations/estg.json');
          const zahl = Object.keys(vorher.normen || {}).length;
          if (zahl < 200) throw new Error('EStG-Annotationen unerwartet dünn: ' + zahl);
          NODE
          node tools/annotieren.mjs --normen 'ustg:10' --ohne-ki --trocken 2>&1 | tee filter2.txt
          grep -q "Normfilter: 1 Normen in 1 Gesetzen" filter2.txt
          rm -f filter.txt filter2.txt

  push-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Veröffentlichten Bestand prüfen
        run: |
          set -euo pipefail
          find tools -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node tools/pruefen.mjs --streng
          node tools/konsistenz.mjs
          if [ -f reports/belege-annotation.json ]; then
            node -e 'const b=require("./reports/belege-annotation.json");if(!b.vollstaendig||b.handbuecherMitBelegen!==8)throw new Error("Belegeinbettung unvollständig")'
          fi

  annotieren:
    if: >-
      github.event_name != 'pull_request' &&
      github.event_name != 'push' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with: { node-version: "22" }

      - name: Modellzugang prüfen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::warning::GEMINI_API_KEY ist nicht gesetzt — der Lauf bleibt rein syntaktisch (--ohne-ki)."
            echo "GEMINI_API_KEY nicht gesetzt. Kostenlosen Schlüssel holen: aistudio.google.com/app/apikey" >> "$GITHUB_STEP_SUMMARY"
          else
            # Gefragt wird nach der MODELLLISTE, nicht nach einem einzelnen
            # Modell. Ein fest eingetragener Name überlebt keinen Zeitraum:
            # Google zieht Modelle zurück, und die API antwortet dann mit 404 —
            # derselben Zahl wie bei einem falschen Pfad, aber einer ganz
            # anderen als bei einem ungültigen Schlüssel (400 oder 403). Wer
            # das nicht auseinanderhält, sucht den Fehler beim Schlüssel.
            antwort="$(mktemp)"
            code="$(curl -s -o "$antwort" -w '%{http_code}' \
              -H "Authorization: Bearer $GEMINI_API_KEY" \
              https://generativelanguage.googleapis.com/v1beta/openai/models || echo 000)"

            {
              echo "### Modellzugang"
              echo ""
              echo "Modellliste: HTTP $code"
            } >> "$GITHUB_STEP_SUMMARY"

            case "$code" in
              200)
                # Verfügbare Gemini-Modelle in die Zusammenfassung, damit bei
                # der nächsten Rückziehung sofort dasteht, was es stattdessen
                # gibt — statt nur, dass etwas fehlt.
                modelle="$(node -e '
                  const fs = require("fs");
                  const d = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                  const ids = (d.data || []).map((m) => String(m.id).replace(/^models\//, ""))
                    .filter((m) => m.startsWith("gemini-")).sort();
                  console.log(ids.join("\n"));
                ' "$antwort")"
                anzahl="$(printf "%s" "$modelle" | grep -c . || true)"
                {
                  echo ""
                  echo "$anzahl Gemini-Modelle verfügbar:"
                  echo ""
                  echo '```'
                  printf "%s\n" "$modelle"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
                echo "Modellzugang steht: $anzahl Gemini-Modelle."
                {
                  echo ""
                  echo "Die Liste sagt, was *existiert* — nicht, was dieser Schlüssel"
                  echo "aufrufen darf. Ein Modell kann gelistet und zugleich für neue"
                  echo "Schlüssel gesperrt sein (HTTP 404 beim Aufruf). Der Lauf pingt"
                  echo "deshalb jedes Modell an, bevor er es benutzt."
                } >> "$GITHUB_STEP_SUMMARY"
                ;;
              400|401|403)
                echo "::error::Der Schlüssel wird abgelehnt (HTTP $code). GEMINI_API_KEY neu erzeugen: aistudio.google.com/app/apikey"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "**Der Schlüssel wird abgelehnt.** Neu erzeugen auf aistudio.google.com/app/apikey und das Secret ersetzen." >> "$GITHUB_STEP_SUMMARY"
                head -c 400 "$antwort" >> "$GITHUB_STEP_SUMMARY" || true
                ;;
              404)
                echo "::error::Der Endpunkt antwortet mit 404 — nicht der Schlüssel ist das Problem, sondern Pfad oder API-Fassung."
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "**HTTP 404 auf der Modellliste.** Das betrifft den Endpunkt, nicht den Schlüssel." >> "$GITHUB_STEP_SUMMARY"
                head -c 400 "$antwort" >> "$GITHUB_STEP_SUMMARY" || true
                ;;
              *)
                echo "::warning::Modellliste nicht abrufbar (HTTP $code)."
                head -c 400 "$antwort" >> "$GITHUB_STEP_SUMMARY" || true
                ;;
            esac
            rm -f "$antwort"
          fi

      - name: Annotationen erzeugen oder aufwerten
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Anbieterwechsel ohne Codeänderung: Repository-Variable KI_ENDPUNKT
          # auf einen anderen OpenAI-kompatiblen Endpunkt setzen — ohne
          # „/chat/completions", das hängt das Werkzeug an — und das Secret
          # KI_SCHLUESSEL anlegen. Beide leer heißt: kostenlose Gemini-
          # Freistufe wie bisher. KI_OHNE_SCHEMA=1 für Anbieter, die
          # `response_format: json_schema` nicht tragen.
          KI_ENDPUNKT: ${{ vars.KI_ENDPUNKT }}
          KI_SCHLUESSEL: ${{ secrets.KI_SCHLUESSEL }}
          KI_OHNE_SCHEMA: ${{ vars.KI_OHNE_SCHEMA }}
          # LEER = automatisch wählen. Ein fest eingetragener Modellname
          # überlebt keinen längeren Zeitraum: gemini-2.0-flash wurde
          # zurückgezogen, gemini-2.5-flash für neue Schlüssel gesperrt — beide
          # standen hier und brachten den Lauf zum Stehen. Das Werkzeug holt
          # jetzt die Liste, ordnet nach Familie und Fassung und pingt jedes
          # Modell an, bevor es damit arbeitet. Ein Name hier überschreibt das.
          KI_MODELLE: ""
          MAX_MODELLAUFRUFE: "180"
          INPUT_NUR: ${{ inputs.nur }}
          INPUT_LAEUFE: ${{ inputs.laeufe }}
          INPUT_OHNE_KI: ${{ inputs.ohne_ki }}
          INPUT_GOLD: ${{ inputs.gold }}
        run: |
          set -euo pipefail
          args=(--laeufe "${INPUT_LAEUFE:-3}")
          [ -n "${INPUT_NUR:-}" ] && args+=(--nur "$INPUT_NUR")
          # Der Messlauf: 45 Normen × 4 Aufrufe = 180, genau das Tagesbudget.
          # Ohne diesen Filter liefe das Budget der Reihe nach durch die AO und
          # erreichte keine einzige Norm, die der Goldstandard kennt.
          [ "${INPUT_GOLD:-false}" = "true" ] && args+=(--gold)
          if [ "${INPUT_OHNE_KI:-false}" = "true" ]; then
            args+=(--ohne-ki)
          else
            args+=(--aufwerten)
          fi
          node tools/annotieren.mjs "${args[@]}"

      - name: KI-Wirkung und Struktur nachweisen
        run: |
          set -euo pipefail
          if [ "${{ inputs.ohne_ki }}" != "true" ]; then
            node - <<'NODE'
          // Zuerst der Abbruch, dann der Nachweis. Vorher meldete dieser Schritt
          // „SolzG-Mehrfachlauf fehlt" — richtig, aber nicht die Ursache: Der Lauf
          // war in der AO stehengeblieben und hatte das SolzG nie erreicht. Die
          // wirkliche Meldung stand zwanzig Zeilen weiter oben im Protokoll.
          const b=require('./reports/annotation.json');
          if(b.abgebrochen)throw new Error('Lauf abgebrochen: '+b.abgebrochen);
          const a=require('./annotations/solzg.json');
          if(!String(a.verfahren||'').includes('mehrfachlauf')||Number(a.laeufe||0)<1)throw new Error('SolzG-Mehrfachlauf fehlt');
          if(!Object.values(a.normen||{}).some(n=>String(n.verfahren||'').includes('mehrfachlauf')))throw new Error('Keine SolzG-Norm mit Mehrfachlauf');
          NODE
          fi
          node tools/pruefen.mjs --streng | tee pruefbericht-ki.txt
          node tools/konsistenz.mjs --schreiben

      - name: Qualität messen
        continue-on-error: true
        run: |
          mkdir -p reports
          if [ -d eval/gold ]; then node tools/eval.mjs | tee reports/eval.txt; else echo "Kein Goldstandard vorhanden — Messung übersprungen." | tee reports/eval.txt; fi

      - name: Änderungen konfliktfest festschreiben
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A annotations reports pruefbericht-ki.txt .fortschritt 2>/dev/null || true
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Annotationen und Belegkonsens aktualisiert ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
