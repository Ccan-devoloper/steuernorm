name: Browsermarkierungen migrieren

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ui-markierungen-migrieren.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrieren:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Browserindex migrieren
        run: node tools/migriere-ui-markierungen.mjs

      - name: Geänderte Oberfläche veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "steuernorm-ui-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git commit -m "Browsermarkierungen elementübergreifend korrigieren"
          git pull --rebase origin main
          git push
