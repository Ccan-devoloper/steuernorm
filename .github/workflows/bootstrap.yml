name: Projekt fertigstellen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aufbauen:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Anwendungsdateien wiederherstellen
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.* | base64 --decode > /tmp/steuernorm-core.tgz
          tar -xzf /tmp/steuernorm-core.tgz
          cat .bootstrap/extras.* | base64 --decode > /tmp/steuernorm-extras.tgz
          tar -xzf /tmp/steuernorm-extras.tgz

          test -s index.html
          test -s package.json
          test -s tools/update.mjs
          test -s tools/pruefen.mjs
          test -s tools/update-von-github.mjs
          test -s .github/workflows/gesetze-aktualisieren-neu.yml

      - name: Gesetzestexte aus dem täglichen XML-Archiv laden
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf data
          node tools/update-von-github.mjs

      - name: Vollständigen Datenbestand und Markierungen prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -s data/index.json
          anzahl="$(find data -maxdepth 1 -type f -name '*.json' ! -name 'index.json' | wc -l)"
          test "$anzahl" -eq 14
          for datei in data/*.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$datei"
          done
          node tools/pruefen.mjs | tee pruefbericht.txt

      - name: Fertigen Projektstand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "steuernorm-bot"
          git config user.email "bot@users.noreply.github.com"
          rm -rf .bootstrap
          rm -f .github/workflows/gesetze-aktualisieren.yml
          mv .github/workflows/gesetze-aktualisieren-neu.yml .github/workflows/gesetze-aktualisieren.yml
          git add -A
          git commit -m "Steuernorm-Anwendung einrichten"
          git push
