name: Projekt fertigstellen

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aufbauen:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Originaldateien wiederherstellen
        run: |
          cat .bootstrap/payload.* | base64 --decode > /tmp/steuernorm-core.tgz
          tar -xzf /tmp/steuernorm-core.tgz
          cat .bootstrap/extras.* | base64 --decode > /tmp/steuernorm-extras.tgz
          tar -xzf /tmp/steuernorm-extras.tgz

      - name: Ausfallsichere Aktualisierung einrichten
        run: |
          python3 - <<'PY'
          from pathlib import Path
          datei = Path("tools/update.mjs")
          text = datei.read_text(encoding="utf-8")
          text = text.replace(
              "      process.exitCode = 1;",
              '      console.warn("Bestehende Gesetzesdaten bleiben unverändert.");'
          )
          datei.write_text(text, encoding="utf-8")
          PY

      - name: Aktuelle Gesetzestexte laden oder vorhandene Daten verwenden
        run: |
          node tools/update.mjs || echo "::warning::Externe Quelle nicht erreichbar; vorhandene Gesetzesdaten werden verwendet."
          test -s data/index.json

      - name: Markierungen prüfen
        run: node tools/pruefen.mjs | tee pruefbericht.txt

      - name: Fertigen Projektstand veröffentlichen
        run: |
          git config user.name "steuernorm-bot"
          git config user.email "bot@users.noreply.github.com"
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git add -A
          git commit -m "Steuernorm-Anwendung einrichten"
          git push
