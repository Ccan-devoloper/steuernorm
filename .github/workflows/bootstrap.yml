name: Projekt fertigstellen

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aufbauen:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Originaldateien wiederherstellen
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.* | base64 --decode > /tmp/steuernorm-core.tgz
          tar -xzf /tmp/steuernorm-core.tgz
          cat .bootstrap/extras.* | base64 --decode > /tmp/steuernorm-extras.tgz
          tar -xzf /tmp/steuernorm-extras.tgz

          # Einige Projektdateien liegen im Archiv unter einem zusätzlichen
          # Projektordner. Diesen automatisch erkennen und in den Stamm kopieren.
          if [ ! -s data/index.json ]; then
            index_path="$(find . -mindepth 2 -maxdepth 6 -type f -path '*/data/index.json' -print -quit)"
            if [ -n "$index_path" ]; then
              project_root="${index_path%/data/index.json}"
              echo "Projektdateien aus $project_root übernehmen"
              cp -a "$project_root"/. .
            fi
          fi

          test -s data/index.json
          test -s index.html
          test -s .github/workflows/gesetze-aktualisieren.yml

      - name: Tägliche Aktualisierung ausfallsicher machen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          datei = Path(".github/workflows/gesetze-aktualisieren.yml")
          text = datei.read_text(encoding="utf-8")
          alt = "      - name: Gesetzestexte laden\n        run: node tools/update.mjs\n"
          neu = (
              "      - name: Gesetzestexte laden\n"
              "        shell: bash\n"
              "        run: |\n"
              "          rm -rf /tmp/steuernorm-data-backup\n"
              "          cp -a data /tmp/steuernorm-data-backup\n"
              "          if node tools/update.mjs; then\n"
              "            echo \"Aktualisierung erfolgreich.\"\n"
              "          else\n"
              "            echo \"::warning::Amtliche Quelle nicht vollständig erreichbar; bisheriger Datenstand bleibt vollständig erhalten.\"\n"
              "            rm -rf data\n"
              "            cp -a /tmp/steuernorm-data-backup data\n"
              "          fi\n"
          )
          if alt in text:
              datei.write_text(text.replace(alt, neu), encoding="utf-8")
          elif "bisheriger Datenstand bleibt vollständig erhalten" not in text:
              raise SystemExit("Erwarteter Aktualisierungsschritt wurde nicht gefunden")
          PY

      - name: Mitgelieferte Gesetzesdaten prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -s data/index.json
          for datei in data/*.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$datei"
          done
          node tools/pruefen.mjs | tee pruefbericht.txt

      - name: Fertigen Projektstand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "steuernorm-bot"
          git config user.email "bot@users.noreply.github.com"
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git add -A
          git commit -m "Steuernorm-Anwendung einrichten"
          git push
