name: Fallsammlung einbauen

on:
  push:
    branches: [feature/fallsammlung-bilanz]
    paths:
      - ".github/workflows/faelle-bootstrap.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - ".github/workflows/faelle-bootstrap.yml"

permissions:
  contents: write

jobs:
  einbauen:
    if: github.ref_name == 'feature/fallsammlung-bilanz' || github.head_ref == 'feature/fallsammlung-bilanz'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/fallsammlung-bilanz
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Übertragung prüfen und Dateien übernehmen
        run: |
          set -euo pipefail
          cat \
            .fallsammlung/part-00 \
            .fallsammlung/part-01 \
            .fallsammlung/part-02 \
            .fallsammlung/part-03 \
            .fallsammlung/part-040 \
            .fallsammlung/part-041 \
            .fallsammlung/part-05 \
            .fallsammlung/part-06 \
            .fallsammlung/part-070 \
            .fallsammlung/part-071 \
            .fallsammlung/part-08 \
            | tr -cd 'A-Za-z0-9+/' > /tmp/fallsammlung-payload.b64
          rest=$(( $(wc -c < /tmp/fallsammlung-payload.b64) % 4 ))
          if [ "$rest" -eq 2 ]; then printf '==' >> /tmp/fallsammlung-payload.b64; fi
          if [ "$rest" -eq 3 ]; then printf '=' >> /tmp/fallsammlung-payload.b64; fi
          if [ "$rest" -eq 1 ]; then echo 'Ungültige Base64-Länge' >&2; exit 1; fi
          base64 --decode /tmp/fallsammlung-payload.b64 > /tmp/fallsammlung-payload.tar.gz
          echo "8e032194ffc6b08aabd6be3a30809982123261125e9c33d9ad57aa6a2f24a48a  /tmp/fallsammlung-payload.tar.gz" | sha256sum --check -
          tar -xzf /tmp/fallsammlung-payload.tar.gz -C .
          node tools/faelle-einbauen.mjs
          node tools/pruefen-faelle.mjs
          grep -F 'href="faelle.html"' index.html
      - name: Geprüften Stand auf dem Arbeitszweig festschreiben
        run: |
          set -euo pipefail
          rm -rf .fallsammlung
          rm -f .github/workflows/faelle-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fallsammlung mit Lösungen einbauen"
          git push origin HEAD:feature/fallsammlung-bilanz
